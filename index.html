const GUIDE_DATA="# 学习指南：把词汇变成考试能力\n\n## 本书的范围\n\n本书将你提供的 30 页词表整理为 2,086 条记录、2,084 个不同词头，并编入 111 篇短文。覆盖率指英文正文出现词头或已列出的变体，不包括标题、附录或练习答案。每个词的首次及其他出现位置、原 PDF 页码均可在索引查到。\n\n这不是官方完整词库，也不是历年真题。故事、访谈、研究与机构安排均为教学情境；技术说明用于语言学习。中文是对照译文，个别篇章采用概括性较强的表达，不宜把长译文直接当成逐字翻译模板。掌握词头不等于掌握全部义项，也不自动对应特定考试分数。\n\n## 每篇的使用顺序\n\n1. 先不看中文，阅读或听一遍英文，写下主题和两三个关键点。\n2. 回看正文，圈出真正不懂的词。查索引找原表记录，再结合句子和中文确定本文含义。不要把每个原表释义都当作本文义项。\n3. 学习句式：找主干、从句和连接关系。每篇选一个自然表达，用自己的校园或生活例子改写。\n4. 遮住英文，完成翻译练习；先自行作答，再看参考译文。答案不是唯一正确版本。\n5. 重新听读，回答理解题，并指出证据句。第二天只看题目重做。\n\n建议每篇 15—25 分钟；一天两篇，再加旧词复习约 45—60 分钟。若生词过多，一天一篇更容易坚持。理解、复述、迁移运用比通读速度更重要。\n\n## 十周学习安排\n\n第 1 周：01—12，教育、学习方法、数字生活与消费。\n第 2 周：13—24，文化、城市与生态。\n第 3 周：25—36，工程、自然科学与交通。\n第 4 周：37—48，生活、公共规则、文化与服务。\n第 5 周：49—60，旅行、就业、商业与阅读语境。\n第 6 周：61—72，人际、叙事、研究与公共讨论。\n第 7 周：73—84，实践、公共项目与改进。\n第 8 周：85—96，日常场景、历史与综合表达。\n第 9 周：97—108，学习策略、细读与批判性思考。\n第 10 周：109—111，查漏补缺，并将时间转向限时真题和输出训练。\n\n前九周每周学习六天、每天两篇，第七天只复习与输出。第十周用两天完成最后三篇，其余时间做综合练习。如果需要更慢节奏，整套安排可等比例拉长。\n\n复习节奏可用学习后第 1、3、7、14 天作起点，按实际遗忘情况调整；这是本书建议的练习安排，不是对所有人有效的固定记忆规律。\n\n## 如何训练听力\n\n网页学习版提供设备语音朗读，可选英语声音和速度。它是合成语音，依赖浏览器与系统中可用的声音；某些声音可能需要联网。没有可用声音时，可把英文复制到你已有的朗读工具。它不等同于真人录音，也不能替代不同口音的真题听力。\n\n第一遍：隐藏中英文，只听主旨，记录谁、发生了什么、最后怎样。\n第二遍：以正常速度听原因、转折与结果；做理解题。\n第三遍：显示英文核对，挑 2—3 句做短句听写，标出漏听的弱读、连接词或词尾。\n第四遍：跟读，再用 30—60 秒复述。不要为了追求快语速而牺牲理解。\n\n对话优先：06、10、24、35—40、48、51、63—64、79、84—88、103、105。\n科普讲话优先：25—34、67—69、74、90、104、108。\n\n本文一篇一题是学习检查，不是完整模拟卷。官方六级听力包含长对话、听力篇章及讲话／报道／讲座，仍需另外做完整题型与限时训练。结构以中国教育考试网公布内容为准。\n\n## 如何迁移到作文\n\n先积累主题的“观点—原因—例子—建议”，而不是整篇套写。\n教育可用 01、03、05；科技可用 07—09、83；城市可用 18、100；环保可用 19、21—24；合作可用 17、41、80、109。\n\n每周写一篇 150—200 词练习稿，先保证切题和论证清楚。练习时可逐步压缩到 30 分钟；实际考试以当次题面字数和任务为准。\n\n改写示范：\n原句：Technology should simplify routine work while protecting users' personal information.\n迁移：Universities should expand access to digital resources while helping students evaluate information critically.\n方法：保留“建议 + while 补充同时责任”的关系，更换主体、措施和目标。\n\n不要把词汇密度当作文质量。torque、retard、pacific、hitherto 等词在本书用于相应科普或阅读语境，并非每篇作文都应主动使用。\n\n## 十二个值得掌握的结构\n\n1. Not only does regular practice improve accuracy, but it also builds confidence.\n   句首 not only 后部分倒装；but also 后正常语序。\n2. Only when we examine the evidence can we reach a sound conclusion.\n   only 加状语前置时主句倒装；only 修饰主语时不机械倒装。\n3. The more carefully we plan, the less time we waste.\n   两个比较级描述关联变化，不自动证明因果。\n4. What matters most is whether the measure meets actual needs.\n   what 主语从句与 whether 表语从句，用于提出评价标准。\n5. Provided that users receive clear guidance, the change will be easier to adopt.\n   条件从句谈将来通常用一般现在时。\n6. Had we checked the source, we might have avoided the error.\n   过去反事实条件句，省略 if 后 had 提前。\n7. By removing avoidable barriers, a university can widen participation.\n   by 加动名词说明方法，主句说目的或结果。\n8. However advanced a tool may be, its results still require verification.\n   however 加形容词构成让步关系。\n9. Seen in context, the result has a more limited meaning.\n   分词短语的逻辑主语是 the result，避免悬垂修饰。\n10. A modest improvement may be valuable without solving every problem.\n    without 加动名词区分有效与万能。\n11. Experience can complement new ideas rather than prevent change.\n    complement 表示互补；rather than 连接平行结构。\n12. It is the quality of the evidence that makes an argument convincing.\n    强调句突出真正重要的因素，避免只为显高级而使用。\n\n练习时每段自然用一两个结构即可。复杂句不是越多越好；语法正确、搭配自然、逻辑明确更重要。\n\n## 如何训练翻译与阅读\n\n翻译先确定时间、主语与谓语，再安排修饰成分。原中文中有“随着、通过、不仅、从而”等关系时，先判断真实逻辑，再选英文结构。参考译文可以改写，但不能漏掉或擅加信息。\n\n每周从 13—18 或 19—24 中选一个主题，用自己的中文写 100—150 字，再译成英文，核对是否保持原意。随后练习正式真题段落长度，避免只会翻本书熟悉句子。\n\n阅读时练三种操作：区分事实与推断（04、08、69）；定位转折后的观点（09、50、78）；解释例子如何支撑主旨（13、17、23）。词不全懂时，先找代词指代、连接词和段落功能。\n\n## 自测掌握标准\n\n词汇：不看中文能说出本文词义，并在一个新句中自然使用；只需阅读识别的专业词至少能在新句中辨认。\n听力：不看稿能说出主旨、原因和结果，理解题有原文证据。\n写作：能换主题复用一个结构，不机械照抄整段。\n翻译：能保留信息、时间、因果与比较关系，主谓和搭配正确。\n阅读：能区分作者观点、例子与限定条件。\n\n每周将错误分为“不认识”“听不出”“认得但用错”“逻辑误读”四类。后续复习分别用查义、听写、造句、证据定位解决，而不是所有问题都靠重背词表。\n\n## 词表修正与语体提醒\n\n原表存在拆字与粘连：outermost、integral、infinitely、indefinite、tile、watt、statistics、mischief 等已恢复。第 9 页 fringe 与 scout 的文字重叠已恢复。mint 与 clip 各有重复记录，索引保留所有原页信息。\ndignity 是名词，原表的词性标注有误。原表有些常见词只列少见义，不应按原释义机械造句。\nMoslem 属旧拼写；damn 属非正式感叹；retard 本文作“减缓”的动词；pacific 本文取较少见的平静义。专门的用法说明见相应篇章。\n\n## 核验来源\n\n考试范围与结构：[中国教育考试网 CET 笔试](https://cet.neea.edu.cn/html1/folder/16113/1586-1.htm)。\n第 22、27 篇单位：[NIST SI 单位](https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-4-two-classes-si-units-and-si-prefixes)。\n第 30 篇飞行四力：[NASA](https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/four-forces-on-an-airplane/)。\n第 31 篇行星与轨道：[NASA 行星](https://science.nasa.gov/solar-system/planets/)、[NASA 轨道](https://science.nasa.gov/solar-system/orbits-and-keplers-laws/)。\n第 34 篇核裂变：[美国能源部](https://www.energy.gov/science/doe-explainsnuclear-fission)。\n词性与用法：[Cambridge dignity](https://dictionary.cambridge.org/dictionary/english/dignity)、[Collins puff](https://www.collinsdictionary.com/dictionary/english/puff)、[Cambridge retard](https://dictionary.cambridge.org/us/dictionary/english/retard)。\n这些来源支持所列事实或用法，文章情境、练习与学习安排为本书原创设计，不代表来源机构认可或提供本书课程。\n\n";
const U=U_DATA, I=I_DATA_1.concat(I_DATA_2,I_DATA_3), GUIDE=GUIDE_DATA;

function marked(text,u){const forms=new Set(u.new.flatMap(w=>byword.get(w.toLowerCase()).forms).map(x=>x.toLowerCase()));return text.split(/(?<=[.!?])(?=\s)/).map(sentence=>'<span data-context="'+esc(sentence.trim())+'">'+sentence.split(/([A-Za-z]+(?:[-'][A-Za-z]+)*)/).map(t=>/^[A-Za-z]+(?:[-'][A-Za-z]+)*$/.test(t)?'<button type="button" class="lookup" data-lookup="'+esc(t)+'" aria-label="查询 '+esc(t)+'">'+(highlight&&forms.has(t.toLowerCase())?'<mark>'+esc(t)+'</mark>':esc(t))+'</button>':esc(t)).join('')+'</span>').join('')}
function openArticle(id){stop();current=U.find(u=>u.id===id)||U[0];view='read';showZh=false;showEn=true;location.hash='p'+current.id;renderArticle();active();list();window.scrollTo(0,0)}
function neuralPlayer(u){const src='audio/'+u.id+'.mp3',sub='audio/'+u.id+'.srt';return '<section class="neural" aria-label="神经语音播放器"><h3>神经语音 · 连续听力</h3><div class="muted">美式女声 Jenny · 含英文标题与完整正文 · 111 篇均已配音 · 手机与电脑使用相同音频</div><audio id="neuralAudio" controls preload="metadata" src="'+src+'" aria-label="第 '+u.id+' 篇神经语音">浏览器不支持音频播放，请下载 MP3。</audio><div class="audio-options"><label>播放速度 <select id="audioRate"><option value="0.85">0.85 倍</option><option value="1" selected>1.0 倍（原音频）</option><option value="1.15">1.15 倍</option></select></label><label><input id="audioLoop" type="checkbox">循环播放</label><a href="'+src+'" download>下载本篇 MP3</a><a href="'+sub+'" download>英文字幕</a></div><div id="audioStatus" role="status" class="muted">点击播放按钮开始；可隐藏下方英文进行盲听。音频为 AI 合成语音。</div></section>'}
function bindNeural(){const a=$('#neuralAudio');if(!a)return;const audioStatus=$('#audioStatus');$('#audioRate').onchange=()=>{a.playbackRate=Number($('#audioRate').value)};$('#audioLoop').onchange=()=>{a.loop=$('#audioLoop').checked};a.onplay=()=>{run++;if('speechSynthesis'in window)speechSynthesis.cancel();$('#status').textContent='';audioStatus.textContent='正在播放神经语音。'};a.onpause=()=>{audioStatus.textContent=a.ended?'播放完成。':'已暂停，可继续播放。'};a.onended=()=>{audioStatus.textContent='播放完成。'};a.onerror=()=>{audioStatus.textContent='音频未能加载，请检查网络并刷新页面，或下载本篇 MP3 播放。'}}
function renderArticle(){const u=current,[key,explain]=u.key.split(' || '),[task,answer]=u.task.split(' || '),[question,solution]=u.q.split(' || ');
$('#main').innerHTML='<article><h2>'+u.id+' · '+esc(u.title)+'</h2><div class="sub">'+marked(u.en_title,u)+' · '+esc(u.kind)+' · '+u.wc+' words</div>'+neuralPlayer(u)+'<div class="tools"><button class="primary" id="speak">系统朗读英文</button><button id="stop">停止</button><select id="voice" aria-label="英语声音"></select><select id="rate" aria-label="朗读速度"><option value=".8">0.8 倍</option><option value="1" selected>1.0 倍</option><option value="1.15">1.15 倍</option></select><button id="english">隐藏英文</button><button id="chinese">显示译文</button><button id="highlight">词汇标记：'+(highlight?'开':'关')+'</button></div><div class="muted">系统朗读使用设备合成语音，部分声音需联网；建议配合真人真题听力。点击英文单词可查看释义、用法并听发音。黄色标记为本册首次覆盖词头。</div><div id="status" role="status"></div><section id="englishBody" class="en">'+u.en.split('\n').filter(Boolean).map(t=>'<p>'+marked(t,u)+'</p>').join('')+'</section><section id="chineseBody" class="zh hidden">'+esc(u.zh)+'</section><section class="learn"><h3>句式迁移</h3><div class="quote">'+marked(key,u)+'</div><p>'+esc(explain)+'</p><h3>翻译练习</h3><p>'+esc(task)+'</p><details><summary>查看参考译文</summary><p>'+marked(answer,u)+'</p></details><h3>理解练习</h3><p class="quote">'+marked(question,u)+'</p><details><summary>查看答案与提示</summary><p>'+esc(solution)+'</p></details>'+(u.note?'<p class="note">'+esc(u.note)+'</p>':'')+'<h3>首次覆盖词头</h3><div class="chips">'+(u.new.length?u.new.map(w=>'<button data-word="'+esc(w)+'">'+esc(w)+'</button>').join(''):'本篇复现此前词条。')+'</div><div class="bottom"><button id="prev">← 上一篇</button><button id="learned">'+(done.has(u.id)?'取消学完标记':'标记学完')+'</button><button id="next">下一篇 →</button></div></section></article>';
$('#english').onclick=()=>{showEn=!showEn;$('#englishBody').classList.toggle('hidden',!showEn);$('#english').textContent=showEn?'隐藏英文':'显示英文'};
$('#chinese').onclick=()=>{showZh=!showZh;$('#chineseBody').classList.toggle('hidden',!showZh);$('#chinese').textContent=showZh?'隐藏译文':'显示译文'};
$('#highlight').onclick=()=>{highlight=!highlight;$('#englishBody').innerHTML=u.en.split('\n').filter(Boolean).map(t=>'<p>'+marked(t,u)+'</p>').join('');$('#highlight').textContent='词汇标记：'+(highlight?'开':'关')};
$('#learned').onclick=()=>{done.has(u.id)?done.delete(u.id):done.add(u.id);try{localStorage.setItem('cet6-learned-v1',JSON.stringify([...done]))}catch(e){}$('#learned').textContent=done.has(u.id)?'取消学完标记':'标记学完';list()};
const n=U.indexOf(u);$('#prev').disabled=n===0;$('#next').disabled=n===U.length-1;$('#prev').onclick=()=>openArticle(U[n-1].id);$('#next').onclick=()=>openArticle(U[n+1].id);
$('#main').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{$('#search').value=b.dataset.word;openWords()});
$('#stop').onclick=stop;$('#speak').onclick=speak;fillVoices();bindNeural()}
function fillVoices(){if(!$('#voice'))return;voices='speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)):[];$('#voice').innerHTML=voices.length?voices.map((v,n)=>'<option value="'+n+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>').join(''):'<option value="">系统默认英语</option>'}
function speak(){stop();if(!('speechSynthesis'in window)){$('#status').textContent='此浏览器不支持朗读，请复制英文到已有朗读工具。';return}
const token=run,rate=Number($('#rate').value),voice=voices[Number($('#voice').value)];const sentences=current.en.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[current.en];let n=0;
function next(){if(token!==run)return;if(n>=sentences.length){$('#status').textContent='朗读完成。';return}const speech=new SpeechSynthesisUtterance(sentences[n].trim());speech.lang=voice?.lang||'en-US';speech.rate=rate;if(voice)speech.voice=voice;$('#status').textContent='正在朗读 '+(n+1)+' / '+sentences.length+' 句';speech.onend=()=>{n++;next()};speech.onerror=e=>{if(token===run)$('#status').textContent='朗读未完成（'+e.error+'）。请尝试其他英语声音。'};speechSynthesis.speak(speech)}next()}
function openWords(){stop();view='words';active();list();const q=$('#search').value.trim().toLowerCase();let ws=I.filter(w=>!q||w.word.toLowerCase().includes(q)||w.records.some(r=>r.raw.includes(q)));ws.sort((a,b)=>(b.word.toLowerCase()===q)-(a.word.toLowerCase()===q)||a.word.localeCompare(b.word));
$('#main').innerHTML='<div class="panel"><h2>逐词索引</h2><p class="muted">找到 '+ws.length+' 个词头。正文中的完整词头或列明变体才计入覆盖；同词重复记录均保留。点篇号查看上下文。</p>'+ws.map(w=>'<section class="word"><h3>'+esc(w.word)+'</h3><div class="muted">原词表第 '+[...new Set(w.records.map(r=>r.page))].join('、')+' 页 · 首次在 '+w.locations[0].id+' 篇</div><div>'+w.locations.map(l=>'<button data-id="'+l.id+'">第 '+l.id+' 篇</button>').join('')+'</div><div class="sample">'+esc(w.locations[0].sentence)+'</div><details><summary>原表记录与恢复信息</summary><p class="muted">以下是原表记录，可能含旧义或错误；不可直接视为已校订的现代释义。请结合正文、译文和用法说明。</p>'+w.records.map(r=>'<p>'+esc(r.id+' · '+r.raw)+(r.correction?'<br><small>规范化：'+esc(r.original_word)+' → '+esc(r.word)+'</small>':'')+'</p>').join('')+'</details></section>').join('')+'</div>';
$('#main').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openArticle(b.dataset.id))}
function inline(t){let s=esc(t);return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function openGuide(){stop();view='guide';active();$('#main').innerHTML='<div class="panel" id="guide">'+GUIDE.split('\n\n').map(b=>b.startsWith('# ')?'<h2>'+esc(b.slice(2))+'</h2>':b.startsWith('## ')?'<h3>'+esc(b.slice(3))+'</h3>':'<div class="guideblock">'+inline(b).replace(/\n/g,'<br>')+'</div>').join('')+'</div>'}
$('#tabRead').onclick=()=>{stop();view='read';active();renderArticle();list()};$('#tabWords').onclick=openWords;$('#tabGuide').onclick=openGuide;
let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{list();if(view==='words')openWords()},160)};$('#filter').onchange=list;$('#clear').onclick=()=>{$('#search').value='';list();if(view==='words')openWords()};
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=fillVoices;
const WORD_CARDS=Object.assign({},WORD_CARDS_1,WORD_CARDS_2,WORD_CARDS_3,WORD_CARDS_4,WORD_CARDS_5,WORD_CARDS_6);
let activeWord='',wordUtterance=null,wordTimer=null,autoWordSound=true;
try{autoWordSound=localStorage.getItem('cet6-word-auto-sound')!=='off'}catch(e){}
function wordGrammar(entry){if(entry.usage)return entry.usage;const z=entry.zh||'',tips=[];if(/(?:^|\n)(?:vt\.|v\.)/.test(z))tips.push('作及物动词时可直接接宾语；搭配应结合下方例句学习。');if(/(?:^|\n)vi\./.test(z))tips.push('作不及物动词时不能直接接宾语，需留意与介词的搭配。');if(/(?:^|\n)(?:a\.|adj\.)/.test(z))tips.push('作形容词时可修饰名词，或在系动词后说明状态；具体位置见例句。');if(/(?:^|\n)(?:adv\.|ad\.)/.test(z))tips.push('作副词时可修饰动作、程度或整个句子；留意例句中的位置。');if(/(?:^|\n)n\./.test(z))tips.push('作名词时注意前面的限定词、单复数和介词搭配；不同词义的可数性可能不同。');return tips.slice(0,2).join(' ')||'结合下方例句，观察它修饰、连接或指代的成分。'}
function wordForms(e){const labels={p:'过去式',d:'过去分词',i:'-ing 形式','3':'第三人称单数',r:'比较级',t:'最高级',s:'复数','0':'词形原形'};return (e.exchange||'').split('/').map(s=>{const n=s.indexOf(':'),k=s.slice(0,n),v=s.slice(n+1);return n>0&&labels[k]&&v?labels[k]+'：'+v:''}).filter(Boolean).join('；')}
function showWord(word,context){stop();activeWord=word;const e=WORD_CARDS[word.toLowerCase()],dlg=$('#wordDialog');$('#wordTitle').textContent=word;$('#wordPhonetic').textContent=e?.phonetic?'参考音标 /'+e.phonetic+'/':'';$('#wordMeaning').textContent=e?.zh||'本地词典暂未收录此词，可打开下方词典继续查询。';$('#wordUsage').textContent=e?wordGrammar(e):'请结合当前例句理解。';$('#wordForms').textContent=e?[e.lemma&&e.lemma!==word.toLowerCase()?'原形：'+e.lemma:'',wordForms(e),e.note].filter(Boolean).join('\n'):'';$('#wordExample').textContent=context||'';$('#wordExample').parentElement.hidden=!context;$('#wordSource').textContent='释义与音标：'+(e?.source||'暂无')+'。多义词请结合上下文选择词义。';$('#wordExternal').href='https://dictionary.cambridge.org/dictionary/english-chinese-simplified/'+encodeURIComponent(e?.lemma||word.toLowerCase());$('#wordAuto').checked=autoWordSound;$('#wordSoundStatus').textContent='单词发音使用英语合成声音，可在正文上方切换声音。';if(!dlg.open)dlg.showModal();if(autoWordSound)pronounceWord()}
function pronounceWord(){stop();clearTimeout(wordTimer);const status=$('#wordSoundStatus');if(!('speechSynthesis'in window)){status.textContent='当前浏览器不支持发音，可打开下方在线词典听读音。';return}const available=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));const selected=voices[Number($('#voice')?.value)],voice=selected||available.find(v=>/en-US/i.test(v.lang))||available[0];const token=run;wordUtterance=new SpeechSynthesisUtterance(activeWord);wordUtterance.lang=voice?.lang||'en-US';wordUtterance.rate=.85;if(voice)wordUtterance.voice=voice;status.textContent='正在准备单词发音…';wordUtterance.onstart=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='正在发音：'+activeWord};wordUtterance.onend=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='发音完成，可点击“再听一次”。'};wordUtterance.onerror=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='此英语声音未能播放。请尝试切换声音，或打开在线词典听读音。'};wordTimer=setTimeout(()=>{if(token!==run)return;speechSynthesis.cancel();status.textContent='暂未启动英语语音。可切换系统英语声音，或打开在线词典听读音。'},8000);speechSynthesis.speak(wordUtterance)}
document.addEventListener('click',event=>{const b=event.target.closest('[data-lookup]');if(b)showWord(b.dataset.lookup,b.closest('[data-context]')?.dataset.context||'')});
$('#wordClose').onclick=()=>$('#wordDialog').close();$('#wordDialog').addEventListener('close',()=>{clearTimeout(wordTimer);stop()});$('#wordDialog').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()});$('#wordSound').onclick=pronounceWord;$('#wordAuto').onchange=()=>{autoWordSound=$('#wordAuto').checked;try{localStorage.setItem('cet6-word-auto-sound',autoWordSound?'on':'off')}catch(e){}};

const target=location.hash.match(/^#p(\d+)$/);if(target)current=U.find(u=>u.id===target[1])||U[0];
renderArticle();list();window.addEventListener('beforeunload',stop);
</script></body></html>
