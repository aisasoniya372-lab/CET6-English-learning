,"barge","liner","dock"]},{"id":"37","title":"在厨房里学习协作","en_title":"Cooking Together","kind":"听力·日常生活","en":"Our cooking club planned a wholesome luncheon. One group would chop garlic and ginger, while another prepared mustard, soy sauce, and olive oil. We had tuna, salmon, sardine, shrimp, and oyster on a display card, but chose only one fish for the meal. A separate team prepared a sandwich with ham and a small bowl of vegetable soup.\nThe instructor showed us how to peel a pineapple, squeeze fruit, and finely chop a walnut for decoration. A raisin and a chestnut could provide different textures. We learnt to thicken soup gradually, sweeten a sauce moderately, and avoid turning it watery. Before using a mixer, we checked that the jug was correctly fitted. The meal taught us that a recipe is also an exercise in coordination: each ingredient has a role, and good timing helps separate efforts become a shared result.","zh":"烹饪社计划做一顿健康午餐。一组切蒜和姜，另一组准备芥末、酱油与橄榄油。展示卡列出金枪鱼、鲑鱼、沙丁鱼、虾和牡蛎，但这顿饭只选一种鱼；另一组做火腿三明治和蔬菜汤。老师演示削菠萝、榨水果汁并把核桃切碎装饰，葡萄干与栗子带来不同口感。我们学习逐步把汤调浓、适度给酱汁增甜，避免过稀。使用搅拌机前先确认容器安装正确。菜谱也是协调练习：每种食材有作用，恰当时机让分头劳动成为共同成果。","key":"Good timing helps separate efforts become a shared result. || help + 宾语 + 动词原形，适用于团队协作主题。","task":"分工明确和及时沟通可以提高团队效率。 || Clear responsibilities and timely communication can improve a team's efficiency.","q":"Did the club cook all the seafood on the card? || No. It selected one fish. 展示词卡与实际菜单不同。","note":"","wc":140,"new":["chop","squeeze","luncheon","garlic","watery","wholesome","moderately","sweeten","thicken","sardine","raisin","ingredient","oyster","chestnut","finely","tuna","mustard","soy","ginger","sandwich","ham","mixer","walnut","peel","salmon","olive","pineapple","jug","recipe","shrimp"]},{"id":"38","title":"在诊所把症状说清楚","en_title":"Describing a Problem Clearly","kind":"听力·就医沟通","en":"At the clinic, a patient explained that he felt dizzy and had developed a persistent cough. He could describe a symptom, but he did not try to diagnose himself. The nurse asked when the problem began and whether he had taken anything before the visit. Accurate information would help the clinician assess the situation.\nA poster explained the distinction between a bacterium and the broader everyday word germ. Another described the clinic's work to vaccinate eligible patients and reduce the spread of infectious disease. A pamphlet mentioned tuberculosis, while a diagram illustrated a kidney and a vein. These displays offered vocabulary, not a prescription for every visitor.\nThe patient asked what the next step involved and requested clarification of an unfamiliar term. Good communication did not require specialized knowledge. It required an honest description, careful listening, and the confidence to ask when an explanation remained unclear.","zh":"诊所里，一位患者说自己头晕并持续咳嗽。他描述症状，却不自行诊断。护士询问何时开始、来之前是否服用过什么，以帮助临床人员评估。海报区分细菌与日常更宽泛的“病菌”，介绍为符合条件者接种以及减少传染病传播的工作。宣传册提到结核病，图示展示肾脏与静脉。这些展示提供知识与词汇，不是给所有人的统一处方。患者询问下一步安排，并请求解释陌生术语。良好沟通不要求专业知识，而需要诚实描述、认真倾听，以及不懂时敢于提问。","key":"He could describe a symptom, but he did not try to diagnose himself. || but 连接职责不同的行为；symptom 是症状，diagnose 是诊断。","task":"清楚描述问题，比使用自己不理解的专业术语更有帮助。 || Describing a problem clearly is more helpful than using technical terms one does not understand.","q":"What information did the nurse request? || When the problem began and what the patient had taken before the visit. 时间与此前行为是具体信息。","note":"","wc":146,"new":["symptom","clinic","diagnose","prescription","pamphlet","bacterium","germ","dizzy","kidney","vein","tuberculosis","vaccinate","infectious"]},{"id":"39","title":"运动中的节奏与坚持","en_title":"Fitness without Comparison","kind":"写作·健康生活","en":"Our coach encouraged us to regard fitness as a gradual undertaking. A muscular appearance did not prove endurance, and a vigorous start did not guarantee a sustainable routine. Each person needed an adjustable plan that reflected experience and current ability.\nAt the first session, we would jog, practise balance, and learn a controlled movement involving the hip and thigh. Some participants could barely complete the sequence, while others wanted an extra challenge. The coach asked us not to mock a slower learner or mistake discomfort for achievement. A competitive atmosphere could energize a group, but excessive comparison could also frustrate it.\nAfter several weeks, the participants noticed steadier progress. The aim was to feel physically capable and remain engaged. Regular recreation offered a break from work and an opportunity to build supportive relationships. A modest routine we could sustain was more useful than an extreme programme abandoned after a few days.","zh":"教练鼓励我们把体能看作逐步培养的结果。肌肉外观不证明耐力，猛烈开头也不保证能坚持，每人需要符合经验与当前能力的可调计划。第一次训练包含慢跑、平衡及涉及髋部和大腿的受控动作。有人勉强完成，有人希望增加挑战。教练要求不嘲笑慢一些的学习者，也不把不适误当成绩。竞争气氛可以激励团队，过度比较却可能使人受挫。几周后，大家的进步更稳定，目标是身体能胜任活动并保持参与。规律休闲让人暂离工作、建立支持关系。能坚持的适量安排，比几天后放弃的极端计划更有用。","key":"A muscular appearance did not prove endurance, and a vigorous start did not guarantee a sustainable routine. || 两个平行否定句区分表象与长期能力。","task":"可持续的进步需要适合个人能力的计划。 || Sustainable progress requires a plan suited to individual ability.","q":"What was the coach's attitude towards comparison? || Competition could help, but excessive comparison could frustrate learners. 答案保留两面性。","note":"","wc":151,"new":["recreation","physically","hip","fitness","jog","endurance","feel","adjustable","competitive","vigorous","barely","challenge","extreme","muscular","thigh","energize","extra","coach","frustrate","mock"]},{"id":"40","title":"合租生活里的协商","en_title":"Sharing a Home","kind":"听力·住宿沟通","en":"When we moved into our lodging, the sitting-room contained a sofa, a couch cover, and a small table. A closet held spare bedding, while the pantry was almost empty. The landlord showed us the basement, the laundry area, and the balcony before handing over the key.\nSharing the space required more than dividing the rent. We agreed to rinse dishes, scrub the sink, and mop up a spill promptly. Nobody should leave underwear or pyjamas in the common lounge. One flatmate preferred an early breakfast; another came home late and needed a quiet place to unwind. These habits were not necessarily incompatible.\nWe held a short meeting whenever a complaint arose. An explicit agreement helped prevent a minor annoyance from becoming lasting resentment. The flat was neither luxurious nor spacious, but considerate behaviour made it homely. A comfortable home depends as much on cooperation as on furniture.","zh":"搬入住处时，起居室有沙发、沙发罩和小桌。壁橱存放备用寝具，食品储藏间几乎空着。房东展示地下室、洗衣区和阳台后交钥匙。合租不只是分房租。大家同意冲净碗碟、刷洗水槽并及时拖净泼洒物，不把内衣睡衣留在公共休息室。一人喜欢早吃早饭，另一人晚归需要安静放松，这些习惯未必不能兼容。出现抱怨就开短会，明确约定能防止小烦恼变成长期怨恨。房子既不豪华也不宽大，但体谅让它温馨。舒适的家既依赖家具，也依赖合作。","key":"A comfortable home depends as much on cooperation as on furniture. || as much on A as on B 表示两方面同样重要。","task":"明确的约定有助于防止小分歧演变成严重冲突。 || Clear agreements help prevent minor disagreements from developing into serious conflicts.","q":"How did the flatmates deal with complaints? || They held a short meeting and clarified agreements. 解决方式是及时协商。","note":"","wc":147,"new":["sofa","balcony","closet","laundry","couch","rinse","pantry","underwear","sitting-room","homely","lodging","complaint","mop","basement","breakfast","incompatible","luxurious","spill","lounge","pyjamas","sink","scrub"]},{"id":"41","title":"学生社团的公开决策","en_title":"Rules for a Student Association","kind":"写作·治理与责任","en":"Our association asked a volunteer to preside over its annual meeting. The treasurer presented the accounts, and a delegate proposed an alteration to the constitution. The new provision would require public notice before a major expenditure. Members could second a motion, debate its merit, and vote in a poll.\nOne faction wanted to abolish every procedural constraint, arguing that bureaucracy wasted time. Others feared that a powerful chair might dominate decisions. We eventually reached an accord: retain a brief review, but shorten unnecessary paperwork. The committee would designate a deputy to supervise implementation and publish a quarterly summary.\nThe unanimous decision did not remove every disagreement about politics. It established a procedure whereby disagreement could be expressed fairly. A charter is valuable when people abide by its principles and hold each other accountable. Good administration should make participation possible while preventing authority from becoming a personal privilege.","zh":"社团请志愿者主持年会，财务负责人汇报账目，一位代表提议修改章程：大笔开支前必须公开通知。成员可附议、讨论价值并投票。一个派别主张废除一切程序限制，认为官僚手续浪费时间；其他人担心强势主席控制决策。最终大家达成一致：保留简短审查，减少多余文书，指定副手监督执行并发布季度摘要。一致通过不代表政治分歧消失，而是建立公平表达分歧的程序。章程的价值在于遵守原则并相互问责。良好管理应让参与成为可能，防止权力变成个人特权。","key":"It established a procedure whereby disagreement could be expressed fairly. || whereby 表示“借助该程序”，引导定语从句，正式语体中可用。","task":"透明的程序有助于防止权力被滥用。 || Transparent procedures help prevent the abuse of power.","q":"What compromise did members reach? || Keep a short review while reducing unnecessary paperwork. 兼顾监督与效率。","note":"","wc":147,"new":["abide","charter","preside","designate","merit","politics","poll","dominate","accord","treasurer","constraint","faction","shorten","whereby","quarterly","provision","bureaucracy","abolish","deputy","delegate","alteration","unanimous","constitution","supervise"]},{"id":"42","title":"诚实比掩饰更重要","en_title":"Integrity under Pressure","kind":"写作·职业道德","en":"A supplier offered an employee a bribe to overlook a defective batch. Accepting it would violate the company's rules and betray its clients. Yet the employee feared that reporting the incident might endanger his promotion. A colleague urged him to document what had happened and use the firm's reporting process.\nThe subsequent investigation found an irregularity in several transactions. Managers had tried to whitewash the matter with an ambiguous statement, but the evidence contradicted their denial. The board decided to dismiss the responsible manager and commission an independent review. It also promised to compensate affected customers.\nA scandal can damage more than immediate earnings. It can undermine the confidence on which long-term cooperation rests. No organization can claim moral superiority merely because it has a code of conduct. Its integrity becomes manifest when it is willing to acknowledge wrongdoing, impose appropriate consequences, and protect people who raise a legitimate concern.","zh":"供应商向员工行贿，希望他忽略一批缺陷产品。接受贿赂既违背公司规定，也背叛客户，但员工担心举报影响晋升。同事建议记录事实并使用公司报告流程。后续调查发现多笔交易异常。管理人员曾用模糊声明粉饰问题，但证据否定其说法。董事会决定解雇负责人、委托独立审查并补偿客户。丑闻损害的不只是眼前收益，还会削弱长期合作的信任。组织不能仅凭行为准则就宣称道德优越；愿意承认错误、落实适当后果并保护正当反映问题者时，诚信才真正显现。","key":"Its integrity becomes manifest when it is willing to acknowledge wrongdoing. || when 从句给出抽象品质得以体现的具体条件。","task":"公众信任取决于组织如何回应错误。 || Public trust depends on how an organization responds to its mistakes.","q":"Why was the employee initially hesitant? || He feared that reporting the incident might harm his promotion. 留意心理动因。","note":"","wc":150,"new":["commission","violate","dismiss","whitewash","ambiguous","impose","bribe","denial","subsequent","scandal","irregularity","manifest"]},{"id":"43","title":"一场模拟法庭","en_title":"Evidence in a Mock Court","kind":"阅读·公共规则","en":"In a mock court, a student played a detective investigating a theft. Another acted as an attorney, while a third took the role of a magistrate. The alleged offence involved a stolen bicycle. The class had to distinguish suspicion from proof before discussing guilt.\nA witness would testify about what she had seen, not what gossip suggested. The defence could challenge a claim, question identification, and make a plea for careful consideration. A confession in the script was not automatically conclusive: its circumstances also mattered. The teacher asked us not to presume that a suspicious appearance established wrongdoing.\nThe exercise ended without a real conviction or penalty. Its purpose was to acquaint us with disciplined reasoning. It is easy to demand certainty when a story provokes anger; it is harder to examine competing explanations fairly. An impartial process protects both the person making a complaint and the person accused.","zh":"模拟法庭上，学生分别扮演侦探、律师和法官，案件是一辆自行车失窃。讨论有罪与否前，要区分怀疑与证据。证人只能陈述所见，不依赖流言；辩方可质疑主张与身份辨认，并请求慎重考虑。剧本中的供认也并非自动成为定论，还要看发生背景。老师要求不要凭外表可疑就认定犯错。活动没有真实定罪或处罚，而是让大家熟悉严谨推理。故事激起愤怒时要求确定答案很容易，公正审视不同解释更难。公正程序同时保护申诉者与被指控者。","key":"It is easy to demand certainty; it is harder to examine competing explanations fairly. || it 作形式主语，不定式为真正主语，平行比较增强论证。","task":"我们不应该把怀疑当作已经得到证明的事实。 || We should not treat suspicion as an established fact.","q":"What was the purpose of the exercise? || To practise disciplined reasoning rather than impose a real punishment. 模拟场景的学习目的。","note":"","wc":149,"new":["testify","detective","guilt","acquaint","identification","conviction","certainty","plea","suspicious","presume","offence","magistrate","theft","attorney","penalty"]},{"id":"44","title":"冲突之后的重建","en_title":"Rebuilding after Conflict","kind":"阅读·历史与人道关怀","en":"The documentary followed a civilian family returning to a desolate town. Warfare had damaged a bridge, emptied a nursery, and left the market in ruins. A former refugee described the grief of losing a neighbour and the difficulty of beginning again. No triumphant slogan could erase that experience.\nAn aid worker explained how humanitarian support could help restore ordinary life. Teams repaired water facilities, reunited relatives, and made a damaged school usable. A memorial recorded a massacre and warned against treating cruelty as an inevitable feature of history. The narrator rejected both the glorification of slaughter and a call for vengeance.\nReconstruction demanded solidarity, patience, and practical resources. A political settlement might end a battle, but it would not instantly remove fear or deprivation. Lasting peace requires institutions that safeguard dignity and opportunities for people to rebuild trust. Humanity is tested most clearly when the needs of vulnerable people remain visible after public attention has moved elsewhere.","zh":"纪录片跟随一个平民家庭返回荒凉城镇。战争毁坏桥梁、使托儿所空置、让市场成为废墟。曾为难民的人讲述失去邻居的悲痛与重新开始的困难，胜利口号无法抹去经历。援助人员解释，人道支持通过修复供水、帮助亲人团聚、恢复学校来重建日常生活。纪念碑记录屠杀，提醒人们不要把残酷当作历史必然。旁白拒绝歌颂杀戮或呼吁复仇。重建需要团结、耐心与资源，政治和解能结束战斗，却不会立刻消除恐惧与匮乏。长久和平还需维护尊严的制度和重建信任的机会。公众目光转移后仍看见脆弱者的需要，尤其考验人性。","key":"A political settlement might end a battle, but it would not instantly remove fear. || might / would 保持条件性，区分短期结果与长期问题。","task":"重建不仅包括修复建筑，也包括恢复人们之间的信任。 || Reconstruction involves restoring trust between people as well as repairing buildings.","q":"Why is rebuilding more than repairing structures? || People also need security, relationships, and trust restored. 关注物质与社会层面。","note":"","wc":157,"new":["warfare","battle","solidarity","settlement","humanity","civilian","refugee","nursery","bridge","documentary","desolate","massacre","cruelty","humanitarian","grief","vengeance","safeguard","slaughter"]},{"id":"45","title":"博物馆中的权力故事","en_title":"When Power Goes Unchecked","kind":"阅读·历史词汇","en":"An exhibit described a fictional sovereign who became a tyrant. His regime used propaganda to glorify obedience, while a dictator in a neighbouring state claimed that dissent was a menace. The curator asked visitors to examine how tyranny could turn a disagreement into an excuse to persecute people.\nThe story included a siege, a captive soldier, and a regiment ordered to defend a fort. A bugle signalled the advance of a troop. Later, a mob tried to overthrow the ruler, and a bandit exploited the disorder to plunder abandoned houses. The display did not present every opponent as a hero.\nIts closing panel described efforts to govern through accountable institutions. A society cannot escape abuse simply by replacing one ruler with another. What matters is whether public authority is constrained and whether ordinary people can challenge injustice without being treated as enemies. Historical language becomes useful when it helps us ask precise questions about power.","zh":"展览讲述虚构君主变成暴君的故事。他的政权用宣传歌颂服从，邻国独裁者则称异议是威胁。策展人请游客思考，暴政如何把分歧当作迫害借口。故事包含围城、被俘士兵和奉命守堡的团，军号发出部队前进信号。后来暴民试图推翻统治者，匪徒趁乱劫掠空屋。展览没有把所有反对者都描绘成英雄。最后介绍通过可问责制度治理的努力：只换统治者不足以摆脱滥权，关键在于公共权力是否受约束，普通人能否挑战不公而不被视为敌人。历史词汇能帮助我们准确追问权力问题。","key":"What matters is whether public authority is constrained. || what 主语从句搭配 whether 表语从句，适合提出判断标准。","task":"真正重要的是，权力是否受到有效监督。 || What truly matters is whether power is subject to effective oversight.","q":"Did the exhibition portray every opponent as heroic? || No. It also showed bandits exploiting disorder. 避免把复杂叙述简化为单一对立。","note":"","wc":155,"new":["regime","excuse","troop","fort","propaganda","overthrow","regiment","bandit","persecute","neighbouring","sovereign","mob","bugle","govern","disorder","obedience","dictator","captive","tyrant","tyranny","siege","menace","plunder"]},{"id":"46","title":"宗教词汇与尊重差异","en_title":"Reading about Belief","kind":"阅读·文化与宗教","en":"In a comparative religion class, we read about Islam, Buddhism, and Christian traditions. One text described a mosque and a pilgrim; another introduced a monk, a nun, and a Catholic bishop. References to Jesus Christ, the pope, and scripture required attention to each passage's context.\nThe teacher distinguished description from personal endorsement. To explain why someone might worship, pray, or burn incense was not to demand that classmates share a doctrine. A pious person might cherish a shrine, while another reader approached the same object historically. Older texts sometimes used Moslem where contemporary texts often use Muslim.\nWe discussed words such as divine, Heaven, and eternal without presenting supernatural claims as scientific findings. A respectful reader should neither ridicule belief nor assume that every member of a community thinks alike. Understanding cultural language requires sensitivity to difference, including differences within a tradition.","zh":"比较宗教课阅读伊斯兰教、佛教与基督教传统。文章提到清真寺、朝圣者、僧侣、修女和天主教主教；耶稣基督、教皇与经文等词需要结合语境。老师区分描述与个人赞同：解释礼拜、祈祷或焚香，不是要求同学接受某种教义。虔诚信徒可能珍爱圣祠，其他读者则从历史角度看它。旧文有时用 Moslem，当代文本常用 Muslim。我们讨论神圣、天堂和永恒等词，却不把超自然主张当作科学发现。尊重的读者既不嘲笑信仰，也不假设群体成员思想一致；文化理解要注意传统内部的差异。","key":"To explain why someone might worship was not to demand that classmates share a doctrine. || 不定式作主语，区分解释某种行为与要求认同。","task":"理解一种文化，不意味着必须接受其中的每一种信念。 || Understanding a culture does not mean accepting every belief within it.","q":"What distinction did the teacher emphasize? || Description versus personal endorsement. 解释并不等于赞同。","note":"Moslem 是旧拼写；主动写作优先使用 Muslim。宗教名词需结合语境理解。","wc":142,"new":["eternal","Islam","Jesus","nun","religion","pilgrim","incense","Catholic","shrine","divine","Heaven","mosque","pious","sensitivity","Christ","doctrine","Christian","monk","Buddhism","worship","scripture","pope","bishop","ridicule","Moslem"]},{"id":"47","title":"舞台背后的合作","en_title":"Behind the Curtain","kind":"听力·戏剧与表演","en":"The amateur drama group prepared a comedy about a magician who could not perform a simple trick. A clown would interrupt him, a dancer would attempt a ballet step, and a witty servant would reveal the illusion. The final episode ended with a surprising gesture rather than a long speech.\nBackstage, someone repaired a scarlet cloak, stitched a seam in a frock, and attached a lace collar to a blouse. A makeup artist adjusted a blond wig and added a wrinkle to make a young actor appear older. The actress playing a goddess practised a graceful movement, while the stage manager checked every cue.\nOpening night brought nervous excitement. The audience began to clap at the climax, and the actors exchanged a grateful hug afterwards. The performance seemed effortless only because innumerable small tasks had been completed with care. Entertainment is often built on cooperation that the spectator never sees.","zh":"业余剧团排演一出喜剧：魔术师连简单戏法都做不好，小丑打断他，舞者尝试芭蕾动作，机智仆人揭露幻象。最后一幕以意外动作而非长演说收尾。后台有人修补猩红披风、缝连衣裙接缝，把蕾丝领安到女衬衫上；化妆师调整金色假发、画上皱纹让年轻演员显老。饰女神的演员练习优雅动作，舞台监督逐一核对提示。首演令人紧张兴奋，高潮时观众鼓掌，结束后演员感激相拥。表演之所以看似轻松，是因为无数小任务已被细心完成。娱乐往往建立在观众看不见的合作上。","key":"The performance seemed effortless only because innumerable small tasks had been completed with care. || 过去完成时被动表示演出之前已完成的准备。","task":"看似轻松的表演往往需要大量看不见的准备。 || A seemingly effortless performance often requires extensive preparation that the audience never sees.","q":"Why did the performance appear effortless? || Numerous backstage tasks had been completed carefully. 外在效果来自幕后劳动。","note":"","wc":150,"new":["makeup","wrinkle","entertainment","episode","cloak","scarlet","lace","drama","comedy","innumerable","clap","blouse","goddess","magician","hug","grateful","witty","illusion","seam","spectator","blond","ballet","climax","frock","clown","gesture"]},{"id":"48","title":"一场风暴中的社区","en_title":"A Community Facing a Storm","kind":"听力·应急协作","en":"A sudden gust shook the shutters as the weather bulletin announced a severe storm. Clouds gathered, hail struck the pavement, and water began to overflow a gutter. The council asked residents to remain alert and follow the local warning. A hurricane mentioned in the broadcast was affecting a distant coast; our town faced heavy rain.\nVolunteers helped move supplies from a damp basement. They used a portable lamp, carried a watertight box, and kept the exit clear. When a branch threatened to block the road, trained staff arranged a safe diversion. No one was encouraged to scramble onto a roof or cross a flooded street.\nAfterwards, neighbours checked on a frail resident and helped clear debris. The damage was serious, but timely cooperation reduced confusion. Preparedness means more than owning equipment: it means knowing who will do what and how information will reach those who need it.","zh":"突起阵风摇动百叶窗，天气公告宣布强风暴来临。云聚集，冰雹打向路面，雨水溢出排水沟。市政部门要求居民警觉并遵循当地预警。广播提到的飓风在遥远海岸，本镇面对的是大雨。志愿者把物资移出潮湿地下室，使用便携灯、搬防水箱并保持出口畅通。树枝可能堵路时，受训人员安排安全绕行。没人被鼓励爬屋顶或穿过积水街道。事后，邻居查看体弱居民并清理杂物。损害严重，但及时合作减少混乱。准备不只是拥有设备，还包括明确分工和信息如何送到需要的人手中。","key":"Preparedness means more than owning equipment: it means knowing who will do what. || means + 动名词，冒号后把抽象准备落实为具体分工。","task":"明确的沟通能够在紧急情况下减少混乱。 || Clear communication can reduce confusion in an emergency.","q":"Was a hurricane directly affecting the town? || No. The hurricane was distant; the town faced heavy rain. 识别不同地点的信息。","note":"","wc":147,"new":["block","diversion","gust","cross","hail","portable","hurricane","alert","warning","timely","severe","gutter","frail","overflow","watertight","scramble"]},{"id":"49","title":"山路上的一次改道","en_title":"A Hike That Changed Course","kind":"听力·户外活动","en":"Our hike began on a winding trail beside a barren slope. We passed a rocky overhang, a shallow cave with a hollow echo, and a clearing where a lily grew in the shade. The guide asked us to tread carefully on loose gravel and avoid the fragile edge of the path.\nAt noon, a fallen tree made the intended route inaccessible. We could not bypass it safely. Some walkers wanted to cling to the original plan, but the guide chose a longer descent. We would traverse the lower ridge, turn at a fence, and return through a neighbouring village.\nThe change caused disappointment, yet nobody had to prove courage by taking a needless risk. We ate a snack, tightened a bootlace, and resumed at a comfortable pace. A successful journey does not always reach the planned summit. Sometimes its achievement lies in recognizing when a sensible alteration is necessary.","zh":"徒步从贫瘠山坡旁的曲径开始，经过悬岩、带空洞回声的浅洞，以及阴影中长着百合的空地。导游要求小心踩碎石，避开脆弱路边。中午倒树使原路无法进入，也无法安全绕过。有人执意原计划，导游却选了更长的下山路：横穿较低山脊，在围栏处转弯，经邻村返回。变化令人失望，但没人需要以无谓冒险证明勇气。大家吃零食、紧鞋带，按舒适速度继续。成功旅程不一定到达计划中的山顶，有时成就在于认出何时必须合理调整。","key":"Sometimes its achievement lies in recognizing when a sensible alteration is necessary. || lie in + 动名词表示关键所在；when 引导宾语从句。","task":"坚持目标并不意味着拒绝调整方法。 || Commitment to a goal does not mean refusing to adjust one's approach.","q":"Why did the guide change the route? || A fallen tree blocked the path, and it could not be bypassed safely. 决定基于现场条件。","note":"","wc":149,"new":["hike","cling","hollow","overhang","descent","gravel","barren","bypass","snack","fence","traverse","echo","summit","inaccessible","fragile","lily","clearing","shade","pace","tread"]},{"id":"50","title":"退休后的新角色","en_title":"A Different Kind of Contribution","kind":"写作·老龄社会","en":"After retirement, a former engineer feared that his experience would become irrelevant. He did not yearn for a grand title, but he missed the satisfaction of solving a practical problem. A community centre invited him to mentor a small repair team.\nAt first, he expected unquestioning obedience. A younger volunteer found his manner stern and his instructions overly conservative. Rather than dismiss the disagreement, they discussed it openly. He learnt to explain the reason behind a procedure; she learnt to value knowledge acquired through years of practice. Their reciprocal respect became the project's greatest strength.\nThe engineer's contribution was not charity received but expertise shared. An ageing society benefits when it creates opportunities for meaningful involvement. Experience can complement youthful energy, provided neither group assumes automatic superiority. Respect grows through genuine collaboration, not a sentimental compliment offered once a year.","zh":"退休后，一位工程师担心经验失去意义。他不渴望头衔，却怀念解决实际问题的满足感。社区中心邀请他指导维修队。起初他希望大家绝对服从，年轻志愿者觉得他严厉、指令过分保守。双方公开讨论：他学着解释程序的原因，她学着重视多年实践积累的知识。相互尊重成为项目最大优势。工程师的参与不是接受施舍，而是分享专长。老龄社会能从有意义的参与机会中受益；只要彼此不自认天然优越，经验就能与年轻活力互补。尊重来自实际合作，而非一年一次的感伤赞美。","key":"Experience can complement youthful energy, provided neither group assumes automatic superiority. || complement 作动词意为互补；provided 引导条件从句。","task":"社会应该为老年人提供继续发挥专长的机会。 || Society should provide older people with opportunities to continue using their expertise.","q":"What changed after the disagreement was discussed? || Both participants learnt to explain or appreciate the other's perspective. 变化是双向的。","note":"","wc":140,"new":["conservative","yearn","reciprocal","compliment","stern","retirement","satisfaction","complement"]},{"id":"51","title":"移居之前的信息准备","en_title":"Preparing to Move Abroad","kind":"听力·出国与手续","en":"Before deciding to emigrate, Lan attended an information session about life in a foreign country. She learnt that immigrate describes entering a country to settle, while emigrate emphasizes leaving one. Her personal motive was to join an overseas research team, not to escape an immediate problem.\nShe checked her passport, visa, and the availability of accommodation. A consul at an embassy information event explained where to find official guidance. An ambassador's speech about diplomatic cooperation was interesting, but it could not answer her individual paperwork questions. Lan made a reservation, packed a suitcase, and kept a copy of her correspondence.\nShe also checked when her documents would expire and whether a dependant needed separate arrangements. No tempting shortcut could replace proper preparation. Moving abroad might be advantageous, but it would involve adaptation, expense, and uncertainty. A realistic decision required both hope and a clear understanding of the commitment.","zh":"兰决定移居前，参加国外生活说明会。她了解到 immigrate 强调迁入定居，emigrate 强调迁出；自己的动机是加入海外研究团队。她核查护照、签证与住宿供应。使馆活动中的领事介绍官方信息渠道，大使关于外交合作的讲话虽有趣，却不能回答个人手续问题。她预订住宿、装好行李并保存通信副本，也核查证件到期时间及受抚养人是否需单独安排。捷径不能取代准备。出国可能有利，但涉及适应、费用与不确定性，现实决定既需要希望，也需要理解承诺。","key":"Moving abroad might be advantageous, but it would involve adaptation, expense, and uncertainty. || might / would 表示审慎预期，三个名词并列呈现成本。","task":"作出重大决定之前，人们应该核实相关信息。 || People should verify relevant information before making a major decision.","q":"Why was the ambassador's speech insufficient for Lan? || It did not answer her individual paperwork questions. 区分宏观讲话与具体服务。","note":"","wc":148,"new":["availability","advantageous","emigrate","suitcase","foreign","diplomatic","correspondence","dependant","visa","expire","consul","shortcut","proper","motive","embassy","ambassador","passport","reservation","immigrate"]},{"id":"52","title":"小店为何会资金紧张","en_title":"Understanding a Cash Shortage","kind":"阅读·经济与经营","en":"A trader sold imported merchandise through a small outlet. Inflation raised his costs, and a fluctuation in currency values made the next order more expensive. Although demand remained steady, the business faced a shortage of cash. A dealer offered to finance a purchase, but the first installment would be due almost immediately.\nThe owner asked whether he could repay the debt if sales fell. A deposit was already tied up in an estate lease, and his mortgage still required payment. One failed assumption could push him towards default or leave the firm bankrupt. He chose to negotiate a smaller order and reduce excess stock.\nAn economics student used this example to explain why profit and liquidity differ. Prices can fluctuate, a commodity can lose value, and a seemingly profitable business can still struggle to meet immediate obligations. Thrifty management means planning ahead, not merely refusing every expenditure.","zh":"商贩通过小门店出售进口商品。通胀推高成本，汇率波动让下批货更贵。需求稳定，现金却短缺。经销商提出融资，但首期很快到期。店主考虑销售若下降能否还债：一笔押金占在物业租约中，按揭仍要支付。错误假设可能导致违约甚至破产。他决定协商减少订单、降低过量库存。经济学学生用此例解释利润与流动性的区别：价格会波动，商品会贬值，看似盈利的企业仍可能无法履行眼前义务。节俭管理是提前规划，不是一概拒绝支出。","key":"A seemingly profitable business can still struggle to meet immediate obligations. || seemingly 表示表象；meet obligations 为履行义务的搭配。","task":"销售稳定并不一定意味着企业有足够的现金。 || Steady sales do not necessarily mean that a business has sufficient cash.","q":"What did the owner choose to do? || Negotiate a smaller order and reduce excess stock. 根据现金压力调整规模。","note":"","wc":147,"new":["deposit","currency","inflation","negotiate","trader","dealer","merchandise","commodity","bankrupt","fell","economics","thrifty","excess","installment","estate","outlet","shortage","mortgage","fluctuation","fluctuate","repay","default"]},{"id":"53","title":"展会上如何提出好问题","en_title":"Asking Questions at a Trade Fair","kind":"听力·商务交流","en":"At a fair, a producer displayed a prototype with a patent application pending. Its spokesman praised an ingenious modification that could halve processing time. I asked for the specification, the conditions of the comparison, and a demonstration using an ordinary workpiece.\nThe machine had a modular design: one module could detach from another, and a handy fitting allowed adjustment. A cutter moved along a preset track while a roller guided the material. The output looked first-rate, but the representative admitted that a delicate garment required different settings. A promotional claim needed qualification.\nWe discussed a possible deal without making an immediate bid. A clear quotation would identify what the price included, what support was available, and who would be liable if delivery failed. Commercial courtesy does not require unquestioning acceptance. A buyer can remain gracious while asking firm, pertinent questions about a product's actual performance.","zh":"展会上，厂家展示一台专利申请中的原型机。发言人称巧妙改进能把加工时间减半，我询问规格、比较条件，并要求用普通工件演示。设备采用模块结构，模块可拆，便利配件能调节；切刀沿预设轨道走，滚轮引导材料。成品看似一流，但代表承认精细衣物需要不同设置，宣传必须有适用限制。双方讨论交易，却没立即报价。清楚的报价单要说明包含内容、售后支持和交货失败责任。商业礼貌不等于全盘接受，买方完全可以礼貌而坚定地询问实际性能。","key":"A buyer can remain gracious while asking firm, pertinent questions. || while + 动名词表示两种行为同时成立。","task":"评价一项宣传时，应该先了解比较是在什么条件下进行的。 || When evaluating a promotional claim, we should first understand the conditions under which the comparison was made.","q":"Why did the performance claim need qualification? || Different materials required different settings. 宣称不能脱离适用条件。","note":"","wc":145,"new":["deal","patent","specification","prototype","preset","liable","cutter","garment","fitting","producer","gracious","pertinent","module","bid","ingenious","modification","roller","detach","handy","spokesman","halve","first-rate"]},{"id":"54","title":"一场简朴的婚礼","en_title":"A Wedding within Our Means","kind":"听力·家庭与消费","en":"The bridegroom wanted a small wedding, although a cousin insisted that a grand engagement party was customary. The couple rejected an extravagant mansion and chose a community hall. A friend would take the photography, and relatives would prepare a light refreshment for each guest.\nThe bride wore a simple dress with a bead decoration and carried a tulip. Her partner looked radiant but nervous. A child tried to tickle his ear, making him grin and blush. During the ceremony, the couple made a vow to support one another. Nobody needed to dazzle the guests with expensive jewellery.\nAfterwards, we added pictures to an album and exchanged a small souvenir. The atmosphere was romantic because people showed sincere affection, not because a millionaire had paid the bill. A meaningful celebration can embody commitment and hospitality without becoming an unreasonable financial burden.","zh":"新郎想办小婚礼，尽管表亲坚持盛大订婚派对是惯例。两人放弃奢华宅邸，选择社区礼堂。朋友摄影，亲戚给每位宾客准备茶点。新娘穿珠饰简裙、拿郁金香，伴侣容光焕发却紧张。孩子挠他耳朵，让他咧嘴笑又脸红。仪式中两人誓言相互支持，无需用昂贵珠宝炫目。后来大家把照片放进相册，交换小纪念品。浪漫来自真诚情意，而非百万富翁买单。有意义的庆祝能体现承诺和好客，又不成为不合理负担。","key":"A meaningful celebration can embody commitment and hospitality without becoming an unreasonable financial burden. || without + 动名词表示避免伴随结果。","task":"庆祝活动的意义并不取决于花费的多少。 || The meaning of a celebration does not depend on how much is spent.","q":"Why did the couple choose a community hall? || They wanted a modest wedding within their means. 场地选择体现消费观。","note":"","wc":140,"new":["album","tulip","bead","radiant","bridegroom","customary","embody","vow","photography","extravagant","tickle","grin","blush","souvenir","engagement","romantic","hospitality","mansion","millionaire","refreshment","ear","dazzle"]},{"id":"55","title":"烘焙课上的耐心","en_title":"Patience in a Baking Class","kind":"听力·生活技能","en":"We began by separating an egg yolk from the white and measuring the flour. The teacher added yeast to one mixture and explained the need for time. Another group prepared a crisp biscuit, a fruit jelly, and a small pickle to accompany a savoury dish. Bacon and steak belonged to the next lesson, not today's menu.\nI tried to hurry and left a lump in the batter. The teacher asked me to stir evenly, scrape the rim, and let the mixture settle. A little extra liquid could soften it; too much would spoil the intended texture. We would bake one batch and compare it with another.\nAfterwards, we cleaned a stainless tray, removed grease from the counter, and checked the burner was off. The class reminded me that skill grows through attention. An ordinary task can teach restraint when impatience tempts us to skip a necessary step.","zh":"大家先分开蛋黄蛋清、称面粉。老师给一份混合物加酵母，解释等待的必要；另一组准备脆饼、果冻和配咸食的小腌菜。培根与牛排属于下次课，非本日菜单。我急躁，面糊留下一团块。老师让均匀搅拌、刮净容器边缘并静置。少量液体能使其变软，过多则破坏口感；我们烤两批比较。事后清洗不锈钢盘、擦去台面油脂并确认炉头关闭。技能通过留心成长，日常任务也能教人克制，避免因急躁跳过必要步骤。","key":"An ordinary task can teach restraint when impatience tempts us to skip a necessary step. || tempt sb. to do 表示诱使；when 从句给出具体情境。","task":"耐心完成每一个步骤，通常比一味求快更有效。 || Completing each step patiently is often more effective than simply trying to work faster.","q":"What mistake did the narrator make? || Hurrying left a lump in the batter. 原因与结果直接对应。","note":"","wc":147,"new":["evenly","pickle","bacon","skip","soften","yeast","jelly","grease","burner","yolk","steak","crisp","stainless","rim","lump","counter"]},{"id":"56","title":"牙科候诊室的阅读练习","en_title":"Reading in a Waiting Room","kind":"阅读·健康信息素养","en":"While waiting for a dentist, I read a leaflet about a cavity and another about the absorption of nutrients. A diagram showed how food could nourish the body, but it did not recommend the same intake for everyone. A vitamin supplement, the text cautioned, should not be confused with a complete diet.\nNearby material discussed deficiency, nourishment, and the interpretation of research. A study of a microscopic process might offer insight, yet its finding could not automatically justify a general claim. A headline about regenerative treatment required more context than the poster supplied.\nI wrote down a question rather than infer a personal diagnosis from the display. Public information is useful when it helps people ask better questions and locate reliable guidance. It becomes misleading when a limited observation is presented as a universal solution. Understanding the boundary between information and individual advice is itself a valuable reading skill.","zh":"等牙医时，我阅读龋洞和营养吸收传单。图示解释食物如何滋养身体，却没有给所有人建议同样摄入量。文中提醒，维生素补充剂不等于完整饮食。附近资料讨论营养缺乏及研究解读：微观过程研究可以提供启发，但不能自动证明一般主张。再生治疗标题所需语境比海报提供的更多。我记下问题，没有从展示推断个人诊断。公共信息若帮助人提出好问题、找到可靠指导就有用，把有限观察包装成万能方案则会误导。区分一般信息与个体建议，本身就是阅读能力。","key":"It becomes misleading when a limited observation is presented as a universal solution. || 被动语态突出信息被如何呈现，适合批判性阅读讨论。","task":"有限的研究结果不应该被描述成适用于所有人的解决方案。 || Limited research findings should not be presented as solutions that apply to everyone.","q":"What did the reader do instead of self-diagnosing? || Wrote down a question for clarification. 信息阅读后采取的行动。","note":"","wc":149,"new":["dentist","regenerative","microscopic","absorption","intake","vitamin","nourish","nourishment","deficiency","cavity","leaflet","supplement","infer"]},{"id":"57","title":"农场工具与劳动分工","en_title":"Tools and Work on a Farm","kind":"阅读·乡村与技术","en":"At the ranch, a farmer showed us an old waggon beside a diesel tractor. A bridle hung near the stable, and a wooden yoke recalled an earlier way of working. A bull stood apart from a buffalo, while a donkey, called an ass in an older account, waited quietly.\nWe watched workers thresh grain, inspect a seed's kernel, and prepare a bed for transplant work. A shovel helped move soil; a machine could perform the same task on a larger scale. Neither tool was ideal for every job. A hardy plant might survive where a delicate one would wither.\nThe farmer explained why care mattered during breeding. To breed animals responsibly required attention to their needs rather than merely increasing numbers. A child watched a chick hatch and later peck at food. The visit made visible the labour behind products that urban shoppers often treat as commonplace.","zh":"牧场里，农民展示柴油拖拉机旁的旧货车。马厩挂着笼头，木轭让人想起旧劳动方式。公牛与水牛分开站，一头旧文称 ass 的驴安静等待。工人脱粒、查看种仁、准备移栽苗床，铲子移土，机器则能扩大处理规模，但没有工具适合一切任务。耐寒健壮的植物可能在娇弱植物枯萎的地方生存。农民解释，负责任地繁育动物需要关注需求，而不只是增加数量。孩子看小鸡孵化，之后啄食。参观让城市消费者常视为平常的商品背后劳动显现出来。","key":"Neither tool was ideal for every job. || neither 否定两者；for every job 限定适用范围。","task":"技术的价值取决于它是否适合具体任务。 || The value of technology depends on whether it suits the particular task.","q":"What did the visit reveal to urban shoppers? || The labour behind everyday products. 细节最后汇成主题。","note":"ass 在此指驴，现代日常表达也可能有其他含义；写作中 donkey 更明确。waggon 为拼写变体，常见拼写 wagon。","wc":147,"new":["buffalo","hardy","commonplace","bull","ass","bridle","wither","yoke","thresh","waggon","shovel","diesel","hatch","kernel","breed","ranch","transplant","peck"]},{"id":"58","title":"铁匠铺与工业展厅","en_title":"From a Forge to a Factory","kind":"阅读·工业史","en":"A blacksmith heated metal in a forge and used a hammer to shape it. The museum placed this scene beside a display on metallurgy. Labels distinguished ferrous material from other metals and explained how coke and charcoal appeared in historical processes. We observed the tools without attempting the work ourselves.\nIn the modern section, a lathe cut a groove into a demonstration piece. A guide described how workers lubricate machinery, inspect a valve, and remove dust before it causes trouble. A steel frame could brace a structure; cement could help form a foundation. A blast furnace model illustrated a very different scale of production.\nIndustrial progress involved more than larger machines. Standard procedures, training, and maintenance were instrumental in improving reliability. A small workplace could still excel by selecting suitable equipment and checking each stage carefully. Technical change matters when it improves the quality of work as well as the quantity of output.","zh":"铁匠在炉中加热金属，用锤成形。博物馆将此场景放在冶金展旁，标签区分含铁材料与其他金属，说明焦炭、木炭在历史工艺中的用途。大家只观察工具，不亲自操作。现代区的车床在演示件上切槽，导游解释润滑设备、检查阀门、清除积尘的重要性。钢架能支撑结构，水泥帮助形成地基，高炉模型则展示另一生产规模。工业进步不只是机器变大，标准程序、培训和维护都帮助提高可靠性。小作坊也能通过选对设备、细查各环节表现出色。技术变化若同时改善工作质量与产量，才有意义。","key":"Technical change matters when it improves the quality of work as well as the quantity of output. || as well as 连接两个评价维度。","task":"可靠的生产既需要设备，也需要培训和维护。 || Reliable production requires training and maintenance as well as equipment.","q":"What helped improve reliability besides machinery? || Standard procedures, training, and maintenance. 考查并列信息。","note":"","wc":153,"new":["brace","cement","instrumental","metallurgy","blacksmith","ferrous","charcoal","lubricate","excel","dust","coke","blast","valve","forge","lathe","groove"]},{"id":"59","title":"小说中的人物不能只看标签","en_title":"Reading a Character Closely","kind":"阅读·文学与判断","en":"Our literary seminar examined a novel about a lonely bachelor and his wealthy patron. At first, the narrator presented the patron as a haughty snob whose bourgeois tastes were beyond criticism. Yet a later chapter revealed generosity that the earlier description had concealed.\nThe teacher asked us to separate a character's voice from the author's position. A maid, a mistress of a household, and a travelling missionary each saw the same incident differently. Their discourse reflected personality, prejudice, and experience. A hostile remark might characterize its speaker more accurately than its target.\nWe compared the novel's prose with a short verse about longing. Neither text offered a simple lesson in morality. Both encouraged us to ponder how perception shapes judgment. Close reading requires more than choosing a sympathetic character: it asks us to notice whose account dominates and which details complicate it.","zh":"文学讨论班研究一部关于孤独单身男子和富有资助者的小说。起初，叙述者把资助者写成傲慢势利者，其资产阶级趣味不容批评；后文却揭露先前未写出的慷慨。老师要求区分人物声音与作者立场。女佣、女主人和旅行传教士对同一事件看法不同，话语反映个性、偏见与经历。敌意评论可能更能说明说话者，而非评论对象。大家将小说散文与表达渴望的诗比较：两者都不提供简单道德教训，而让人思考感知如何塑造判断。细读不只是选同情的人物，还要注意谁主导叙述、哪些细节使其复杂。","key":"A hostile remark might characterize its speaker more accurately than its target. || might 表示文本推断；比较级呈现反向解读。","task":"理解小说人物时，我们需要考虑叙述者的立场。 || When interpreting a fictional character, we need to consider the narrator's perspective.","q":"Why did the later chapter matter? || It revealed generosity that complicated the earlier portrayal. 后文修正初始印象。","note":"","wc":142,"new":["bourgeois","bachelor","snob","verse","maid","prose","personality","mistress","prejudice","longing","ponder","generosity","literary","discourse","hostile","morality","missionary","characterize","patron","haughty"]},{"id":"60","title":"旧文献里的词义变化","en_title":"Words across Time","kind":"阅读·语体与旧义","en":"An archive displayed a telex message, a postal notice, and a typed report produced before a modern printer became commonplace. A visitor asked whether xerox could be used as a verb. The librarian explained its association with photocopying and recommended neutral wording in formal work.\nLanguage also changes in social contexts. An older text might use intercourse to describe communication, while contemporary readers often associate it with sexual activity. A historical author might call someone a dwarf or an idiot, terms that can be inappropriate when applied to people today. Quoting such language requires context, not casual imitation.\nThe class compared a dictionary's older sense with current usage. An entry's presence did not mean every meaning was equally suitable for an essay. The lesson was to read generously but write selectively. A strong vocabulary includes knowing when a word will convey the intended meaning and when it may create an unintended impression.","zh":"档案馆展示电传信息、邮政通知及现代打印机普及前的打字报告。有人问 xerox 能否作动词，管理员解释其与复印的联系，并建议正式写作选中性表达。社会语境也会改变词义：旧文 intercourse 可指交往，如今读者常联想到性行为；历史作者可能用 dwarf 或 idiot 称人，今天这样称呼可能不妥。引用需交代语境，不宜随手模仿。大家比较词典旧义与当前用法，词条存在不等于所有义项都适合作文。阅读应广泛理解，写作则有选择。词汇能力也包括知道何时能准确传意、何时会引发意外印象。","key":"An entry's presence did not mean every meaning was equally suitable for an essay. || not ... every 是部分否定，强调词义与语域选择。","task":"掌握一个词也包括了解它适合什么语境。 || Knowing a word also involves understanding the contexts in which it is appropriate.","q":"What does “write selectively” mean here? || Choose meanings and registers appropriate to the intended context. 不是故意少写信息。","note":"此篇专门辨析旧义与语体，文中的词不宜全部当作作文推荐表达。xerox 涉及品牌衍生用法，正式表达可用 photocopy。","wc":152,"new":["postal","printer","intercourse","telex","convey","idiot","dwarf","xerox"]},{"id":"61","title":"面对愤怒时如何回应","en_title":"Choosing a Response","kind":"写作·人际沟通","en":"After a harsh remark, my first impulse was to retort. I felt furious, and my fury made a minor dispute seem monstrous. I wanted to denounce the speaker, ridicule his conceit, and embarrass him in front of everyone. Fortunately, a friend asked me to pause.\nShe did not dismiss my hurt. Instead, she helped me distinguish a thoughtless comment from deliberate malice. To sneer, scoff, or hurl an insult would merely heighten the conflict. It would not explain why the remark was offensive. I decided to state my objection with firmness and ask for a proper response.\nThe conversation remained awkward, but the other person eventually apologized. I could accept that without pretending the incident had been nice. Tact does not require passive resignation. It requires enough restraint to address a problem without allowing wrath, jealousy, or spite to govern the exchange. A measured response can be courageous precisely because it resists an easy outburst.","zh":"听到严厉评论，我最初想反驳。愤怒让小争执显得可怕，我想公开谴责、嘲笑对方自负，让他难堪。朋友请我停一停。她没有否定我的受伤，而帮助区分轻率言论与蓄意恶意。冷笑、讥讽或辱骂只会加剧冲突，不能解释言论为何冒犯。我决定坚定表达异议并要求适当回应。谈话仍尴尬，对方最终道歉，我接受但不假装经历愉快。得体不等于消极顺从，而是克制地解决问题，不让暴怒、嫉妒和怨恨支配交流。平静回应正因抵制轻易爆发而可能勇敢。","key":"Tact does not require passive resignation. || 简短否定句澄清概念，可接 It requires ... 给出正面定义。","task":"坚定地表达异议，并不意味着必须侮辱对方。 || Expressing disagreement firmly does not mean having to insult the other person.","q":"Why would insults have been unhelpful? || They would heighten conflict without explaining the objection. 关注行为能否解决问题。","note":"","wc":155,"new":["conceit","courageous","nice","resignation","hurt","embarrass","denounce","thoughtless","hurl","offensive","furious","fury","monstrous","firmness","heighten","tact","malice","spite","jealousy","harsh","wrath","scoff","retort","sneer"]},{"id":"62","title":"悬疑故事中的线索","en_title":"Clues in a Radio Drama","kind":"听力·故事与推断","en":"In a radio drama, a sheriff received a report that a burglar had tried to steal an antique. A watchful guard heard a clatter, saw a figure flee, and called a patrol. The suspected outlaw left a badge behind, but it might have been fake.\nA second scene introduced a notorious gangster and a rumour that he planned to kidnap a dealer. The police could not detain someone merely because a frightening story sounded plausible. They had to examine evidence and follow the required procedure. The narrator mentioned a warrant without explaining its legal details.\nAt the climax, the apparent villain turned out to be a witness. The real motive involved greed and a failed attempt to smuggle stolen ware. The story taught listeners to separate a clue from an assumption. A dramatic voice can make a questionable explanation sound persuasive, but suspense is not proof.","zh":"广播剧里，警长接报窃贼企图盗古董。警觉守卫听到碰撞声、看见身影逃跑并叫巡逻人员。疑犯遗下徽章，却可能是假货。第二幕引出臭名昭著的歹徒，以及他计划绑架商人的传言。不能仅凭吓人故事似乎可信就拘留某人，必须查证并遵循程序。旁白提到令状，但未讲法律细节。高潮时，看似反派的人其实是证人，真实动机涉及贪婪和走私赃物未遂。故事提醒听众区分线索与假设。戏剧化声音会让可疑解释听着有说服力，但悬念不是证明。","key":"A dramatic voice can make a questionable explanation sound persuasive. || make + 宾语 + 动词原形；区分表达效果与证据质量。","task":"一个听起来可信的故事仍然需要证据支持。 || A plausible story still needs supporting evidence.","q":"Why was the abandoned badge not decisive proof? || It might have been fake. 线索存在其他解释。","note":"","wc":146,"new":["watchful","kidnap","burglar","patrol","warrant","steal","flee","outlaw","greed","smuggle","ware","questionable","sheriff","fake","badge","gangster","clatter","detain","notorious"]},{"id":"63","title":"球场上的规则与尊重","en_title":"Fair Play on the Field","kind":"听力·运动与规则","en":"At a baseball match, a spectator shouted when the referee made an unpopular call. A player wanted to argue, but the captain urged everyone to resume play. Being a champion, she said, did not entitle a team to disregard a rule or treat an opponent as inferior.\nLater, a runner slipped and began to limp. The game paused while staff checked the situation. Another player tried to shove past a rival; the coach immediately challenged that foul behaviour. To cheat, threaten, or deliberately hurt someone was a violation of the spirit of the match.\nOur team lost by a narrow margin. A disappointed supporter muttered, “Damn,” then joined the applause. The word expressed informal frustration, not language to imitate in an academic essay. The captain chose to credit the winners and commend her own team for its effort. Respect matters most when the result is unwelcome.","zh":"棒球赛中，裁判作出不受欢迎判罚，观众大喊。一名球员想争辩，队长劝继续比赛：冠军身份不允许无视规则或轻视对手。后来跑者滑倒跛行，比赛暂停让工作人员查看。另一球员推搡对手，教练立即指出犯规。作弊、威胁或蓄意伤害违背体育精神。球队惜败，一名球迷低声说“该死”，随后鼓掌。damn 表示非正式沮丧，不适合照搬到学术作文。队长肯定胜者，也称赞自己队伍的努力。结果不如意时，尊重尤其重要。","key":"Respect matters most when the result is unwelcome. || when 从句把抽象价值落实到困难情境。","task":"真正的体育精神也体现在如何面对失败。 || True sportsmanship is also reflected in how people respond to defeat.","q":"How did the captain react to losing? || She credited the winners and praised her team's effort. 不把失败转化为对他人的攻击。","note":"damn 是非正式感叹语，此处用于听力识别，不推荐写进正式作文。","wc":146,"new":["damn","inferior","violation","shove","deliberately","cheat","limp","champion","commend","rule","disregard","baseball","foul","referee","resume","credit"]},{"id":"64","title":"车站里的一次延误","en_title":"A Delay at the Station","kind":"听力·出行信息","en":"At the platform, an announcement said our train would not depart on time. A shuttle would take passengers to a nearby station. We needed to keep our ticket and board at the marked point. An attendant asked the crowd not to shove and helped a passenger carrying a cane.\nOutside, traffic approached a roundabout. A horn sounded as a driver tried to overtake a slow vehicle near a pedestrian crossing. Farther along the motorway, a crash had caused the original delay. Staff would divert the replacement bus past a garage and a motel before returning to the main road.\nI wanted to cancel the journey, but a clear explanation reduced my annoyance. We could claim the stated compensation through the operator's process, though the attendant did not promise an immediate payment. Travel disruption becomes less distressing when accurate information replaces speculation and passengers know what to do next.","zh":"站台公告说列车不能准时出发，接驳车将送乘客去附近车站，需保留车票并在标记处上车。工作人员请人群别推挤，帮助拄手杖乘客。外面车流驶近环岛，司机在人行横道附近试图超慢车，喇叭响起。高速公路更远处的碰撞造成原延误，替代巴士将绕经车库与汽车旅馆再回主路。我想取消行程，但清晰解释缓解烦躁。乘客可按运营方流程申领所述补偿，工作人员并没保证立刻付款。准确信息替代猜测、下一步明确时，出行中断就没那么令人困扰。","key":"Travel disruption becomes less distressing when accurate information replaces speculation. || become + 比较级形容词，说明服务改善的条件。","task":"及时提供准确的信息能够减轻乘客的焦虑。 || Providing accurate information promptly can reduce passengers' anxiety.","q":"Did the attendant promise immediate compensation? || No. Passengers had to use the operator's stated process. 避免把可申请误听为已支付。","note":"","wc":148,"new":["crash","platform","roundabout","overtake","divert","cancel","garage","motel","motorway","horn","pedestrian","compensation","shuttle","cane","ticket"]},{"id":"65","title":"小狗不懂人的标签","en_title":"Learning to Observe Behaviour","kind":"阅读·动物与观察","en":"My little pal called our puppy a rascal because it would gnaw a slipper, grab a mitten, and make a mess. It might wag its tail at a visitor, then growl at an unfamiliar noise. Once, a wasp made it leap sideways and howl; a moment later it began to sniff the grass again.\nAn animal-care volunteer asked us not to ascribe every action to a human motive. A hound might follow a scent, a cat might twitch a whisker, and a bird might flutter before settling on a perch. These behaviours required observation rather than a story about good or evil intentions.\nWe learnt to avoid teasing the puppy or encouraging it to snap. A youngster should not poke an animal simply to make it react. Understanding grew when we noticed patterns, respected space, and asked knowledgeable people for guidance. Affection is more useful when it is accompanied by attention to another creature's needs.","zh":"小伙伴称小狗淘气鬼，因为它啃拖鞋、抢手套、弄乱屋子。它向访客摇尾，对陌生声音低吼；一次被黄蜂吓得侧跳嚎叫，片刻又嗅草。动物照护志愿者要求别把一切动作都归因于人的动机：猎犬循气味，猫动胡须，鸟扑翅后停枝，都需要观察，而非编善恶意图故事。我们学着不逗弄小狗、不鼓励咬人，孩子不该只为看反应而戳动物。留意规律、尊重空间、向懂行者求助，理解才会增长。感情伴随对需求的关注才更有帮助。","key":"Affection is more useful when it is accompanied by attention to another creature's needs. || 被动结构 be accompanied by 表示相伴条件。","task":"喜爱动物也意味着尊重它们的行为和空间。 || Caring about animals also means respecting their behaviour and space.","q":"What did the volunteer discourage? || Assigning human motives to every animal action. 避免过度拟人化推断。","note":"","wc":155,"new":["sniff","wag","evil","whisker","mess","snap","rascal","mitten","gnaw","wasp","pal","howl","hound","youngster","poke","ascribe","perch","flutter","growl","grab"]},{"id":"66","title":"关于情绪的课堂讨论","en_title":"Understanding Difficult Feelings","kind":"写作·心理与支持","en":"In a psychology class, students discussed anxiety, melancholy, and depression as terms requiring care. A sorrowful day did not automatically establish a disorder, and a cheerful appearance did not prove that someone was free from distress. A person's inner experience could remain largely hidden.\nThe class examined a fictional student whose nightmare and persistent worry began to haunt his daily life. He feared being called pathetic, incapable, or unfit for study. Such labels could intensify his misery and make him reluctant to seek support. A friend chose to listen without ridicule and helped him contact the campus service.\nThe lecturer also discussed responsible reporting of suicide: language should avoid sensationalism and respect those affected. No dramatic story could substitute for appropriate professional assessment. The lesson emphasized compassion and the limits of casual judgment. We need not solve every problem ourselves to offer patient, humane support.","zh":"心理学课讨论焦虑、忧郁和抑郁等需谨慎使用的术语。一天难过不自动构成障碍，外表开心也不能证明没有困扰，内在经历可能隐而不见。案例中的虚构学生被噩梦与持续担忧影响生活，害怕被说可悲、无能或不适合学习。这些标签会加重痛苦，使他不敢求助。朋友选择不嘲笑地倾听，帮助联系校园支持服务。讲师也讨论负责任的自杀报道：避免煽情，尊重受影响者。戏剧化故事不能取代适当专业评估。课程强调同情与随意判断的局限。提供耐心、人性化支持，不要求我们独自解决一切。","key":"A cheerful appearance did not prove that someone was free from distress. || prove that 后接判断内容，强调外表不足以证明内在状态。","task":"耐心倾听可以帮助一个人更愿意寻求支持。 || Patient listening can help a person feel more willing to seek support.","q":"How did the friend respond? || Listened without ridicule and helped the student contact campus support. 具体支持行为。","note":"","wc":145,"new":["psychology","depression","incapable","misery","sorrowful","nightmare","haunt","unfit","pathetic","suicide","melancholy"]},{"id":"67","title":"山谷中的地质记录","en_title":"Reading a Landscape","kind":"阅读·地质与环境","en":"Our geology class visited a plateau above a river. Layers of rock recorded deposition, while a steep bank showed signs of erosion. A guide explained that a landscape could change through processes too slow to notice in a single afternoon. Its apparent stillness did not imply permanence.\nWe compared a dry channel with one carrying cloudy water. A small flake of stone rested beside a larger fragment. Above us, a massive cliff rose to a striking elevation, and a stream disappeared beneath an opaque pool. The teacher asked us to describe what we could observe before discussing its origin.\nNo one was permitted to collect material indiscriminately. The purpose was to connect evidence with an explanation, not to fill a bag with souvenirs. A dramatic view could fascinate us, but scientific understanding required attention to scale, time, and alternative accounts of how the feature had formed.","zh":"地质课前往河流上方高原，岩层记录沉积，陡岸显示侵蚀。导游解释，景观变化可能慢到一下午察觉不到，看似静止不等于永恒。我们比较干河道与流着浑水的河道，小石片靠着大碎块。上方巨大崖壁高耸，溪流隐入不透明水潭。老师要求先描述观察，再讨论成因。不得随意采集材料，目的是联系证据与解释，而非装满纪念品。壮观景色能使人着迷，但科学理解还需关注尺度、时间和不同成因解释。","key":"Its apparent stillness did not imply permanence. || apparent 与 imply 区分表象和推论，适合科学说明。","task":"理解自然景观需要同时考虑空间尺度和时间。 || Understanding a natural landscape requires considering both spatial scale and time.","q":"What were students asked to do before explaining origins? || Describe what they could observe. 观察先于成因解释。","note":"","wc":146,"new":["flake","deposition","fascinate","stillness","cloudy","plateau","elevation","dry","erosion","geology","fill","massive","opaque"]},{"id":"68","title":"微小变化的实验","en_title":"Measuring Small Changes","kind":"阅读·实验设计","en":"We used a pendulum to examine periodic motion. Its regularity looked impressive, but the teacher asked us to measure rather than assume. A small change in length could affect the result. We recorded a vector's direction in one exercise and a scalar magnitude in another, taking care not to confuse them.\nNext, a magnet helped demonstrate attraction and repulsion. We observed polarity and discussed magnetism before considering induction in a separate apparatus. A nearby display showed how a filament could glow and how a narrow opening formed a slit in an optical experiment.\nEach group had to tabulate observations, compare the resultant values, and explain a possible source of error. A parameter was held constant while another changed. Where a relation appeared inversely proportional, we checked several points. Scientific confidence increased through repeated examination, not because the first result looked elegant.","zh":"我们用摆研究周期运动。规律看似明显，老师仍要求测量，长度小变化也可能影响结果。练习分别记录矢量方向与标量大小，避免混淆。随后用磁铁演示吸引与排斥，观察极性、讨论磁性，再用另一装置考虑感应。旁边展示灯丝发光及光学实验狭缝。各组必须列表记录、比较所得数值并解释误差来源，一个参数固定，另一个变化。关系似乎成反比时，还要检验多个点。科学信心通过重复检查增强，而不是因为首个结果漂亮。","key":"A parameter was held constant while another changed. || while 对照控制变量和变化变量；被动语态适合描述实验。","task":"我们应该通过重复测量来检验最初的判断。 || We should test our initial judgment through repeated measurements.","q":"Why were several points checked? || To examine whether the apparent proportional relationship held. 不以单点代替规律。","note":"","wc":141,"new":["resultant","magnet","periodic","inversely","filament","vector","slit","induction","polarity","regularity","magnitude","magnetism","parameter","tabulate","pendulum"]},{"id":"69","title":"从毕业论文到研究表达","en_title":"Turning Evidence into a Thesis","kind":"写作·学术表达","en":"My thesis examined the adoption of a new teaching method. I had to formulate a proposition, explain its derivation, and identify what would count as supporting evidence. The first draft was deficient in detail and relied on an analogy that did not fit the data.\nMy supervisor asked me to distinguish a constituent of the model from an assumption about the whole. I should not postulate a mechanism merely to explain away an inconvenient result. Nor could I claim that two trends must correlate simply because their timing happened to coincide.\nI revised the formulation, placed extra tables in an appendix, and prepared a synthesis of the findings. The conclusion acknowledged a marginal effect and a substantial limitation. The process was demanding, but it helped me appreciate why rigorous expression matters. A sound argument remains open to revision when new evidence challenges its premises.","zh":"毕业论文研究新教学法的采用。我需提出命题、解释推导，并明确何种证据能支持。初稿细节不足，类比也不符数据。导师要求区分模型组成部分与对整体的假设，不能只为搪塞不利结果而假定机制，也不能因两个趋势恰好同时出现，就断言相关。我修改表述，把额外表格放附录，综合研究发现，结论承认效果很小且局限明显。过程费力，却让我理解严谨表达的重要。新证据挑战前提时，可靠论证仍应允许修改。","key":"Nor could I claim that two trends must correlate simply because their timing happened to coincide. || nor 句首部分倒装；simply because 指出理由不足。","task":"一篇有说服力的论文也应该承认自身的局限。 || A persuasive thesis should also acknowledge its own limitations.","q":"What was wrong with the first draft? || It lacked detail and used an analogy that did not fit the data. 两个问题并列。","note":"","wc":144,"new":["derivation","postulate","constituent","analogy","coincide","adoption","deficient","count","proposition","formulation","thesis","marginal","correlate","synthesis","appendix","rigorous"]},{"id":"70","title":"面试中的表达与倾听","en_title":"Speaking without Performing Confidence","kind":"听力·面试技巧","en":"Before the interview, I was tempted to memorize an elaborate speech. My adviser warned that eloquence could not conceal an absence of relevant experience. A clear example would be more useful than a lofty declaration about being exceptional.\nWe practised answering without rambling. I would state the situation, describe my action, and explain the outcome. When I began to ramble, she asked me to return to the question. I learnt not to flatter an interviewer or claim expertise I did not possess. Modesty did not require hiding an achievement; sincerity required describing it accurately.\nOn the day, one question seemed designed to baffle me. I paused, admitted the uncertainty, and explained how I would investigate. The panel appeared interested. I left without knowing the result, but with a better understanding of communication: a thoughtful response can reveal more intellect than a quick display of confidence.","zh":"面试前，我想背精致长演说。顾问提醒，口才掩盖不了相关经验缺失，清楚案例比宣称自己非凡的高调表态有用。练习中，我依次交代情境、行动和结果，一跑题她就让我回到问题。我学着不奉承面试官，也不冒称专长。谦逊不要求隐藏成绩，真诚则要求准确描述。当天一个问题似乎故意难倒我，我停顿、承认不确定，并解释会怎样调查。评委似乎有兴趣。离开时虽不知结果，却更理解沟通：深思熟虑的回答比急着表现自信更能展现智慧。","key":"Modesty did not require hiding an achievement; sincerity required describing it accurately. || 两个平行分句辨析谦逊与真诚。","task":"承认不知道某件事，并不意味着缺乏学习能力。 || Admitting that one does not know something does not imply a lack of ability to learn.","q":"How did the narrator handle the difficult question? || Admitted uncertainty and explained how to investigate. 不是编造确定答案。","note":"","wc":145,"new":["sincerity","eloquence","ramble","baffle","modesty","exceptional","intellect","lofty","flatter"]},{"id":"71","title":"公共会议上的意见与行动","en_title":"From a Petition to a Decision","kind":"写作·公共参与","en":"At a public convention, a senator invited residents to discuss proposed legislation. One advocate wanted to repeal an outdated prohibition; another urged the council to retain a regulation that protected a vulnerable group. The controversy concerned both fairness and the possibility of unintended effects.\nThe chair asked speakers to cite evidence, refrain from personal attacks, and acknowledge a reasonable concession. A coalition offered an allied campaign, but members would not accept an ally who encouraged a riot. They preferred to mobilize support through a peaceful rally and a clearly stated pledge.\nAfter debate, the council agreed to initiate a review and announce its findings annually. A proposed veto was withdrawn, and a subsidiary committee would handle technical questions. The mayor would inaugurate the consultation rather than dictate its outcome. Public participation can counter inertia when citizens turn dissatisfaction into a practicable proposal. Strong conviction matters, but persuasion also requires listening to people whose priorities differ from our own.","zh":"公共会议上，参议员邀请居民讨论立法。一位倡导者要求废除旧禁令，另一位主张保留保护弱势群体的规定，争议关乎公平及意外影响。主席要求引用证据、克制人身攻击并接受合理让步。联盟愿意联合行动，却不接受鼓励骚乱的盟友，倾向和平集会与明确承诺。议会同意启动审查、每年公布结果，拟议否决被撤回，附属委员会处理技术问题；市长负责开启咨询而非决定结论。公民将不满化为可行建议，就能克服惰性。信念重要，但说服也需要倾听不同优先事项。","key":"Public participation can counter inertia when citizens turn dissatisfaction into a practicable proposal. || turn A into B 描述将情绪转化为可行动方案。","task":"建设性的参与需要把不满转化为具体建议。 || Constructive participation requires turning dissatisfaction into concrete proposals.","q":"What kind of campaign did the coalition prefer? || A peaceful rally with a clearly stated pledge. 与骚乱明确区分。","note":"","wc":158,"new":["controversy","cite","refrain","pledge","concession","persuasion","annually","practicable","ally","allied","legislation","possibility","inaugurate","initiate","prohibition","regulation","inertia","convention","veto","subsidiary","mobilize","repeal","senator","dissatisfaction","advocate","announce","rally","riot"]},{"id":"72","title":"报道应该如何措辞","en_title":"Editing a Sensitive Report","kind":"阅读·新闻与表达","en":"Our editor received a draft describing an assault, a hostage incident, and a suspected terrorist threat. The writer had used the same dramatic language for all three. The editor asked whether each label was supported and whether the reader could distinguish confirmed information from an allegation.\nShe would not let an adjective substitute for evidence. A headline might trigger panic, and a careless phrase could propagate an unverified claim. The newsroom had to relay accurate information, correct a misleading passage, and avoid turning a person's suffering into a sensation.\nWe revised the text to denote the known facts precisely. A direct quotation remained a quotation; it did not become the publication's own conclusion. The exercise helped us understand that word choice can either enlighten or bewilder. Responsible reporting should inform the public without exploiting fear, and it should remain open to correction when subsequent evidence changes the account.","zh":"编辑收到一份同时描述袭击、人质事件与疑似恐怖威胁的稿子，作者全用同样戏剧化语言。编辑问，每个标签是否有依据，读者能否区分已证实信息与指控。形容词不能代替证据，标题可能引发恐慌，草率措辞会传播未核实主张。编辑部须传递准确信息、纠正误导段落，避免把痛苦变成轰动。我们修改文字来准确表示已知事实，直接引语仍是引语，不变成刊物自己的结论。选词能启发也能迷惑。负责报道应告知公众而不利用恐惧，后续证据改变叙述时要允许纠正。","key":"A direct quotation remained a quotation; it did not become the publication's own conclusion. || 平行分句区分转述与认定，适合媒介素养讨论。","task":"新闻报道应清楚区分已证实的事实与未经证实的指控。 || News reports should clearly distinguish confirmed facts from unverified allegations.","q":"Why did the editor question the labels? || They might not all be supported by confirmed evidence. 用词强度需要证据匹配。","note":"","wc":148,"new":["denote","assault","hostage","enlighten","bewilder","panic","terrorist","sensation","relay","propagate","trigger"]},{"id":"73","title":"修理工作中的小动作","en_title":"Small Actions at a Workbench","kind":"听力·动作与顺序","en":"The instructor asked me to unfold a cloth and place the broken frame on it. I would first untie a cord, loosen a clip, and straighten a crooked strip. Then I could use tape to hold the pieces temporarily. A narrow tack would secure the final covering, but I should not pierce the wrong layer.\nBeside me, a student tried to twist a wire too sharply. It began to deform. Another tugged at a loose thread and made the fabric rip. We stopped, examined the damage, and learnt to apply less force. A stitch could mend the tear; a clamp would keep the joint tightly aligned.\nThe demonstration was a lesson in restraint. We must not fling tools onto the bench, squash a delicate part, or scratch the surface through haste. To repair something well is to understand what each small action will change. Patience prevents damage that greater strength cannot undo.","zh":"老师让我展开布、放上破框。先解绳、松夹子、拉直歪条，再用胶带临时固定。小钉固定最后覆盖层，但别刺错层。旁边学生把金属丝扭得太急，开始变形；另一人拉松线使布撕裂。我们停下检查，学着减力。针脚能补破口，夹具保持接头紧密对齐。这是克制训练：不能甩工具、压坏精细部件，或因着急划伤表面。修好物品意味着理解每个小动作带来的改变。耐心能预防力量无法挽回的损坏。","key":"To repair something well is to understand what each small action will change. || 不定式作主语与表语，形成行为与能力的对应。","task":"修理物品之前，应先理解每个部件的作用。 || Before repairing an object, we should understand the function of each component.","q":"What caused the wire to deform? || It was twisted too sharply. 留意程度副词。","note":"","wc":152,"new":["unfold","stitch","sharply","squash","tape","crooked","twist","deform","rip","scratch","tack","tightly","untie","clip","pierce","straighten","fling"]},{"id":"74","title":"液体实验中的观察","en_title":"Watching a Liquid Change","kind":"阅读·物理化学","en":"In a recorded experiment, a scientist poured a viscous liquid into a flask. A filter removed visible particles before the solution entered a second vessel. We watched a solid dissolve, a bubble rise, and a thin layer of foam appear. The instructor asked us to record these changes without inventing a cause.\nAnother demonstration compared evaporation under different humidity conditions. To evaporate was not to vanish without a trace; matter had moved into another form. A sample reached saturation, while an adjacent container held a weaker mixture. We discussed concentration, compression, and the need to keep measurements comparable.\nThe teacher used an animation to show how one process might induce another. A catalyst appeared in a separate example, and the class considered the distinction between speeding a process and changing its final result. The lesson's purpose was observational discipline: a striking transformation should prompt a careful question, not an immediate, unsupported explanation.","zh":"录播实验中，科学家把黏稠液体倒入烧瓶，过滤器除去可见颗粒，液体进入第二容器。大家看固体溶解、气泡上升、薄泡沫出现。老师要求记录变化，不凭空编原因。另一演示比较不同湿度下的蒸发。蒸发不是无踪消失，而是物质转为另一形态。一份样品达到饱和，相邻容器是更稀混合物。大家讨论浓度、压缩与测量可比性。动画展示一个过程可能诱发另一个，另例出现催化剂，并区分加快过程与改变最终结果。课程目的在于规范观察：明显变化应引出认真问题，而非立刻给出无依据解释。","key":"A striking transformation should prompt a careful question, not an immediate, unsupported explanation. || should 表示建议；平行名词短语区分提问与臆断。","task":"观察到变化并不意味着我们已经理解了它的原因。 || Observing a change does not mean that we already understand its cause.","q":"What did the instructor ask students to avoid? || Inventing a cause before examining evidence. 观察与解释不能跳步。","note":"","wc":152,"new":["viscous","compression","evaporate","humidity","induce","flask","adjacent","foam","filter","comparable","dissolve","catalyst","saturation"]},{"id":"75","title":"在不同生境之间比较","en_title":"Comparing Habitats","kind":"阅读·自然与比较","en":"A school display compared a tropical jungle, an open prairie, and a wooded valley. One map marked the Tropic of Cancer, while another showed where birds migrate. The children noticed an abundance of life in every scene, but the dominant forms differed.\nIn a short film, a cuckoo called near a maple, a snake described as a serpent moved through leaves, and a predator pursued its prey. The teacher warned against calling an unfamiliar creature an alien monster. Its appearance might seem peculiar to us, yet it belonged to its own environment.\nWe examined how a web could trap an insect and how a plant's growth might be limited by scarcity of water. No habitat contained perpetual plenty. Ecological understanding grows when we compare relationships rather than rank landscapes by beauty. Even a place that appears empty can sustain life adapted to conditions that would challenge other organisms.","zh":"学校展览比较热带丛林、开阔草原和林木山谷。一幅图标北回归线，另一幅展示候鸟迁移地。每处生命丰富，但优势类型不同。短片里，布谷鸟在枫树旁叫，被称为 serpent 的蛇穿叶而行，捕食者追猎物。老师提醒别把陌生生物叫外来怪物：外观对我们奇特，却属于自身环境。大家考察蛛网捕虫及缺水限制植物生长，没有栖息地永远丰裕。比较关系而不是按美景排名，才能理解生态。看似空旷之地也可维系适应特定条件的生命。","key":"Its appearance might seem peculiar to us, yet it belonged to its own environment. || yet 引导转折，提示避免以观察者熟悉程度评价对象。","task":"不同物种能够适应不同的环境条件。 || Different species can adapt to different environmental conditions.","q":"What did the teacher recommend comparing? || Ecological relationships rather than scenic beauty. 比较标准是核心。","note":"","wc":148,"new":["perpetual","web","alien","dominant","serpent","tropic","tropical","scarcity","migrate","maple","prey","monster","abundance","cuckoo","prairie","jungle"]},{"id":"76","title":"航海故事中的动作与位置","en_title":"A Boat in Changing Weather","kind":"听力·位置与动作","en":"In a training story, a crew prepared to moor a small boat beside a sheltered cape. One person held an oar while another checked the mast and the line at the stern. A windy afternoon had made the return slower than expected.\nWhen a rope began to tangle, the captain told the crew to pause. They must not let a loose loop catch a foot or allow impatience to propel the boat into a rock. A nearby vessel offered to tow them the final distance. Once secure, they could step ashore and examine the problem.\nThe instructor contrasted this practical account with a romance about a pirate and a tragic shipwreck. Adventure writing could thrill a reader, but it often concealed the ordinary preparation behind safe travel. The class learnt the difference between enjoying a story and treating its dramatic actions as a guide to real behaviour.","zh":"训练故事中，船员准备把小船系在避风海角旁。一人持桨，另一人查看桅杆与船尾绳。下午风大，返程比预计慢。绳子缠绕时，船长要求停下，避免绳圈套脚，也不能因急躁把船推向岩石。附近船只愿拖完最后一段。固定后，大家才能上岸查看。老师把实际叙述与海盗及悲剧海难的传奇对比：冒险写作能使人激动，却常省略安全出行背后的日常准备。课堂学习区分享受故事与把戏剧动作当现实行为指南。","key":"Adventure writing could thrill a reader, but it often concealed the ordinary preparation behind safe travel. || but 对比故事效果与被省略的信息。","task":"精彩的故事不一定能作为现实行动的指南。 || An exciting story does not necessarily provide a guide to real action.","q":"How did the nearby vessel help? || It offered to tow the boat the final distance. tow 指拖曳。","note":"","wc":147,"new":["mast","propel","moor","tangle","cape","oar","pirate","windy","shipwreck","romance","tragic","thrill","tow"]},{"id":"77","title":"历史展品上的称号","en_title":"Titles, Memory, and Interpretation","kind":"阅读·历史文化","en":"The archive displayed an oath taken by a knight, a tribute to a martyr, and a portrait labelled “His Majesty.” Another panel described a patriot remembered for defending a town. The curator asked how a patriotic account could differ from a later historical interpretation.\nA document mentioned a plan to assassinate a ruler, followed by an execution and a public burial. Nearby stood a coffin from a theatrical reconstruction, clearly identified as a reproduction. These objects were intended to illustrate a narrative, not to prove every statement in it.\nThe final section examined royalty and public memory. A hero's likeness could appear on a coin, and an official decree could bestow a title. Yet neither honour made a person immortal or removed the need for inquiry. To salute a historical contribution is compatible with examining its limitations. Careful remembrance permits both appreciation and critical thought.","zh":"档案展示骑士誓言、烈士纪念文及标“陛下”的肖像，另一面板介绍守城而被纪念的爱国者。策展人问，爱国叙述与后来历史解释可能怎样不同。文献提到刺杀统治者的计划，以及随后的处决和公开安葬；附近剧场复原用棺木明确标注为复制品。物品用于说明叙事，不证明所有陈述。最后讨论王室与公共记忆：英雄肖像可上硬币，官方法令可授头衔，但荣誉不让人永生，也不能免于探究。致敬历史贡献与审视局限并不矛盾。认真纪念允许欣赏与批判思考共存。","key":"To salute a historical contribution is compatible with examining its limitations. || be compatible with + 动名词表示两种态度可并存。","task":"尊重历史人物并不意味着忽视他们的局限。 || Respecting historical figures does not mean ignoring their limitations.","q":"Why was the coffin labelled as a reproduction? || So visitors would not mistake a reconstruction for an original object. 说明证据性质。","note":"","wc":145,"new":["reproduction","salute","majesty","likeness","oath","execution","knight","martyr","royalty","coffin","tribute","decree","immortal","bestow","assassinate","burial","patriot","patriotic"]},{"id":"78","title":"一份拒信之后","en_title":"After a Rejection","kind":"写作·挫折与成长","en":"The rejection filled me with dismay. I had expected recognition and imagined a superb result. Instead, I felt blue, then sullen, and finally tempted to grumble that the whole process was absurd. An email from my tutor helped console me without offering false praise.\nShe suggested that I examine the feedback before deciding it was unfair. A grim mood could make every criticism seem dreadful. It could also tempt me to forsake the project or regard one misfortune as permanent doom. Neither response would help me improve.\nI took a day to rest, then returned to the draft. Some comments were hard to accept, but several revealed a genuine gap. The experience did not suddenly enchant me or produce rapture. It did, however, teach me to separate disappointment from judgment. Growth often begins with the willingness to remain engaged when the first outcome is unwelcome.","zh":"拒信使我沮丧。我期待认可与极佳结果，却先忧郁、再闷闷不乐，最后想抱怨整个流程荒谬。导师邮件安慰我，却没虚假夸奖。她建议先看反馈，再判是否不公。阴郁情绪会让批评都显可怕，也会诱使人放弃项目，把一次不幸当永久厄运，两者都无助改进。我休息一天再回稿件，有些意见难接受，但一些揭示真实缺口。经历没有突然令我欣喜若狂，却教会区分失望与判断。成长常始于首次结果不如意时，仍愿继续投入。","key":"It did, however, teach me to separate disappointment from judgment. || did + 动词原形表示强调；separate A from B 区分两者。","task":"失望不应该阻止我们认真考虑有价值的反馈。 || Disappointment should not prevent us from considering useful feedback carefully.","q":"What did the tutor suggest first? || Examine the feedback before judging the process unfair. 先证据后评价。","note":"","wc":145,"new":["superb","tempt","forsake","console","blue","gap","recognition","doom","enchant","grim","rapture","dreadful","dismay","misfortune","absurd","sullen","grumble","hard"]},{"id":"79","title":"初入职场的第一周","en_title":"An Induction Week","kind":"听力·职场学习","en":"During induction, the manager explained how our team would specialize in customer support. We should comply with the service procedure, but not conform blindly when an unusual case required judgment. A script was a starting point, not an excuse to ignore a person.\nI learnt to classify a complaint, ask for relevant input, and dispatch a request to the right department. A colleague taught me shorthand for private notes, although a formal record needed full wording. We would alternate between calls and written work to maintain attention.\nThe manager encouraged initiative while setting a clear threshold for escalation. If a problem exceeded our authority, we should seek help rather than improvise a promise. A thorough handover could minimize repetition and improve the overall experience. The week showed me that professionalism combines consistent methods with the sensitivity to recognize when a case is different.","zh":"入职培训时，经理解释团队专做客服：应遵守流程，但特殊案例需要判断时不能盲从。脚本是起点，不是忽视人的借口。我学习分类投诉、询问相关信息、把请求转至正确部门。同事教私人笔记速记，正式记录则需完整措辞。我们轮换电话与书面工作来保持注意。经理鼓励主动性，也明确何时升级处理：问题超权限应求助，不随意承诺。完整交接能减少重复、改善整体体验。专业能力结合一致方法与识别特殊情况的敏感度。","key":"A script was a starting point, not an excuse to ignore a person. || 两个名词短语界定工具的作用和边界。","task":"遇到超出权限的问题时，员工应该及时寻求帮助。 || Employees should seek help promptly when a problem exceeds their authority.","q":"When should staff seek help? || When the issue exceeds their authority. 权限是判断标准。","note":"","wc":143,"new":["overall","comply","shorthand","input","conform","specialize","alternate","minimize","consistent","dispatch","threshold","thorough","initiative"]},{"id":"80","title":"一个社区项目的启动","en_title":"Starting a Shared Project","kind":"写作·公益与执行","en":"Our neighbourhood decided to dedicate an unused room to adult learning. Volunteers would furnish it, establish a small lending shelf, and recruit people willing to impart practical skills. A retired teacher offered to teach adults who had previously remained illiterate.\nThe project needed more than idealism. We had to secure a grant, nominate a coordinator, and agree on a timetable. The first meeting would commence once the room was ready, while the completion of minor repairs could follow. A local business offered to endow a small fund for materials.\nSome residents doubted the idea, but the organizers did not promise a miracle. They proposed a modest trial and invited suggestions. The resulting cooperation could enrich community life and give overlooked abilities recognition. A shared vision becomes credible when people translate it into specific responsibilities and are willing to review what actually happens.","zh":"社区决定把闲屋用于成人学习，志愿者布置家具、设借阅书架、招募愿传授实用技能的人。退休教师愿教此前不识字的成人。项目不能只靠理想主义，还需资助、协调人和时间表。房间准备好即可开首次会议，小修随后完成。当地企业愿捐设材料基金。有人怀疑，组织者没许诺奇迹，而提出小规模试行并征求建议。合作能丰富社区生活，让被忽视的能力获得认可。把共同愿景落实为具体职责，并愿评估真实结果，愿景才可信。","key":"A shared vision becomes credible when people translate it into specific responsibilities. || translate ... into ... 也可表示将想法落实为行动。","task":"共同愿景需要明确分工才能变成现实。 || A shared vision needs clear responsibilities if it is to become reality.","q":"What made the project more than idealism? || Funding, coordination, a timetable, and a modest trial. 实际执行要素。","note":"","wc":142,"new":["endow","illiterate","idealism","completion","nominate","grant","vision","enrich","commence","impart","dedicate"]},{"id":"81","title":"社会调查中的解释边界","en_title":"Explaining Social Change","kind":"阅读·社会科学","en":"In sociology, a dynamic account must do more than label one practice a norm and another a peculiarity. Our class studied a district where unemployment was prevalent. The predominant explanation blamed idleness, but interviews revealed inadequate transport. We had to contend with several interpretations. One finding seemed to contradict another, partly because of selection. An intermediate category helped distinguish temporary difficulty from persistent exclusion. A pattern was indicative of a problem, not proof of its origin. The teacher asked us to orient the analysis towards evidence and incorporate competing explanations. Normalization of a harmful condition can conceal its causes. Research should illuminate those causes without treating every case as equivalent.","zh":"社会学中的动态解释不能只把一种做法叫常态、另一种叫怪异。班级研究失业普遍的地区。主流解释责怪懒惰，访谈却显示交通不足。不同发现似乎冲突，部分源于样本选择；中间类别帮助区分暂时困难与持续排斥。规律提示问题，却不证明起因。老师要求以证据为导向，纳入其他解释。有害条件常态化会掩盖原因，研究应揭示成因，又不把所有案例等同。","key":"A pattern was indicative of a problem, not proof of its origin. || be indicative of 表示提示，区分迹象与证明。","task":"社会问题不能仅归因于个人选择。 || Social problems cannot be attributed solely to individual cho
