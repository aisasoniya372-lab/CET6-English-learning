ing an immediate bid. A clear quotation would identify what the price included, what support was available, and who would be liable if delivery failed. Commercial courtesy does not require unquestioning acceptance. A buyer can remain gracious while asking firm, pertinent questions about a product's actual performance.","zh":"å±•ä¼šä¸Šï¼Œå‚å®¶å±•ç¤ºä¸€å°ä¸“åˆ©ç”³è¯·ä¸­çš„åŸå‹æœºã€‚å‘è¨€äººç§°å·§å¦™æ”¹è¿›èƒ½æŠŠåŠ å·¥æ—¶é—´å‡åŠï¼Œæˆ‘è¯¢é—®è§„æ ¼ã€æ¯”è¾ƒæ¡ä»¶ï¼Œå¹¶è¦æ±‚ç”¨æ™®é€šå·¥ä»¶æ¼”ç¤ºã€‚è®¾å¤‡é‡‡ç”¨æ¨¡å—ç»“æ„ï¼Œæ¨¡å—å¯æ‹†ï¼Œä¾¿åˆ©é…ä»¶èƒ½è°ƒèŠ‚ï¼›åˆ‡åˆ€æ²¿é¢„è®¾è½¨é“èµ°ï¼Œæ»šè½®å¼•å¯¼ææ–™ã€‚æˆå“çœ‹ä¼¼ä¸€æµï¼Œä½†ä»£è¡¨æ‰¿è®¤ç²¾ç»†è¡£ç‰©éœ€è¦ä¸åŒè®¾ç½®ï¼Œå®£ä¼ å¿…é¡»æœ‰é€‚ç”¨é™åˆ¶ã€‚åŒæ–¹è®¨è®ºäº¤æ˜“ï¼Œå´æ²¡ç«‹å³æŠ¥ä»·ã€‚æ¸…æ¥šçš„æŠ¥ä»·å•è¦è¯´æ˜åŒ…å«å†…å®¹ã€å”®åæ”¯æŒå’Œäº¤è´§å¤±è´¥è´£ä»»ã€‚å•†ä¸šç¤¼è²Œä¸ç­‰äºå…¨ç›˜æ¥å—ï¼Œä¹°æ–¹å®Œå…¨å¯ä»¥ç¤¼è²Œè€Œåšå®šåœ°è¯¢é—®å®é™…æ€§èƒ½ã€‚","key":"A buyer can remain gracious while asking firm, pertinent questions. || while + åŠ¨åè¯è¡¨ç¤ºä¸¤ç§è¡Œä¸ºåŒæ—¶æˆç«‹ã€‚","task":"è¯„ä»·ä¸€é¡¹å®£ä¼ æ—¶ï¼Œåº”è¯¥å…ˆäº†è§£æ¯”è¾ƒæ˜¯åœ¨ä»€ä¹ˆæ¡ä»¶ä¸‹è¿›è¡Œçš„ã€‚ || When evaluating a promotional claim, we should first understand the conditions under which the comparison was made.","q":"Why did the performance claim need qualification? || Different materials required different settings. å®£ç§°ä¸èƒ½è„±ç¦»é€‚ç”¨æ¡ä»¶ã€‚","note":"","wc":145,"new":["deal","patent","specification","prototype","preset","liable","cutter","garment","fitting","producer","gracious","pertinent","module","bid","ingenious","modification","roller","detach","handy","spokesman","halve","first-rate"]},{"id":"54","title":"ä¸€åœºç®€æœ´çš„å©šç¤¼","en_title":"A Wedding within Our Means","kind":"å¬åŠ›Â·å®¶åº­ä¸æ¶ˆè´¹","en":"The bridegroom wanted a small wedding, although a cousin insisted that a grand engagement party was customary. The couple rejected an extravagant mansion and chose a community hall. A friend would take the photography, and relatives would prepare a light refreshment for each guest.\nThe bride wore a simple dress with a bead decoration and carried a tulip. Her partner looked radiant but nervous. A child tried to tickle his ear, making him grin and blush. During the ceremony, the couple made a vow to support one another. Nobody needed to dazzle the guests with expensive jewellery.\nAfterwards, we added pictures to an album and exchanged a small souvenir. The atmosphere was romantic because people showed sincere affection, not because a millionaire had paid the bill. A meaningful celebration can embody commitment and hospitality without becoming an unreasonable financial burden.","zh":"æ–°éƒæƒ³åŠå°å©šç¤¼ï¼Œå°½ç®¡è¡¨äº²åšæŒç››å¤§è®¢å©šæ´¾å¯¹æ˜¯æƒ¯ä¾‹ã€‚ä¸¤äººæ”¾å¼ƒå¥¢åå®…é‚¸ï¼Œé€‰æ‹©ç¤¾åŒºç¤¼å ‚ã€‚æœ‹å‹æ‘„å½±ï¼Œäº²æˆšç»™æ¯ä½å®¾å®¢å‡†å¤‡èŒ¶ç‚¹ã€‚æ–°å¨˜ç©¿ç é¥°ç®€è£™ã€æ‹¿éƒé‡‘é¦™ï¼Œä¼´ä¾£å®¹å…‰ç„•å‘å´ç´§å¼ ã€‚å­©å­æŒ ä»–è€³æœµï¼Œè®©ä»–å’§å˜´ç¬‘åˆè„¸çº¢ã€‚ä»ªå¼ä¸­ä¸¤äººèª“è¨€ç›¸äº’æ”¯æŒï¼Œæ— éœ€ç”¨æ˜‚è´µç å®ç‚«ç›®ã€‚åæ¥å¤§å®¶æŠŠç…§ç‰‡æ”¾è¿›ç›¸å†Œï¼Œäº¤æ¢å°çºªå¿µå“ã€‚æµªæ¼«æ¥è‡ªçœŸè¯šæƒ…æ„ï¼Œè€Œéç™¾ä¸‡å¯Œç¿ä¹°å•ã€‚æœ‰æ„ä¹‰çš„åº†ç¥èƒ½ä½“ç°æ‰¿è¯ºå’Œå¥½å®¢ï¼Œåˆä¸æˆä¸ºä¸åˆç†è´Ÿæ‹…ã€‚","key":"A meaningful celebration can embody commitment and hospitality without becoming an unreasonable financial burden. || without + åŠ¨åè¯è¡¨ç¤ºé¿å…ä¼´éšç»“æœã€‚","task":"åº†ç¥æ´»åŠ¨çš„æ„ä¹‰å¹¶ä¸å–å†³äºèŠ±è´¹çš„å¤šå°‘ã€‚ || The meaning of a celebration does not depend on how much is spent.","q":"Why did the couple choose a community hall? || They wanted a modest wedding within their means. åœºåœ°é€‰æ‹©ä½“ç°æ¶ˆè´¹è§‚ã€‚","note":"","wc":140,"new":["album","tulip","bead","radiant","bridegroom","customary","embody","vow","photography","extravagant","tickle","grin","blush","souvenir","engagement","romantic","hospitality","mansion","millionaire","refreshment","ear","dazzle"]},{"id":"55","title":"çƒ˜ç„™è¯¾ä¸Šçš„è€å¿ƒ","en_title":"Patience in a Baking Class","kind":"å¬åŠ›Â·ç”Ÿæ´»æŠ€èƒ½","en":"We began by separating an egg yolk from the white and measuring the flour. The teacher added yeast to one mixture and explained the need for time. Another group prepared a crisp biscuit, a fruit jelly, and a small pickle to accompany a savoury dish. Bacon and steak belonged to the next lesson, not today's menu.\nI tried to hurry and left a lump in the batter. The teacher asked me to stir evenly, scrape the rim, and let the mixture settle. A little extra liquid could soften it; too much would spoil the intended texture. We would bake one batch and compare it with another.\nAfterwards, we cleaned a stainless tray, removed grease from the counter, and checked the burner was off. The class reminded me that skill grows through attention. An ordinary task can teach restraint when impatience tempts us to skip a necessary step.","zh":"å¤§å®¶å…ˆåˆ†å¼€è›‹é»„è›‹æ¸…ã€ç§°é¢ç²‰ã€‚è€å¸ˆç»™ä¸€ä»½æ··åˆç‰©åŠ é…µæ¯ï¼Œè§£é‡Šç­‰å¾…çš„å¿…è¦ï¼›å¦ä¸€ç»„å‡†å¤‡è„†é¥¼ã€æœå†»å’Œé…å’¸é£Ÿçš„å°è…Œèœã€‚åŸ¹æ ¹ä¸ç‰›æ’å±äºä¸‹æ¬¡è¯¾ï¼Œéæœ¬æ—¥èœå•ã€‚æˆ‘æ€¥èºï¼Œé¢ç³Šç•™ä¸‹ä¸€å›¢å—ã€‚è€å¸ˆè®©å‡åŒ€æ…æ‹Œã€åˆ®å‡€å®¹å™¨è¾¹ç¼˜å¹¶é™ç½®ã€‚å°‘é‡æ¶²ä½“èƒ½ä½¿å…¶å˜è½¯ï¼Œè¿‡å¤šåˆ™ç ´åå£æ„Ÿï¼›æˆ‘ä»¬çƒ¤ä¸¤æ‰¹æ¯”è¾ƒã€‚äº‹åæ¸…æ´—ä¸é”ˆé’¢ç›˜ã€æ“¦å»å°é¢æ²¹è„‚å¹¶ç¡®è®¤ç‚‰å¤´å…³é—­ã€‚æŠ€èƒ½é€šè¿‡ç•™å¿ƒæˆé•¿ï¼Œæ—¥å¸¸ä»»åŠ¡ä¹Ÿèƒ½æ•™äººå…‹åˆ¶ï¼Œé¿å…å› æ€¥èºè·³è¿‡å¿…è¦æ­¥éª¤ã€‚","key":"An ordinary task can teach restraint when impatience tempts us to skip a necessary step. || tempt sb. to do è¡¨ç¤ºè¯±ä½¿ï¼›when ä»å¥ç»™å‡ºå…·ä½“æƒ…å¢ƒã€‚","task":"è€å¿ƒå®Œæˆæ¯ä¸€ä¸ªæ­¥éª¤ï¼Œé€šå¸¸æ¯”ä¸€å‘³æ±‚å¿«æ›´æœ‰æ•ˆã€‚ || Completing each step patiently is often more effective than simply trying to work faster.","q":"What mistake did the narrator make? || Hurrying left a lump in the batter. åŸå› ä¸ç»“æœç›´æ¥å¯¹åº”ã€‚","note":"","wc":147,"new":["evenly","pickle","bacon","skip","soften","yeast","jelly","grease","burner","yolk","steak","crisp","stainless","rim","lump","counter"]},{"id":"56","title":"ç‰™ç§‘å€™è¯Šå®¤çš„é˜…è¯»ç»ƒä¹ ","en_title":"Reading in a Waiting Room","kind":"é˜…è¯»Â·å¥åº·ä¿¡æ¯ç´ å…»","en":"While waiting for a dentist, I read a leaflet about a cavity and another about the absorption of nutrients. A diagram showed how food could nourish the body, but it did not recommend the same intake for everyone. A vitamin supplement, the text cautioned, should not be confused with a complete diet.\nNearby material discussed deficiency, nourishment, and the interpretation of research. A study of a microscopic process might offer insight, yet its finding could not automatically justify a general claim. A headline about regenerative treatment required more context than the poster supplied.\nI wrote down a question rather than infer a personal diagnosis from the display. Public information is useful when it helps people ask better questions and locate reliable guidance. It becomes misleading when a limited observation is presented as a universal solution. Understanding the boundary between information and individual advice is itself a valuable reading skill.","zh":"ç­‰ç‰™åŒ»æ—¶ï¼Œæˆ‘é˜…è¯»é¾‹æ´å’Œè¥å…»å¸æ”¶ä¼ å•ã€‚å›¾ç¤ºè§£é‡Šé£Ÿç‰©å¦‚ä½•æ»‹å…»èº«ä½“ï¼Œå´æ²¡æœ‰ç»™æ‰€æœ‰äººå»ºè®®åŒæ ·æ‘„å…¥é‡ã€‚æ–‡ä¸­æé†’ï¼Œç»´ç”Ÿç´ è¡¥å……å‰‚ä¸ç­‰äºå®Œæ•´é¥®é£Ÿã€‚é™„è¿‘èµ„æ–™è®¨è®ºè¥å…»ç¼ºä¹åŠç ”ç©¶è§£è¯»ï¼šå¾®è§‚è¿‡ç¨‹ç ”ç©¶å¯ä»¥æä¾›å¯å‘ï¼Œä½†ä¸èƒ½è‡ªåŠ¨è¯æ˜ä¸€èˆ¬ä¸»å¼ ã€‚å†ç”Ÿæ²»ç–—æ ‡é¢˜æ‰€éœ€è¯­å¢ƒæ¯”æµ·æŠ¥æä¾›çš„æ›´å¤šã€‚æˆ‘è®°ä¸‹é—®é¢˜ï¼Œæ²¡æœ‰ä»å±•ç¤ºæ¨æ–­ä¸ªäººè¯Šæ–­ã€‚å…¬å…±ä¿¡æ¯è‹¥å¸®åŠ©äººæå‡ºå¥½é—®é¢˜ã€æ‰¾åˆ°å¯é æŒ‡å¯¼å°±æœ‰ç”¨ï¼ŒæŠŠæœ‰é™è§‚å¯ŸåŒ…è£…æˆä¸‡èƒ½æ–¹æ¡ˆåˆ™ä¼šè¯¯å¯¼ã€‚åŒºåˆ†ä¸€èˆ¬ä¿¡æ¯ä¸ä¸ªä½“å»ºè®®ï¼Œæœ¬èº«å°±æ˜¯é˜…è¯»èƒ½åŠ›ã€‚","key":"It becomes misleading when a limited observation is presented as a universal solution. || è¢«åŠ¨è¯­æ€çªå‡ºä¿¡æ¯è¢«å¦‚ä½•å‘ˆç°ï¼Œé€‚åˆæ‰¹åˆ¤æ€§é˜…è¯»è®¨è®ºã€‚","task":"æœ‰é™çš„ç ”ç©¶ç»“æœä¸åº”è¯¥è¢«æè¿°æˆé€‚ç”¨äºæ‰€æœ‰äººçš„è§£å†³æ–¹æ¡ˆã€‚ || Limited research findings should not be presented as solutions that apply to everyone.","q":"What did the reader do instead of self-diagnosing? || Wrote down a question for clarification. ä¿¡æ¯é˜…è¯»åé‡‡å–çš„è¡ŒåŠ¨ã€‚","note":"","wc":149,"new":["dentist","regenerative","microscopic","absorption","intake","vitamin","nourish","nourishment","deficiency","cavity","leaflet","supplement","infer"]},{"id":"57","title":"å†œåœºå·¥å…·ä¸åŠ³åŠ¨åˆ†å·¥","en_title":"Tools and Work on a Farm","kind":"é˜…è¯»Â·ä¹¡æ‘ä¸æŠ€æœ¯","en":"At the ranch, a farmer showed us an old waggon beside a diesel tractor. A bridle hung near the stable, and a wooden yoke recalled an earlier way of working. A bull stood apart from a buffalo, while a donkey, called an ass in an older account, waited quietly.\nWe watched workers thresh grain, inspect a seed's kernel, and prepare a bed for transplant work. A shovel helped move soil; a machine could perform the same task on a larger scale. Neither tool was ideal for every job. A hardy plant might survive where a delicate one would wither.\nThe farmer explained why care mattered during breeding. To breed animals responsibly required attention to their needs rather than merely increasing numbers. A child watched a chick hatch and later peck at food. The visit made visible the labour behind products that urban shoppers often treat as commonplace.","zh":"ç‰§åœºé‡Œï¼Œå†œæ°‘å±•ç¤ºæŸ´æ²¹æ‹–æ‹‰æœºæ—çš„æ—§è´§è½¦ã€‚é©¬å©æŒ‚ç€ç¬¼å¤´ï¼Œæœ¨è½­è®©äººæƒ³èµ·æ—§åŠ³åŠ¨æ–¹å¼ã€‚å…¬ç‰›ä¸æ°´ç‰›åˆ†å¼€ç«™ï¼Œä¸€å¤´æ—§æ–‡ç§° ass çš„é©´å®‰é™ç­‰å¾…ã€‚å·¥äººè„±ç²’ã€æŸ¥çœ‹ç§ä»ã€å‡†å¤‡ç§»æ ½è‹—åºŠï¼Œé“²å­ç§»åœŸï¼Œæœºå™¨åˆ™èƒ½æ‰©å¤§å¤„ç†è§„æ¨¡ï¼Œä½†æ²¡æœ‰å·¥å…·é€‚åˆä¸€åˆ‡ä»»åŠ¡ã€‚è€å¯’å¥å£®çš„æ¤ç‰©å¯èƒ½åœ¨å¨‡å¼±æ¤ç‰©æ¯èçš„åœ°æ–¹ç”Ÿå­˜ã€‚å†œæ°‘è§£é‡Šï¼Œè´Ÿè´£ä»»åœ°ç¹è‚²åŠ¨ç‰©éœ€è¦å…³æ³¨éœ€æ±‚ï¼Œè€Œä¸åªæ˜¯å¢åŠ æ•°é‡ã€‚å­©å­çœ‹å°é¸¡å­µåŒ–ï¼Œä¹‹åå•„é£Ÿã€‚å‚è§‚è®©åŸå¸‚æ¶ˆè´¹è€…å¸¸è§†ä¸ºå¹³å¸¸çš„å•†å“èƒŒååŠ³åŠ¨æ˜¾ç°å‡ºæ¥ã€‚","key":"Neither tool was ideal for every job. || neither å¦å®šä¸¤è€…ï¼›for every job é™å®šé€‚ç”¨èŒƒå›´ã€‚","task":"æŠ€æœ¯çš„ä»·å€¼å–å†³äºå®ƒæ˜¯å¦é€‚åˆå…·ä½“ä»»åŠ¡ã€‚ || The value of technology depends on whether it suits the particular task.","q":"What did the visit reveal to urban shoppers? || The labour behind everyday products. ç»†èŠ‚æœ€åæ±‡æˆä¸»é¢˜ã€‚","note":"ass åœ¨æ­¤æŒ‡é©´ï¼Œç°ä»£æ—¥å¸¸è¡¨è¾¾ä¹Ÿå¯èƒ½æœ‰å…¶ä»–å«ä¹‰ï¼›å†™ä½œä¸­ donkey æ›´æ˜ç¡®ã€‚waggon ä¸ºæ‹¼å†™å˜ä½“ï¼Œå¸¸è§æ‹¼å†™ wagonã€‚","wc":147,"new":["buffalo","hardy","commonplace","bull","ass","bridle","wither","yoke","thresh","waggon","shovel","diesel","hatch","kernel","breed","ranch","transplant","peck"]},{"id":"58","title":"é“åŒ é“ºä¸å·¥ä¸šå±•å…","en_title":"From a Forge to a Factory","kind":"é˜…è¯»Â·å·¥ä¸šå²","en":"A blacksmith heated metal in a forge and used a hammer to shape it. The museum placed this scene beside a display on metallurgy. Labels distinguished ferrous material from other metals and explained how coke and charcoal appeared in historical processes. We observed the tools without attempting the work ourselves.\nIn the modern section, a lathe cut a groove into a demonstration piece. A guide described how workers lubricate machinery, inspect a valve, and remove dust before it causes trouble. A steel frame could brace a structure; cement could help form a foundation. A blast furnace model illustrated a very different scale of production.\nIndustrial progress involved more than larger machines. Standard procedures, training, and maintenance were instrumental in improving reliability. A small workplace could still excel by selecting suitable equipment and checking each stage carefully. Technical change matters when it improves the quality of work as well as the quantity of output.","zh":"é“åŒ åœ¨ç‚‰ä¸­åŠ çƒ­é‡‘å±ï¼Œç”¨é”¤æˆå½¢ã€‚åšç‰©é¦†å°†æ­¤åœºæ™¯æ”¾åœ¨å†¶é‡‘å±•æ—ï¼Œæ ‡ç­¾åŒºåˆ†å«é“ææ–™ä¸å…¶ä»–é‡‘å±ï¼Œè¯´æ˜ç„¦ç‚­ã€æœ¨ç‚­åœ¨å†å²å·¥è‰ºä¸­çš„ç”¨é€”ã€‚å¤§å®¶åªè§‚å¯Ÿå·¥å…·ï¼Œä¸äº²è‡ªæ“ä½œã€‚ç°ä»£åŒºçš„è½¦åºŠåœ¨æ¼”ç¤ºä»¶ä¸Šåˆ‡æ§½ï¼Œå¯¼æ¸¸è§£é‡Šæ¶¦æ»‘è®¾å¤‡ã€æ£€æŸ¥é˜€é—¨ã€æ¸…é™¤ç§¯å°˜çš„é‡è¦æ€§ã€‚é’¢æ¶èƒ½æ”¯æ’‘ç»“æ„ï¼Œæ°´æ³¥å¸®åŠ©å½¢æˆåœ°åŸºï¼Œé«˜ç‚‰æ¨¡å‹åˆ™å±•ç¤ºå¦ä¸€ç”Ÿäº§è§„æ¨¡ã€‚å·¥ä¸šè¿›æ­¥ä¸åªæ˜¯æœºå™¨å˜å¤§ï¼Œæ ‡å‡†ç¨‹åºã€åŸ¹è®­å’Œç»´æŠ¤éƒ½å¸®åŠ©æé«˜å¯é æ€§ã€‚å°ä½œåŠä¹Ÿèƒ½é€šè¿‡é€‰å¯¹è®¾å¤‡ã€ç»†æŸ¥å„ç¯èŠ‚è¡¨ç°å‡ºè‰²ã€‚æŠ€æœ¯å˜åŒ–è‹¥åŒæ—¶æ”¹å–„å·¥ä½œè´¨é‡ä¸äº§é‡ï¼Œæ‰æœ‰æ„ä¹‰ã€‚","key":"Technical change matters when it improves the quality of work as well as the quantity of output. || as well as è¿æ¥ä¸¤ä¸ªè¯„ä»·ç»´åº¦ã€‚","task":"å¯é çš„ç”Ÿäº§æ—¢éœ€è¦è®¾å¤‡ï¼Œä¹Ÿéœ€è¦åŸ¹è®­å’Œç»´æŠ¤ã€‚ || Reliable production requires training and maintenance as well as equipment.","q":"What helped improve reliability besides machinery? || Standard procedures, training, and maintenance. è€ƒæŸ¥å¹¶åˆ—ä¿¡æ¯ã€‚","note":"","wc":153,"new":["brace","cement","instrumental","metallurgy","blacksmith","ferrous","charcoal","lubricate","excel","dust","coke","blast","valve","forge","lathe","groove"]},{"id":"59","title":"å°è¯´ä¸­çš„äººç‰©ä¸èƒ½åªçœ‹æ ‡ç­¾","en_title":"Reading a Character Closely","kind":"é˜…è¯»Â·æ–‡å­¦ä¸åˆ¤æ–­","en":"Our literary seminar examined a novel about a lonely bachelor and his wealthy patron. At first, the narrator presented the patron as a haughty snob whose bourgeois tastes were beyond criticism. Yet a later chapter revealed generosity that the earlier description had concealed.\nThe teacher asked us to separate a character's voice from the author's position. A maid, a mistress of a household, and a travelling missionary each saw the same incident differently. Their discourse reflected personality, prejudice, and experience. A hostile remark might characterize its speaker more accurately than its target.\nWe compared the novel's prose with a short verse about longing. Neither text offered a simple lesson in morality. Both encouraged us to ponder how perception shapes judgment. Close reading req contemporary readers often associate it with sexual activity. A historical author might call someone a dwarf or an idiot, terms that can be inappropriate when applied to people today. Quoting such language requires context, not casual imitation.\nThe class compared a dictionary's older sense with current usage. An entry's presence did not mean every meaning was equally suitable for an essay. The lesson was to read generously but write selectively. A strong vocabulary includes knowing when a word will convey the intended meaning and when it may create an unintended impression.","zh":"æ¡£æ¡ˆé¦†å±•ç¤ºç”µä¼ ä¿¡æ¯ã€é‚®æ”¿é€šçŸ¥åŠç°ä»£æ‰“å°æœºæ™®åŠå‰çš„æ‰“å­—æŠ¥å‘Šã€‚æœ‰äººé—® xerox èƒ½å¦ä½œåŠ¨è¯ï¼Œç®¡ç†å‘˜è§£é‡Šå…¶ä¸å¤å°çš„è”ç³»ï¼Œå¹¶å»ºè®®æ­£å¼å†™ä½œé€‰ä¸­æ€§è¡¨è¾¾ã€‚ç¤¾ä¼šè¯­å¢ƒä¹Ÿä¼šæ”¹å˜è¯ä¹‰ï¼šæ—§æ–‡ intercourse å¯æŒ‡äº¤å¾€ï¼Œå¦‚ä»Šè¯»è€…å¸¸è”æƒ³åˆ°æ€§è¡Œä¸ºï¼›å†å²ä½œè€…å¯èƒ½ç”¨ dwarf æˆ– idiot ç§°äººï¼Œä»Šå¤©è¿™æ ·ç§°å‘¼å¯èƒ½ä¸å¦¥ã€‚å¼•ç”¨éœ€äº¤ä»£è¯­å¢ƒï¼Œä¸å®œéšæ‰‹æ¨¡ä»¿ã€‚å¤§å®¶æ¯”è¾ƒè¯å…¸æ—§ä¹‰ä¸å½“å‰ç”¨æ³•ï¼Œè¯æ¡å­˜åœ¨ä¸ç­‰äºæ‰€æœ‰ä¹‰é¡¹éƒ½é€‚åˆä½œæ–‡ã€‚é˜…è¯»åº”å¹¿æ³›ç†è§£ï¼Œå†™ä½œåˆ™æœ‰é€‰æ‹©ã€‚è¯æ±‡èƒ½åŠ›ä¹ŸåŒ…æ‹¬çŸ¥é“ä½•æ—¶èƒ½å‡†ç¡®ä¼ æ„ã€ä½•æ—¶ä¼šå¼•å‘æ„å¤–å°è±¡ã€‚","key":"An entry's presence did not mean every meaning was equally suitable for an essay. || not ... every æ˜¯éƒ¨åˆ†å¦å®šï¼Œå¼ºè°ƒè¯ä¹‰ä¸è¯­åŸŸé€‰æ‹©ã€‚","task":"æŒæ¡ä¸€ä¸ªè¯ä¹ŸåŒ…æ‹¬äº†è§£å®ƒé€‚åˆä»€ä¹ˆè¯­å¢ƒã€‚ || Knowing a word also involves understanding the contexts in which it is appropriate.","q":"What does â€œwrite selectivelyâ€ mean here? || Choose meanings and registers appropriate to the intended context. ä¸æ˜¯æ•…æ„å°‘å†™ä¿¡æ¯ã€‚","note":"æ­¤ç¯‡ä¸“é—¨è¾¨ææ—§ä¹‰ä¸è¯­ä½“ï¼Œæ–‡ä¸­çš„è¯ä¸å®œå…¨éƒ¨å½“ä½œä½œæ–‡æ¨èè¡¨è¾¾ã€‚xerox æ¶‰åŠå“ç‰Œè¡ç”Ÿç”¨æ³•ï¼Œæ­£å¼è¡¨è¾¾å¯ç”¨ photocopyã€‚","wc":152,"new":["postal","printer","intercourse","telex","convey","idiot","dwarf","xerox"]},{"id":"61","title":"é¢å¯¹æ„¤æ€’æ—¶å¦‚ä½•å›åº”","en_title":"Choosing a Response","kind":"å†™ä½œÂ·äººé™…æ²Ÿé€š","en":"After a harsh remark, my first impulse was to retort. I felt furious, and my fury made a minor dispute seem monstrous. I wanted to denounce the speaker, ridicule his conceit, and embarrass him in front of everyone. Fortunately, a friend asked me to pause.\nShe did not dismiss my hurt. Instead, she helped me distinguish a thoughtless comment from deliberate malice. To sneer, scoff, or hurl an insult would merely heighten the conflict. It would not explain why the remark was offensive. I decided to state my objection with firmness and ask for a proper response.\nThe conversation remained awkward, but the other person eventually apologized. I could accept that without pretending the incident had been nice. Tact does not require passive resignation. It requires enough restraint to address a problem without allowing wrath, jealousy, or spite to govern the exchange. A measured response can be courageous precisely because it resists an easy outburst.","zh":"å¬åˆ°ä¸¥å‰è¯„è®ºï¼Œæˆ‘æœ€åˆæƒ³åé©³ã€‚æ„¤æ€’è®©å°äº‰æ‰§æ˜¾å¾—å¯æ€•ï¼Œæˆ‘æƒ³å…¬å¼€è°´è´£ã€å˜²ç¬‘å¯¹æ–¹è‡ªè´Ÿï¼Œè®©ä»–éš¾å ªã€‚æœ‹å‹è¯·æˆ‘åœä¸€åœã€‚å¥¹æ²¡æœ‰å¦å®šæˆ‘çš„å—ä¼¤ï¼Œè€Œå¸®åŠ©åŒºåˆ†è½»ç‡è¨€è®ºä¸è“„æ„æ¶æ„ã€‚å†·ç¬‘ã€è®¥è®½æˆ–è¾±éª‚åªä¼šåŠ å‰§å†²çªï¼Œä¸èƒ½è§£é‡Šè¨€è®ºä¸ºä½•å†’çŠ¯ã€‚æˆ‘å†³å®šåšå®šè¡¨è¾¾å¼‚è®®å¹¶è¦æ±‚é€‚å½“å›åº”ã€‚è°ˆè¯ä»å°´å°¬ï¼Œå¯¹æ–¹æœ€ç»ˆé“æ­‰ï¼Œæˆ‘æ¥å—ä½†ä¸å‡è£…ç»å†æ„‰å¿«ã€‚å¾—ä½“ä¸ç­‰äºæ¶ˆæé¡ºä»ï¼Œè€Œæ˜¯å…‹åˆ¶åœ°è§£å†³é—®é¢˜ï¼Œä¸è®©æš´æ€’ã€å«‰å¦’å’Œæ€¨æ¨æ”¯é…äº¤æµã€‚å¹³é™å›åº”æ­£å› æŠµåˆ¶è½»æ˜“çˆ†å‘è€Œå¯èƒ½å‹‡æ•¢ã€‚","key":"Tact does not require passive resignation. || ç®€çŸ­å¦å®šå¥æ¾„æ¸…æ¦‚å¿µï¼Œå¯æ¥ It requires ... ç»™å‡ºæ­£é¢å®šä¹‰ã€‚","task":"åšå®šåœ°è¡¨è¾¾å¼‚è®®ï¼Œå¹¶ä¸æ„å‘³ç€å¿…é¡»ä¾®è¾±å¯¹æ–¹ã€‚ || Expressing disagreement firmly does not mean having to insult the other person.","q":"Why would insults have been unhelpful? || They would heighten conflict without explaining the objection. å…³æ³¨è¡Œä¸ºèƒ½å¦è§£å†³é—®é¢˜ã€‚","note":"","wc":155,"new":["conceit","courageous","nice","resignation","hurt","embarrass","denounce","thoughtless","hurl","offensive","furious","fury","monstrous","firmness","heighten","tact","malice","spite","jealousy","harsh","wrath","scoff","retort","sneer"]},{"id":"62","title":"æ‚¬ç–‘æ•…äº‹ä¸­çš„çº¿ç´¢","en_title":"Clues in a Radio Drama","kind":"å¬åŠ›Â·æ•…äº‹ä¸æ¨æ–­","en":"In a radio drama, a sheriff received a report that a burglar had tried to steal an antique. A watchful guard heard a clatter, saw a figure flee, and called a patrol. The suspected outlaw left a badge behind, but it might have been fake.\nA second scene introduced a notorious gangster and a rumour that he planned to kidnap a dealer. The police could not detain someone merely because a frightening story sounded plausible. They had to examine evidence and follow the required procedure. The narrator mentioned a warrant without explaining its legal details.\nAt the climax, the apparent villain turned out to be a witness. The real motive involved greed and a failed attempt to smuggle stolen ware. The story taught listeners to separate a clue from an assumption. A dramatic voice can make a questionable explanation sound persuasive, but suspense is not proof.","zh":"å¹¿æ’­å‰§é‡Œï¼Œè­¦é•¿æ¥æŠ¥çªƒè´¼ä¼å›¾ç›—å¤è‘£ã€‚è­¦è§‰å®ˆå«å¬åˆ°ç¢°æ’å£°ã€çœ‹è§èº«å½±é€ƒè·‘å¹¶å«å·¡é€»äººå‘˜ã€‚ç–‘çŠ¯é—ä¸‹å¾½ç« ï¼Œå´å¯èƒ½æ˜¯å‡è´§ã€‚ç¬¬äºŒå¹•å¼•å‡ºè‡­åæ˜­è‘—çš„æ­¹å¾’ï¼Œä»¥åŠä»–è®¡åˆ’ç»‘æ¶å•†äººçš„ä¼ è¨€ã€‚ä¸èƒ½ä»…å‡­å“äººæ•…äº‹ä¼¼ä¹å¯ä¿¡å°±æ‹˜ç•™æŸäººï¼Œå¿…é¡»æŸ¥è¯å¹¶éµå¾ªç¨‹åºã€‚æ—ç™½æåˆ°ä»¤çŠ¶ï¼Œä½†æœªè®²æ³•å¾‹ç»†èŠ‚ã€‚é«˜æ½®æ—¶ï¼Œçœ‹ä¼¼åæ´¾çš„äººå…¶å®æ˜¯è¯äººï¼ŒçœŸå®åŠ¨æœºæ¶‰åŠè´ªå©ªå’Œèµ°ç§èµƒç‰©æœªé‚ã€‚æ•…äº‹æé†’å¬ä¼—åŒºåˆ†çº¿ç´¢ä¸å‡è®¾ã€‚æˆå‰§åŒ–å£°éŸ³ä¼šè®©å¯ç–‘è§£é‡Šå¬ç€æœ‰è¯´æœåŠ›ï¼Œä½†æ‚¬å¿µä¸æ˜¯è¯æ˜ã€‚","key":"A dramatic voice can make a questionable explanation sound persuasive. || make + å®¾è¯­ + åŠ¨è¯åŸ ed beside a larger fragment. Above us, a massive cliff rose to a striking elevation, and a stream disappeared beneath an opaque pool. The teacher asked us to describe what we could observe before discussing its origin.\nNo one was permitted to collect material indiscriminately. The purpose was to connect evidence with an explanation, not to fill a bag with souvenirs. A dramatic view could fascinate us, but scientific understanding required attention to scale, time, and alternative accounts of how the feature had formed.","zh":"åœ°è´¨è¯¾å‰å¾€æ²³æµä¸Šæ–¹é«˜åŸï¼Œå²©å±‚è®°å½•æ²‰ç§¯ï¼Œé™¡å²¸æ˜¾ç¤ºä¾µèš€ã€‚å¯¼æ¸¸è§£é‡Šï¼Œæ™¯è§‚å˜åŒ–å¯èƒ½æ…¢åˆ°ä¸€ä¸‹åˆå¯Ÿè§‰ä¸åˆ°ï¼Œçœ‹ä¼¼é™æ­¢ä¸ç­‰äºæ°¸æ’ã€‚æˆ‘ä»¬æ¯”è¾ƒå¹²æ²³é“ä¸æµç€æµ‘æ°´çš„æ²³é“ï¼Œå°çŸ³ç‰‡é ç€å¤§ç¢å—ã€‚ä¸Šæ–¹å·¨å¤§å´–å£é«˜è€¸ï¼Œæºªæµéšå…¥ä¸é€æ˜æ°´æ½­ã€‚è€å¸ˆè¦æ±‚å…ˆæè¿°è§‚å¯Ÿï¼Œå†è®¨è®ºæˆå› ã€‚ä¸å¾—éšæ„é‡‡é›†ææ–™ï¼Œç›®çš„æ˜¯è”ç³»è¯æ®ä¸è§£é‡Šï¼Œè€Œéè£…æ»¡çºªå¿µå“ã€‚å£®è§‚æ™¯è‰²èƒ½ä½¿äººç€è¿·ï¼Œä½†ç§‘å­¦ç†è§£è¿˜éœ€å…³æ³¨å°ºåº¦ã€æ—¶é—´å’Œä¸åŒæˆå› è§£é‡Šã€‚","key":"Its apparent stillness did not imply permanence. || apparent ä¸ imply åŒºåˆ†è¡¨è±¡å’Œæ¨è®ºï¼Œé€‚åˆç§‘å­¦è¯´æ˜ã€‚","task":"ç†è§£è‡ªç„¶æ™¯è§‚éœ€è¦åŒæ—¶è€ƒè™‘ç©ºé—´å°ºåº¦å’Œæ—¶é—´ã€‚ || Understanding a natural landscape requires considering both spatial scale and time.","q":"What were students asked to do before explaining origins? || Describe what they could observe. è§‚å¯Ÿå…ˆäºæˆå› è§£é‡Šã€‚","note":"","wc":146,"new":["flake","deposition","fascinate","stillness","cloudy","plateau","elevation","dry","erosion","geology","fill","massive","opaque"]},{"id":"68","title":"å¾®å°å˜åŒ–çš„å®éªŒ","en_title":"Measuring Small Changes","kind":"é˜…è¯»Â·å®éªŒè®¾è®¡","en":"We used a pendulum to examine periodic motion. Its regularity looked impressive, but the teacher asked us to measure rather than assume. A small change in length could affect the result. We recorded a vector's direction in one exercise and a scalar magnitude in another, taking care not to confuse them.\nNext, a magnet helped demonstrate attraction and repulsion. We observed polarity and discussed magnetism before considering induction in a separate apparatus. A nearby display showed how a filament could glow and how a narrow opening formed a slit in an optical experiment.\nEach group had to tabulate observations, compare the resultant values, and explain a possible source of error. A parameter was held constant while another changed. Where a relation appeared inversely proportional, we checked several points. Scientific confidence increased through repeated examination, not because the first result looked elegant.","zh":"æˆ‘ä»¬ç”¨æ‘†ç ”ç©¶å‘¨æœŸè¿åŠ¨ã€‚è§„å¾‹çœ‹ä¼¼æ˜æ˜¾ï¼Œè€å¸ˆä»è¦æ±‚æµ‹é‡ï¼Œé•¿åº¦å°å˜åŒ–ä¹Ÿå¯èƒ½å½±å“ç»“æœã€‚ç»ƒä¹ åˆ†åˆ«è®°å½•çŸ¢é‡æ–¹å‘ä¸æ ‡é‡å¤§å°ï¼Œé¿å…æ··æ·†ã€‚éšåç”¨ç£é“æ¼”ç¤ºå¸å¼•ä¸æ’æ–¥ï¼Œè§‚å¯Ÿææ€§ã€è®¨è®ºç£æ€§ï¼Œå†ç”¨å¦ä¸€è£…ç½®è€ƒè™‘æ„Ÿåº”ã€‚æ—è¾¹å±•ç¤ºç¯ä¸å‘å…‰åŠå…‰å­¦å®éªŒç‹­ç¼ã€‚å„ç»„å¿…é¡»åˆ—è¡¨è®°å½•ã€æ¯”è¾ƒæ‰€å¾—æ•°å€¼å¹¶è§£é‡Šè¯¯å·®æ¥æºï¼Œä¸€ä¸ªå‚æ•°å›ºå®šï¼Œå¦ä¸€ä¸ªå˜åŒ–ã€‚å…³ç³»ä¼¼ä¹æˆåæ¯”æ—¶ï¼Œè¿˜è¦æ£€éªŒå¤šä¸ªç‚¹ã€‚ç§‘å­¦ä¿¡å¿ƒé€šè¿‡é‡å¤æ£€æŸ¥å¢å¼ºï¼Œè€Œä¸æ˜¯å› ä¸ºé¦–ä¸ªç»“æœæ¼‚äº®ã€‚","key":"A parameter was held constant while another changed. || while å¯¹ç…§æ§åˆ¶å˜é‡å’Œå˜åŒ–å˜é‡ï¼›è¢«åŠ¨è¯­æ€é€‚åˆæè¿°å®éªŒã€‚","task":"æˆ‘ä»¬åº”è¯¥é€šè¿‡é‡å¤æµ‹é‡æ¥æ£€éªŒæœ€åˆçš„åˆ¤æ–­ã€‚ || We should test our initial judgment through repeated measurements.","q":"Why were several points checked? || To examine whether the apparent proportional relationship held. ä¸ä»¥å•ç‚¹ä»£æ›¿è§„å¾‹ã€‚","note":"","wc":141,"new":["resultant","magnet","periodic","inversely","filament","vector","slit","induction","polarity","regularity","magnitude","magnetism","parameter","tabulate","pendulum"]},{"id":"69","title":"ä»æ¯•ä¸šè®ºæ–‡åˆ°ç ”ç©¶è¡¨è¾¾","en_title":"Turning Evidence into a Thesis","kind":"å†™ä½œÂ·å­¦æœ¯è¡¨è¾¾","en":"My thesis examined the adoption of a new teaching method. I had to formulate a proposition, explain its derivation, and identify what would count as supporting evidence. The first draft was deficient in detail and relied on an analogy that did not fit the data.\nMy supervisor asked me to distinguish a constituent of the model from an assumption about the whole. I should not postulate a mechanism merely to explain away an inconvenient result. Nor could I claim that two trends must correlate simply because their timing happened to coincide.\nI revised the formulation, placed extra tables in an appendix, and prepared a synthesis of the findings. The conclusion acknowledged a marginal effect and a substantial limitation. The process was demanding, but it helped me appreciate why rigorous expression matters. A sound argument remains open to revision when new evidence challenges its premises.","zh":"æ¯•ä¸šè®ºæ–‡ç ”ç©¶æ–°æ•™å­¦æ³•çš„é‡‡ç”¨ã€‚æˆ‘éœ€æå‡ºå‘½é¢˜ã€è§£é‡Šæ¨å¯¼ï¼Œå¹¶æ˜ç¡®ä½•ç§è¯æ®èƒ½æ”¯æŒã€‚åˆç¨¿ç»†èŠ‚ä¸è¶³ï¼Œç±»æ¯”ä¹Ÿä¸ç¬¦æ•°æ®ã€‚å¯¼å¸ˆè¦æ±‚åŒºåˆ†æ¨¡å‹ç»„æˆéƒ¨åˆ†ä¸å¯¹æ•´ä½“çš„å‡è®¾ï¼Œä¸èƒ½åªä¸ºæªå¡ä¸åˆ©ç»“æœè€Œå‡å®šæœºåˆ¶ï¼Œä¹Ÿä¸èƒ½å› ä¸¤ä¸ªè¶‹åŠ¿æ°å¥½åŒæ—¶å‡ºç°ï¼Œå°±æ–­è¨€ç›¸å…³ã€‚æˆ‘ä¿®æ”¹è¡¨è¿°ï¼ŒæŠŠé¢å¤–è¡¨æ ¼æ”¾é™„å½•ï¼Œç»¼åˆç ”ç©¶å‘ç°ï¼Œç»“è®ºæ‰¿è®¤æ•ˆæœå¾ˆå°ä¸”å±€é™æ˜æ˜¾ã€‚è¿‡ç¨‹è´¹åŠ›ï¼Œå´è®©æˆ‘ç†è§£ä¸¥è°¨è¡¨è¾¾çš„é‡è¦ã€‚æ–°è¯æ®æŒ‘æˆ˜å‰ææ—¶ï¼Œå¯é è®ºè¯ä»åº”å…è®¸ä¿®æ”¹ã€‚","key":"Nor could I claim that two trends must correlate simply because their timing happened to coincide. || nor å¥é¦–éƒ¨åˆ†å€’è£…ï¼›simply because æŒ‡å‡ºç†ç”±ä¸è¶³ã€‚","task":"ä¸€ç¯‡æœ‰è¯´æœåŠ›çš„è®ºæ–‡ä¹Ÿåº”è¯¥æ‰¿è®¤è‡ªèº«çš„å±€é™ã€‚ || A persuasive thesis should also acknowledge its own limitations.","q":"What was wrong with the first draft? || It lacked detail and used an analogy that did not fit the data. ä¸¤ä¸ªé—®é¢˜å¹¶åˆ—ã€‚","note":"","wc":144,"new":["derivation","postulate","constituent","analogy","coincide","adoption","deficient","count","proposition","formulation","thesis","marginal","correlate","synthesis","appendix","rigorous"]},{"id":"70","title":"é¢è¯•ä¸­çš„è¡¨è¾¾ä¸å€¾å¬","en_title":"Speaking without Performing Confidence","kind":"å¬åŠ›Â·é¢è¯•æŠ€å·§","en":"Before the interview, I was tempted to memorize an elaborate speech. My adviser warned that eloquence could not conceal an absence of relevant experience. A clear example would be more useful than a lofty declaration about being exceptional.\nWe practised answering without rambling. I would state the situation, describe my action, and explain the outcome. When I began to ramble, she asked me to return to the question. I learnt not to flatter an interviewer or claim expertise I did not possess. Modesty did not require hiding an achievement; sincerity required describing it accurately.\nOn the day, one question seemed designed to baffle me. I paused, admitted the uncertainty, and explained how I would investigate. The panel appeared interested. I left without knowing the result, but with a better understanding of communication: a thoughtful response can reveal more intellect than a quick display of confidence.","zh":"é¢è¯•å‰ï¼Œæˆ‘æƒ³èƒŒç²¾è‡´é•¿æ¼”è¯´ã€‚é¡¾é—®æé†’ï¼Œå£æ‰æ©ç›–ä¸äº†ç›¸å…³ç»éªŒç¼ºå¤±ï¼Œæ¸…æ¥šæ¡ˆä¾‹æ¯”å®£ç§°è‡ªå·±éå‡¡çš„é«˜è°ƒè¡¨æ€æœ‰ç”¨ã€‚ç»ƒä¹ ä¸­ï¼Œæˆ‘ä¾æ¬¡äº¤ä»£æƒ…å¢ƒã€è¡ŒåŠ¨å’Œç»“æœï¼Œä¸€è·‘é¢˜å¥¹å°±è®©æˆ‘å›åˆ°é—®é¢˜ã€‚æˆ‘å­¦ç€ä¸å¥‰æ‰¿é¢è¯•å®˜ï¼Œä¹Ÿä¸å†’ç§°ä¸“é•¿ã€‚è°¦é€Šä¸è¦æ±‚éšè—æˆç»©ï¼ŒçœŸè¯šåˆ™è¦æ±‚å‡†ç¡®æè¿°ã€‚å½“å¤©ä¸€ä¸ªé—®é¢˜ä¼¼ä¹æ•…æ„éš¾å€’æˆ‘ï¼Œæˆ‘åœé¡¿ã€æ‰¿è®¤ä¸ç¡®å®šï¼Œå¹¶è§£é‡Šä¼šæ€æ ·è°ƒæŸ¥ã€‚è¯„å§”ä¼¼ä¹æœ‰å…´è¶£ã€‚ç¦»å¼€æ—¶è™½ä¸çŸ¥ç»“æœï¼Œå´æ›´ç†è§£æ²Ÿé€šï¼šæ·±æ€ç†Ÿè™‘çš„å›ç­”æ¯”æ€¥ç€è¡¨ç°è‡ªä¿¡æ›´èƒ½å±•ç°æ™ºæ…§ã€‚","key":"Modesty did not require hiding an achievement; sincerity required describing it accurately. || ä¸¤ä¸ªå¹³è¡Œåˆ†å¥è¾¨æè°¦é€Šä¸çœŸè¯šã€‚","task":"æ‰¿è®¤ä¸çŸ¥é“æŸä»¶äº‹ï¼Œå¹¶ä¸æ„å‘³ç€ç¼ºä¹å­¦ä¹ èƒ½åŠ›ã€‚ || Admitting that one does not †æŠ€æœ¯é—®é¢˜ï¼›å¸‚é•¿è´Ÿè´£å¼€å¯å’¨è¯¢è€Œéå†³å®šç»“è®ºã€‚å…¬æ°‘å°†ä¸æ»¡åŒ–ä¸ºå¯è¡Œå»ºè®®ï¼Œå°±èƒ½å…‹æœæƒ°æ€§ã€‚ä¿¡å¿µé‡è¦ï¼Œä½†è¯´æœä¹Ÿéœ€è¦å€¾å¬ä¸åŒä¼˜å…ˆäº‹é¡¹ã€‚","key":"Public participation can counter inertia when citizens turn dissatisfaction into a practicable proposal. || turn A into B æè¿°å°†æƒ…ç»ªè½¬åŒ–ä¸ºå¯è¡ŒåŠ¨æ–¹æ¡ˆã€‚","task":"å»ºè®¾æ€§çš„å‚ä¸éœ€è¦æŠŠä¸æ»¡è½¬åŒ–ä¸ºå…·ä½“å»ºè®®ã€‚ || Constructive participation requires turning dissatisfaction into concrete proposals.","q":"What kind of campaign did the coalition prefer? || A peaceful rally with a clearly stated pledge. ä¸éªšä¹±æ˜ç¡®åŒºåˆ†ã€‚","note":"","wc":158,"new":["controversy","cite","refrain","pledge","concession","persuasion","annually","practicable","ally","allied","legislation","possibility","inaugurate","initiate","prohibition","regulation","inertia","convention","veto","subsidiary","mobilize","repeal","senator","dissatisfaction","advocate","announce","rally","riot"]},{"id":"72","title":"æŠ¥é“åº”è¯¥å¦‚ä½•æªè¾","en_title":"Editing a Sensitive Report","kind":"é˜…è¯»Â·æ–°é—»ä¸è¡¨è¾¾","en":"Our editor received a draft describing an assault, a hostage incident, and a suspected terrorist threat. The writer had used the same dramatic language for all three. The editor asked whether each label was supported and whether the reader could distinguish confirmed information from an allegation.\nShe would not let an adjective substitute for evidence. A headline might trigger panic, and a careless phrase could propagate an unverified claim. The newsroom had to relay accurate information, correct a misleading passage, and avoid turning a person's suffering into a sensation.\nWe revised the text to denote the known facts precisely. A direct quotation remained a quotation; it did not become the publication's own conclusion. The exercise helped us understand that word choice can either enlighten or bewilder. Responsible reporting should inform the public without exploiting fear, and i e joint tightly aligned.\nThe demonstration was a lesson in restraint. We must not fling tools onto the bench, squash a delicate part, or scratch the surface through haste. To repair something well is to understand what each small action will change. Patience prevents damage that greater strength cannot undo.","zh":"è€å¸ˆè®©æˆ‘å±•å¼€å¸ƒã€æ”¾ä¸Šç ´æ¡†ã€‚å…ˆè§£ç»³ã€æ¾å¤¹å­ã€æ‹‰ç›´æ­ªæ¡ï¼Œå†ç”¨èƒ¶å¸¦ä¸´æ—¶å›ºå®šã€‚å°é’‰å›ºå®šæœ€åè¦†ç›–å±‚ï¼Œä½†åˆ«åˆºé”™å±‚ã€‚æ—è¾¹å­¦ç”ŸæŠŠé‡‘å±ä¸æ‰­å¾—å¤ªæ€¥ï¼Œå¼€å§‹å˜å½¢ï¼›å¦ä¸€äººæ‹‰æ¾çº¿ä½¿å¸ƒæ’•è£‚ã€‚æˆ‘ä»¬åœä¸‹æ£€æŸ¥ï¼Œå­¦ç€å‡åŠ›ã€‚é’ˆè„šèƒ½è¡¥ç ´å£ï¼Œå¤¹å…·ä¿æŒæ¥å¤´ç´§å¯†å¯¹é½ã€‚è¿™æ˜¯å…‹åˆ¶è®­ç»ƒï¼šä¸èƒ½ç”©å·¥å…·ã€å‹åç²¾ç»†éƒ¨ä»¶ï¼Œæˆ–å› ç€æ€¥åˆ’ä¼¤è¡¨é¢ã€‚ä¿®å¥½ç‰©å“æ„å‘³ç€ç†è§£æ¯ä¸ªå°åŠ¨ä½œå¸¦æ¥çš„æ”¹å˜ã€‚è€å¿ƒèƒ½é¢„é˜²åŠ›é‡æ— æ³•æŒ½å›çš„æŸåã€‚","key":"To repair something well is to understand what each small action will change. || ä¸å®šå¼ä½œä¸»è¯­ä¸è¡¨è¯­ï¼Œå½¢æˆè¡Œä¸ºä¸èƒ½åŠ›çš„å¯¹åº”ã€‚","task":"ä¿®ç†ç‰©å“ä¹‹å‰ï¼Œåº”å…ˆç†è§£æ¯ä¸ªéƒ¨ä»¶çš„ä½œç”¨ã€‚ || Before repairing an object, we should understand the function of each component.","q":"What caused the wire to deform? || It was twisted too sharply. ç•™æ„ç¨‹åº¦å‰¯è¯ã€‚","note":"","wc":152,"new":["unfold","stitch","sharply","squash","tape","crooked","twist","deform","rip","scratch","tack","tightly","untie","clip","pierce","straighten","fling"]},{"id":"74","title":"æ¶²ä½“å®éªŒä¸­çš„è§‚å¯Ÿ","en_title":"Watching a Liquid Change","kind":"é˜…è¯»Â·ç‰©ç†åŒ–å­¦","en":"In a recorded experiment, a scientist poured a viscous liquid into a flask. A filter removed visible particles before the solution entered a second vessel. We watched a solid dissolve, a bubble rise, and a thin layer of foam appear. The instructor asked us to record these changes without inventing a cause.\nAnother demonstration compared evaporation under different humidity conditions. To evaporate was not to vanish without a trace; matter had moved into another e, an open prairie, and a wooded valley. One map marked the Tropic of Cancer, while another showed where birds migrate. The children noticed an abundance of life in every scene, but the dominant forms differed.\nIn a short film, a cuckoo called near a maple, a snake described as a serpent moved through leaves, and a predator pursued its prey. The teacher warned against calling an unfamiliar creature an alien monster. Its appearance might seem peculiar to us, yet it belonged to its own environment.\nWe examined how a web could trap an insect and how a plant's growth might be limited by scarcity of water. No habitat contained perpetual plenty. Ecological understanding grows when we compare relationships rather than rank landscapes by beauty. Even a place that appears empty can sustain life adapted to conditions that would challenge other organisms.","zh":"å­¦æ ¡å±•è§ˆæ¯”è¾ƒçƒ­å¸¦ä¸›æ—ã€å¼€é˜”è‰åŸå’Œæ—æœ¨å±±è°·ã€‚ä¸€å¹…å›¾æ ‡åŒ—å›å½’çº¿ï¼Œå¦ä¸€å¹…å±•ç¤ºå€™é¸Ÿè¿ç§»åœ°ã€‚æ¯å¤„ç”Ÿå‘½ä¸°å¯Œï¼Œä½†ä¼˜åŠ¿ç±»å‹ä¸åŒã€‚çŸ­ç‰‡é‡Œï¼Œå¸ƒè°·é¸Ÿåœ¨æ«æ ‘æ—å«ï¼Œè¢«ç§°ä¸º serpent çš„è›‡ç©¿å¶è€Œè¡Œï¼Œæ•é£Ÿè€…è¿½çŒç‰©ã€‚è€å¸ˆæé†’åˆ«æŠŠé™Œç”Ÿç”Ÿç‰©å«å¤–æ¥æ€ªç‰©ï¼šå¤–è§‚å¯¹æˆ‘ä»¬å¥‡ç‰¹ï¼Œå´å±äºè‡ªèº«ç¯å¢ƒã€‚å¤§å®¶è€ƒå¯Ÿè››ç½‘æ•è™«åŠç¼ºæ°´é™åˆ¶æ¤ç‰©ç”Ÿé•¿ï¼Œæ²¡æœ‰æ –æ¯åœ°æ°¸è¿œä¸°è£•ã€‚æ¯”è¾ƒå…³ç³»è€Œä¸æ˜¯æŒ‰ç¾æ™¯æ’åï¼Œæ‰èƒ½ç†è§£ç”Ÿæ€ã€‚çœ‹ä¼¼ç©ºæ—·ä¹‹åœ°ä¹Ÿå¯ç»´ç³»é€‚åº”ç‰¹å®šæ¡ä»¶çš„ç”Ÿå‘½ã€‚","key":"Its appearance might seem peculiar to us, yet it belonged to its own environment. || yet å¼•å¯¼è½¬æŠ˜ï¼Œæç¤ºé¿å…ä»¥è§‚å¯Ÿè€…ç†Ÿæ‚‰ç¨‹åº¦è¯„ä»·å¯¹è±¡ã€‚","task":"ä¸åŒç‰©ç§èƒ½å¤Ÿé€‚åº”ä¸åŒçš„ç¯å¢ƒæ¡ä»¶ã€‚ || Different species can adapt to different environmental conditions.","q":"What did the teacher recommend comparing? || Ecological relationships rather than scenic beauty. æ¯”è¾ƒæ ‡å‡†æ˜¯æ ¸å¿ƒã€‚","note":"","wc":148,"new":["perpetual","web","alien","dominant","serpent","tropic","tropical","scarcity","migrate","maple","prey","monster","abundance","cuckoo","prairie","jungle"]},{"id":"76","title":"èˆªæµ·æ•…äº‹ä¸­çš„åŠ¨ä½œä¸ä½ç½®","en_title":"A Boat in Changing Weather","kind":"å¬åŠ›Â·ä½ç½®ä¸åŠ¨ä½œ","en":"In a training story, a crew prepared to moor a small boat beside a sheltered cape. One person held an oar while another checked the mast and the line at the stern. A windy afternoon had made the return slower than expected.\nWhen a rope began to tangle, the captain told the crew to pause. They must not let a loose loop catch a foot or allow impatience to propel the boat into a rock. A nearby vessel offered to tow them the final distance. Once secure, they could step ashore and examine the problem.\nThe instructor contrasted this practical account with a romance about a pirate and a tragic shipwreck. Adventure writing could thrill a reader, but it often concealed the ordinary preparation behind safe travel. The class learnt the difference between enjoying a story and treating its dramatic actions as a guide to real behaviour.","zh":"è®­ç»ƒæ•…äº‹ä¸­ï¼Œèˆ¹å‘˜å‡†å¤‡æŠŠå°èˆ¹ç³»åœ¨é¿é£æµ·è§’æ—ã€‚ä¸€äººæŒæ¡¨ï¼Œå¦ä¸€äººæŸ¥çœ‹æ¡…æ†ä¸èˆ¹å°¾ç»³ã€‚ä¸‹åˆé£å¤§ï¼Œè¿”ç¨‹æ¯”é¢„è®¡æ…¢ã€‚ç»³å­ç¼ ç»•æ—¶ï¼Œèˆ¹é•¿è¦æ±‚åœä¸‹ï¼Œé¿å…ç»³åœˆå¥—è„šï¼Œä¹Ÿä¸èƒ½å› æ€¥èºæŠŠèˆ¹æ¨å‘å²©çŸ³ã€‚é™„è¿‘èˆ¹åªæ„¿æ‹–å®Œæœ€åä¸€æ®µã€‚å›ºå®šåï¼Œå¤§å®¶æ‰èƒ½ä¸Šå²¸æŸ¥çœ‹ã€‚è€å¸ˆæŠŠå®é™…å™è¿°ä¸æµ·ç›—åŠæ‚²å‰§æµ·éš¾çš„ä¼ å¥‡å¯¹æ¯”ï¼šå†’é™©å†™ä½œèƒ½ä½¿äººæ¿€åŠ¨ï¼Œå´å¸¸çœç•¥å®‰å…¨å‡ºè¡ŒèƒŒåçš„æ—¥å¸¸å‡†å¤‡ã€‚è¯¾å ‚å­¦ä¹ åŒºåˆ†äº«å—æ•…äº‹ä¸æŠŠæˆå‰§åŠ¨ä½œå½“ç°å®è¡Œä¸ºæŒ‡å—ã€‚","key":"Adventure writing could thrill a reader, but it often concealed the ordinary preparation behind safe travel. || but å¯¹æ¯”æ•…äº‹æ•ˆæœä¸è¢«çœç•¥çš„ä¿¡æ¯ã€‚","task":"ç²¾å½©çš„æ•…äº‹ä¸ä¸€å®šèƒ½ä½œä¸ºç°å®è¡ŒåŠ¨çš„æŒ‡å—ã€‚ || An exciting story does not necessarily provide a guide to real action.","q":"How did the nearby vessel help? || It offered to tow the boat the final distance. tow æŒ‡æ‹–æ›³ã€‚","note":"","wc":147,"new":["mast","  || Respecting historical figures does not mean ignoring their limitations.","q":"Why was the coffin labelled as a reproduction? || So visitors would not mistake a reconstruction for an original object. è¯´æ˜è¯æ®æ€§è´¨ã€‚","note":"","wc":145,"new":["reproduction","salute","majesty","likeness","oath","execution","knight","martyr","royalty","coffin","tribute","decree","immortal","bestow","assassinate","burial","patriot","patriotic"]},{"id":"78","title":"ä¸€ä»½æ‹’ä¿¡ä¹‹å","en_title":"After a Rejection","kind":"å†™ä½œÂ·æŒ«æŠ˜ä¸æˆé•¿","en":"The rejection filled me with dismay. I had expected recognition and imagined a superb result. Instead, I felt blue, then sullen, and finally tempted to grumble that the whole process was absurd. An email from my tutor helped console me without offering false praise.\nShe suggested that I examine the feedback before deciding it was unfair. A grim mood could make every criticism seem dreadful. It could also tempt me to forsake the project or regard one misfortune as permanent doom. Neither response would help me improve.\nI took a day to rest, then returned to the draft. Some comments were hard to accept, but several revealed a genuine gap. The experience did not suddenly enchant me or produce rapture. It did, however, teach me to separate disappointment from judgment. Growth often begins with the willingness to remain engaged when the first outcome is unwelcome.","zh":"æ‹’ä¿¡ä½¿æˆ‘æ²®ä¸§ã€‚æˆ‘æœŸå¾…è®¤å¯ä¸æä½³ç»“æœï¼Œå´å…ˆå¿§éƒã€å†é—·é—·ä¸ä¹ï¼Œæœ€åæƒ³æŠ±æ€¨æ•´ä¸ªæµç¨‹è’è°¬ã€‚å¯¼å¸ˆé‚®ä»¶å®‰æ…°æˆ‘ï¼Œå´æ²¡è™šå‡å¤¸å¥–ã€‚å¥¹å»ºè®®å…ˆçœ‹åé¦ˆï¼Œå†åˆ¤æ˜¯å¦ä¸å…¬ã€‚é˜´éƒæƒ…ç»ªä¼šè®©æ‰¹è¯„éƒ½æ˜¾å¯æ€•ï¼Œä¹Ÿä¼šè¯±ä½¿äººæ”¾å¼ƒé¡¹ç›®ï¼ŒæŠŠä¸€æ¬¡ä¸å¹¸å½“æ°¸ä¹…å„è¿ï¼Œä¸¤è€…éƒ½æ— åŠ©æ”¹è¿›ã€‚æˆ‘ä¼‘æ¯ä¸€å¤©å†å›ç¨¿ä»¶ï¼Œæœ‰äº›æ„è§éš¾æ¥å—ï¼Œä½†ä¸€äº›æ­ç¤ºçœŸå®ç¼ºå£ã€‚ç»å†æ²¡æœ‰çªç„¶ä»¤æˆ‘æ¬£å–œè‹¥ç‹‚ï¼Œå´æ•™ä¼šåŒºåˆ†å¤±æœ›ä¸åˆ¤æ–­ã€‚æˆé•¿å¸¸å§‹äºé¦–æ¬¡ç»“æœä¸å¦‚æ„æ—¶ï¼Œä»æ„¿ç»§ç»­æŠ•å…¥ã€‚","key":"It …ç½®æ¯å‘¨æœŸå¼¹ä»£å¸ï¼Œå¦ä¸€æ¼”ç¤ºæ‘©æ“¦å‡ç¼“è¿åŠ¨ã€‚æœ‰ç”¨è§£é‡ŠæŠŠæ‰€è§ä¸äº§ç”Ÿæ¡ä»¶è”ç³»èµ·æ¥ã€‚","key":"A machine might appear stable while material remained in constant flux. || while å¯¹ç…§å¤–è¡¨ä¸å†…éƒ¨çŠ¶æ€ã€‚","task":"è§£é‡Šåº”è¯¥æŠŠç°è±¡ä¸äº§ç”Ÿæ¡ä»¶è”ç³»èµ·æ¥ã€‚ || An explanation should connect a phenomenon with the conditions that produce it.","q":"Why was direction discussed? || Direction is part of velocity, unlike speed. åŒºåˆ†è¿‘ä¹‰æœ¯è¯­ã€‚","note":"retard åœ¨æ­¤æ˜¯å‡ç¼“çš„åŠ¨è¯ï¼Œä¸å¯æ®æ­¤å½“ä½œç§°å‘¼äººçš„è¯ã€‚dynamic / dynamical å‡ä¿ç•™ï¼›æ™®é€šä½œæ–‡ç”¨ dynamic çš„åœºæ™¯æ›´å¤šã€‚","wc":111,"new":["eject","retard","velocity","mesh","equilibrium","deflection","flux","cubic","deflect","clockwise"]},{"id":"91","title":"æ’ç»ƒå®¤ä¸­çš„å£°éŸ³ä¸åŠ¨ä½œ","en_title":"Rehearsing a Scene","kind":"å¬åŠ›Â·èˆå°ä¸åŠ¨ä½œ","en":"Our energetic group prepared a circus scene for a school play. A performer would march in a parade, blow a shrill whistle, and shout \"Hurrah!\" Another would flap a cloth wing and pretend to fly. The comic hero had to hop over a box, squat behind it, then stride into view. Nobody needed a dangerous stunt.\nThe director asked us to vary the sound. A character might whisper, hiss, grunt, or give a sudden exclamation. A metallic bell would jingle; a drumbeat would follow a quick rap on the door. We practised when to clap, how to reel in surprise, and where to pause.\nThe scene ended with a hymn followed by a hush. Its effect depended on contrast and timing. Even a fantastic story requires disciplined preparation. A good performance can emerge when many small actions become a harmonious whole.","zh":"æ´»åŠ›åè¶³çš„å‰§å›¢æ’é©¬æˆåœºæ™¯ï¼šæ¼”å‘˜æ¸¸è¡Œã€å¹å°–å“¨ã€å–Šå¥½è€¶ï¼Œå¦ä¸€äººæ‰‘å¸ƒç¿…å‡è£…é£ã€‚å–œå‰§è‹±é›„è·³è¿‡ç®±å­ã€è¹²ä¸‹å†å¤§æ­¥å…¥åœºï¼Œä¸åšå±é™©ç‰¹æŠ€ã€‚å¯¼æ¼”è¦æ±‚å˜åŒ–å£°éŸ³ï¼šä½è¯­ã€å˜¶å£°ã€å’•å“æˆ–çªç„¶æ„Ÿå¹ï¼Œé‡‘å±é“ƒå®å½“ï¼Œæ•²é—¨åæ¥é¼“ç‚¹ã€‚å¤§å®¶ç»ƒä¹ é¼“æŒæ—¶æœºã€æƒŠè®¶è¸‰è·„å’Œåœé¡¿ã€‚ç»“å°¾æ˜¯åœ£æ­Œä¸å¯‚é™ï¼Œæ•ˆæœä¾èµ–å¯¹æ¯”å’ŒèŠ‚å¥ã€‚å¹»æƒ³æ•…äº‹ä¹Ÿéœ€ä¸¥è°¨å‡†å¤‡ï¼Œå°åŠ¨ä½œåè°ƒæˆæ•´ä½“æ‰èƒ½å½¢æˆå¥½è¡¨æ¼”ã€‚","key":"A good performance can emerge when many small actions become a harmonious whole. || emerge è¡¨ç¤ºå½¢æˆï¼›when ä»å¥è¯´æ˜å½¢æˆæ¡ä»¶ã€‚","task":"å›¢é˜Ÿæˆæœä¾èµ–æ¯ä¸ªäººå¯¹ç»†èŠ‚çš„å…³æ³¨ã€‚ || A team's success depends on each member's attention to detail.","q":"What made the final scene effective? || Contrast and timing. ä¸æ˜¯å±é™©ç‰¹æŠ€ã€‚","note":"","wc":141,"new":["grunt","hymn","hop","hiss","rap","circus","parade","fantastic","reel","metallic","shrill","energetic","exclamation","harmonious","hurrah","emerge","fly","whisper","stride","hush","squat","jingle","flap"]},{"id":"92","title":"è‡ªç„¶è§‚å¯Ÿä¸­çš„è¯¯åˆ¤","en_title":"Looking without Labels","kind":"é˜…è¯»Â·è‡ªç„¶è§‚å¯Ÿ","en":"At dawn, a cock called near the fence. A tiny insect gave a child a sting, and he declared every bug vicious. The guide asked him to reconsider. An unfamiliar animal was not necessarily a hazard; a shark on a poster was neither a cartoon villain nor a creature to tease.\nWe watched birds pluck food, observed a plant repel an insect, and noticed how a leaf could taper towards its tip. The guide invited us to roam only within the marked area. We should not clutch a creature, disturb it for a photograph, or let curiosity become thoughtless intrusion.\nA nickname such as \"monster\" could obscure an animal's actual behaviour. So could the urge to adore everything that looked soft. Observation requires patience with what we do not yet understand. Respect for nature is more reliable when it rests on attention rather than fear or sentiment alone.","zh":"é»æ˜å…¬é¸¡å«ï¼Œæ˜†è™«èœ‡äº†å­©å­ï¼Œä»–ä¾¿è¯´æ‰€æœ‰è™«éƒ½æ¶æ¯’ã€‚å¯¼æ¸¸è®©ä»–é‡æƒ³ï¼šé™Œç”ŸåŠ¨ç‰©æœªå¿…æœ‰å®³ï¼Œæµ·æŠ¥ä¸­çš„é²¨é±¼æ—¢éå¡é€šåæ´¾ï¼Œä¹Ÿä¸è¯¥é€—å¼„ã€‚æˆ‘ä»¬çœ‹é¸Ÿå•„å–é£Ÿç‰©ã€æ¤ç‰©é©±è™«ã€å¶ç‰‡å°–ç«¯æ¸ç»†ï¼Œåªåœ¨æ ‡è®°èŒƒå›´èµ°åŠ¨ï¼Œä¸æŠ“ç”Ÿç‰©æˆ–ä¸ºæ‹ç…§æ‰“æ‰°ã€‚å«åŠ¨ç‰©â€œæ€ªç‰©â€å¯èƒ½æ©ç›–çœŸå®è¡Œä¸ºï¼Œå–œæ¬¢ä¸€åˆ‡è½¯èŒä¸œè¥¿ä¹Ÿä¼šè¯¯åˆ¤ã€‚è§‚å¯Ÿéœ€è€å¿ƒé¢å¯¹æœªçŸ¥ï¼Œå¯¹è‡ªç„¶çš„å°Šé‡å»ºç«‹åœ¨ç•™å¿ƒä¹‹ä¸Šæ¯”åªé ææƒ§æˆ–æ„Ÿæƒ…å¯é ã€‚","key":"An unfamiliar animal was not necessarily a hazard. || not necessarily è¡¨ç¤ºæœªå¿…ï¼Œé¿å…ç»å¯¹åŒ–åˆ¤æ–­ã€‚","task":"è§‚å¯Ÿåº”è¯¥å¸®åŠ©æˆ‘ä»¬ä¿®æ­£æœ€åˆçš„å°è±¡ã€‚ || Observation should help us revise our initial impressions.","q":"Why did the guide challenge the child's statement? || One sting did not justify a judgment about every insect. é¿å…ä»¥åæ¦‚å…¨ã€‚","note":"","wc":148,"new":["clutch","roam","cock","vicious","taper","hazard","shark","cartoon","sting","repel","pluck","sentiment","tease","adore","bug","nickname"]},{"id":"93","title":"å†’é™©æ•…äº‹å¦‚ä½•åˆ¶é€ ç´§å¼ ","en_title":"Suspense and Action","kind":"é˜…è¯»Â·å™äº‹è¯­è¨€","en":"In a fictional adventure, a fighter tried to cross an icy pass before an enemy could seize the bridge. Ice made each step uncertain. The story did not ask readers to imitate him: its aim was to create fright. A gigantic gate guarded a vault, and a skeleton lay beneath a faded flag.\nThe hero would grope through darkness, heave a heavy door, and wield a broken pole to keep an attacker away. His companion wanted to punch and thrash their opponent, but the hero chose to subdue the conflict without further violence. A trap threatened to expel them into the snow.\nThe climax brought an unexpected ally. A fearsome appearance had concealed kindness. Readers felt astonishment because their assumptions had been overturned. Suspense can terrify or excite through selective information. To understand the story, we must examine what the narrator reveals, what remains a mystery, and when that information changes.","zh":"è™šæ„å†’é™©ä¸­ï¼Œæˆ˜å£«è¯•å›¾åœ¨æ•Œäººå¤ºæ¡¥å‰ç©¿è¿‡å†°å†·å±±å£ã€‚å†°ä½¿æ­¥æ­¥å±é™©ï¼Œæ•…äº‹æ„åœ¨åˆ¶é€ ææƒ§ï¼Œä¸ä¾›æ¨¡ä»¿ã€‚å·¨é—¨å®ˆå®åº“ï¼Œè¤ªæ——ä¸‹èººéª¨æ¶ã€‚è‹±é›„æ‘¸é»‘æ¨é‡é—¨ã€æŒ¥æ–­æ†é˜»æ”»å‡»ï¼›åŒä¼´æƒ³æ‹³æ‰“ç—›ææ•Œæ‰‹ï¼Œè‹±é›„é€‰æ‹©ç¼“å’Œå†²çªï¼Œé™·é˜±é™©æŠŠä»–ä»¬å¼¹å…¥é›ªä¸­ã€‚é«˜æ½®å‡ºç°æ„å¤–ç›Ÿå‹ï¼Œå¯æ€•å¤–è¡¨è—å–„æ„ï¼Œè¯»è€…å› é¢„è®¾è¢«æ¨ç¿»è€ŒæƒŠè®¶ã€‚æ‚¬å¿µé€šè¿‡ä¿¡æ¯é€‰æ‹©ä½¿äººå®³æ€•æˆ–å…´å¥‹ï¼Œé˜…è¯»éœ€çœ‹å™è¿°è€…ä½•æ—¶æ­ç¤ºä»€ä¹ˆã€‚","key":"Readers felt astonishment because their assumptions had been overturned. || è¿‡å»å®Œæˆæ—¶è¢«åŠ¨è¡¨ç¤ºå…ˆå‰å‡è®¾å·²è¢«æ¨ç¿»ã€‚","task":"å™è¿°è€…å¯ä»¥é€šè¿‡æ§åˆ¶ä¿¡æ¯æ¥åˆ¶é€ æ‚¬å¿µã€‚ || A narrator can create suspense by controlling information.","q":"Why was the ally surprising? || A fearsome appearance had led readers to expect hostility. å¤–è¡¨ä¸å®é™…åå·®ã€‚","note":"åŠ¨ä½œæ¥è‡ªè™šæ„æ•…äº‹ï¼Œå­¦ä¹ é‡ç‚¹æ˜¯å™äº‹ã€æ¨æ–­å’ŒåŠ¨ä½œåŠ¨è¯ã€‚å…¨æ–‡å…¶ä»–æ•…äº‹ä¸ç ”ç©¶é¡¹ç›®ä¹Ÿä¸ºæ•™å­¦æƒ…å¢ƒã€‚","wc":151,"new":["thrash","subdue","terrify","ice","mystery","expel","gigantic","fright","astonishment","wield","skeleton","vault","fighter","punch","icy","heave","grope"]},{"id":"94","title":"æ”¹å˜åè§çš„ç›¸å¤„","en_title":"Beyond First Impressions","kind":"å†™ä½œÂ·äººé™…ä¸åŒ…å®¹","en":"I had dismissed my new neighbour as snobbish because he rarely spoke. He was bald, wore formal clothes, and looked decidedly uneasy at our first gathering. I foolishly treated those details as evidence of his personality. That judgment now seems shameful.\nWhen a storm damaged the street, he worked tirelessly to help. He did not preach about generosity or deliver a sermon on duty. He simply offered time and tools. I felt shame at my earlier assumption and tried to make amends.\nThe experience taught me not to resent someone for failing to fit my expectations. A tolerant community must make room for different manners, including silence. A person may be reserved without being rude, just as a lively manner need not indicate goodness. We ought to replace petty labels with patient attention. The requisite first step is often to admit that our impression may be wrong.","zh":"é‚»å±…å°‘è¨€ï¼Œæˆ‘å°±åˆ¤ä»–åŠ¿åˆ©ã€‚ä»–ç§ƒé¡¶ã€è¡£ç€æ­£å¼ï¼Œåˆèšæ˜æ˜¾ä¸è‡ªåœ¨ï¼Œæˆ‘æ„šè ¢åœ°å½“ä½œæ€§æ ¼è¯æ®ï¼Œå¦‚ä»Šæƒ³æ¥ç¾æ„§ã€‚é£æš´æŸè¡—æ—¶ï¼Œä»–ä¸è¾è¾›è‹¦å¸®å¿™ï¼Œä¸å®£æ‰¬æ…·æ…¨æˆ–è¯´æ•™è´£ä»»ï¼Œåªè´¡çŒ®æ—¶é—´å·¥å…·ã€‚æˆ‘ä¸ºæ—§åˆ¤æ–­ç¾æ„§å¹¶å¼¥è¡¥ã€‚ä¸è¦å› åˆ«äººä¸ç¬¦æœŸå¾…è€Œæ€¨ä»–ã€‚åŒ…å®¹ç¤¾åŒºå®¹çº³ä¸åŒä¸¾æ­¢ï¼Œä¹ŸåŒ…æ‹¬æ²‰é»˜ã€‚å†…æ•›æœªå¿…æ— ç¤¼ï¼Œæ´»æ³¼ä¹Ÿæœªå¿…å–„è‰¯ã€‚åº”ç”¨è€å¿ƒè§‚å¯Ÿæ›¿ä»£çç¢æ ‡ç­¾ï¼Œç¬¬ä¸€æ­¥å¸¸æ˜¯æ‰¿è®¤å°è±¡å¯èƒ½é”™ã€‚","key":"A person may be reserved without being rude. || without + åŠ¨åè¯åŒºåˆ†å¸¸è¢«è¯¯è®¤ä¸ºç›¸ä¼´çš„ä¸¤ç§ç‰¹å¾ã€‚","task":"æˆ‘ä»¬ä¸åº”è¯¥ä»…å‡­å¤–è¡¨åˆ¤æ–­ä¸€ä¸ªäººçš„å“æ ¼ã€‚ || We should not judge a person's character solely by appearance.","q":"What changed the narrator's view? || The neighbour's practical help after a storm. å®é™…è¡Œä¸ºä¿®æ­£åˆ¤æ–­ã€‚","note":"","wc":147,"new":["requisite","petty","bald","preach","snobbish","shame","goodness","tolerant","decidedly","shameful","resent","sermon","uneasy","ought"]},{"id":"95","title":"å¥½çš„ç»“è®ºæœ‰å¤šå¤§èŒƒå›´","en_title":"The Scope of a Conclusion","kind":"é˜…è¯»Â·ç ”ç©¶ä¸è¡¨è¾¾","en":"Our research team examined a global trend over a ten-year span. An apparent similarity between two regions was notable, but the differences were equally important. We divided the data into a segment for each period and checked whether simultaneous changes had a shared explanation.\nA figure of nought did not necessarily prove absence; it might reflect the way a variable was recorded. Nor did a dramatic peak justify an indefinite forecast. The teacher asked us to qualify each inference and identify whether a result was statistically useful or merely interesting.\nWe could deem the findings suggestive without presenting them as final. The overall range remained broad, and a peripheral factor might still matter. Research should bring uncertainty to the fore rather than hide it. To pore over evidence is worthwhile when it makes a conclusion more precise. Its value lies not in sounding formidable but in saying exactly what the data can support.","zh":"å›¢é˜Ÿç ”ç©¶åå¹´å…¨çƒè¶‹åŠ¿ï¼Œä¸¤åœ°åŒºè¡¨é¢ç›¸ä¼¼å€¼å¾—æ³¨æ„ï¼Œå·®å¼‚åŒæ ·é‡è¦ã€‚æŒ‰æ—¶æœŸåˆ†æ®µæ•°æ®ï¼Œæ£€æŸ¥åŒæ­¥å˜åŒ–æ˜¯å¦å…±åŒåŸå› ã€‚é›¶å€¼æœªå¿…è¯æ˜ä¸å­˜åœ¨ï¼Œä¹Ÿå¯èƒ½æ¥è‡ªè®°å½•æ–¹å¼ï¼›æ˜æ˜¾å³°å€¼ä¸èƒ½è¯æ˜æ— é™æœŸé¢„æµ‹ã€‚è€å¸ˆè¦æ±‚ç»™æ¨æ–­åŠ é€‚ç”¨é™åˆ¶ï¼ŒåŒºåˆ†ç»Ÿè®¡ä»·å€¼ä¸ä»…æœ‰è¶£ã€‚ç»“è®ºå¯ç®—æç¤ºæ€§å´éå®šè®ºï¼ŒèŒƒå›´ä»å¹¿ï¼Œè¾¹ç¼˜å› ç´ ä¹Ÿå¯èƒ½é‡è¦ã€‚ç ”ç©¶åº”å‘ˆç°ä¸ç¡®å®šæ€§ï¼Œä»”ç»†å®¡è¯æ®æ˜¯ä¸ºäº†å‡†ç¡®ã€‚ä»·å€¼ä¸åœ¨å¬æ¥æ·±å¥¥ï¼Œè€Œåœ¨å‡†ç¡®è¯´æ•°æ®æ”¯æŒä»€ä¹ˆã€‚","key":"Its value lies not in sounding formidable but in saying exactly what the data can support. || not in ... but in ... å½¢æˆå¹³è¡ŒåŠ¨åè¯ç»“æ„ã€‚","task":"ä¸€ä¸ªç»“è®ºçš„èŒƒå›´ä¸åº”è¯¥è¶…å‡ºè¯æ®æ‰€èƒ½æ”¯æŒçš„èŒƒå›´ã€‚ || A conclusion should not extend beyond what the evidence can support.","q":"Why might a recorded zero be ambiguous? || It could reflect how a variable was recorded rather than true absence. æ•°æ®éœ€ç»“åˆæµ‹é‡æ–¹å¼ã€‚","note":"","wc":153,"new":["peripheral","notable","fore","qualify","indefinite","nought","simultaneous","deem","global","segment","range","pore","similarity","formidable","peak","span"]},{"id":"96","title":"è´¸æ˜“å¢é•¿ä¸å…¬å…±è´£ä»»","en_title":"Trade and Responsibility","kind":"å†™ä½œÂ·ç»æµå‘å±•","en":"A commonwealth of fictional coastal states sought to expand trade. Its members wanted to combat discrimination, reduce a monopoly's influence, and prevent development from damaging a virgin forest. The plan would elevate incomes only if benefits reached ordinary households.\nThe first proposal overlooked environmental degradation. Extraction of raw materials could deprive a community of clean water, and waste might infect an already polluted stream with harmful microbes. A destructive project could bring a short boom and a disastrous decline. Growth alone was not enough.\nThe states agreed to review each proceeding before approval and publish the terms thereof in accessible language. One group threatened a boycott if consultation was ignored. The debate showed that cooperation requires more than agreeing on an attractive goal. Trade can improve lives, but its design must account for who bears the costs and who receives the gains.","zh":"è™šæ„æ²¿æµ·å›½å®¶è”åˆä½“æƒ³æ‰©è´¸æ˜“ã€åæ­§è§†ã€å‡å„æ–­å½±å“ï¼Œå¹¶é˜²å¼€å‘æŸåŸå§‹æ£®æ—ã€‚æ”¶ç›Šåˆ°æ™®é€šå®¶åº­æ‰æå‡æ”¶å…¥ã€‚åˆæ¡ˆå¿½ç•¥ç¯å¢ƒé€€åŒ–ï¼šå¼€é‡‡å¯èƒ½å‰¥å¤ºç¤¾åŒºæ¸…æ°´ï¼ŒåºŸç‰©å¯æŠŠæœ‰å®³å¾®ç”Ÿç‰©å¸¦å…¥å·²æ±¡æŸ“æºªæµï¼›ç ´åé¡¹ç›®æˆ–å…ˆçŸ­ç¹è£åç¾éš¾è¡°é€€ã€‚å„å›½åŒæ„æ‰¹å‡†å‰å®¡æŸ¥ç¨‹åºï¼Œä»¥æ˜“æ‡‚è¯­è¨€å…¬å¸ƒç›¸å…³æ¡æ¬¾ï¼›å›¢ä½“å¨èƒè‹¥å¿½ç•¥å’¨è¯¢å°±æŠµåˆ¶ã€‚åˆä½œä¸æ­¢åŒæ„æ¼‚äº®ç›®æ ‡ï¼Œè´¸æ˜“åˆ¶åº¦è¦é—®è°æ‰¿æ‹…æˆæœ¬ã€è°å¾—åˆ°æ”¶ç›Šã€‚","key":"Its design must account for who bears the costs and who receives the gains. || account for åä¸¤ä¸ªå®¾è¯­ä»å¥ï¼Œå®Œæ•´åˆ—å‡ºåˆ†é…é—®é¢˜ã€‚","task":"ç»æµå¢é•¿åº”è¯¥å…¼é¡¾å½“åœ°å±…æ°‘ä¸ç¯å¢ƒã€‚ || Economic growth should take local residents and the environment into account.","q":"Why was growth alone insufficient? || It could create environmental harm and unequal costs. å¢é•¿ä¸åˆ†é…ã€ç¯å¢ƒå¹¶éåŒä¸€æŒ‡æ ‡ã€‚","note":"commonwealth åœ¨æ­¤æ˜¯è™šæ„è”åˆä½“çš„è®¾å®šï¼Œä¸æ˜¯å¯¹ç°å®ç»„ç»‡çš„æŠ¥é“ã€‚","wc":142,"new":["disastrous","elevate","thereof","infect","destructive","monopoly","degradation","commonwealth","combat","deprive","virgin","extraction","proceeding","discrimination","boycott"]},{"id":"97","title":"å¦‚ä½•åšæŒä¸€ä¸ªé•¿æœŸé¡¹ç›®","en_title":"Staying with a Project","kind":"å†™ä½œÂ·æ¯…åŠ›ä¸æ–¹æ³•","en":"A long project can overwhelm even an industrious student. My first inclination was to work excessively and disregard rest. The result was not extraordinary productivity but stiffness, fatigue, and a wish to desert the task. I nearly let one difficult week destine the whole project for failure.\nMy tutor suggested a steadier rhythm. I should adhere to a realistic schedule, strive for a clear daily objective, and persist without treating every delay as disgrace. A setback could disillusion me, but it did not have to end the endeavor.\nWe revised the plan and allowed time to elapse between demanding sessions. Ideally, work would finish early; ordinarily, it would require adjustment. I learnt to waver less when a problem appeared and to ask for help before frustration became overwhelming. Determination is not a promise never to hesitate. It is the willingness to resume thoughtfully after difficulty.","zh":"é•¿é¡¹ç›®è¿å‹¤å¥‹å­¦ç”Ÿä¹Ÿä¼šä¸å ªé‡è´Ÿã€‚æˆ‘èµ·åˆè¿‡åº¦å·¥ä½œä¸ä¼‘æ¯ï¼Œç»“æœä¸æ˜¯æƒŠäººæ•ˆç‡ï¼Œè€Œæ˜¯åƒµç¡¬ç–²åŠ³ã€æƒ³æ”¾å¼ƒï¼Œé™©è®©ä¸€å‘¨å›°éš¾å†³å®šé¡¹ç›®å¤±è´¥ã€‚å¯¼å¸ˆå»ºè®®ç¨³å®šèŠ‚å¥ï¼šéµç°å®è®¡åˆ’ï¼Œæ¯å¤©æœ‰ç›®æ ‡ï¼ŒåšæŒä½†ä¸æŠŠå»¶è¯¯å½“è€»è¾±ã€‚æŒ«æŠ˜ä¼šæ‰“ç ´å¹»æƒ³ï¼Œå´ä¸å¿…ç»ˆæ­¢åŠªåŠ›ã€‚æˆ‘ä»¬ä¿®è®¡åˆ’ï¼Œåœ¨é«˜å¼ºåº¦æ—¶æ®µé—´ç•™é—´éš”ã€‚ç†æƒ³ä¸Šæ—©å®Œæˆï¼Œé€šå¸¸ä»éœ€è°ƒæ•´ã€‚æˆ‘å°‘äº›åŠ¨æ‘‡ï¼Œåœ¨æ²®ä¸§å‹å€’è‡ªå·±å‰æ±‚åŠ©ã€‚å†³å¿ƒä¸æ˜¯ä»ä¸çŠ¹è±«ï¼Œè€Œæ˜¯å›°éš¾åå®¡æ…ç»§ç»­ã€‚","key":"Determination is not a promise never to hesitate. || ç”¨ç®€çŸ­å¥æ¾„æ¸…æ¯…åŠ›çš„å«ä¹‰ï¼Œå†æ¥å…·ä½“è§£é‡Šã€‚","task":"åšæŒä¹Ÿéœ€è¦æ ¹æ®å®é™…æƒ…å†µè°ƒæ•´è®¡åˆ’ã€‚ || Persistence also requires adjusting a plan to actual circumstances.","q":"What was wrong with the initial approach? || Excessive work without sufficient rest caused fatigue rather than lasting productivity. æ–¹æ³•ä¸ç»“æœä¸åŒ¹é…ã€‚","note":"","wc":145,"new":["adhere","stiffness","desert","waver","ordinarily","disgrace","inclination","industrious","strive","destine","ideally","disillusion","hesitate","excessively","persist","elapse","endeavor"]},{"id":"98","title":"ç¤¼è²Œæ‹’ç»ä¸åšå®šè¾¹ç•Œ","en_title":"Saying No Clearly","kind":"å¬åŠ›Â·äººé™…æ²Ÿé€š","en":"A classmate was obstinate about borrowing my equipment. He would entreat, implore, and finally plead that I make an exception. I wanted to oblige him, but the device belonged to a team and could not leave the laboratory without authorization.\nI explained the limitation without calling him selfish. He tried to defy the rule, insisting that a small exception was a trifle. I replied that the issue was shared responsibility. A device that went missing would cause more than a troublesome afternoon.\nThe discussion was tense, yet I did not need to slap the table or summon others to shame him. I could remain calm and suggest an approved alternative. A clear boundary need not be hostile. Respectful refusal can protect cooperation when a hasty favour would place other people's work at risk.","zh":"åŒå­¦æ‰§æ„å€Ÿè®¾å¤‡ï¼Œå…ˆæ³æ±‚ã€å†å¤®æ±‚ï¼Œæœ€åè¯·æ±‚ç ´ä¾‹ã€‚æˆ‘æƒ³å¸®ï¼Œä½†è®¾å¤‡å±å›¢é˜Ÿï¼Œæœªç»æˆæƒä¸èƒ½å‡ºå®éªŒå®¤ã€‚æˆ‘è§£é‡Šé™åˆ¶ä¸éª‚è‡ªç§ã€‚ä»–æƒ³è¿è§„åˆ™ï¼Œç§°å°ä¾‹å¤–ä¸å€¼ä¸€æï¼Œæˆ‘è¯´é—®é¢˜æ˜¯å…±åŒè´£ä»»ï¼Œä¸¢è®¾å¤‡å¯ä¸æ­¢éº»çƒ¦ä¸€ä¸‹åˆã€‚è®¨è®ºç´§å¼ ï¼Œä½†ä¸ç”¨æ‹æ¡Œæˆ–å«åˆ«äººç¾è¾±ä»–ï¼Œæˆ‘èƒ½å¹³é™æè·å‡†æ›¿ä»£ã€‚è¾¹ç•Œä¸ä¸€å®šæ•Œå¯¹ï¼Œä»“ä¿ƒå¸®å¿™ä¼šè®©ä»–äººå·¥ä½œå†’é™©æ—¶ï¼Œå°Šé‡çš„æ‹’ç»åèƒ½ä¿æŠ¤åˆä½œã€‚","key":"A clear boundary need not be hostile. || need not è¡¨ç¤ºä¸å¿…ï¼Œå¹¶é must not çš„ç¦æ­¢ã€‚","task":"ç¤¼è²Œæ‹’ç»ä¸ç­‰äºä¸æ„¿åˆä½œã€‚ || A polite refusal does not imply an unwillingness to cooperate.","q":"Why could the device not be lent immediately? || It was shared equipment requiring authorization to leave the lab. è´£ä»»å½’å±å†³å®šè¾¹ç•Œã€‚","note":"","wc":133,"new":["summon","defy","plead","trifle","oblige","implore","troublesome","slap","obstinate","entreat"]},{"id":"99","title":"æ—§å¹¿å‘Šä¸ç°ä»£è¯»è€…","en_title":"Reading an Old Advertisement","kind":"é˜…è¯»Â·è¯­è¨€å˜åŒ–","en":"A periodical from an earlier epoch advertised a classic household product. It promised everlasting softness and a solution to every cleaning problem. One page displayed a primitive tool; another claimed a modern process would make every stain disappear. The teacher asked us to distinguish persuasive language from reliable evidence.\nWe examined the word \"smart\" and compared its meanings in several contexts. A fashionable appearance and a useful technological feature were not identical. Nor did a noted inventor's endorsement guarantee a product's success. The advertisement's simplicity concealed unanswered questions.\nThe exercise was an apt introduction to critical reading. A claim may be memorable without being sound. Before deciding to subscribe to a service or buy a product, a reader should examine its specific promise, the evidence offered, and the conditions under which that promise could hold.","zh":"æ—§æ—¶ä»£æœŸåˆŠå®£ä¼ ç»å…¸å®¶ç”¨å“ï¼Œæ‰¿è¯ºæ°¸æ’æŸ”è½¯ã€è§£å†³ä¸€åˆ‡æ¸…æ´é—®é¢˜ã€‚ä¸€é¡µå±•ç¤ºç®€é™‹å·¥å…·ï¼Œå¦ä¸€é¡µç§°ç°ä»£å·¥è‰ºè®©æ‰€æœ‰æ±¡æ¸æ¶ˆå¤±ã€‚è€å¸ˆè¦æ±‚åŒºåˆ†åŠæœè¯­è¨€ä¸å¯é è¯æ®ã€‚å¤§å®¶æ¯”è¾ƒ smart åœ¨ä¸åŒè¯­å¢ƒçš„æ„ä¹‰ï¼šæ—¶é«¦å¤–è¡¨ä¸æœ‰ç”¨ç§‘æŠ€åŠŸèƒ½ä¸åŒï¼ŒçŸ¥åå‘æ˜è€…èƒŒä¹¦ä¹Ÿä¸ä¿è¯æˆåŠŸã€‚å¹¿å‘Šç®€æ´å´éšè—æœªç­”é—®é¢˜ã€‚è¿™æ˜¯æ‰¹åˆ¤é˜…è¯»çš„æ°å½“å¼•å…¥ï¼šä¸»å¼ å¥½è®°æœªå¿…å¯é ã€‚è®¢æœåŠ¡æˆ–ä¹°å•†å“å‰ï¼Œåº”çœ‹å…·ä½“æ‰¿è¯ºã€è¯æ®ä¸é€‚ç”¨æ¡ä»¶ã€‚","key":"A claim may be memorable without being sound. || may ä¸ without å…±åŒè¡¨ç¤ºä¸¤ç§æ€§è´¨ä¸å¿…ç›¸ä¼´ã€‚","task":"å¹¿å‘Šçš„å¸å¼•åŠ›ä¸èƒ½ä»£æ›¿äº§å“æ€§èƒ½çš„è¯æ®ã€‚ || An advertisement's appeal cannot replace evidence of a product's performance.","q":"What did the advertisement's simplicity conceal? || Unanswered questions about evidence and conditions. ç®€æ´ä¸ä»£è¡¨å®Œæ•´ã€‚","note":"","wc":135,"new":["noted","primitive","everlasting","softness","apt","periodical","classic","subscribe","simplicity","smart","epoch"]},{"id":"100","title":"ä¸€åº§åŸå¸‚çš„æ—§ç…§ç‰‡","en_title":"A City in Photographs","kind":"ç¿»è¯‘Â·åŸå¸‚ä¸è®°å¿†","en":"The exhibition placed an old photograph beside a recent one. A mighty bridge now crossed the river, and new buildings seemed to spring from every vacant plot. Yet the curator did not herald every change as progress. The disappearance of a familiar lane could bring both convenience and loss.\nIn the older image, a woman stood beside a cradle while a worker pulled a cart. A narrow path led to a small house. In the newer one, a broad road occupied the same spatial position. The contrast brought changes in everyday life into focus.\nVisitors were invited to meditate on what the city should preserve. Nostalgia alone could not answer that question, but neither could an account concerned only with growth. A city is more than a collection of structures. Its evolution also involves memory, relationships, and the ways people learn to share space.","zh":"å±•è§ˆå¹¶åˆ—æ—§ç…§æ–°ç…§ã€‚å¤§æ¡¥è·¨æ²³ï¼Œæ–°æ¥¼ä»ç©ºåœ°æ¶Œèµ·ï¼Œç­–å±•äººå´æ²¡æŠŠæ¯ä¸ªå˜åŒ–éƒ½ç§°è¿›æ­¥ï¼šç†Ÿæ‚‰å°å··æ¶ˆå¤±å¯èƒ½å…¼æœ‰ä¾¿åˆ©ä¸å¤±è½ã€‚æ—§ç…§å¥³äººç«™æ‘‡ç¯®æ—ã€å·¥äººæ‹‰è½¦ï¼Œçª„é“é€šå°å±‹ï¼Œæ–°ç…§åŒä½ç½®æ˜¯å®½è·¯ï¼Œå¯¹æ¯”å‡¸æ˜¾ç”Ÿæ´»å˜åŒ–ã€‚æ¸¸å®¢è¢«é‚€æ€è€ƒåŸå¸‚è¯¥ä¿ç•™ä»€ä¹ˆï¼Œæ€€æ—§ä¸èƒ½ç‹¬è‡ªå›ç­”ï¼Œä½†åªè°ˆå¢é•¿ä¹Ÿä¸å¤Ÿã€‚åŸå¸‚ä¸åªæ˜¯å»ºç­‘é›†åˆï¼Œæ¼”å˜è¿˜æ¶‰åŠè®°å¿†ã€å…³ç³»ä¸å…±äº«ç©ºé—´æ–¹å¼ã€‚","key":"A city is more than a collection of structures. || more than è¡¨ç¤ºä¸åªæ˜¯ï¼Œå¯å¼•å‡ºç¤¾ä¼šä¸æ–‡åŒ–ç»´åº¦ã€‚","task":"åŸå¸‚çš„å‘å±•ä¹Ÿåº”å…³æ³¨å±…æ°‘çš„è®°å¿†ä¸å…³ç³»ã€‚ || Urban development should also consider residents' memories and relationships.","q":"Did the curator describe every change as progress? || No. Some changes brought loss as well as convenience. è¯„ä»·æœ‰ä¸¤é¢ã€‚","note":"","wc":144,"new":["cradle","disappearance","mighty","spatial","evolution","herald","meditate"]},{"id":"101","title":"æ¼”å‘˜æ€æ ·è¡¨è¾¾æƒ…ç»ª","en_title":"Acting without Exaggeration","kind":"å¬åŠ›Â·åŠ¨ä½œä¸æƒ…ç»ª","en":"During her maiden performance, an actress had to play a frightened traveller. Her first attempt was extraordinarily loud. She would pant, stagger, and quiver, then cry, \"Alas, what awful news!\" The director asked her to reconsider. A frightened person might become mute or speak in a hoarse whisper; fear did not always require a violent outburst.\nThe next scene involved a wretched character unable to escape a memory. His torment interrupted his slumber, and he spoke of endless woe. The actor wanted to smash a prop and shatter a glass. The director substituted safe sound effects and asked him to express the conflict through posture.\nHitherto, the group had treated strong emotion as a reason to shout. Now they learnt that stillness could be equally powerful. Their muse was ordinary observation. The scene became more convincing when the actors stopped trying to display every possible feeling at once. Less movement did not mean less meaning.","zh":"é¦–æ¬¡æ¼”å‡ºä¸­ï¼Œå¥³æ¼”å‘˜æ‰®å—æƒŠæ—…äººã€‚å¥¹èµ·åˆæ ¼å¤–å“äº®ï¼šå–˜æ°”ã€è¸‰è·„ã€å‘æŠ–ï¼Œå†å–Šâ€œå”‰ï¼Œå¤šå¯æ€•çš„æ¶ˆæ¯ï¼â€å¯¼æ¼”è®©é‡æƒ³ï¼šå—æƒŠè€…ä¹Ÿå¯èƒ½æ²‰é»˜æˆ–å˜¶å“‘ä½è¯­ï¼Œå¹¶éæ€»çŒ›çƒˆçˆ†å‘ã€‚ä¸‹ä¸€è§’è‰²è¢«è®°å¿†æŠ˜ç£¨ï¼Œç¡çœ å—æ‰°ï¼Œå€¾è¯‰æ— å°½æ‚²å“€ã€‚æ¼”å‘˜æƒ³ç ¸é“å…·ä¸ç»ç’ƒï¼Œå¯¼æ¼”æ¢å®‰å…¨éŸ³æ•ˆï¼Œè¯·ä»–ç”¨å§¿åŠ¿è¡¨è¾¾å†²çªã€‚æ­¤å‰å¤§å®¶æŠŠå¼ºæƒ…ç»ªå½“å¤§å–Šç†ç”±ï¼Œå¦‚ä»Šå­¦ä¼šé™æ­¢ä¹Ÿæœ‰åŠ›é‡ã€‚çµæ„Ÿæ¥è‡ªæ—¥å¸¸è§‚å¯Ÿï¼Œä¸åŒæ—¶å±•ç¤ºä¸€åˆ‡æƒ…ç»ªåä½¿åœºæ™¯å¯ä¿¡ã€‚åŠ¨ä½œå°‘ä¸ç­‰äºæ„ä¹‰å°‘ã€‚","key":"Less movement did not mean less meaning. || å¹³è¡Œæ¯”è¾ƒå½¢å¼è¡¨è¾¾æ•°é‡ä¸æ•ˆæœä¸èƒ½ç®€å•ç­‰åŒã€‚","task":"å¼ºçƒˆçš„æƒ…ç»ªä¹Ÿå¯ä»¥é€šè¿‡å®‰é™çš„æ–¹å¼è¡¨è¾¾ã€‚ || Strong emotions can also be expressed quietly.","q":"What changed the actors' approach? || They learnt that stillness could convey emotion as powerfully as shouting. è¡¨è¾¾æ‰‹æ®µä¸åªæœ‰éŸ³é‡ã€‚","note":"maiden è¡¨ç¤ºé¦–æ¬¡çš„ï¼Œä¿®é¥° performanceï¼›muse è¡¨ç¤ºçµæ„Ÿæ¥æºã€‚","wc":155,"new":["awful","torment","slumber","maiden","mute","pant","hitherto","stagger","violent","shatter","extraordinarily","smash","muse","wretched","woe","alas","hoarse","quiver"]},{"id":"102","title":"ç»´ä¿®æ—¥çš„å‡†å¤‡ä¸æ”¶å°¾","en_title":"Preparing for a Repair Day","kind":"å¬åŠ›Â·åŠ³åŠ¨ä¸ç»´æŠ¤","en":"Before volunteers arrived, staff would erect a sign and inspect a damaged bench. A bump on its surface could catch a sleeve. An old hook needed replacing, and the printer required a new cartridge. The caretaker asked us to leave a lifting jack to trained workers and report any mechanical jam.\nWe cleaned dirt without treating every surface alike. A label warned that bleach could damage one material. Another object showed decay, not merely filth. We learnt to wipe a spill, wring a cloth, and flush a dirty channel only as instructed. Nobody should grind a sharp edge without the right training.\nOutside, a contractor examined old tar on the path. The remainder of the team sorted reusable materials. Maintenance involved knowing what to do, what to inspect, and when to seek expertise. The lesson was practical: preserving useful things requires attention both before work begins and after the tools are put away.","zh":"å¿—æ„¿è€…åˆ°å‰ï¼Œå‘˜å·¥ç«‹å‘Šç¤ºã€æŸ¥ç ´å‡³ã€‚å‡¸èµ·å¯èƒ½å‹¾è¢–ï¼Œæ—§é’©éœ€æ¢ï¼Œæ‰“å°æœºéœ€æ–°å¢¨ç›’ã€‚ç®¡ç†å‘˜è¦æ±‚åƒæ–¤é¡¶äº¤å—è®­è€…ï¼Œæœºæ¢°å¡ä½å°±æŠ¥å‘Šã€‚æ¸…æ´è¦åŒºåˆ«è¡¨é¢ï¼šæ¼‚ç™½å‰‚ä¼šæŸæŸææ–™ï¼Œå¦ä¸€ç‰©ä»¶æ˜¯è…æœ½ä¸åªæ˜¯è„ã€‚å¤§å®¶æŒ‰æŒ‡å¼•æ“¦æº¢å‡ºç‰©ã€æ‹§å¸ƒã€å†²è„æ§½ï¼Œä¸æ“…ç£¨é”è¾¹ã€‚å¤–é¢æ‰¿åŒ…äººæŸ¥è·¯ä¸Šæ—§æ²¥é’ï¼Œå…¶ä½™äººåˆ†ç±»å¯å¤ç”¨ææ–™ã€‚ç»´æŠ¤éœ€çŸ¥é“åšä»€ä¹ˆã€æŸ¥ä»€ä¹ˆã€ä½•æ—¶æ±‚ä¸“ä¸šå¸®åŠ©ï¼Œå¼€å·¥å‰å’Œæ”¶å·¥å…·åéƒ½è¦ç”¨å¿ƒã€‚","key":"Maintenance involved knowing what to do, what to inspect, and when to seek expertise. || ä¸‰ä¸ªç–‘é—®è¯åŠ ä¸å®šå¼å¹¶åˆ—ï¼Œç»„ç»‡è¡ŒåŠ¨æ­¥éª¤ã€‚","task":"ç»´æŠ¤å·¥ä½œéœ€è¦é€‚å½“çš„çŸ¥è¯†å’Œå‡†å¤‡ã€‚ || Maintenance requires appropriate knowledge and preparation.","q":"Was every dirty-looking surface treated in the same way? || No. Some materials could be damaged, and some objects showed decay. åŒºåˆ†æè´¨ä¸æŸåç±»å‹ã€‚","note":"","wc":153,"new":["bump","grind","hook","flush","filth","erect","decay","remainder","jack","bleach","wring","jam","cartridge","tar"]},{"id":"103","title":"è¿åŠ¨ä¼šä¸Šçš„å°æ’æ›²","en_title":"An Incident at Sports Day","kind":"å¬åŠ›Â·æ ¡å›­æ´»åŠ¨","en":"Our class was bound for the field when two pupils almost collided at a doorway. The teacher explained that people can collide even without moving quickly if everyone tries to pass at once. He asked us to form a row, keep an elbow away from others, and watch the slippery slide.\nA mischievous child tried to wink at his friend during the instructions. His playful wink was not itself a problem, but he was about to stray onto a wet area. The teacher chose to intervene calmly. Mischief did not require a dramatic punishment; safety did require attention.\nLater, we watched a horse trot in a supervised demonstration. A cold wind brought a chill, so the group moved indoors to quench its thirst. Nobody made a fuss about the change. The event was memorable because staff combined clear boundaries with kindness. They did not confuse an energetic child with a troublesome one.","zh":"å»æ“åœºæ—¶ä¸¤å­©å­é™©åœ¨é—¨å£ç›¸æ’ã€‚è€å¸ˆè§£é‡Šï¼Œä¸€æ‹¥è€Œè¿‡å³ä½¿ä¸å¿«ä¹Ÿä¼šç¢°æ’ï¼Œè¦æ±‚æ’é˜Ÿã€è‚˜åˆ«ç¢°äººã€å°å¿ƒæ»‘æ¢¯ã€‚æ·˜æ°”å­©å­å‘æœ‹å‹çœ¨çœ¼ï¼Œçœ¨çœ¼æœ¬èº«æ— å¦¨ï¼Œä½†ä»–å¿«è¯¯å…¥æ¹¿åœ°ã€‚è€å¸ˆå¹³é™ä»‹å…¥ï¼šè°ƒçš®ä¸éœ€å¤§æƒ©ç½šï¼Œå®‰å…¨å´éœ€æ³¨æ„ã€‚åæ¥å¤§å®¶çœ‹å—ç›‘ç£çš„é©¬å°è·‘æ¼”ç¤ºã€‚å†·é£å¸¦å¯’æ„ï¼Œç¾¤ä½“è¿›å±‹è§£æ¸´ï¼Œæ²¡äººä¸ºå˜åŒ–å¤§æƒŠå°æ€ªã€‚æ´»åŠ¨éš¾å¿˜å› å·¥ä½œäººå‘˜æŠŠæ˜ç¡®ç•Œé™ä¸å–„æ„ç»“åˆï¼Œæ²¡æŠŠæ´»æ³¼ç­‰åŒéº»çƒ¦ã€‚","key":"They did not confuse an energetic child with a troublesome one. || confuse A with B è¡¨ç¤ºæŠŠä¸¤è€…æ··æ·†ã€‚","task":"æ¸…æ¥šçš„è§„åˆ™å¯ä»¥ä¸å‹å–„çš„æ€åº¦å¹¶å­˜ã€‚ || Clear rules can coexist with a kind attitude.","q":"Why did the group move indoors? || A cold wind brought a chill. å¤©æ°”å˜åŒ–å¼•å‡ºåœ°ç‚¹è°ƒæ•´ã€‚","note":"","wc":152,"new":["wink","elbow","bound","wind","quench","mischief","collide","stray","fuss","slide","intervene","chill","row","trot"]},{"id":"104","title":"ä¿¡æ¯ä¼ æ’­ä¸åˆ¤æ–­","en_title":"How a Claim Travels","kind":"é˜…è¯»Â·ç ”ç©¶ä¸åª’ä»‹","en":"The circulation of a striking story can outpace its verification. In our project, we examined the propagation of a claim across a cluster of accounts. Its incidence increased sharply after one popular post, but popularity did not establish truth. We had to examine the representation of events and the possibility of fabrication.\nThe analysis was subject to clear limits. A missing record could make a conclusion invalid, while an apparently uniform pattern might conceal distinct groups. We could not assume that people responded uniformly or invariably shared the same motive. Nor did a negative comment prove hostility.\nWe distinguished reach from penetration into a particular audience. A story could be seen by many people yet understood by few. The result was a useful lesson in public consciousness: exposure does not automatically produce understanding. Before deciding what a message achieves, researchers must ask who encountered it, how they interpreted it, and what evidence supports the conclusion.","zh":"é†’ç›®æ•…äº‹ä¼ æ’­å¯èƒ½å¿«äºæ ¸å®ã€‚é¡¹ç›®è€ƒå¯Ÿä¸»å¼ è·¨è´¦å·ç¾¤ä¼ æ’­ï¼Œçƒ­é—¨å¸–åå‡ºç°ç‡å‡é«˜ï¼Œä½†æµè¡Œä¸è¯æ˜çœŸç›¸ï¼Œéœ€æŸ¥äº‹ä»¶å‘ˆç°åŠç¼–é€ å¯èƒ½ã€‚åˆ†ææœ‰é™åˆ¶ï¼šç¼ºè®°å½•å¯èƒ½ä½¿ç»“è®ºæ— æ•ˆï¼Œè¡¨é¢ç»Ÿä¸€æ¨¡å¼å¯èƒ½è—ä¸åŒç¾¤ä½“ï¼Œä¸èƒ½å‡è®¾äººååº”ä¸€è‡´ã€åŠ¨æœºæ€»ç›¸åŒï¼Œè´Ÿé¢è¯„è®ºä¹Ÿä¸è¯æ˜æ•Œæ„ã€‚æˆ‘ä»¬åŒºåˆ†è§¦åŠäººæ•°ä¸åœ¨ç‰¹å®šå—ä¼—ä¸­çš„æ·±å…¥ç¨‹åº¦ï¼šå¤šäººè§å´å°‘äººæ‡‚ã€‚å…¬ä¼—è®¤çŸ¥æé†’ï¼Œæ¥è§¦ä¸è‡ªåŠ¨äº§ç”Ÿç†è§£ï¼Œè¯„ä»·ä¿¡æ¯æ•ˆæœè¦é—®è°æ¥è§¦ã€å¦‚ä½•è§£è¯»ã€è¯æ®æ˜¯ä»€ä¹ˆã€‚","key":"Exposure does not automatically produce understanding. || ç®€æ´å› æœå¦å®šï¼Œé€‚åˆè®¨è®ºä¿¡æ¯ã€æ•™è‚²å’Œä¼ æ’­ã€‚","task":"ä¿¡æ¯ä¼ æ’­å¹¿æ³›ï¼Œå¹¶ä¸æ„å‘³ç€å®ƒè¢«å‡†ç¡®ç†è§£ã€‚ || Wide circulation of information does not mean that it is accurately understood.","q":"Why was reach distinguished from understanding? || Many people might see a story while few understand it accurately. æ¥è§¦ä¸ç†è§£æ˜¯ä¸åŒæŒ‡æ ‡ã€‚","note":"","wc":155,"new":["fabrication","consciousness","cluster","circulation","uniformly","subject","representation","negative","propagation","incidence","distinct","penetration","invariably","invalid"]},{"id":"105","title":"åº¦å‡è®¡åˆ’ä¸­çš„å–èˆ","en_title":"Choosing a Short Break","kind":"å¬åŠ›Â·è®¡åˆ’ä¸åå¥½","en":"My friend wanted to immerse herself in a new place, whilst I preferred a quiet break. We nearly let that contrast become a clash. She proposed a strenuous tramp through hills; I feared the walk would devour our limited time and leave no room to rest.\nWe agreed not to gamble on an unrealistic timetable. A morning visit could precede an afternoon near the coast. I could indulge in reading, while she could explore nearby paths. We would not claim that one preference was more sensible in every case. Nor would we let stubborn insistence turn a holiday into strife.\nThe compromise pleased us both. I learnt that a plan can have direction without being rigid. My friend learnt that rest need not be laziness. Shared travel requires a willingness to embrace another person's priorities without abandoning one's own. A small adjustment can preserve both cooperation and enjoyment.","zh":"æœ‹å‹æƒ³æ²‰æµ¸æ–°åœ°æ–¹ï¼Œæˆ‘æƒ³å®‰é™ä¼‘æ¯ï¼Œå·®å¼‚é™©æˆå†²çªã€‚å¥¹æè®®å±±é—´é•¿é€”è·‹æ¶‰ï¼Œæˆ‘æ€•è€—å°½æ—¶é—´ä¸èƒ½ä¼‘æ¯ã€‚åŒæ–¹ä¸æ‹¿ä¸ç°å®æ—¥ç¨‹å†’é™©ï¼Œä¸Šåˆå‚è§‚ã€ä¸‹åˆæµ·è¾¹ï¼Œæˆ‘äº«é˜…è¯»ï¼Œå¥¹èµ°é™„è¿‘å°å¾„ã€‚ä¸è¯´æŸåå¥½æ€»æ›´åˆç†ï¼Œä¹Ÿä¸æ‰§æ‹—åˆ°åº¦å‡å˜äº‰æ–—ã€‚æŠ˜ä¸­è®©ä¸¤äººæ»¡æ„ï¼šè®¡åˆ’å¯æœ‰æ–¹å‘è€Œä¸åƒµç¡¬ï¼Œä¼‘æ¯ä¸ä¸€å®šæ‡’ã€‚ç»“ä¼´æ—…è¡Œéœ€æ¥çº³ä»–äººä¼˜å…ˆäº‹é¡¹è€Œä¸æ”¾å¼ƒè‡ªèº«ï¼Œå°è°ƒæ•´èƒ½ä¿åˆä½œä¸ä¹è¶£ã€‚","key":"A plan can have direction without being rigid. || without + åŠ¨åè¯ï¼Œè¡¨ç¤ºç›®æ ‡ä¸çµæ´»æ€§å¯ä»¥å…¼å®¹ã€‚","task":"åˆä½œéœ€è¦è®¤çœŸè€ƒè™‘ä¸åŒçš„ä¼˜å…ˆäº‹é¡¹ã€‚ || Cooperation requires taking different priorities seriously.","q":"What compromise did the friends make? || A morning visit and an afternoon allowing different activities near the coast. å…±åŒè®¡åˆ’ä¿ç•™ä¸ªäººç©ºé—´ã€‚","note":"","wc":148,"new":["stubborn","devour","whilst","clash","indulge","gamble","strife","immerse","embrace","tramp"]},{"id":"106","title":"è®²æ¸…æ¥šè€Œä¸æ˜¯è¯´æ¼‚äº®","en_title":"A Talk That Changed Direction","kind":"å†™ä½œÂ·è¡¨è¾¾ä¸é€»è¾‘","en":"My first talk was a bore: it sounded elaborate but gave listeners little to use. I had mistaken simplicity for ignorance and filled the slides with vague claims. A peer asked what I actually meant. That commonsense question changed the presentation.\nI removed an improper comparison and explained why one inference was only tentative. Inasmuch as the evidence was incomplete, I could not claim certainty. Notwithstanding that limitation, the project still offered a useful insight. I would not say the result was incredible or doubtless correct merely to impress.\nI also replaced \"male versus female abilities\" with a more precise question about expectations. Describing a role as masculine or feminine did not prove that anyone was naturally suited to it. The improved talk avoided an empty opposition and offered a clear argument. Careful wording can help listeners think rather than simply persuade them to agree.","zh":"é¦–æ¬¡æ¼”è®²æ¯ç‡¥ï¼šå¬ç€ç²¾å·§å´æ— å®ç”¨å†…å®¹ã€‚æˆ‘æŠŠç®€å•å½“æ— çŸ¥ï¼Œå¹»ç¯ç‰‡æ»¡ç©ºè¯ã€‚åŒä¼´é—®åˆ°åº•ä»€ä¹ˆæ„æ€ï¼Œè¿™ä¸ªå¸¸è¯†é—®é¢˜æ”¹å˜æŠ¥å‘Šã€‚æˆ‘åˆ ä¸å½“æ¯”è¾ƒï¼Œè§£é‡Šæ¨æ–­æš‚å®šã€‚ç”±äºè¯æ®ä¸å…¨ï¼Œä¸èƒ½ç§°ç¡®å®šï¼›å°½ç®¡æœ‰é™åˆ¶ï¼Œä»æœ‰å¯å‘ã€‚ä¸ä¸ºè®¨å¥½å°±è¯´ç»“æœä¸å¯æ€è®®æˆ–æ— ç–‘æ­£ç¡®ã€‚è¿˜æŠŠâ€œç”·å¥³èƒ½åŠ›å¯¹æŠ—â€æ”¹ä¸ºæ›´å‡†ç¡®çš„ç¤¾ä¼šæœŸå¾…é—®é¢˜ï¼šè§’è‰²è¢«ç§°ç”·æ€§åŒ–æˆ–å¥³æ€§åŒ–ï¼Œä¸è¯æ˜è°å¤©ç”Ÿé€‚åˆã€‚å¥½æªè¾å¸®åŠ©å¬è€…æ€è€ƒï¼Œè€ŒéåªåŠåŒæ„ã€‚","key":"Inasmuch as the evidence was incomplete, I could not claim certainty. || inasmuch as è¡¨ç¤ºå› ä¸ºï¼Œè¾ƒæ­£å¼ï¼›æ—¥å¸¸ä½œæ–‡ç”¨ because ä¹Ÿè‡ªç„¶ã€‚","task":"å‡†ç¡®è¡¨è¾¾æ¯”å¤¸å¤§ç»“è®ºæ›´æœ‰è¯´æœåŠ›ã€‚ || Accurate expression is more persuasive than overstating a conclusion.","q":"What changed the presentation? || A peer's question about what the speaker actually meant. æ¸…æ™°é—®é¢˜ä¿ƒæˆå…·ä½“åŒ–ã€‚","note":"inasmuch as / notwithstanding å±è¾ƒæ­£å¼è¡¨è¾¾ã€‚æ¸…æ¥šè‡ªç„¶æ—¶ï¼Œbecause / despite å¾€å¾€å·²ç»è¶³å¤Ÿã€‚","wc":145,"new":["commonsense","inasmuch","ignorance","doubtless","bore","feminine","peer","incredible","masculine","notwithstanding","improper","versus"]},{"id":"107","title":"è®°å½•ä¸€ä¸ªé¡¹ç›®çš„å˜åŒ–","en_title":"Keeping a Useful Project Log","kind":"é˜…è¯»Â·è¿æ¥è¯ä¸æ—¶é—´","en":"Our project log stated that work was currently behind schedule. Hitherto, the team had relied on informal updates. Henceforth, each member would record progress weekly. The first review identified a delay; subsequently, we revised the timetable. Thereafter, reports became more consistent.\nThe log was useful because it explained decisions, not just dates. A note might say that a change could pose a risk or that a resource was on the verge of running out. Another would explain why an apparently easy solution had proved of no avail. A summary referred to a problem and the lessons contained therein.\nFormal connectors should clarify relationships, not decorate a paragraph. Incidentally, an extra fact belongs only where it helps the reader. A record becomes confusing when every sentence sounds official but no one can tell what happened. The best account lets readers trace a decision, understand its reason, and see what followed.","zh":"é¡¹ç›®æ—¥å¿—å†™å·¥ä½œç›®å‰è½åã€‚æ­¤å‰é éæ­£å¼æ›´æ–°ï¼Œæ­¤åæ¯äººæ¯å‘¨è®°è¿›å±•ã€‚é¦–è½®å®¡æŸ¥å‘ç°å»¶è¯¯ï¼Œéšåæ”¹æ—¶é—´è¡¨ï¼Œæ­¤åæŠ¥å‘Šæ›´ä¸€è‡´ã€‚æ—¥å¿—æœ‰ç”¨å› è§£é‡Šå†³å®šä¸åªè®°æ—¥æœŸï¼šå˜åŒ–å¯èƒ½å¸¦é£é™©ï¼Œèµ„æºæ¿’ä¸´ç”¨å°½ï¼Œçœ‹ä¼¼ç®€å•æ–¹æ¡ˆæ— æ•ˆï¼Œæ‘˜è¦æåˆ°é—®é¢˜åŠå…¶ä¸­æ•™è®­ã€‚æ­£å¼è¿æ¥è¯åº”è¯´æ˜å…³ç³»è€Œéè£…é¥°ã€‚é¡ºå¸¦äº‹å®åªæœ‰å¸®åŠ©è¯»è€…æ‰å€¼å¾—æ”¾ã€‚æ¯å¥å®˜è…”å´ä¸çŸ¥å‘ç”Ÿä»€ä¹ˆåªä¼šå›°æƒ‘ï¼Œæœ€ä½³è®°å½•èƒ½è¿½å†³å®šã€æ˜åŸå› ã€è§åæœã€‚","key":"Formal connectors should clarify relationships, not decorate a paragraph. || clarify relationships å¯è¿ç§»åˆ°å†™ä½œå»ºè®®ï¼›é¿å…å †ç Œè¿æ¥è¯ã€‚","task":"å¥½çš„è®°å½•åº”è¯¥æ¸…æ¥šè¯´æ˜å†³å®šçš„åŸå› ã€‚ || A good record should clearly explain the reasons behind decisions.","q":"Why was the log useful? || It explained decisions rather than merely listing dates. ä¿¡æ¯ä¹‹é—´æœ‰æ¸…æ™°å…³ç³»ã€‚","note":"hithertoã€henceforthã€thereafterã€therein ç”¨äºè¾¨è®¤æ­£å¼æ–‡æœ¬ï¼Œå†™ä½œæ–‡ä¸å¿…æˆä¸²ä½¿ç”¨ã€‚","wc":149,"new":["therein","avail","subsequently","currently","henceforth","incidentally","thereafter","verge","pose"]},{"id":"108","title":"è®²è¿°å˜åŒ–çš„ç§‘æ™®ä½œè€…","en_title":"Explaining Change to the Public","kind":"é˜…è¯»Â·ç§‘å­¦ä¼ æ’­","en":"An author used an elemental example to explain a complex process. A growing plant could originate from a tiny seed, yet its development depended on many conditions. Readers should not confuse a simple starting point with a simple outcome.\nThe author compared the example with a different system, carefully noting where the analogy would deviate from reality. She refused to let a memorable image perplex readers about the underlying science. A spectacular claim might attract attention, but sheer novelty did not make it true.\nThe final chapter urged readers to remain curious. They could marvel at a discovery without attributing it to superstition. They could acknowledge a mystery without assuming that it would remain forever unexplained. Scientific communication succeeds when it preserves wonder while making the limits of knowledge visible. An explanation can be both accessible and intellectually honest.","zh":"ä½œè€…ç”¨åŸºæœ¬ä¾‹å­è¯´æ˜å¤æ‚è¿‡ç¨‹ï¼šæ¤ç‰©å¯æ¥è‡ªå°ç§å­ï¼Œä½†å‘å±•ä¾èµ–å¤šæ¡ä
