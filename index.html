<script>
const U=[{"id":"01","title":"让大学学习有方向","en_title":"Learning with a Purpose","kind":"写作·教育与成长","en":"Initially, many students regard a diploma as their ultimate objective. Yet a qualification is only one component of an education. What matters more is whether learners can interpret a difficult paragraph, formulate a coherent argument, and apply an abstract concept to a realistic situation. A good instructor will therefore encourage a student to question an assumption, clarify a notion, and distinguish an apparent fact from a reasonable inference.\nAt our college, each participant must undertake a small research project. Students first prepare an outline, then develop a hypothesis and gather empirical evidence. They submit a draft to a tutor, who may reject a superficial explanation but will offer constructive counsel. A scholarship rewards persistence and integrity as well as achievement. The dean hopes that this systematic approach will broaden students' intellectual interests. Not only does purposeful study deepen understanding, but it also gives learners the confidence to tackle unfamiliar problems. A university should cultivate independent judgment rather than make perfection its only criterion of success.","zh":"起初，许多学生把文凭看作教育的最终目标。然而，资格证书只是教育的一部分。更重要的是，学习者能否解读难懂的段落、组织连贯的论证，并把抽象概念应用于真实情境。因此，优秀的教师会鼓励学生质疑假设、澄清概念，区分表面事实与合理推断。在我们学校，每位参与者都必须承担一个小型研究项目：先拟提纲，再提出假说并收集实证材料。学生向导师提交初稿，导师可能否定肤浅的解释，但会提供建设性建议。奖学金既奖励成绩，也奖励坚持与诚信。院长希望这种系统的方法拓宽学生的学术兴趣。有目的的学习不仅加深理解，也让学习者有信心处理陌生问题。大学应培养独立判断力，而不应把完美作为成功的唯一标准。","key":"Not only does purposeful study deepen understanding, but it also gives learners the confidence to tackle unfamiliar problems. || not only 置于句首，第一分句部分倒装，but also 后正常语序。迁移：Not only does regular practice improve accuracy, but it also builds confidence.","task":"大学应该鼓励学生质疑假设，而不是简单地接受信息。 || Universities should encourage students to question assumptions rather than simply accept information.","q":"What does the scholarship reward besides achievement? || Persistence and integrity. 文中 as well as 将三项奖励依据并列。","note":"qualification 在本文前半部分指资格；第 04 篇结尾指限制条件。dignity 是名词，原表第 1 页的形容词标注有误。","wc":165,"new":["initially","qualification","can","instructor","coherent","undertake","formulate","scholarship","paragraph","realistic","apparent","question","inference","gather","what","confidence","distinguish","develop","reject","counsel","difficult","abstract","empirical","perfection","interpret","tackle","tutor","persistence","hypothesis","deepen","ultimate","outline","notion","offer","systematic","integrity","participant","assumption","objective","superficial","criterion","diploma","should","situation","dean","broaden"]},{"id":"02","title":"从背词到主动运用","en_title":"From Vocabulary to Communication","kind":"写作·学习方法","en":"A vocabulary notebook is useful only if its owner knows how to use it. Mei used to reproduce a glossary word for word, hoping that mechanical repetition would make her proficient. Her vocabulary grew, but her proficiency in conversation remained limited. Then she began to integrate reading, writing, and oral practice into a daily routine.\nFor each entry, she would note its usage, underline a natural phrase, and compose a short message. She would also consult a handbook when an abbreviation or an obscure expression caused confusion. Instead of treating every translation as literal, she considered the context and the writer's intent. A familiar word could carry a distinctly different meaning in a novel or an editorial. She learnt to modulate her voice, check the vowel sounds, and vary her intonation. She would record a presentation, replay it, and rectify one recurring error at a time. The more actively she used a word, the easier it became to recall. Her progress was gradual, yet the method proved far more productive than an ambitious plan she could not maintain.","zh":"词汇笔记只有在主人知道如何使用时才有价值。梅过去逐字抄写词汇表，希望机械重复能让自己熟练掌握英语。她的词汇量增长了，口语熟练度却仍然有限。后来，她把阅读、写作和口头练习融入日常安排。每个词条，她都记录用法，画出自然搭配，并写一则短信息。遇到缩写或晦涩表达时，她查阅手册。她不再把所有翻译都视为逐字对应，而是考虑语境和作者意图。熟词在小说或社论中可能有明显不同的含义。她学习调节声音、检查元音并改变语调，还会录下自己的发言，重听后每次纠正一个反复出现的错误。一个词用得越主动，回忆起来就越容易。虽然进步缓慢，这种方法却比无法坚持的宏大计划更有效。","key":"The more actively she used a word, the easier it became to recall. || the + 比较级，the + 比较级，表示两个变化相互关联。迁移：The more carefully we plan, the less time we waste.","task":"只有把新词用在具体语境中，我们才能更牢固地记住它们。 || Only when we use new words in specific contexts can we remember them more securely.","q":"Why did Mei change her method? || Her growing vocabulary had not led to comparable progress in conversation. 注意词汇量与运用能力之间的转折。","note":"","wc":178,"new":["check","underline","vowel","intonation","ambitious","obscure","novel","distinctly","usage","literal","entry","modulate","proficient","proficiency","handbook","integrate","productive","editorial","context","routine","message","intent","carry","rectify","presentation","abbreviation","reproduce","glossary","vocabulary"]},{"id":"03","title":"公平不等于同一种支持","en_title":"Fair Access to Education","kind":"写作·教育公平","en":"A college may advertise itself as inclusive, yet its daily arrangements can still create a hindrance for some learners. A compulsory evening workshop, for example, may exclude a student with an unpaid caring role. A steep stairway can hamper access for someone who cannot walk easily. Such barriers are neither insignificant nor inevitable.\nOur student association submitted a petition asking the administration to review attendance rules. Its proposal was straightforward: provide an accessible room, a flexible timetable, and a digital version of each handout. Financial support should be available irrespective of family background, and a modest allowance could help cover transport. One representative argued that equal opportunity did not require identical treatment. Rather, it required an impartial assessment of individual needs. Whoever wished to enroll should receive clear guidance, not a dismissive shrug. The committee agreed to implement the proposal and monitor its outcome. By removing avoidable obstacles, a university can uphold dignity and enable more students to participate fully. Inclusion is a continuing undertaking, not merely a phrase in a public declaration.","zh":"一所大学可能宣传自己具有包容性，但日常安排仍会给部分学习者制造障碍。例如，强制性的晚间研讨课可能让承担无偿照护责任的学生无法参加，陡峭的楼梯也会妨碍行动不便者进入。这些障碍既不微小，也并非不可避免。学生协会提交请愿书，要求校方审查出勤规定，建议提供无障碍教室、灵活时间表和电子讲义。经济援助应不受家庭背景影响，适当补贴也能帮助支付交通费。一名代表指出，机会平等不要求待遇完全一致，而要求公正评估个人需求。任何想报名的人都应该得到清晰指导，而不是被轻蔑地耸肩敷衍。委员会同意实施提案并追踪结果。消除可避免的障碍能维护尊严，让更多学生充分参与。包容是一项持续的事业，不只是公开声明中的一句话。","key":"By removing avoidable obstacles, a university can uphold dignity and enable more students to participate fully. || By + 动名词交代实现目标的方法；enable sb. to do 表示使某人能够做。适合提出建议的作文结尾。","task":"公平的制度应该回应个人需求，而不是假设所有人都面临同样的困难。 || A fair system should respond to individual needs rather than assume that everyone faces the same difficulties.","q":"Why might identical treatment be unfair? || Students have different needs and face different barriers. 答案来自代表对 equal opportunity 的解释。","note":"","wc":173,"new":["dignity","workshop","hindrance","declaration","insignificant","unpaid","identical","advertise","individual","handout","undertaking","petition","compulsory","stairway","flexible","straightforward","uphold","administration","whoever","support","version","outcome","assessment","impartial","implement","hamper","enroll","attendance","representative","participate","irrespective","inclusive","shrug","allowance"]},{"id":"04","title":"一次校园调查能说明什么","en_title":"What a Survey Can Tell Us","kind":"阅读·数据与判断","en":"A popular claim on campus was that online courses would inevitably improve learning. To examine its validity, a research team designed a questionnaire and selected a random sample. The students recorded each response without changing an inconvenient datum. They distinguished quantitative measures, such as study hours, from qualitative observations about motivation.\nThe initial statistics showed a positive correlation between regular attendance and examination performance. However, a correlation did not establish a cause. A learner's prior knowledge might influence both variables. Nor was the sample homogeneous: a junior student could have different priorities from someone approaching graduation. The team therefore refused to generalize too quickly. A numerical coefficient offered useful information, but its interpretation required caution. An analytic approach, or an analytical one, involves examining how separate factors interact. The final report described the study's scope, identified a possible flaw, and acknowledged that some conclusions remained uncertain. Only by reporting limitations openly could the researchers make their recommendation credible. The exercise taught them that an honest qualification strengthens an argument instead of making it worthless.","zh":"校园里有一种流行说法：在线课程必然改善学习。为检验其有效性，一个研究团队设计问卷并随机抽样。学生如实记录每个回答，不修改不符合预期的数据。他们区分学习时长等定量指标与关于动机的定性观察。初步统计显示，规律出勤与考试成绩正相关，但相关性并不能证明因果关系，已有知识可能同时影响这两个变量。样本也不是同质的：低年级学生与即将毕业者可能有不同的优先事项。因此，团队拒绝过早概括。数值系数提供信息，但解读时需要谨慎。分析性方法意味着考察不同因素如何相互作用。最终报告交代研究范围、指出潜在缺陷，并承认某些结论仍不确定。只有公开报告局限，研究建议才可信。这让学生明白，诚实地给结论加上限制条件，反而能增强论证。","key":"Only by reporting limitations openly could the researchers make their recommendation credible. || Only + 状语置于句首，主句部分倒装；make + 宾语 + 形容词。不要把 only 修饰主语时也机械倒装。","task":"相关性可以提供线索，却不能单独证明因果关系。 || A correlation can provide a clue, but it cannot by itself establish a causal relationship.","q":"Why did the team avoid a broad generalization? || The sample was not homogeneous, and other factors could explain the correlation. 两个限制共同削弱简单的因果结论。","note":"analytic / analytical 都表示分析的。datum 是 data 的单数形式；本文作为可数单个数据使用。","wc":174,"new":["datum","qualitative","positive","validity","scope","team","coefficient","caution","correlation","interact","recommendation","statistics","homogeneous","questionnaire","random","numerical","influence","establish","claim","flaw","junior","quantitative","response","generalize","analytic","between","initial","report","inevitably","uncertain"]},{"id":"05","title":"在挫折之后继续学习","en_title":"Progress after a Setback","kind":"写作·心理与成长","en":"After a disappointing interview, Jun felt that one failure would determine his destiny. He began to brood over every awkward answer and dread the next opportunity. A friend could not remove his sorrow, but she could offer companionship and a realistic perspective. She reminded him that a momentary setback did not signify permanent incapacity.\nJun decided to confront the problem in manageable steps. He would rehearse a concise introduction, identify one strength, and ask for specific feedback. He tried not to overestimate a competitor or underestimate himself. When nervousness made him stammer, he paused instead of rushing headlong into another sentence. His tutor praised his willingness to persevere, not a faultless performance. Gradually, his bitterness gave way to cautious optimism. What helped him most was the realization that confidence could develop through action. He did not suddenly become fearless, nor did every difficulty disappear. Nevertheless, he learnt to treat uncertainty as something he could work with. A steady effort, supported by patient encouragement, was more valuable than an empty assurance of instant success.","zh":"一次不理想的面试后，俊觉得一次失败就会决定命运。他反复想着每个尴尬的回答，并害怕下一次机会。朋友无法消除他的难过，却能陪伴他，帮助他更客观地看问题：短暂挫折并不意味着永久无能。俊决定分步骤应对问题，练习简洁的自我介绍，找出一个优势，并寻求具体反馈。他既不过分高估竞争者，也不低估自己。紧张得结巴时，他会停顿，而不是一头冲进下一句话。导师称赞他的坚持意愿，而不是要求完美表现。渐渐地，苦涩变成了谨慎的乐观。最有帮助的是，他认识到信心能通过行动培养。他没有突然无所畏惧，困难也没有全部消失，但他学会了与不确定性共处。有耐心鼓励支撑的持续努力，比空洞的速成保证更有价值。","key":"What helped him most was the realization that confidence could develop through action. || what 引导主语从句；that 引导 realization 的同位语从句，解释具体认识。迁移：What matters most is the belief that effort can make a difference.","task":"一次失败并不意味着一个人缺乏取得进步的能力。 || A single failure does not mean that a person lacks the ability to make progress.","q":"How did Jun respond when he started to stammer? || He paused instead of rushing into another sentence. 留意行为变化，而不是把进步误解为紧张完全消失。","note":"","wc":173,"new":["action","way","over","through","cautious","fearless","faultless","momentary","confront","destiny","optimism","bitterness","stammer","competitor","interview","steady","persevere","overestimate","valuable","answer","underestimate","brood","awkward","strength","signify","assurance","realization","headlong"]},{"id":"06","title":"图书馆的安静不是冷漠","en_title":"A Library for Everyone","kind":"听力·校园服务","en":"Librarian: We plan to convert the old reading room into a shared study area. Before we proceed, I would like to hear your main concern.\nStudent: The current room is tranquil, which helps me concentrate. If people can chatter freely, its value will decline.\nLibrarian: We agree that silence is essential. Our proposal is to install a movable partition. The outermost section will remain a quiet zone, while the interior will house small discussion groups.\nStudent: Will there be enough stationery and power sockets? Some desks are in poor condition, and a broken fastener makes one chair unstable.\nLibrarian: Maintenance staff will mend the furniture. We also intend to update the catalogue and simplify the subscription process for electronic journals.\nStudent: That sounds sensible. Could you notify users beforehand and display an outline at the entry?\nLibrarian: Certainly. We will circulate a bulletin and invite further comments. Provided that the arrangement works satisfactorily, we will retain it next term. A library should respond to changing needs without abandoning the qualities its users cherish.","zh":"图书管理员：我们计划把旧阅览室改成共享学习区。在推进前，我想听听你最关心的问题。学生：现在的房间很安静，有助于集中注意力。如果大家随意聊天，它的价值就会下降。管理员：我们同意安静至关重要。方案是安装可移动隔断，最外侧保留为安静区，内部安排小组讨论。学生：文具和电源插座够吗？有些桌子状态不好，一把椅子的扣件坏了，坐着不稳。管理员：维修人员会修好家具。我们还打算更新目录，简化电子期刊订阅流程。学生：听起来合理。能否提前通知，并在入口展示方案概要？管理员：当然。我们会发布公告，征求进一步意见。如果安排运行良好，下学期就保留。图书馆应回应变化的需求，同时保留使用者珍视的品质。","key":"Provided that the arrangement works satisfactorily, we will retain it next term. || provided that 表示“只要／如果”，引导条件状语从句；谈将来时从句通常用一般现在时。","task":"只要提前通知用户，新安排就更容易被接受。 || Provided that users are notified beforehand, the new arrangement will be easier to accept.","q":"How will the library accommodate both silent study and discussion? || It will install a movable partition and create separate zones. 原方案并非让整间阅览室自由聊天。","note":"","wc":173,"new":["outermost","value","main","convert","cherish","further","satisfactorily","subscription","beforehand","house","decline","stationery","catalogue","notify","essential","concern","section","tranquil","interior","sensible","fastener","mend","maintenance","partition","concentrate","chatter","bulletin"]},{"id":"07","title":"让数字工具真正节省时间","en_title":"Technology That Saves Time","kind":"写作·数字生活","en":"A software developer offered to automate our volunteer registration system. Previously, an attendant had to copy each paper form, insert the information into a directory, and check for a duplicate. The process was tiresome, and a simple mistake could leave a name absent from the final list.\nThe new interface allowed users to edit an entry and receive instantaneous confirmation. A compact program would standardize the format, flag incomplete fields, and interconnect the membership records with the timetable. Its designer was careful not to overload the screen with every conceivable option. A clear heading, a visible help button, and a plain explanation of each step made the system easier to comprehend.\nYet efficiency was not the only consideration. A technical breakdown could paralyse registration, so the team kept a backup procedure. They also restricted access to confidential information and tested whether the system was compatible with older devices. Useful innovation begins with a genuine need. Unless a digital service is reliable and understandable, its sophistication may become a burden rather than an advantage.","zh":"一位软件开发者提出，把我们的志愿者登记系统自动化。过去，工作人员必须抄写纸质表格，把信息录入名录，再检查重复项。流程枯燥，一个小错误就可能让某人的名字从最终名单中消失。新界面允许用户修改条目并立即收到确认。一个小型程序能统一格式、标记不完整字段，并将会员记录与时间表连接起来。设计者避免把所有可能的选项都塞进屏幕。清晰的标题、显眼的帮助按钮和直白的步骤说明让系统更容易理解。但效率不是唯一考虑。技术故障可能使登记瘫痪，因此团队保留备用流程，也限制机密信息访问，并测试旧设备兼容性。有价值的创新始于真实需求。如果数字服务不可靠、难理解，其复杂性反而可能成为负担。","key":"Unless a digital service is reliable and understandable, its sophistication may become a burden rather than an advantage. || unless 表示“除非／如果不”；rather than 连接平行名词，突出取舍。","task":"技术应该简化日常工作，同时保护用户的个人信息。 || Technology should simplify routine work while protecting users' personal information.","q":"Why did the team keep a backup procedure? || A technical breakdown could stop registration. 备用流程对应可靠性，而非界面美观。","note":"","wc":173,"new":["volunteer","confirmation","paper","compatible","option","directory","plain","instantaneous","attendant","automate","standardize","paralyse","tiresome","interconnect","overload","confidential","comprehend","compact","duplicate","interface","simple","innovation","membership","absent","incomplete","heading","program","edit","breakdown","software","insert"]},{"id":"08","title":"网络信息与事实核查","en_title":"Before You Share a Claim","kind":"写作·媒介素养","en":"A dramatic video can spread across a network before anybody examines its origin. A shadowy account may distort an incident, attach a false caption, and provoke indignation. When a striking image confirms our existing opinion, the impulse to share it can be overwhelming. Nevertheless, popularity is not evidence of accuracy.\nOur journalism workshop taught a practical sequence. First, identify the original author and the date of publication. Next, compare the report with independent accounts. Finally, ask whether a missing detail could alter the interpretation. We learnt to distinguish a documented occurrence from gossip, an imitation from an authentic recording, and criticism from slander. A responsible editor must not fabricate testimony or disguise a sham interview as factual reporting.\nHad the first readers paused to check the source, the rumour might not have spread so widely. Verification can seem slow, particularly during a crisis, but an inaccurate message can magnify fear. The aim is neither to suppress disagreement nor to censor every unusual opinion. It is to make public discussion more informed, rational, and accountable.","zh":"一段戏剧性的视频可能在任何人核查来源之前就传遍网络。身份不明的账号可能歪曲事件、添加虚假说明，激起愤怒。当醒目图片证实我们已有观点时，分享冲动可能格外强烈。然而，流行并不是准确性的证据。新闻研讨课教了一套实用流程：先确认原作者和发布日期，再与独立报道比较，最后检查是否有遗漏细节会改变解读。我们学习区分有记录的事件与流言、仿制品与真实录音，以及批评与诽谤。负责的编辑不能编造证言，也不能把假采访包装成事实报道。如果最早的读者停下来查证，谣言可能就不会传播得如此广泛。尤其在危机期间，核实显得缓慢，但错误信息会放大恐惧。目标不是压制分歧或审查一切不同寻常的意见，而是让公共讨论更知情、理性并对言论负责。","key":"Had the first readers paused to check the source, the rumour might not have spread so widely. || 过去反事实条件句，省略 if 后将 had 提前；主句 might have + 过去分词。只用于与过去事实相反或假设的情况。","task":"一条消息越令人震惊，我们就越应该仔细核查其来源。 || The more shocking a message is, the more carefully we should verify its source.","q":"Does the workshop recommend suppressing all disagreement? || No. It recommends checking evidence so that discussion becomes better informed. 末段明确区分核实事实与压制意见。","note":"","wc":174,"new":["anybody","responsible","fabricate","suppress","shadowy","overwhelming","sequence","striking","gossip","crisis","network","distort","rational","impulse","popularity","detail","occurrence","censor","video","sham","indignation","imitation","magnify","provoke","widely","author","disagreement","inaccurate","slander"]},{"id":"09","title":"人工智能与人的责任","en_title":"Human Judgment in an Automated World","kind":"写作·科技伦理","en":"A laboratory introduced a virtual assistant to summarize research papers. It could scan a manuscript, extract a theme, and generate a brief exposition within seconds. For a busy researcher, the potential gain in productivity was substantial. The tool could also classify material by category and reveal a pattern that a reader might overlook.\nHowever, an elegant summary could still contain a blunder. The assistant might invent a reference, confuse a theory with a proven theorem, or confidently assert something unsupported. A polished tone was no guarantee of sound reasoning. Consequently, the laboratory required a human review before any generated passage entered a formal report. Researchers had to ascertain whether each citation existed and whether it supported the associated claim.\nAs useful as automation can be, responsibility remains with the people who deploy it. A sophisticated mechanism can facilitate analysis; it cannot justify careless judgment. The team's guiding principle was to preserve human oversight while using technology to lessen repetitive work. They measured success by dependable results, not by the mere rapidity of a response.","zh":"一家实验室引入虚拟助手来概括研究论文。它能扫描稿件、提取主题，并在几秒内生成简短说明。对忙碌的研究者来说，生产率提升的潜力很大。工具还能给材料分类，找出读者可能忽略的规律。但优雅的摘要仍可能包含严重错误：助手可能编造文献，把理论与已证明的定理混淆，或自信地断言没有依据的内容。成熟的语气并不保证推理可靠。因此，实验室要求生成文本进入正式报告前必须经过人工审核，研究者必须查明每条引文是否存在、是否支持相应论点。无论自动化多么有用，责任仍属于使用它的人。复杂机制能协助分析，却不能为草率判断提供理由。团队坚持保留人工监督，用技术减少重复劳动，并以结果是否可靠，而不是仅以回复速度评价成功。","key":"As useful as automation can be, responsibility remains with the people who deploy it. || As + 形容词 + as + 主语 + 谓语，表达“尽管……”，后接让步的主句；who 引导定语从句。","task":"无论工具多么先进，使用者仍然有责任核实结果。 || However advanced a tool may be, its users remain responsible for verifying the results.","q":"How did the laboratory evaluate success? || By dependable results, not merely by the speed of a response. 题目考查评价标准。","note":"","wc":174,"new":["category","formal","substantial","overlook","theme","exposition","manuscript","facilitate","virtual","productivity","tone","scan","extract","sophisticated","rapidity","theory","lessen","mechanism","reveal","summary","pattern","blunder","generate","assert","theorem","ascertain","reference","elegant"]},{"id":"10","title":"第一份工作的选择","en_title":"Choosing a First Job","kind":"听力·就业与职业规划","en":"Adviser: You have an offer from a large enterprise and another from a small design studio. Which one appeals to you?\nGraduate: The first pays more, but the second seems to suit my vocation. I could collaborate directly with an experienced architect.\nAdviser: Compare the whole arrangement. Ask about training, working hours, promotion, and the obligation you would accept. A prestigious brand does not automatically provide a supportive workplace.\nGraduate: The executive at the smaller firm was courteous. She gave an explicit description of my role and said I would initially be subordinate to a project manager.\nAdviser: That clarity is valuable. You should also check the contract before you sign. Is the promised salary fixed? Can you resign with reasonable notice? Will the employer compensate you for necessary travel?\nGraduate: I will request written confirmation. I do not want to choose purely for prestige or make a reckless commitment.\nAdviser: Exactly. Rather than seek an ideal position in every respect, identify your priority and consider the trade-off. A prudent decision balances present needs with opportunities for future development.","zh":"顾问：你收到了大企业和小设计工作室的录用通知。哪一个更吸引你？毕业生：第一份薪水更高，但第二份似乎更符合我的职业志向，我能直接与经验丰富的建筑师合作。顾问：要比较完整安排，询问培训、工时、晋升以及你要承担的义务。知名品牌不一定提供支持性的工作环境。毕业生：小公司的主管很有礼貌，明确说明了我的职责，说我起初归项目经理管理。顾问：职责清晰很重要。签约前也要核实合同：承诺的工资是否固定？能否在合理提前通知后辞职？必要差旅是否报销？毕业生：我会要求书面确认。我不想纯粹为声望选择，也不想鲁莽承诺。顾问：对。与其寻求各方面都理想的职位，不如确定优先事项并考虑取舍。审慎的决定会平衡当前需要和未来发展机会。","key":"Rather than seek an ideal position in every respect, identify your priority and consider the trade-off. || Rather than + 动词原形置前，与祈使句构成取舍建议；避免把 trade-off 误解为商业交易。","task":"选择工作时，我们不仅要考虑收入，也要考虑成长机会。 || When choosing a job, we should consider opportunities for growth as well as income.","q":"What will the graduate do before making a commitment? || Request written confirmation and check the contract. 顾问的建议引出了毕业生下一步的行动。","note":"","wc":179,"new":["trade","executive","position","vocation","second","sign","brand","courteous","obligation","collaborate","priority","subordinate","prestige","resign","suit","explicit","prudent","architect","enterprise","studio","promotion","reckless","compensate"]},{"id":"11","title":"一家修理铺的创业课","en_title":"A Repair Shop's First Year","kind":"写作·创业与社区经济","en":"When Lin decided to lease a small shop, a banker asked whether her business model was profitable. Lin did not promise unlimited growth. She planned to repair domestic appliances, sell second-hand equipment, and cater to residents who preferred maintenance to replacement. Her budget included rent, a modest wage, and a reserve for unexpected expenditure.\nThe first quarter brought little revenue. A shipment of spare parts arrived late, and one client refused to pay an invoice. Rather than conceal the problem, Lin negotiated a new delivery schedule and kept an accurate log of each transaction. She learnt to distinguish cash in the bank from actual earnings. A temporary surplus could vanish if an overlooked liability became due.\nBy the end of the year, customers began to recommend the shop. Its margin remained slim, but its reputation for fair treatment grew. Lin's experience illustrates a practical lesson: commercial survival depends not only on ingenuity but also on reliable service, careful finance, and the willingness to acknowledge a mistake promptly.","zh":"林决定租一间小店时，一位银行从业者问她的商业模式是否盈利。她没有承诺无限增长，而计划修理家用电器、出售二手设备，服务那些愿意维修而非更换物品的居民。预算包括房租、适当工资，以及应对意外支出的储备。第一季度收入不多，一批零件到货延迟，还有客户拒付发票。林没有隐瞒，而是协商新的交货安排，并准确记录每笔交易。她学会区分银行现金与真正收益：一笔被忽略的债务到期，就可能让临时盈余消失。年底，客户开始推荐这家店。利润仍薄，但公平待客的口碑逐渐增长。她的经历说明，商业生存不仅取决于巧思，也取决于可靠服务、谨慎的财务管理，以及及时承认错误的意愿。","key":"Commercial survival depends not only on ingenuity but also on reliable service, careful finance, and the willingness to acknowledge a mistake promptly. || not only ... but also ... 位于句中无需倒装；并列项在语法上保持一致。","task":"稳定的收入不能替代对成本和风险的谨慎管理。 || A steady income cannot replace careful management of costs and risks.","q":"Why could the temporary surplus disappear? || An overlooked liability might become due. 注意区分手头现金与扣除义务后的财务状况。","note":"","wc":167,"new":["lease","shipment","liability","budget","margin","profitable","cater","banker","domestic","survival","slim","unlimited","finance","revenue","late","end","promptly","fair","second-hand","reserve","ingenuity","log","surplus","replacement","client","earnings","invoice","transaction","acknowledge","bank","expenditure"]},{"id":"12","title":"理性消费的日常练习","en_title":"Buying with a Clear Purpose","kind":"写作·消费与可持续生活","en":"An advertisement offered a gorgeous jacket at a huge discount. The material resembled velvet, and the lining felt wonderfully soft. I was tempted to buy it immediately, although my wardrobe already contained several similar garments. The promise of a bargain had briefly displaced a more basic question: did I need it?\nA consumer can resist this impulse by considering use, quality, and total cost. An attractive accessory is not necessarily essential, and a fashionable novelty may soon lose its charm. Buying an item in installments does not make it cheaper; it only changes the timing of payment. Nor should a complimentary token distract us from an unreasonable price.\nI left the store and reviewed my spending. The exercise was not about becoming a miser or rejecting every pleasure. It was about ensuring that consumption reflected my priorities. I eventually bought a sturdy coat that I could mend easily. Had I followed the initial excitement, I would have purchased something less suitable. A deliberate pause can transform shopping from a reflex into a considered choice.","zh":"一则广告宣传一件漂亮夹克大幅打折。面料像天鹅绒，衬里十分柔软。尽管衣柜里已有几件相似衣服，我还是差点立刻购买。便宜的诱惑暂时挤走了更基本的问题：我需要它吗？消费者可以通过考虑用途、质量和总成本抵制冲动。好看的配饰未必必需，时尚新品也可能很快失去魅力。分期付款不会降低价格，只改变付款时间。我们也不应被免费赠品吸引，忽视不合理的价格。我离开商店并检查支出。这样做不是要变成守财奴或拒绝所有乐趣，而是确保消费符合优先事项。最后，我买了一件结实且易于修补的外套。如果跟着最初的兴奋走，我就会买到不合适的东西。刻意停顿能让购物从本能反应变成经过考虑的选择。","key":"Nor should a complimentary token distract us from an unreasonable price. || 否定副词 nor 置于句首，助动词或情态动词提前；distract sb. from sth. 为固定搭配。","task":"分期付款改变的是付款时间，而不是商品的总成本。 || Paying in installments changes the timing of payment rather than the total cost of an item.","q":"What did the narrator eventually buy? || A sturdy coat that was easy to mend. 最终选择依据实用性，不是广告中的夹克。","note":"","wc":174,"new":["discount","wardrobe","gorgeous","novelty","consumption","consumer","token","accessory","velvet","miser","deliberate","choice","charm","sturdy","distract","unreasonable","transform","lining"]},{"id":"13","title":"老街里的传统手艺","en_title":"Craft in an Old Town","kind":"翻译·传统文化","en":"In a tranquil town beside a river, a weaver still works at a wooden loom. A strip of cloth gradually becomes a decorative panel, its delicate pattern recalling the bamboo and willow along the bank. Nearby, an artisan shapes earthenware, while another adds a fine glaze to porcelain. Visitors can watch a demonstration, purchase a modest ornament, or attend a workshop on embroidery.\nThe town was formerly known principally for trade. Today, its historic quarter attracts people who wish to understand the relationship between craft and everyday life. An old warehouse has become an exhibition hall. There, a bronze utensil stands alongside a carved wooden box and an antique piece of jewellery. Each object carries evidence of practical skill as well as aesthetic judgment.\nPreserving such a place requires more than an elegant facade. Unless young people can earn a reasonable living from their work, traditional knowledge may gradually disappear. By combining training with sustainable tourism, the community hopes to keep its heritage alive. What deserves appreciation is not simply the finished product, but the patience and experience embodied in its making.","zh":"在河边一座宁静的小镇，一名织工仍使用木织机。一条布逐渐织成装饰面板，精细图案让人想到河岸的竹子和柳树。附近有人制作陶器，也有人为瓷器施上细釉。游客能观看演示、购买朴素饰品，或参加刺绣体验课。小镇从前主要以贸易闻名，如今，历史街区吸引人们了解手艺与日常生活的关系。旧仓库变成展厅，青铜器具与雕花木盒、古董珠宝并列陈列。每件物品都展示实用技能与审美判断。保护这样的地方不能只靠漂亮外观。如果年轻人无法凭手艺获得合理收入，传统知识就可能逐渐消失。社区希望通过结合培训与可持续旅游，让遗产延续。值得欣赏的不只是成品，还有制作过程中体现的耐心和经验。","key":"What deserves appreciation is not simply the finished product, but the patience and experience embodied in its making. || what 主语从句突出评价对象；embodied in ... 为过去分词短语作后置定语。","task":"这座小镇通过把传统手艺与现代生活相结合，保护了独特的文化遗产。 || By combining traditional crafts with modern life, the town has preserved its unique cultural heritage.","q":"Why is a reasonable income important for preservation? || It makes it possible for young people to continue the craft. 保护措施需要解决传承者的生计问题。","note":"","wc":182,"new":["ornament","decorative","principally","bamboo","jewellery","weaver","strip","alongside","formerly","embroidery","appreciation","earthenware","bronze","utensil","box","willow","historic","craft","antique","porcelain","warehouse","panel"]},{"id":"14","title":"一座花园的文化表达","en_title":"A Garden Built for Reflection","kind":"翻译·园林与城市文化","en":"Our guide asked us to pause beneath an arch before entering the garden. Through a circular opening, we could see a small pond, an ornamental rock, and the slender stem of a flowering shrub. The view appeared natural, yet its composition had been carefully planned. A winding footpath encouraged visitors to stroll slowly instead of heading directly towards the exit.\nOn a terrace stood a pavilion with a tiled roof. Its lattice windows framed changing views of the landscape. A vine climbed beside the doorway, while a fragrant herb grew near a patch of moss. At twilight, a faint gleam on the water made the surrounding buildings seem unusually distant. The pond could mirror the sky, but a single ripple would alter the reflection.\nRather than overwhelm visitors with grandeur, the garden invited quiet observation. Its appeal lay in the balance between enclosure and openness, detail and space. Even a miniature garden can reveal a thoughtful conception of how people might reside alongside nature. For a hurried urban resident, such a place offers a valuable opportunity to slow down and reflect.","zh":"进入花园前，导游请我们在拱门下停步。透过圆形开口，可以看到池塘、观赏石和开花灌木的细茎。景色看似自然，构图却经过精心规划。弯曲小径鼓励游客慢慢散步，而不是直奔出口。台地上的亭子盖着瓦顶，格窗框出不断变化的景观。藤蔓爬在门边，苔藓旁长着芳香草本植物。黄昏时，水上微光让周围建筑显得格外遥远。池水能映照天空，但一道涟漪就会改变倒影。花园没有用宏伟气势压倒游客，而是邀请人静静观察。其吸引力在于封闭与开阔、细节与空间之间的平衡。即使微型园林，也能展现人如何与自然相处的深思。对匆忙的城市居民而言，这样的地方提供了放慢脚步、反思生活的宝贵机会。","key":"Through a circular opening, we could see a small pond, an ornamental rock, and the slender stem of a flowering shrub. || 方位短语前置构建空间视角；三个平行名词短语组织景物描写，适合园林类翻译。","task":"蜿蜒的小路和精巧的窗户，让游客从不同角度欣赏园林。 || Winding paths and delicate windows allow visitors to appreciate the garden from different angles.","q":"What kind of experience does the garden encourage? || Slow, quiet observation and reflection. 看景物描写如何服务于慢下来的主题。","note":"","wc":181,"new":["composition","ornamental","observation","overwhelm","footpath","fragrant","towards","enclosure","gleam","even","moss","miniature","stroll","terrace","vine","ripple","twilight","winding","reside","shrub","arch","lattice","conception","landscape","mirror","stem","circular","resident","herb"]},{"id":"15","title":"节庆晚宴与文化交流","en_title":"An Evening of Shared Traditions","kind":"听力·文化交流","en":"For the anniversary of our international club, we arranged a banquet in the college hall. The hostess welcomed each guest with warmth, and volunteers set a napkin beside every plate. A small orchestra played a familiar melody as people began to dine. The meal included a mild vegetable stew, steamed fish, and a pumpkin dessert. A fragrant spice gave the food a distinctive flavour without overwhelming it.\nDuring dinner, a student described Thanksgiving as a family occasion in her community. Another explained a local harvest custom. Nobody was asked to represent an entire culture. Instead, each speaker offered a personal memory: a grandfather's proverb, a childhood song, or the sweetness of a favourite dish. Their stories revealed both difference and resemblance.\nAfter the meal, a brief concert brought everyone together. We sang the chorus of a simple song and thanked the cooks with hearty applause. Cultural exchange becomes meaningful when curiosity is joined by courtesy. By listening without making a hasty generalization, we can appreciate another person's experience while retaining the freedom to describe our own.","zh":"国际社团周年纪念时，我们在学校礼堂举办晚宴。女主人热情欢迎来宾，志愿者在每个餐盘旁放上餐巾。大家开始用餐时，小乐团演奏熟悉的旋律。食物有味道温和的蔬菜炖菜、清蒸鱼和南瓜甜点，一种芳香调料增添特色而不喧宾夺主。席间，一名学生讲述她所在社区把感恩节当作家庭团聚日，另一人介绍当地收获习俗。没有人被要求代表整种文化，每个人只是分享私人记忆：祖父的一句谚语、儿时歌曲，或喜爱食物的甜味。故事既呈现差异，也展现相似。饭后的短音乐会把大家聚到一起，我们合唱简单歌曲的副歌，用热烈掌声感谢厨师。当好奇与礼貌相伴，文化交流才有意义。倾听时不仓促概括，就能欣赏别人的经历，也保有讲述自身经历的自由。","key":"Cultural exchange becomes meaningful when curiosity is joined by courtesy. || when 从句说明产生结果的条件；抽象名词作主语使文化类作文简洁自然。","task":"尊重文化差异并不意味着一个人必须放弃自己的传统。 || Respecting cultural differences does not mean that a person must abandon their own traditions.","q":"Were students expected to speak for an entire culture? || No. Each speaker shared a personal memory. 这是晚宴交流方式的核心区别。","note":"","wc":176,"new":["anniversary","hearty","concert","generalization","banquet","proverb","melody","spice","resemblance","sweetness","dessert","hostess","pumpkin","courtesy","set","applause","custom","orchestra","flavour","Thanksgiving","stew","dine","napkin","mild","chorus"]},{"id":"16","title":"博物馆如何讲述历史","en_title":"Reading Objects in a Museum","kind":"阅读·历史与证据","en":"A museum display showed an Egyptian sculpture beside a Roman coin. Nearby stood a model of a medieval fortress, complete with a tower, a gate, and a defensive trench. The labels described the reign of a monarch, the privileges of a duke and a baron, and the daily work of an ordinary tradesman. A historian explained that a grand monument might glorify a conqueror while revealing little about those who built it.\nThe next section examined colonial expansion. It distinguished the account of a colonist from the memory preserved by a descendant of a displaced community. A military victory, the guide observed, could be followed by exile, loss, and a profound change in social life. An exhibit should not erase that complexity.\nSeen in context, an object can illuminate more than its maker's skill. It can also reveal who possessed authority and whose labour remained largely invisible. The museum invited visitors to compare sources, question a triumphant narration, and consider the people missing from it. History becomes more informative when admiration is accompanied by careful inquiry.","zh":"博物馆把埃及雕塑与罗马硬币并列展示。附近是中世纪堡垒模型，包括塔楼、大门和防御壕沟。说明牌介绍君主统治、公爵与男爵的特权，以及普通工匠的日常工作。历史学者解释，宏伟纪念碑可能歌颂征服者，却很少呈现建造者的生活。下一区域讨论殖民扩张，区分殖民者的叙述与被迫迁移社区后裔保存的记忆。导游指出，军事胜利之后可能出现流放、损失和社会生活的深刻变化，展览不应抹去这些复杂性。把物品置于语境中，看到的不仅是制作者的技艺，也能看出谁掌握权力、谁的劳动长期被忽略。博物馆邀请游客比较资料、质疑胜利者的叙述，并考虑其中缺席的人。当欣赏伴随认真探究时，历史才更能提供启发。","key":"Seen in context, an object can illuminate more than its maker's skill. || 过去分词短语作状语，逻辑主语应与主句的 an object 一致；相当于 When it is seen in context。","task":"博物馆不仅展示珍贵物品，也帮助公众理解普通人的生活。 || Museums not only display valuable objects but also help the public understand ordinary people's lives.","q":"Why should visitors compare different historical sources? || One account may glorify powerful people and omit the experiences of others. 答案由征服者与建造者、殖民者与后裔两组对照支撑。","note":"","wc":176,"new":["descendant","coin","colonial","conqueror","illuminate","glorify","colonist","narration","profound","trench","tradesman","admiration","baron","Roman","exile","historian","monarch","duke","tower","complexity","sculpture","triumphant","largely","reign","fortress","Egyptian"]},{"id":"17","title":"音乐让社区相遇","en_title":"Music in a Shared Space","kind":"听力·艺术与公益","en":"The community theatre had been empty for years when a retired composer offered to revive it. He proposed a weekly rehearsal open to both an amateur and a trained musician. Someone donated a second-hand piano; another lent a harp and a guitar. An old gramophone in the lobby reminded visitors how people had listened to music before digital recording.\nAt first, the performers struggled to coordinate. A singer would miss an entry, a player would strike the wrong chord, and the group would lose the rhythm. The conductor resisted the urge to rebuke them harshly. Instead, she asked them to listen to one another and repeat a short sequence. The improvement was gradual but appreciable.\nOn opening night, a solo performance was followed by a short symphony. The audience began to applaud before the final note had faded. It was not technical superiority that made the evening memorable, but the devotion shared by people of different ages. The project demonstrated how participation in the arts can foster fellowship and give an overlooked public space a new purpose.","zh":"社区剧院空置多年后，一位退休作曲家提出让它重新活跃起来，每周组织排练，向业余爱好者与专业乐手开放。有人捐赠二手钢琴，有人借出竖琴和吉他。大厅里的老式留声机让游客想起数字录音之前的听乐方式。起初，表演者难以协调：歌手错过进入时机，乐手弹错和弦，大家失去节奏。指挥克制住严厉责备的冲动，而是请大家彼此倾听，反复练习一小段。进步虽然缓慢，却很明显。首演夜，独奏之后是一首短交响曲，最后一个音还没消失，观众就开始鼓掌。使夜晚难忘的不是技艺高人一等，而是不同年龄者共享的投入。这个项目说明，参与艺术能够促进情谊，赋予被忽略的公共空间新的用途。","key":"It was not technical superiority that made the evening memorable, but the devotion shared by people of different ages. || It was ... that ... 强调句突出原因；not ... but ... 形成平行对比。可迁移为强调合作而非个人天赋。","task":"艺术活动能把不同年龄的人聚在一起，并增强社区归属感。 || Artistic activities can bring together people of different ages and strengthen their sense of belonging to the community.","q":"How did the conductor respond to early mistakes? || She encouraged listening and repeated practice instead of harsh criticism. 留意实际指导方式。","note":"","wc":177,"new":["composer","rebuke","audience","superiority","amateur","foster","devotion","theatre","coordinate","harp","lobby","gramophone","appreciable","symphony","guitar","fellowship","applaud","solo","chord","urge","revive"]},{"id":"18","title":"城市更新应当保留什么","en_title":"Renewal without Erasure","kind":"写作·城市发展","en":"A metropolitan district planned to replace an old market with a skyscraper. The developer praised the scheme as a way to increase retail space and municipal revenue. Residents, however, feared that the new complex would displace small traders and weaken the neighbourhood's character. Their objection was not simply an attachment to the past.\nThe market provided inexpensive food, informal employment, and a place where elderly residents could meet. Its narrow lanes were shabby, but they supported a lively network of relationships. An architect suggested a more flexible option: reinforce the structure, improve drainage, and convert the upper floor into a spacious community centre. The plan would preserve the street's scale while improving its safety.\nAfter a public forum, the council agreed to assess both proposals. It asked for a transparent account of cost, environmental impact, and the likelihood of disruption. Urban renewal should not be judged solely by the height of a building. To be sustainable, it must reconcile economic development with the practical needs of the people who already dwell there.","zh":"一个大城市街区计划用摩天楼替换老市场。开发商称方案能增加零售空间和市政收入，但居民担心新综合体挤走小商贩、削弱街区特色。他们的反对并非只是怀旧。市场提供便宜食物、非正式就业，以及老年居民见面的场所。狭窄街巷虽然破旧，却维系活跃的人际网络。建筑师提出更灵活的选项：加固结构、改善排水，把上层改为宽敞的社区中心。这样既能保留街道尺度，也能改善安全。公开论坛后，市议会同意评估两个方案，并要求透明说明成本、环境影响和受扰动的可能性。城市更新不能只用楼高评价。要实现可持续发展，就必须协调经济发展与现有居民的实际需要。","key":"To be sustainable, it must reconcile economic development with the practical needs of the people who already dwell there. || 不定式作目的／条件意味的状语；reconcile A with B 表示协调两种需求。","task":"城市更新应该改善居民的生活，而不是只追求更高的建筑。 || Urban renewal should improve residents' lives rather than merely pursue taller buildings.","q":"What alternative did the architect suggest? || Repair and adapt the existing market while improving drainage and safety. 原建筑保留并改造，而非完全推倒。","note":"","wc":172,"new":["metropolitan","displace","replace","municipal","reconcile","drainage","skyscraper","forum","retail","attachment","shabby","likelihood","dwell","scheme","environmental","spacious","market"]},{"id":"19","title":"湿地并不是闲置土地","en_title":"A Marsh Worth Protecting","kind":"翻译·生态保护","en":"A marsh on the outskirts of town was once dismissed as useless land. A developer wanted to drain it and construct a warehouse. Local volunteers, however, argued that the apparent emptiness concealed a complex habitat. A reed bed sheltered small animals, while the shallow water offered a feeding ground for birds.\nDuring an excursion, we watched a woodpecker near a willow grove and a dove resting on a branch. A snail moved across a damp leaf, and a grasshopper clung to a stalk. Our guide asked us not to trample the vegetation or disturb a nest. Even an organism that seemed trivial could contribute to the area's ecology.\nThe group prepared a proposal to reclaim a damaged section and restrict construction near the water. It did not claim that preservation would solve every environmental problem. Rather, it showed how one practical intervention could protect a valuable locality. Once a habitat is destroyed, its restoration may demand far more time and money than its protection would have required. Treating nature as an integral part of a city can therefore be both responsible and economical.","zh":"镇郊一片湿地曾被视为无用土地，开发商想排干水建仓库。当地志愿者却指出，看似空旷的地方隐藏着复杂栖息地：芦苇地庇护小动物，浅水为鸟类提供觅食场所。一次考察中，我们看见柳林附近的啄木鸟、枝头的鸽子、湿叶上的蜗牛，以及紧抓植物茎秆的蚱蜢。导游要求大家不要踩踏植被或干扰鸟巢。即使看似微小的生物，也可能对当地生态作出贡献。团队建议修复受损地段，并限制水边建设。他们没有声称保护湿地能解决所有环境问题，而是展示一次实际行动如何保护重要地点。一旦栖息地遭破坏，恢复所需时间和资金可能远超原本保护的投入。因此，把自然视为城市不可分割的一部分，既负责，也可能经济合算。","key":"Once a habitat is destroyed, its restoration may demand far more time and money than its protection would have required. || once 引导时间／条件从句；比较结构中 would have required 表示对未采取保护措施的假设成本。","task":"湿地为许多物种提供栖息地，因此不应该被当作无用的土地。 || Wetlands provide habitats for many species and should therefore not be regarded as useless land.","q":"Why did volunteers oppose draining the marsh? || It supported a complex habitat and valuable ecological relationships. 不是单纯因为不喜欢仓库。","note":"","wc":183,"new":["integral","woodpecker","nest","stalk","marsh","grasshopper","snail","locality","trivial","ecology","reed","grove","excursion","reclaim","construction","bed","dove","preservation","drain","trample"]},{"id":"20","title":"在动物保护区学习观察","en_title":"Watching Wildlife Responsibly","kind":"听力·自然科普","en":"At the reserve, an instructor explained the difference between a mammal and a reptile before leading us past the observation enclosure. A peacock displayed its feathers, a turtle rested near the pond, and a beetle crawled beneath a stone. In the distance, a herd moved slowly across the pasture. We were told to observe quietly and let each creature follow its normal pattern.\nThe afternoon talk concerned endangered animals. A gorilla, a leopard, and a whale require very different habitats, yet each can suffer when human activity destroys its surroundings. A panther in a photograph was not a pet or a spectacle; it was a wild animal whose needs deserved respect. The guide also discussed how an extinct species differs from one merely absent from a particular locality.\nWhat impressed us most was the restraint required of a responsible observer. We must not use bait to attract wildlife, allow a puppy to chase birds, or toss food into an enclosure. Curiosity should lead to understanding rather than interference. The privilege of seeing an animal does not entitle us to control its behaviour.","zh":"保护区里，指导员先讲解哺乳动物与爬行动物的区别，再带我们经过观察围栏。孔雀展示羽毛，乌龟在池边休息，甲虫爬到石下，远处兽群缓缓穿过草地。我们被要求安静观察，让动物按正常方式活动。下午的讲座讨论濒危动物：大猩猩、豹和鲸需要不同栖息地，但都可能因人类破坏环境而受苦。照片里的黑豹不是宠物或表演对象，而是需求应受尊重的野生动物。导游还解释物种灭绝与仅在某地消失的区别。最让我们印象深刻的是，负责的观察者必须克制：不能用诱饵引来野生动物，不能让小狗追鸟，也不能把食物扔进围栏。好奇应带来理解，而非干扰。能够看见动物，并不意味着有权控制它的行为。","key":"The privilege of seeing an animal does not entitle us to control its behaviour. || entitle sb. to do 表示给予某人做某事的权利；适合讨论权利与责任。","task":"观察野生动物时，人们应该保持距离，避免干扰它们的正常行为。 || When observing wildlife, people should keep their distance and avoid disturbing the animals' normal behaviour.","q":"Which actions does the guide discourage? || Using bait, allowing dogs to chase birds, and throwing food into enclosures. 三个并列动作都是人为干扰。","note":"","wc":182,"new":["species","puppy","observe","reptile","pasture","peacock","particular","extinct","whale","beetle","turtle","stone","herd","toss","bait","gorilla","follow","spectacle","mammal","panther","leopard","entitle"]},{"id":"21","title":"把废弃物重新变成资源","en_title":"Repair, Reuse, and Recover","kind":"写作·循环利用","en":"At a recycling workshop, each volunteer received a glove and a sorting guide. We separated metal scrap from plastic, detached a cable from a damaged appliance, and removed a worn tile from a reusable wooden frame. The supervisor asked us to handle a sharp edge with caution and leave electrical dismantling to trained personnel.\nThe display explained why materials need different treatment. A polymer may require a specialized process, while a composite product can be difficult to separate. A coating that protects an object from corrosion may complicate its recovery. Even a seemingly minor impurity can reduce the value of a recycled batch. These details made the promise of effortless recycling appear less convincing.\nWe then repaired a chair with a loose joint. A clamp held the parts together until the glue could solidify. Repair could prolong the object's useful life and reduce the need for replacement. The lesson was clear: a circular economy begins before something becomes waste. If manufacturers design products that people can maintain, reuse, and dismantle, fewer valuable resources will end up as litter.","zh":"回收工作坊给每名志愿者发了手套和分类指南。我们把金属废料与塑料分开，从坏电器上拆下电缆，再从可重复使用的木框上取下一块旧瓷砖。主管提醒大家小心锋利边缘，把电器拆解留给受训人员。展览说明材料为何需要不同处理：聚合物可能需要专门工艺，复合产品则难以分离。防腐涂层可能让回收更复杂，看似微小的杂质也可能降低整批回收材料的价值。这些细节让“轻松回收”的承诺显得不够可信。之后，我们修理了一把接头松动的椅子，用夹具固定部件，等胶水凝固。维修能延长使用寿命、减少替换需求。循环经济在物品成为垃圾前就已开始。如果厂家设计便于维护、再用和拆解的产品，最终变成垃圾的宝贵资源就会减少。","key":"If manufacturers design products that people can maintain, reuse, and dismantle, fewer valuable resources will end up as litter. || if 条件句搭配含定语从句的宾语；三个动词并列描述可持续设计。","task":"延长产品寿命，是减少资源浪费的一种切实可行的方法。 || Extending the useful life of products is a practicable way to reduce the waste of resources.","q":"Why can composite products be hard to recycle? || Their different materials can be difficult to separate. 文中通过材料构成解释回收困难。","note":"","wc":178,"new":["glue","prolong","tile","scrap","plastic","personnel","polymer","clamp","composite","cable","corrosion","litter","impurity","seemingly","solidify"]},{"id":"22","title":"节能改造从细节开始","en_title":"An Energy Audit on Campus","kind":"听力·能源与工程","en":"Our college invited an engineer to assess energy consumption in the oldest building. She examined the boiler, the radiator, and the pipe network before checking the insulation. A small leakage near a junction had gone unnoticed, and an inefficient heater was consuming more power than necessary. The proposed replacement would require an initial investment, but might reduce long-term costs.\nDuring her presentation, the engineer explained that a watt describes power, while energy use depends on both power and duration. A kilowatt is a thousand watts. She then showed how a sensor could regulate indoor lighting according to brightness and whether a room was occupied. A solar panel might supply part of the building's electricity, but its contribution would vary with conditions.\nThe students wanted a single spectacular solution. The engineer instead recommended a sequence of measurable improvements: insulate exposed pipes, repair faulty controls, ventilate rooms appropriately, and monitor the outcome. Not every impressive technology produces the optimum result in every setting. A careful assessment of actual needs is indispensable to an effective transition towards more efficient energy utilization.","zh":"学校邀请工程师评估最老建筑的能耗。她先检查锅炉、暖气片和管道网络，再查看保温情况。接头附近有一处小泄漏未被发现，一台低效取暖器耗电超出需要。更换设备需要初始投资，却可能减少长期成本。报告中，她说明瓦特描述功率，而能耗取决于功率和持续时间；一千瓦等于一千瓦特。她还展示传感器如何根据亮度及房间是否有人来调节室内灯光。太阳能板也许能供给部分电力，但贡献会随条件变化。学生希望找到一个惊人的单一方案，工程师却建议进行一系列可测量改进：给裸露管道保温、修理失灵控制器、适当通风并监测结果。并非每种先进技术在所有场景下都最优。认真评估实际需求，是有效转向高效能源利用不可缺少的步骤。","key":"Not every impressive technology produces the optimum result in every setting. || not every 是部分否定，意为“并非每一个”，不要误译为“所有都不”。","task":"节能政策应该建立在实际需求和可衡量的结果之上。 || Energy-saving policies should be based on actual needs and measurable results.","q":"What approach did the engineer recommend? || A sequence of measurable improvements rather than a single spectacular solution. 听清转折词 instead 后的建议。","note":"","wc":178,"new":["optimum","transition","watt","regulate","indoor","ventilate","insulate","kilowatt","radiator","brightness","leakage","junction","solar","utilization","heater","boiler","pipe","sensor","indispensable"]},{"id":"23","title":"从果园到餐桌","en_title":"A Farm's Changing Seasons","kind":"翻译·乡村生活","en":"At dawn, the farmer led us through a fertile valley. An orchard occupied the gentle slope, while barley and another cereal grew on the level ground. Beyond a grassy track, cattle began to graze in a pasture. A rooster called near the poultry shed, where a hen guarded her offspring. The farm also kept a small flock of domestic fowl.\nOur task was to help in the vegetable garden. We used a hoe to loosen the soil, planted a young shoot, and checked the irrigation channels. A toad rested near a water basin, and a bee moved between flowers. The farmer explained that a pest could damage a crop, but careless treatment might also harm useful creatures. Watching a locust did not mean that every insect was an enemy.\nAfter work, we carried a bushel of apples to the storehouse. Some would be sold fresh; others would become juice. Fallen leaves would decompose and return material to the soil. The visit showed us that agricultural productivity rests on patient observation, suitable tools, and an understanding of the relationships that sustain growth.","zh":"黎明，农民带我们穿过肥沃山谷。果园位于缓坡，大麦和另一种谷物长在平地上。草径外，牛开始在牧场吃草。家禽棚附近公鸡啼叫，母鸡守着幼崽，农场还养着一群其他家禽。我们的任务是在菜园帮忙：用锄头松土、种下幼苗，并检查灌溉沟渠。一只蟾蜍停在水盆附近，蜜蜂在花间移动。农民解释，害虫会伤害作物，但不慎处理也可能伤害有益生物。看到一只蝗虫，不等于所有昆虫都是敌人。劳动后，我们把一蒲式耳苹果搬入库房，有的鲜卖，有的榨汁。落叶会分解，让物质回到土壤。参观让我们看到，农业生产力依赖耐心观察、合适工具，以及对维系生长的相互关系的理解。","key":"The visit showed us that agricultural productivity rests on patient observation, suitable tools, and an understanding of the relationships that sustain growth. || show sb. that ... 引出认识；rest on 表示依赖；并列三个名词短语组织总结。","task":"现代农业既需要合适的技术，也需要对自然规律的理解。 || Modern agriculture requires both suitable technology and an understanding of natural patterns.","q":"Why should farmers avoid treating every insect as an enemy? || Some creatures are useful, and careless treatment may harm them. 文章强调生态关系而非一概消灭昆虫。","note":"","wc":181,"new":["graze","flock","bushel","basin","track","fowl","poultry","locust","pest","orchard","irrigation","cereal","rooster","offspring","barley","visit","toad","grassy","loosen","fertile","hoe","decompose"]},{"id":"24","title":"海岸清洁行动","en_title":"A Morning by the Sea","kind":"听力·海洋与志愿服务","en":"Before the seaside cleanup began, the organizer gave us a safety briefing. We were to remain on the beach, avoid a slippery rock, and report anything sharp. Nobody should wade into a rough inlet or attempt to retrieve waste from a reef. A changing tide could create peril even when the water looked calm.\nOur group found a length of fishing line, a torn net, and a plastic crate near the pier. A crab hid beneath a shell, while a gull hovered over the wharf. Farther out, a ferry crossed the strait towards the seaport. Its wake sent a small splash onto the shore. The contrast between everyday activity and discarded rubbish was striking.\nAt the end, we recorded the number and type of objects collected. The data would support a local campaign for better waste management. We did not pretend that one morning could purify an entire coast. Nevertheless, repeated action could reduce harm, deepen awareness, and encourage cooperation. Protecting the sea requires both individual effort and the infrastructure that makes responsible behaviour possible.","zh":"海边清洁开始前，组织者做安全说明：留在沙滩，避开湿滑岩石，发现尖锐物就报告；不要涉入风浪大的小海湾，也不要尝试从礁石上捡垃圾。即使水面平静，潮汐变化也可能带来危险。我们在码头附近找到一段鱼线、破渔网和塑料箱。螃蟹藏在贝壳下，海鸥在码头上盘旋。远处渡船穿过海峡驶向海港，尾流把小片水花推上岸。日常活动与随意丢弃的垃圾形成鲜明对照。结束时，我们记录垃圾数量和种类，用数据支持当地改进废物管理的行动。我们没有假装一上午能净化整片海岸，但重复行动能减少伤害、加深认识并鼓励合作。海洋保护既需要个人努力，也需要使负责行为成为可能的基础设施。","key":"Protecting the sea requires both individual effort and the infrastructure that makes responsible behaviour possible. || 动名词短语作主语，谓语用单数 requires；both ... and ... 连接两个必要条件。","task":"个人行动能够带来改变，但也需要公共设施和长期政策的支持。 || Individual action can make a difference, but it also needs support from public facilities and long-term policies.","q":"What would the recorded data be used for? || To support a local campaign for better waste management. 留意活动结束后数据的用途。","note":"","wc":175,"new":["net","crab","peril","purify","wade","contrast","shell","wharf","inlet","reef","splash","line","strait","seaport","seaside","number","ferry","length","pier"]},{"id":"25","title":"自行车维修室里的力学","en_title":"Mechanics at the Repair Bench","kind":"阅读·工程科普","en":"At the repair bench, the instructor asked us to mount a bicycle securely before examining the rear wheel. We checked the axle, the bearing, and the alignment of the frame. A bent shaft could make a rotating part move unevenly, while excessive friction could waste energy. The instructor used a wrench to tighten a nut and a lever to lift a heavy component.\nNext came a demonstration of torque. A force applied farther from the axis could produce a greater turning effect, provided its direction was appropriate. We turned a crank slowly and watched the pedal rotate. A small model showed how a gear could change the relationship between speed and turning force. Another displayed a piston moving inside a cylinder.\nThe lesson connected theory with visible motion. We learnt to distinguish axial movement from sideways displacement and to notice a loose hinge before it caused damage. No one was permitted to operate unfamiliar equipment without supervision. Understanding mechanics meant more than memorizing a formula: it required noticing how parts interact and recognizing when an apparently minor defect could endanger the whole operation.","zh":"维修台前，指导员让我们先固定自行车，再检查后轮。我们查看车轴、轴承和车架对齐情况。弯曲转轴可能使旋转部件运动不均，过大摩擦则会浪费能量。指导员用扳手拧紧螺母，用杠杆抬起重部件。随后演示扭矩：方向合适时，力作用点离轴越远，转动效果可能越强。我们慢慢转曲柄，观察踏板旋转；小模型展示齿轮如何改变转速与转动力之间的关系，另一模型展示活塞在气缸内运动。课程把理论与可见运动联系起来。我们学习区分轴向运动与侧向位移，并在铰链松动造成损坏前发现问题。没人能在无人监督时操作陌生设备。理解力学不只是背公式，还要观察部件相互作用，认识到小缺陷可能危及整个运行。","key":"Understanding mechanics meant more than memorizing a formula: it required noticing how parts interact. || 动名词作主语；more than + 动名词表示“不只是”；冒号后解释更深层要求。","task":"即使是一个小缺陷，也可能影响整台设备的可靠性。 || Even a minor defect can affect the reliability of an entire machine.","q":"What did the lesson connect? || Mechanical theory with directly observable motion and practical inspection. 学习重点是把概念用于观察。","note":"科技术语用于阅读识别，不必把 torque、axial 等生硬放入普通议论文。","wc":183,"new":["mount","torque","axial","axis","bearing","operation","cylinder","displacement","sideways","endanger","lever","pedal","rear","crank","wrench","nut","mechanics","piston","hinge","move","alignment","gear","friction","axle","shaft","tighten","rotate"]},{"id":"26","title":"一间材料实验室","en_title":"Inside a Materials Laboratory","kind":"阅读·材料与实验","en":"The laboratory compared a metal strip with a sample of polymer. Students measured tensile strength, watched a specimen bend, and recorded the point at which a fracture appeared. A wedge helped hold one sample in place, while a protective screen separated the observers from the apparatus. Safety took precedence over speed.\nA second experiment examined deformation under pressure. A soft material could flatten or stretch, whereas a brittle one might crack. The instructor warned that surface appearance alone could not predict capability. A shiny coating might hide an internal flaw, and a thick workpiece was not necessarily stronger in every direction. The sample's composition and manufacturing process also mattered.\nThe team used calibration records to check its instruments. A small deviation in measurement could become significant when results were compared. Rather than discard an unexpected reading, students repeated the procedure and described the discrepancy. Experimentation requires an honest account of uncertainty. The purpose was to assess a material's behaviour under specified conditions, not to declare one substance universally superior to every alternative.","zh":"实验室比较一条金属与一块聚合物样品。学生测量抗拉强度，观察试件弯曲，并记录何时出现断裂。楔块帮助固定样品，防护屏把观察者与设备隔开，安全优先于速度。第二个实验研究受压变形：柔软材料可能变扁或拉伸，脆性材料则可能开裂。指导员提醒，单看表面不能预测性能，光亮涂层可能掩盖内部缺陷，厚工件也并非各方向都更强，组成与制造工艺同样重要。团队用校准记录检查仪器。比较结果时，小测量偏差也可能很重要。学生没有丢弃意外读数，而是重复程序并说明差异。实验需要诚实交代不确定性，目的是评估材料在指定条件下的行为，而非宣布一种物质普遍优于所有替代物。","key":"A soft material could flatten or stretch, whereas a brittle one might crack. || whereas 连接对照；could / might 保留条件性，避免把实验结果写成无条件规律。","task":"可靠的实验报告应该记录异常结果，而不是把它们隐藏起来。 || A reliable experimental report should record unexpected results rather than hide them.","q":"Why did students repeat an unexpected measurement? || To investigate the discrepancy rather than simply discard inconvenient evidence. 与科研诚信主题呼应。","note":"","wc":172,"new":["tensile","significant","wedge","calibration","deformation","bend","experimentation","hide","universally","fracture","capability","workpiece","whereas","pressure","specimen","substance","deviation","flatten","measurement","crack"]},{"id":"27","title":"看懂一块简单电路板","en_title":"Understanding a Simple Circuit","kind":"阅读·电子与信息","en":"An electrician brought a demonstration board to our electronics class. It contained a battery, a switch, a small lamp, and a capacitor. A diagram showed the connection between each component. The instructor explained that resistance is measured in ohms, with ohm as the singular form, and capacitance in farads. She reminded us that a circuit diagram simplifies a physical arrangement.\nWe examined a silicon chip under a camera connected to a projector. Its tiny scale contrasted with the old radio receiver beside it. A microprocessor could perform operations far more quickly than the mechanical devices in the display, but it still required a suitable power supply. An insulator prevented an unintended electrical connection, while a loose contact could interrupt transmission.\nThe class then discussed a photoelectric detector and an optical sensor. Both examples helped us link an invisible process to a visible response. The demonstration used enclosed educational equipment; students did not handle live household wiring. The most useful insight was that a complex device becomes easier to understand when its function is divided into a sequence of manageable parts.","zh":"电工给电子课带来演示板，上面有电池、开关、小灯和电容器，图示说明各部件的连接。指导员解释，电阻的单位是欧姆，ohm 是单数形式；电容的单位是法拉。她提醒，电路图是对实际布局的简化。我们通过连接投影仪的摄像头观察硅芯片。其微小尺寸与旁边旧收音机形成对比。微处理器运算远快于展出的机械设备，但仍需要合适电源。绝缘体防止意外电连接，接点松动则会中断传输。随后，课堂讨论光电探测器和光学传感器，帮助我们把不可见过程与可见反应联系起来。演示采用封闭教学设备，学生不接触家用带电线路。最实用的认识是：把复杂设备的功能分解为可理解的小步骤，就更容易看懂它。","key":"A complex device becomes easier to understand when its function is divided into a sequence of manageable parts. || when 从句说明理解条件；被动语态突出被分析的功能而非执行者。","task":"把复杂问题分成较小的部分，能够帮助学习者逐步建立理解。 || Dividing a complex problem into smaller parts can help learners develop understanding step by step.","q":"Why was the old radio displayed beside the chip? || To contrast its physical scale with modern electronic technology. 对比用于帮助理解技术变化。","note":"ohm 的单数被明确写出以对应词表。复数 ohms 常用于实际数量表达。","wc":180,"new":["singular","transmission","microprocessor","projector","battery","ohm","receiver","silicon","photoelectric","optical","insulator","detector","insight","capacitance","electronics","capacitor","electrician","chip","switch","board"]},{"id":"28","title":"化学课不只是在记符号","en_title":"Chemistry beyond Symbols","kind":"阅读·化学与材料","en":"In the chemistry gallery, labels introduced zinc, nickel, sodium, and mercury. Another case displayed graphite, quartz, limestone, and a piece of granite. The guide stressed that naming a substance was only the start of understanding it. Its properties depended on its structure and the conditions under which it was examined.\nA model represented an atom with a central nucleus and surrounding electrons. A proton carried positive charge, while a neutron was electrically neutral. An ion differed from a neutral atom or group of atoms because it had gained or lost electrons. The class then compared an inorganic compound with a hydrocarbon and considered what a molecular diagram could show.\nIn a recorded demonstration, a metal could oxidize and form an oxide. Elsewhere, a display illustrated an electrode and an anode in a particular cell. The guide did not invite us to mix unfamiliar chemicals. Instead, she asked us to read each label carefully and distinguish an observation from an explanation. Scientific literacy begins when technical terminology helps us reason about evidence rather than merely impress an audience.","zh":"化学展厅的标签介绍锌、镍、钠和汞，另一个展柜展示石墨、石英、石灰岩和花岗岩。导游强调，叫出物质名称只是理解的开始，其性质取决于结构和观察条件。一个模型以中心原子核及周围电子表示原子：质子带正电，中子不带电。离子与中性原子或原子团的区别，在于获得或失去了电子。课堂又比较无机化合物与烃，思考分子图能展示什么。录播演示中，金属可以氧化并形成氧化物，另一展项说明特定电池中的电极和阳极。导游没有邀请大家混合陌生化学品，而要求认真阅读标签、区分观察与解释。术语帮助我们依据证据推理，而不只是用来显得高深时，科学素养才开始形成。","key":"The guide stressed that naming a substance was only the start of understanding it. || stressed that 引述强调内容；两个动名词短语 naming / understanding 构成“命名—理解”的逻辑递进。","task":"掌握科学术语很重要，但更重要的是理解它们所描述的现象。 || Knowing scientific terminology is important, but understanding the phenomena it describes matters more.","q":"What distinction did the guide ask students to make? || The distinction between an observation and an explanation. 不把看到的现象与对原因的解释混同。","note":"","wc":177,"new":["neutron","proton","nucleus","oxide","oxidize","anode","zinc","inorganic","atom","hydrocarbon","terminology","quartz","limestone","graphite","nickel","sodium","ion","start","granite","mercury","impress","charge","molecular","electrode","reason"]},{"id":"29","title":"从风到运动","en_title":"How Machines Transfer Energy","kind":"阅读·动力与工程","en":"At an engineering exhibition, a small windmill stood beside a model turbine. A moving stream of air could turn a rotor and drive a dynamo. Another display used a transparent hose to illustrate a hydraulic system, while a sealed model demonstrated pneumatic motion. The guide compared these mechanisms without suggesting that they were interchangeable.\nA pulley helped raise a weight, and a spring stored energy when compressed. Visitors could observe the kinetic energy of a moving trolley and the friction that slowed it. A rotating propeller produced thrust in an enclosed demonstration, helping explain one form of propulsion. The shape of the blade and the rate of rotation affected the result.\nThe instructor asked us to consider both useful output and unwanted losses. Vibration, heat, and sound could dissipate energy that might otherwise perform work. A smooth motion did not imply a perfect machine. By identifying where losses occurred, a designer could modify a component, streamline a process, or choose a more suitable mechanism. Engineering progress often comes from a series of careful improvements rather than a single dramatic invention.","zh":"工程展上，小风车立在涡轮模型旁。流动空气能带动转子并驱动发电机。另一展项用透明软管说明液压系统，封闭模型则演示气动运动。导游比较这些机构，并未说它们可以互换。滑轮帮助提升重物，弹簧受压时储存能量。参观者观察移动小车的动能，以及让它减速的摩擦。封闭演示中，旋转螺旋桨产生推力，帮助解释一种推进方式；叶片形状和转速会影响结果。指导员让我们同时考虑有用输出与非预期损耗。振动、热和声音可能使原本可用于做功的能量耗散。运动平稳不等于机器完美。查明损耗位置后，设计者能修改部件、简化流程或选择更合适的机构。工程进步常来自一连串认真改进，而不是单一惊人发明。","key":"By identifying where losses occurred, a designer could modify a component, streamline a process, or choose a more suitable mechanism. || by + 动名词说明方法；where 引导宾语从句；三个动词并列列出可采取的措施。","task":"发现能量损失发生在哪里，是提高设备效率的重要一步。 || Identifying where energy losses occur is an important step towards improving a device's efficiency.","q":"Does smooth motion prove that a machine is perfect? || No. Energy may still be lost through heat, sound, or vibration. 平稳运动并不等于没有损耗。","note":"","wc":180,"new":["hose","propulsion","raise","hydraulic","trolley","perfect","dissipate","propeller","streamline","otherwise","pneumatic","rate","pulley","windmill","dynamo","kinetic"]},{"id":"30","title":"飞行展厅的一堂课","en_title":"Learning How Aircraft Fly","kind":"听力·航空科普","en":"The aviation gallery displayed a glider, a propeller aircraft, and a model supersonic jet. A guide explained that aerospace research examines flight both within and beyond the atmosphere, although each environment creates different problems. A diagram showed the four forces commonly discussed in aircraft flight: lift, weight, thrust, and drag.\nWe watched a video in which air moved around a wing. A model could tilt, ascend, or descend while its controls changed the airflow. Another exhibit demonstrated why a pilot must coordinate movement rather than make a sudden jerk. The guide pointed to the aircraft's nose and explained how the shape of its body could influence drag.\nThe final section concerned emergency equipment. A parachute was displayed beside a training harness, and a notice described why routine inspection mattered. Visitors could manipulate a simulator, but only after an instructor explained its limitations. No model could reproduce every real condition. What the gallery offered was an orientation: a way to connect familiar motion with the principles that make controlled flight possible.","zh":"航空展厅展示滑翔机、螺旋桨飞机和超声速喷气机模型。导游解释，航空航天研究涉及大气层内外的飞行，但不同环境带来不同问题。图示介绍飞机飞行常讨论的四种力：升力、重力、推力和阻力。视频展示气流绕过机翼，模型能倾斜、上升或下降，控制装置会改变气流。另一展项解释为何飞行员要协调动作，避免突然猛动。导游指着机头，说明机身形状如何影响阻力。最后一区域展示应急设备，降落伞放在训练安全带旁，告示说明日常检查的重要性。参观者只有在指导员解释局限后才能操作模拟器，因为模型无法重现所有真实条件。展厅提供的是入门方向：把熟悉运动与可控飞行背后的原理联系起来。","key":"No model could reproduce every real condition. || no + 名词与 every 的组合表达模型无法覆盖所有条件；科学说明文中应主动说明适用范围。","task":"模拟器可以帮助学生理解原理，但无法重现所有真实情况。 || A simulator can help students understand principles, but it cannot reproduce every real situation.","q":"What had to happen before visitors used the simulator? || An instructor had to explain its limitations. 时间顺序由 only after 引出。","note":"","wc":170,"new":["orientation","body","nose","ascend","jerk","flight","parachute","glider","aerospace","aviation","supersonic","manipulate","tilt"]},{"id":"31","title":"星空下的科学提问","en_title":"Questions under the Dome","kind":"阅读·天文学","en":"Inside the observatory dome, our astronomy tutor projected an image of Venus, Mars, Jupiter, and Saturn. Each planet could revolve around the Sun along an elliptical orbit. A separate animation explained a lunar eclipse. The tutor warned us not to confuse a cosmic event with a prophecy: a prediction should rest on evidence, not the authority of a prophet.\nWe then discussed exploration beyond Earth. A satellite could carry a probe, but a picture of the cosmos could not answer every question about it. An apparently spherical object might conceal a complicated structure. The quest for knowledge therefore remained open. Rather than speculate without limits, we should define a question and identify the observation needed to examine it. The most memorable sight was not a spectacular photograph, but a student discovering that uncertainty could inspire further inquiry.","zh":"天文台圆顶内，导师投映金星、火星、木星和土星的图像，展示行星沿椭圆轨道绕太阳运行，并用另一动画解释月食。她提醒，不要把宇宙事件与预言混淆：预测应依靠证据，而不是先知权威。随后大家讨论地外探索。卫星可以搭载探测器，但宇宙照片不能回答所有问题，看似球形的物体也可能藏着复杂结构。求知仍有广阔空间。我们应提出明确问题并寻找所需观测，而不是无限猜测。最难忘的景象，是学生发现不确定性也能激发进一步探究。","key":"Rather than speculate without limits, we should define a question. || rather than + 动词原形，提出研究方法上的选择。","task":"科学预测应该建立在可检验的证据之上。 || Scientific predictions should rest on evidence that can be tested.","q":"How does the tutor distinguish a prediction from a prophecy? || A prediction rests on evidence rather than a prophet's authority. 关注论断的依据。","note":"","wc":137,"new":["lunar","dome","prophet","prophecy","prediction","cosmic","cosmos","quest","Venus","elliptical","astronomy","probe","speculate","spherical","Jupiter","sight","Saturn","exploration","Mars","define","satellite","eclipse","revolve"]},{"id":"32","title":"用图形理解数学","en_title":"Mathematics Made Visible","kind":"阅读·数学思维","en":"Our teacher used a rectangle, a triangular frame, and an oval mirror to introduce geometrical thinking. A radius linked a circle's centre to its edge; a perpendicular line met another at a right angle. We compared radial and transverse directions before drawing a spiral and an arc.\nThe algebra lesson began with a simple equation. We expressed a fraction as a decimal, practised multiplication, and used a subscript to distinguish related quantities. A linear relation appeared as a straight line on our graph. Its gradient helped describe change. Later, calculus would extend that idea. The teacher distinguished a finite interval from infinity and explained why an infinite process could require careful reasoning. Saying that something grows infinitely does not replace a proof. Even when a diagram appears symmetrical, its symmetry must be examined, not merely presumed.","zh":"老师用长方形、三角框和椭圆镜引入几何思维。半径连接圆心与边缘，垂直线以直角相交；我们比较径向与横向，再画螺线和圆弧。代数课从简单方程开始，把分数写成小数，练习乘法，并用下标区分相关量。线性关系在图中呈直线，斜率描述变化，微积分会进一步发展这一思想。老师区分有限区间与无穷，指出无穷过程需要严谨推理，说某物无限增长不能代替证明。即使图形看似对称，也要检验而非臆断。","key":"Even when a diagram appears symmetrical, its symmetry must be examined. || even when 表示让步；must be + 过去分词强调必要步骤。","task":"直观的图形可以辅助理解，却不能代替严格的证明。 || An intuitive diagram can aid understanding, but it cannot replace a rigorous proof.","q":"What does the gradient help describe? || Change in the graphed relationship. 图形术语应与实际功能联系。","note":"","wc":136,"new":["multiplication","finite","gradient","subscript","decimal","linear","infinitely","infinite","calculus","introduce","triangular","equation","spiral","oval","rectangle","geometrical","arc","transverse","radial","fraction","symmetry","symmetrical","algebra","infinity","perpendicular","radius"]},{"id":"33","title":"光与声音的实验展","en_title":"Signals We Can Observe","kind":"阅读·物理科普","en":"A prism separated a beam of white light into a spectrum. Nearby, a display compared visible light with ultraviolet radiation and a microwave signal. Visitors adjusted a model wave's amplitude and frequency, then observed how the resulting pattern changed. An antenna and a receiving aerial illustrated the transmission of information.\nIn the sound gallery, a low hum became a loud buzz. The instructor explained why an intense sound could deafen rather than merely irritate. An ultrasonic device was shown in a sealed demonstration. We compared stereo recordings with an older analogue system and listened for distortion. The ambient noise made a subtle difference difficult to discern. Only when the room became quiet could we hear it clearly. The exhibition turned unfamiliar terms into questions about perception, measurement, and the limits of our senses.","zh":"棱镜把白光束分成光谱，旁边展项比较可见光、紫外辐射和微波信号。参观者调节波形模型的振幅与频率，观察图案变化，天线展示信息传输。声音展区里，低沉嗡鸣变成响亮蜂鸣。老师解释，强烈声音可能损害听觉，而不只是烦人。超声设备采用封闭演示。我们比较立体声录音与旧模拟系统，倾听失真。环境噪声让细微差异难以辨别，只有安静后才听得清楚。展览把陌生术语转化为关于感知、测量与感官局限的问题。","key":"Only when the room became quiet could we hear it clearly. || only + when 从句前置，主句部分倒装。","task":"环境噪声可能使细微的差别难以辨别。 || Ambient noise may make subtle differences difficult to discern.","q":"Why was the difference initially hard to hear? || Ambient noise concealed it. 注意实验条件对观察的影响。","note":"","wc":133,"new":["ultraviolet","ambient","spectrum","hum","subtle","microwave","deafen","frequency","distortion","stereo","prism","analogue","aerial","discern","irritate","amplitude","perception","beam","antenna","ultrasonic","white","buzz"]},{"id":"34","title":"谈能源先弄清概念","en_title":"Discussing Energy Carefully","kind":"阅读·能源与政策","en":"At a symposium, a speaker explained nuclear fission using a model reactor. A uranium nucleus could split, releasing energy. The audience then compared this process with combustion in a fossil-fuel plant. A refinery, the speaker added, served a different purpose from an electricity generator. Mixing these concepts would produce a misleading debate.\nStudents asked about thermal efficiency, carbon dioxide emission, and the management of residual material. No single number could express every consequence. The speaker recommended a framework that considered cost, reliability, and environmental effects together. A by-product that appeared negligible in one experiment might matter at a larger scale. Before proposing a drastic change, decision-makers should quantify the expected benefits and identify the assumptions behind them. A balanced discussion requires neither blind enthusiasm nor blanket rejection, but a clear account of the relevant evidence.","zh":"研讨会上，发言者用反应堆模型解释核裂变：铀原子核可以分裂并释放能量。听众把它与化石燃料电厂的燃烧比较。发言者补充，炼油厂与发电机承担不同任务，混淆概念会误导讨论。学生询问热效率、二氧化碳排放及残余物管理。单一数字不能表达所有后果，应同时考虑成本、可靠性与环境影响。某次实验中似乎微不足道的副产物，规模扩大后可能很重要。提出剧烈变革前，决策者应量化预期收益并说明假设。平衡的讨论需要清晰证据，而非盲目热情或全盘否定。","key":"A by-product that appeared negligible in one experiment might matter at a larger scale. || 定语从句限定对象；might 保持审慎推断。","task":"评估能源政策时，应同时考虑成本、可靠性和环境影响。 || When assessing energy policy, we should consider cost, reliability, and environmental effects together.","q":"Why is a single number insufficient? || It cannot represent every consequence of an energy choice. 综合评估需要多个维度。","note":"","wc":135,"new":["consequence","uranium","negligible","residual","emission","thermal","combustion","quantify","fission","symposium","refinery","drastic","framework","fossil","by-product","split","reactor","dioxide","blind"]},{"id":"35","title":"地图上的方向与实地判断","en_title":"Finding Our Way","kind":"听力·地理与旅行","en":"Before our expedition, the scout explained latitude, longitude, and the equator on a globe. We located each hemisphere, traced a continental coastline, and distinguished an arctic route from an antarctic one. The polar regions were far from our actual destination: a mountainous district in our own province.\nWe would travel eastward, turn northward at a junction (northwards on the route card), and then proceed southwards around a steep incline. A barometer, a map, and a compass belonged in our kit. The guide warned that mist could hide the horizon and make a familiar location seem strange. If a storm developed, we would not press onward. Onwards was our general direction, not an obligation to ignore danger. A geographical description was useful, but real navigation also required attention to current conditions and the capability of the group.","zh":"考察前，向导在地球仪上解释纬度、经度和赤道，定位南北半球，描出大陆海岸，区分北极与南极路线。极地离我们的实际目的地很远：我们只去本省山区。路线先向东，在岔口向北，再向南绕过陡坡。装备包括气压计、地图和指南针。导游提醒，雾可能遮住地平线，让熟悉地点显得陌生。若有暴风雨，就不硬向前走；继续前行是总体方向，不是忽视危险的义务。地理描述有用，但实际导航也需关注当前条件与团队能力。","key":"If a storm developed, we would not press onward. || 过去叙述中的条件与未来行动，用 would 表示当时预定的应对。","task":"良好的计划应该允许人们根据实际条件调整路线。 || A good plan should allow people to adjust their route according to actual conditions.","q":"Where was the expedition actually going? || To a mountainous district in the group's own province. 极地只是地图教学内容。","note":"onward/onwards、northward/northwards 为原表括号变体，此处均保留。地图描述是虚构训练场景。","wc":136,"new":["press","onward","southwards","northward","latitude","strange","expedition","scout","barometer","incline","antarctic","polar","province","longitude","mountainous","location","geographical","continental","equator","kit","horizon","arctic","storm","mist","hemisphere","eastward"]},{"id":"36","title":"港口如何协同运作","en_title":"A Working Harbour","kind":"听力·交通与物流","en":"At the harbour, a tug helped a tanker approach the dock while a barge waited outside. A passenger liner would depart after a freight vessel. From the terminal, we could also see a yacht prepared for a coastal cruise. The port's headquarters had to coordinate these movements carefully.\nAn inspector checked a ship's hull and storage compartments. Workers would hoist a container, secure it, and record its destination before loading another. A damaged load required a different procedure; nobody could simply haul it aboard and hope for the best. A notice explained how the railway locomotive linked the port to inland distribution centres.\nThe guide said that shipbuilding and transport depended on countless modest operations performed correctly. A delay ashore could affect a schedule overseas. What looked like a chaotic gathering of machines was, in fact, an intricate arrangement of people, equipment, and information.","zh":"港口里，拖船协助油轮靠码头，驳船在外等待。客轮将在货船后离港，航站楼外还能看到准备沿海巡游的游艇。港口总部必须仔细协调。检查员查看船体和储藏舱，工人吊起集装箱、固定并记录目的地后，再装下一只。受损货物要另按流程处理，不能随便拖上船再碰运气。告示说明铁路机车如何连接港口与内陆配送中心。导游说，造船和运输依赖无数小步骤的正确执行，岸上一处延误可能影响海外时刻表。看似混乱的机器集合，实际是人员、设备与信息的精密安排。","key":"What looked like a chaotic gathering of machines was, in fact, an intricate arrangement. || what 引导主语从句，对照表面印象与实际情况。","task":"一次局部延误可能影响整个运输网络。 || A local delay can affect an entire transport network.","q":"How were inland centres connected to the port? || By railway. 听清不同交通方式之间的衔接。","note":"","wc":144,"new":["headquarters","storage","correctly","shipbuilding","overseas","ashore","outside","freight","locomotive","yacht","tanker","tug","harbour","cruise","hull","haul","hoist","inspector","terminal","gathering","inland"
