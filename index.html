ices.","q":"Why did the findings partly differ? || The selection of cases differed. 样本选择影响结论。","note":"","wc":110,"new":["intermediate","indicative","normalization","predominant","peculiarity","unemployment","sociology","prevalent","idleness","contend","selection","incorporate","dynamic","contradict","orient","equivalent","inadequate","norm"]},{"id":"82","title":"改革为什么需要试行","en_title":"Testing a Reform","kind":"写作·公共政策","en":"The college wanted to enhance teaching and diminish paperwork. A radical proposal promised a decisive improvement, but critics feared instability and the consequent confusion. Its inherent drawback was the time required for training. The committee chose to subdivide the project and test one stage experimentally. This would not constitute a perfect comparison, but it could reveal a complication early. A clear procedure would precede each change. Staff would consolidate initial gains and offset extra work with additional support. The question was whether the reform could operate economically. A resolute commitment to improvement can coexist with a willingness to reverse a decision when its effects prove undesirable.","zh":"学校想改善教学、减少文书。激进方案承诺决定性提升，批评者担心不稳定与随之混乱，其固有弊端是培训耗时。委员会决定分阶段试行，虽非完美对比，却能早发现麻烦。每次改变前明确程序，巩固初步成果，以支持抵消额外工作，并考察是否经济高效。坚定改进与不良结果出现时撤回决定并不矛盾。","key":"A resolute commitment to improvement can coexist with a willingness to reverse a decision. || coexist with 表示两种态度可以并存。","task":"小规模试行能够揭示潜在问题。 || A small-scale trial can reveal potential problems.","q":"Why was the project divided into stages? || To reveal complications before wider implementation. 分阶段有助于检验。","note":"","wc":106,"new":["consequent","precede","drawback","enhance","experimentally","decisive","economically","diminish","resolute","radical","inherent","constitute","consolidate","complication","offset","instability","undesirable","reverse","subdivide"]},{"id":"83","title":"从灵感到设计","en_title":"Making an Idea Work","kind":"写作·创新","en":"A student tried to conceive a device to help users with limited hand movement unlock a door. Her inspiration came from a relative's struggle with a stiff handle. The aim was to reduce a practical handicap. A versatile design needed careful testing. A loosely connected part could stall, and a sharp edge could prick a finger. Latent problems forced her to restrain her enthusiasm. The team would exert a small force and compare responses systematically. The prototype did not surpass every existing product. Nevertheless, it revealed a neglected need. The essence of useful design lies in testing ideas against reality; a modest invention can exemplify this principle.","zh":"学生构想帮助行动受限者开门的装置，灵感来自亲属转不动僵硬把手，目标是减少实际障碍。通用设计需测试：连接松会卡住，锐边会扎手。潜在问题让她暂缓热情，团队施加小力并系统比较。原型没超过一切产品，却揭示被忽略的需要。有用设计本质在于让想法接受现实检验，小发明也能体现原则。","key":"The essence of useful design lies in testing ideas against reality. || lie in + 动名词，指出关键所在。","task":"实用创新应该回应真实需求。 || Practical innovation should respond to real needs.","q":"What inspired the device? || A relative's difficulty with a stiff handle. 具体问题激发创新。","note":"","wc":107,"new":["restrain","systematically","loosely","stiff","conceive","inspiration","unlock","exemplify","stall","handicap","exert","versatile","latent","prick","surpass","essence"]},{"id":"84","title":"接替前任的管理者","en_title":"Taking Over a Team","kind":"听力·职场","en":"My predecessor left a detailed handover. A successor, he warned, should sift useful routines from wasteful ones. The forthcoming project required us to marshal resources, lengthen testing, and terminate an outdated arrangement. I asked colleagues to affirm what worked. A senior employee was insistent that nothing change, but we examined evidence. I learnt to shoulder responsibility without claiming exclusive wisdom. A mature manager should engage with criticism rather than expect obedient agreement. Leadership involves succession as well as personal performance. A clear handover helps the next person understand a decision and revise it thoughtfully when conditions diverge from earlier expectations.","zh":"前任留下详细交接，提醒继任者筛选有用与浪费的惯例。新项目需统筹资源、延长测试并终止旧安排。我请同事肯定有效部分，老员工坚持不变，但大家检验证据。我学着承担责任而不自称独有智慧。成熟管理者应回应批评，不只期待服从。领导涉及传承，交接帮助后来者理解决定并在条件偏离预期时修订。","key":"A mature manager should engage with criticism rather than expect obedient agreement. || rather than 连接动词短语，表达管理原则。","task":"承担责任不意味着必须独自决定一切。 || Taking responsibility does not mean deciding everything alone.","q":"What did the handover help explain? || The reasoning behind decisions. 交接不仅是任务清单。","note":"","wc":100,"new":["marshal","lengthen","mature","engage","sift","predecessor","expect","wasteful","insistent","succession","successor","forthcoming","obedient","diverge","affirm","exclusive","shoulder","wisdom","terminate"]},{"id":"85","title":"市集上的下午","en_title":"At the Bazaar","kind":"听力·生活","en":"The bazaar was situated near houses that adjoin the square. A pedlar displayed an array of objects, including a ruby imitation and an ivory-coloured plastic comb. A waitress carried tea past a mint-sweet stall. People stopped to mingle. A plump child with curly hair tried to clasp a balloon while a stout man retrieved a coin. Nearby, a woman applied lipstick using a mirror. Someone in a jean jacket played a tune. Conversation and music seemed to overlap without creating a disturbance. The market offered amusement, but its agreeable atmosphere also depended on clear paths and cleanliness. Public comfort often rests on small, almost invisible arrangements.","zh":"市集在与广场相接的房屋旁，小贩摆出仿红宝石和象牙色塑料梳等物件。女服务员端茶经过薄荷糖摊，人们停留交流。卷发胖孩子抱气球，壮实男人捡硬币，女人照镜涂口红，穿牛仔布夹克者奏曲。声音交叠却不扰人。市集有娱乐，宜人气氛也依靠道路畅通与清洁。公共舒适往往来自细小安排。","key":"Public comfort often rests on small, almost invisible arrangements. || rest on 表示依赖，用于解释服务质量。","task":"良好服务能够增强一个地方的吸引力。 || Good services can enhance a place's appeal.","q":"What supported the pleasant atmosphere? || Clear paths and cleanliness as well as entertainment. 条件不只有娱乐。","note":"jean 在 jean jacket 中作定语指牛仔布；denim jacket 也是常用表达。","wc":106,"new":["array","mint","overlap","amusement","jean","ivory","situated","adjoin","mingle","cleanliness","agreeable","waitress","clasp","curly","bazaar","ruby","plump","disturbance","lipstick","stout","pedlar"]},{"id":"86","title":"旅店的一夜","en_title":"A Night at the Inn","kind":"听力·住宿","en":"The inn stood in the vicinity of a villa. A fireplace warmed the entrance, and a kettle rested by the hearth. The host gave me a flannel blanket and showed me how to close the shutter without making it rattle. A repaired fixture held the lamp. Tired but awake, I could overhear a murmur and an occasional snore. Outside, a luminous sign seemed to float in darkness. I chose not to fret. I folded my pants, left my coat to dry, and read until the day's agitation subsided. A shower began. By morning, ventilation had helped freshen the stuffy room. Comfort depended on details, not a grand description.","zh":"旅店在别墅附近，壁炉温暖门厅，炉边有水壶。主人给绒布毯，演示安静关窗，修好的固定件支撑灯。我累却清醒，听见低语与偶尔鼾声。夜中发光招牌仿佛漂浮。我不再焦虑，折裤、晾外套、阅读到烦躁平息。阵雨开始，次晨通风使闷房清新。舒适来自细节，不是夸大描述。","key":"Comfort depended on details, not a grand description. || 简洁对照强调评价应基于实际体验。","task":"住宿质量也取决于细节。 || The quality of accommodation also depends on attention to detail.","q":"What helped freshen the room? || Ventilation. 辨认具体改善措施。","note":"","wc":108,"new":["shower","freshen","awake","float","overhear","vicinity","pants","fixture","agitation","flannel","luminous","rattle","murmur","snore","stuffy","villa","hearth","fireplace","shutter","fret"]},{"id":"87","title":"一场安全演练","en_title":"A Safety Drill","kind":"听力·公共安全","en":"A siren sounded during the drill. The scenario involved a blaze near storage, where trained staff would assess the flame. We were not asked to improvise a way to extinguish it. Pictures explained how a spark could ignite material or scorch a surface. A lighter, a cigar butt, and a faulty fuse appeared in separate examples. A firework belonged in another discussion, not in the room. The purpose was prevention. We kept the perimeter clear and followed an escort. Nobody should linger for belongings or create an uproar. Afterwards, we recalled the sequence. Preparedness means knowing what to do first and which actions require trained personnel.","zh":"演练警报响起，情境是储物处失火，由受训者评估火焰，不要求游客临时自创灭火法。图片解释火花点燃材料、热灼伤表面，案例分别涉及打火机、雪茄烟头与坏保险丝。烟花另讨论，不放现场。重点是预防：外围畅通，跟随引导，不留恋财物、不喧哗。结束后回忆顺序，准备意味着知道先做什么和哪些行动需受训人员。","key":"Preparedness means knowing what to do first. || what to do 作 knowing 的宾语，简洁说明准备的内容。","task":"明确行动顺序能够减少混乱。 || A clear sequence of actions can reduce confusion.","q":"Who handled specialized actions? || Trained personnel. 分工是关键。","note":"","wc":106,"new":["perimeter","prevention","ignite","cigar","extinguish","blaze","scorch","uproar","siren","flame","linger","butt","lighter","firework","fuse","escort"]},{"id":"88","title":"病区志愿者的职责","en_title":"A Volunteer in the Ward","kind":"听力·服务","en":"In the ward, I helped visitors find seats. A nurse asked me to fetch a blanket, not to inject medicine or assess an injured limb. One patient wore a bandage over a scar. I could offer directions and company, not medical judgment. The coordinator said that a small errand could be vital to a busy team. I should not hover over patients or spread an unconfirmed outbreak story. If someone began to sneeze, I would follow the facility's instructions. A pregnant visitor thanked me, as did a parent holding a baby. Reliable service required understanding my role and knowing when to seek help.","zh":"病区里，我帮访客找座位。护士让我拿毯，不是注射或评估伤肢。有患者疤上缠绷带，我能指路陪伴，不能医疗判断。协调员说小跑腿对忙碌团队也重要，不应围着患者或传未核实疫情故事。有人打喷嚏就遵设施指引。孕妇与抱婴儿家长感谢我。可靠服务需要理解职责并知道何时求助。","key":"Reliable service required understanding my role and knowing when to seek help. || 并列动名词说明可靠服务的两个条件。","task":"清楚职责范围有助于提供可靠服务。 || Understanding the scope of one's role helps make service reliable.","q":"What could the volunteer offer? || Directions and company. 不能越权作医疗判断。","note":"","wc":103,"new":["inject","baby","vital","hover","pregnant","limb","sneeze","errand","ward","bandage","scar","outbreak"]},{"id":"89","title":"阅读困难的历史材料","en_title":"Reading Difficult Archives","kind":"阅读·历史","en":"An archive described a slave forced to work under a ruthless overseer. Its purpose was to document injustice, not excuse it. Some experiences remained behind a veil of official language. Another document discussed an opium trade dispute; a third recorded a torpedo attack. These subjects required context beyond a single paragraph. We compared sources rather than let one vivid account become the whole story. The class also examined language that could degrade a person. A respectable title did not make a corrupt official merciful, and a label such as coward could conceal complexity. Learning difficult vocabulary should sharpen judgment rather than normalize the harm it describes.","zh":"档案描述奴隶在残酷监工下被迫劳动，目的记录不公，不是开脱。有些经历被官方语言遮蔽。另文涉及鸦片贸易争端，还有鱼雷袭击，都需要超过一段文字的语境。我们比较来源，不让生动记载替代全部历史，也审视贬低人的措辞。体面头衔不使腐败官员仁慈，“懦夫”等标签可能掩盖复杂性。难词应提高判断，而非让人把伤害当常态。","key":"A respectable title did not make a corrupt official merciful. || make + 宾语 + 形容词，区分名号与实质。","task":"理解历史需要比较不同来源。 || Understanding history requires comparing different sources.","q":"Why were several sources compared? || One account could not explain the whole history. 单一来源有限。","note":"","wc":106,"new":["slave","torpedo","veil","opium","ruthless","degrade","merciful","coward","respectable","corrupt"]},{"id":"90","title":"展厅里的运动模型","en_title":"Motion on Display","kind":"阅读·工程","en":"A model arm could deflect an object, and a scale measured the deflection. Another display asked us to turn a handle clockwise and watch a wheel reverse direction. We compared velocity with speed. Nearby, a channel made two streams converge or diverge. A metal mesh caught particles, while a cubic container collected liquid. The guide asked us to observe rather than assume equilibrium. A machine might appear stable while material remained in constant flux. The guide described this as a dynamical system. One apparatus could eject a token after each cycle; another showed how friction might retard motion. A useful explanation connects what learners see with the conditions that produce it.","zh":"模型臂让物体偏转，刻度量偏转程度。另一展项让人顺时针转把手，看轮子反向，比较速度矢量与速率。通道使两股流汇合或分开，金属网截颗粒，立方容器收液。导游要求观察，不假定平衡。机器看似稳，物质仍流变，导游将其称为动力系统。一装置每周期弹代币，另一演示摩擦减缓运动。有用解释把所见与产生条件联系起来。","key":"A machine might appear stable while material remained in constant flux. || while 对照外表与内部状态。","task":"解释应该把现象与产生条件联系起来。 || An explanation should connect a phenomenon with the conditions that produce it.","q":"Why was direction discussed? || Direction is part of velocity, unlike speed. 区分近义术语。","note":"retard 在此是减缓的动词，不可据此当作称呼人的词。dynamic / dynamical 均保留；普通作文用 dynamic 的场景更多。","wc":111,"new":["eject","retard","velocity","mesh","equilibrium","deflection","flux","cubic","deflect","clockwise"]},{"id":"91","title":"排练室中的声音与动作","en_title":"Rehearsing a Scene","kind":"听力·舞台与动作","en":"Our energetic group prepared a circus scene for a school play. A performer would march in a parade, blow a shrill whistle, and shout \"Hurrah!\" Another would flap a cloth wing and pretend to fly. The comic hero had to hop over a box, squat behind it, then stride into view. Nobody needed a dangerous stunt.\nThe director asked us to vary the sound. A character might whisper, hiss, grunt, or give a sudden exclamation. A metallic bell would jingle; a drumbeat would follow a quick rap on the door. We practised when to clap, how to reel in surprise, and where to pause.\nThe scene ended with a hymn followed by a hush. Its effect depended on contrast and timing. Even a fantastic story requires disciplined preparation. A good performance can emerge when many small actions become a harmonious whole.","zh":"活力十足的剧团排马戏场景：演员游行、吹尖哨、喊好耶，另一人扑布翅假装飞。喜剧英雄跳过箱子、蹲下再大步入场，不做危险特技。导演要求变化声音：低语、嘶声、咕哝或突然感叹，金属铃叮当，敲门后接鼓点。大家练习鼓掌时机、惊讶踉跄和停顿。结尾是圣歌与寂静，效果依赖对比和节奏。幻想故事也需严谨准备，小动作协调成整体才能形成好表演。","key":"A good performance can emerge when many small actions become a harmonious whole. || emerge 表示形成；when 从句说明形成条件。","task":"团队成果依赖每个人对细节的关注。 || A team's success depends on each member's attention to detail.","q":"What made the final scene effective? || Contrast and timing. 不是危险特技。","note":"","wc":141,"new":["grunt","hymn","hop","hiss","rap","circus","parade","fantastic","reel","metallic","shrill","energetic","exclamation","harmonious","hurrah","emerge","fly","whisper","stride","hush","squat","jingle","flap"]},{"id":"92","title":"自然观察中的误判","en_title":"Looking without Labels","kind":"阅读·自然观察","en":"At dawn, a cock called near the fence. A tiny insect gave a child a sting, and he declared every bug vicious. The guide asked him to reconsider. An unfamiliar animal was not necessarily a hazard; a shark on a poster was neither a cartoon villain nor a creature to tease.\nWe watched birds pluck food, observed a plant repel an insect, and noticed how a leaf could taper towards its tip. The guide invited us to roam only within the marked area. We should not clutch a creature, disturb it for a photograph, or let curiosity become thoughtless intrusion.\nA nickname such as \"monster\" could obscure an animal's actual behaviour. So could the urge to adore everything that looked soft. Observation requires patience with what we do not yet understand. Respect for nature is more reliable when it rests on attention rather than fear or sentiment alone.","zh":"黎明公鸡叫，昆虫蜇了孩子，他便说所有虫都恶毒。导游让他重想：陌生动物未必有害，海报中的鲨鱼既非卡通反派，也不该逗弄。我们看鸟啄取食物、植物驱虫、叶片尖端渐细，只在标记范围走动，不抓生物或为拍照打扰。叫动物“怪物”可能掩盖真实行为，喜欢一切软萌东西也会误判。观察需耐心面对未知，对自然的尊重建立在留心之上比只靠恐惧或感情可靠。","key":"An unfamiliar animal was not necessarily a hazard. || not necessarily 表示未必，避免绝对化判断。","task":"观察应该帮助我们修正最初的印象。 || Observation should help us revise our initial impressions.","q":"Why did the guide challenge the child's statement? || One sting did not justify a judgment about every insect. 避免以偏概全。","note":"","wc":148,"new":["clutch","roam","cock","vicious","taper","hazard","shark","cartoon","sting","repel","pluck","sentiment","tease","adore","bug","nickname"]},{"id":"93","title":"冒险故事如何制造紧张","en_title":"Suspense and Action","kind":"阅读·叙事语言","en":"In a fictional adventure, a fighter tried to cross an icy pass before an enemy could seize the bridge. Ice made each step uncertain. The story did not ask readers to imitate him: its aim was to create fright. A gigantic gate guarded a vault, and a skeleton lay beneath a faded flag.\nThe hero would grope through darkness, heave a heavy door, and wield a broken pole to keep an attacker away. His companion wanted to punch and thrash their opponent, but the hero chose to subdue the conflict without further violence. A trap threatened to expel them into the snow.\nThe climax brought an unexpected ally. A fearsome appearance had concealed kindness. Readers felt astonishment because their assumptions had been overturned. Suspense can terrify or excite through selective information. To understand the story, we must examine what the narrator reveals, what remains a mystery, and when that information changes.","zh":"虚构冒险中，战士试图在敌人夺桥前穿过冰冷山口。冰使步步危险，故事意在制造恐惧，不供模仿。巨门守宝库，褪旗下躺骨架。英雄摸黑推重门、挥断杆阻攻击；同伴想拳打痛揍敌手，英雄选择缓和冲突，陷阱险把他们弹入雪中。高潮出现意外盟友，可怕外表藏善意，读者因预设被推翻而惊讶。悬念通过信息选择使人害怕或兴奋，阅读需看叙述者何时揭示什么。","key":"Readers felt astonishment because their assumptions had been overturned. || 过去完成时被动表示先前假设已被推翻。","task":"叙述者可以通过控制信息来制造悬念。 || A narrator can create suspense by controlling information.","q":"Why was the ally surprising? || A fearsome appearance had led readers to expect hostility. 外表与实际反差。","note":"动作来自虚构故事，学习重点是叙事、推断和动作动词。全文其他故事与研究项目也为教学情境。","wc":151,"new":["thrash","subdue","terrify","ice","mystery","expel","gigantic","fright","astonishment","wield","skeleton","vault","fighter","punch","icy","heave","grope"]},{"id":"94","title":"改变偏见的相处","en_title":"Beyond First Impressions","kind":"写作·人际与包容","en":"I had dismissed my new neighbour as snobbish because he rarely spoke. He was bald, wore formal clothes, and looked decidedly uneasy at our first gathering. I foolishly treated those details as evidence of his personality. That judgment now seems shameful.\nWhen a storm damaged the street, he worked tirelessly to help. He did not preach about generosity or deliver a sermon on duty. He simply offered time and tools. I felt shame at my earlier assumption and tried to make amends.\nThe experience taught me not to resent someone for failing to fit my expectations. A tolerant community must make room for different manners, including silence. A person may be reserved without being rude, just as a lively manner need not indicate goodness. We ought to replace petty labels with patient attention. The requisite first step is often to admit that our impression may be wrong.","zh":"邻居少言，我就判他势利。他秃顶、衣着正式，初聚明显不自在，我愚蠢地当作性格证据，如今想来羞愧。风暴损街时，他不辞辛苦帮忙，不宣扬慷慨或说教责任，只贡献时间工具。我为旧判断羞愧并弥补。不要因别人不符期待而怨他。包容社区容纳不同举止，也包括沉默。内敛未必无礼，活泼也未必善良。应用耐心观察替代琐碎标签，第一步常是承认印象可能错。","key":"A person may be reserved without being rude. || without + 动名词区分常被误认为相伴的两种特征。","task":"我们不应该仅凭外表判断一个人的品格。 || We should not judge a person's character solely by appearance.","q":"What changed the narrator's view? || The neighbour's practical help after a storm. 实际行为修正判断。","note":"","wc":147,"new":["requisite","petty","bald","preach","snobbish","shame","goodness","tolerant","decidedly","shameful","resent","sermon","uneasy","ought"]},{"id":"95","title":"好的结论有多大范围","en_title":"The Scope of a Conclusion","kind":"阅读·研究与表达","en":"Our research team examined a global trend over a ten-year span. An apparent similarity between two regions was notable, but the differences were equally important. We divided the data into a segment for each period and checked whether simultaneous changes had a shared explanation.\nA figure of nought did not necessarily prove absence; it might reflect the way a variable was recorded. Nor did a dramatic peak justify an indefinite forecast. The teacher asked us to qualify each inference and identify whether a result was statistically useful or merely interesting.\nWe could deem the findings suggestive without presenting them as final. The overall range remained broad, and a peripheral factor might still matter. Research should bring uncertainty to the fore rather than hide it. To pore over evidence is worthwhile when it makes a conclusion more precise. Its value lies not in sounding formidable but in saying exactly what the data can support.","zh":"团队研究十年全球趋势，两地区表面相似值得注意，差异同样重要。按时期分段数据，检查同步变化是否共同原因。零值未必证明不存在，也可能来自记录方式；明显峰值不能证明无限期预测。老师要求给推断加适用限制，区分统计价值与仅有趣。结论可算提示性却非定论，范围仍广，边缘因素也可能重要。研究应呈现不确定性，仔细审证据是为了准确。价值不在听来深奥，而在准确说数据支持什么。","key":"Its value lies not in sounding formidable but in saying exactly what the data can support. || not in ... but in ... 形成平行动名词结构。","task":"一个结论的范围不应该超出证据所能支持的范围。 || A conclusion should not extend beyond what the evidence can support.","q":"Why might a recorded zero be ambiguous? || It could reflect how a variable was recorded rather than true absence. 数据需结合测量方式。","note":"","wc":153,"new":["peripheral","notable","fore","qualify","indefinite","nought","simultaneous","deem","global","segment","range","pore","similarity","formidable","peak","span"]},{"id":"96","title":"贸易增长与公共责任","en_title":"Trade and Responsibility","kind":"写作·经济发展","en":"A commonwealth of fictional coastal states sought to expand trade. Its members wanted to combat discrimination, reduce a monopoly's influence, and prevent development from damaging a virgin forest. The plan would elevate incomes only if benefits reached ordinary households.\nThe first proposal overlooked environmental degradation. Extraction of raw materials could deprive a community of clean water, and waste might infect an already polluted stream with harmful microbes. A destructive project could bring a short boom and a disastrous decline. Growth alone was not enough.\nThe states agreed to review each proceeding before approval and publish the terms thereof in accessible language. One group threatened a boycott if consultation was ignored. The debate showed that cooperation requires more than agreeing on an attractive goal. Trade can improve lives, but its design must account for who bears the costs and who receives the gains.","zh":"虚构沿海国家联合体想扩贸易、反歧视、减垄断影响，并防开发损原始森林。收益到普通家庭才提升收入。初案忽略环境退化：开采可能剥夺社区清水，废物可把有害微生物带入已污染溪流；破坏项目或先短繁荣后灾难衰退。各国同意批准前审查程序，以易懂语言公布相关条款；团体威胁若忽略咨询就抵制。合作不止同意漂亮目标，贸易制度要问谁承担成本、谁得到收益。","key":"Its design must account for who bears the costs and who receives the gains. || account for 后两个宾语从句，完整列出分配问题。","task":"经济增长应该兼顾当地居民与环境。 || Economic growth should take local residents and the environment into account.","q":"Why was growth alone insufficient? || It could create environmental harm and unequal costs. 增长与分配、环境并非同一指标。","note":"commonwealth 在此是虚构联合体的设定，不是对现实组织的报道。","wc":142,"new":["disastrous","elevate","thereof","infect","destructive","monopoly","degradation","commonwealth","combat","deprive","virgin","extraction","proceeding","discrimination","boycott"]},{"id":"97","title":"如何坚持一个长期项目","en_title":"Staying with a Project","kind":"写作·毅力与方法","en":"A long project can overwhelm even an industrious student. My first inclination was to work excessively and disregard rest. The result was not extraordinary productivity but stiffness, fatigue, and a wish to desert the task. I nearly let one difficult week destine the whole project for failure.\nMy tutor suggested a steadier rhythm. I should adhere to a realistic schedule, strive for a clear daily objective, and persist without treating every delay as disgrace. A setback could disillusion me, but it did not have to end the endeavor.\nWe revised the plan and allowed time to elapse between demanding sessions. Ideally, work would finish early; ordinarily, it would require adjustment. I learnt to waver less when a problem appeared and to ask for help before frustration became overwhelming. Determination is not a promise never to hesitate. It is the willingness to resume thoughtfully after difficulty.","zh":"长项目连勤奋学生也会不堪重负。我起初过度工作不休息，结果不是惊人效率，而是僵硬疲劳、想放弃，险让一周困难决定项目失败。导师建议稳定节奏：遵现实计划，每天有目标，坚持但不把延误当耻辱。挫折会打破幻想，却不必终止努力。我们修计划，在高强度时段间留间隔。理想上早完成，通常仍需调整。我少些动摇，在沮丧压倒自己前求助。决心不是从不犹豫，而是困难后审慎继续。","key":"Determination is not a promise never to hesitate. || 用简短句澄清毅力的含义，再接具体解释。","task":"坚持也需要根据实际情况调整计划。 || Persistence also requires adjusting a plan to actual circumstances.","q":"What was wrong with the initial approach? || Excessive work without sufficient rest caused fatigue rather than lasting productivity. 方法与结果不匹配。","note":"","wc":145,"new":["adhere","stiffness","desert","waver","ordinarily","disgrace","inclination","industrious","strive","destine","ideally","disillusion","hesitate","excessively","persist","elapse","endeavor"]},{"id":"98","title":"礼貌拒绝与坚定边界","en_title":"Saying No Clearly","kind":"听力·人际沟通","en":"A classmate was obstinate about borrowing my equipment. He would entreat, implore, and finally plead that I make an exception. I wanted to oblige him, but the device belonged to a team and could not leave the laboratory without authorization.\nI explained the limitation without calling him selfish. He tried to defy the rule, insisting that a small exception was a trifle. I replied that the issue was shared responsibility. A device that went missing would cause more than a troublesome afternoon.\nThe discussion was tense, yet I did not need to slap the table or summon others to shame him. I could remain calm and suggest an approved alternative. A clear boundary need not be hostile. Respectful refusal can protect cooperation when a hasty favour would place other people's work at risk.","zh":"同学执意借设备，先恳求、再央求，最后请求破例。我想帮，但设备属团队，未经授权不能出实验室。我解释限制不骂自私。他想违规则，称小例外不值一提，我说问题是共同责任，丢设备可不止麻烦一下午。讨论紧张，但不用拍桌或叫别人羞辱他，我能平静提获准替代。边界不一定敌对，仓促帮忙会让他人工作冒险时，尊重的拒绝反能保护合作。","key":"A clear boundary need not be hostile. || need not 表示不必，并非 must not 的禁止。","task":"礼貌拒绝不等于不愿合作。 || A polite refusal does not imply an unwillingness to cooperate.","q":"Why could the device not be lent immediately? || It was shared equipment requiring authorization to leave the lab. 责任归属决定边界。","note":"","wc":133,"new":["summon","defy","plead","trifle","oblige","implore","troublesome","slap","obstinate","entreat"]},{"id":"99","title":"旧广告与现代读者","en_title":"Reading an Old Advertisement","kind":"阅读·语言变化","en":"A periodical from an earlier epoch advertised a classic household product. It promised everlasting softness and a solution to every cleaning problem. One page displayed a primitive tool; another claimed a modern process would make every stain disappear. The teacher asked us to distinguish persuasive language from reliable evidence.\nWe examined the word \"smart\" and compared its meanings in several contexts. A fashionable appearance and a useful technological feature were not identical. Nor did a noted inventor's endorsement guarantee a product's success. The advertisement's simplicity concealed unanswered questions.\nThe exercise was an apt introduction to critical reading. A claim may be memorable without being sound. Before deciding to subscribe to a service or buy a product, a reader should examine its specific promise, the evidence offered, and the conditions under which that promise could hold.","zh":"旧时代期刊宣传经典家用品，承诺永恒柔软、解决一切清洁问题。一页展示简陋工具，另一页称现代工艺让所有污渍消失。老师要求区分劝服语言与可靠证据。大家比较 smart 在不同语境的意义：时髦外表与有用科技功能不同，知名发明者背书也不保证成功。广告简洁却隐藏未答问题。这是批判阅读的恰当引入：主张好记未必可靠。订服务或买商品前，应看具体承诺、证据与适用条件。","key":"A claim may be memorable without being sound. || may 与 without 共同表示两种性质不必相伴。","task":"广告的吸引力不能代替产品性能的证据。 || An advertisement's appeal cannot replace evidence of a product's performance.","q":"What did the advertisement's simplicity conceal? || Unanswered questions about evidence and conditions. 简洁不代表完整。","note":"","wc":135,"new":["noted","primitive","everlasting","softness","apt","periodical","classic","subscribe","simplicity","smart","epoch"]},{"id":"100","title":"一座城市的旧照片","en_title":"A City in Photographs","kind":"翻译·城市与记忆","en":"The exhibition placed an old photograph beside a recent one. A mighty bridge now crossed the river, and new buildings seemed to spring from every vacant plot. Yet the curator did not herald every change as progress. The disappearance of a familiar lane could bring both convenience and loss.\nIn the older image, a woman stood beside a cradle while a worker pulled a cart. A narrow path led to a small house. In the newer one, a broad road occupied the same spatial position. The contrast brought changes in everyday life into focus.\nVisitors were invited to meditate on what the city should preserve. Nostalgia alone could not answer that question, but neither could an account concerned only with growth. A city is more than a collection of structures. Its evolution also involves memory, relationships, and the ways people learn to share space.","zh":"展览并列旧照新照。大桥跨河，新楼从空地涌起，策展人却没把每个变化都称进步：熟悉小巷消失可能兼有便利与失落。旧照女人站摇篮旁、工人拉车，窄道通小屋，新照同位置是宽路，对比凸显生活变化。游客被邀思考城市该保留什么，怀旧不能独自回答，但只谈增长也不够。城市不只是建筑集合，演变还涉及记忆、关系与共享空间方式。","key":"A city is more than a collection of structures. || more than 表示不只是，可引出社会与文化维度。","task":"城市的发展也应关注居民的记忆与关系。 || Urban development should also consider residents' memories and relationships.","q":"Did the curator describe every change as progress? || No. Some changes brought loss as well as convenience. 评价有两面。","note":"","wc":144,"new":["cradle","disappearance","mighty","spatial","evolution","herald","meditate"]},{"id":"101","title":"演员怎样表达情绪","en_title":"Acting without Exaggeration","kind":"听力·动作与情绪","en":"During her maiden performance, an actress had to play a frightened traveller. Her first attempt was extraordinarily loud. She would pant, stagger, and quiver, then cry, \"Alas, what awful news!\" The director asked her to reconsider. A frightened person might become mute or speak in a hoarse whisper; fear did not always require a violent outburst.\nThe next scene involved a wretched character unable to escape a memory. His torment interrupted his slumber, and he spoke of endless woe. The actor wanted to smash a prop and shatter a glass. The director substituted safe sound effects and asked him to express the conflict through posture.\nHitherto, the group had treated strong emotion as a reason to shout. Now they learnt that stillness could be equally powerful. Their muse was ordinary observation. The scene became more convincing when the actors stopped trying to display every possible feeling at once. Less movement did not mean less meaning.","zh":"首次演出中，女演员扮受惊旅人。她起初格外响亮：喘气、踉跄、发抖，再喊“唉，多可怕的消息！”导演让重想：受惊者也可能沉默或嘶哑低语，并非总猛烈爆发。下一角色被记忆折磨，睡眠受扰，倾诉无尽悲哀。演员想砸道具与玻璃，导演换安全音效，请他用姿势表达冲突。此前大家把强情绪当大喊理由，如今学会静止也有力量。灵感来自日常观察，不同时展示一切情绪反使场景可信。动作少不等于意义少。","key":"Less movement did not mean less meaning. || 平行比较形式表达数量与效果不能简单等同。","task":"强烈的情绪也可以通过安静的方式表达。 || Strong emotions can also be expressed quietly.","q":"What changed the actors' approach? || They learnt that stillness could convey emotion as powerfully as shouting. 表达手段不只有音量。","note":"maiden 表示首次的，修饰 performance；muse 表示灵感来源。","wc":155,"new":["awful","torment","slumber","maiden","mute","pant","hitherto","stagger","violent","shatter","extraordinarily","smash","muse","wretched","woe","alas","hoarse","quiver"]},{"id":"102","title":"维修日的准备与收尾","en_title":"Preparing for a Repair Day","kind":"听力·劳动与维护","en":"Before volunteers arrived, staff would erect a sign and inspect a damaged bench. A bump on its surface could catch a sleeve. An old hook needed replacing, and the printer required a new cartridge. The caretaker asked us to leave a lifting jack to trained workers and report any mechanical jam.\nWe cleaned dirt without treating every surface alike. A label warned that bleach could damage one material. Another object showed decay, not merely filth. We learnt to wipe a spill, wring a cloth, and flush a dirty channel only as instructed. Nobody should grind a sharp edge without the right training.\nOutside, a contractor examined old tar on the path. The remainder of the team sorted reusable materials. Maintenance involved knowing what to do, what to inspect, and when to seek expertise. The lesson was practical: preserving useful things requires attention both before work begins and after the tools are put away.","zh":"志愿者到前，员工立告示、查破凳。凸起可能勾袖，旧钩需换，打印机需新墨盒。管理员要求千斤顶交受训者，机械卡住就报告。清洁要区别表面：漂白剂会损某材料，另一物件是腐朽不只是脏。大家按指引擦溢出物、拧布、冲脏槽，不擅磨锐边。外面承包人查路上旧沥青，其余人分类可复用材料。维护需知道做什么、查什么、何时求专业帮助，开工前和收工具后都要用心。","key":"Maintenance involved knowing what to do, what to inspect, and when to seek expertise. || 三个疑问词加不定式并列，组织行动步骤。","task":"维护工作需要适当的知识和准备。 || Maintenance requires appropriate knowledge and preparation.","q":"Was every dirty-looking surface treated in the same way? || No. Some materials could be damaged, and some objects showed decay. 区分材质与损坏类型。","note":"","wc":153,"new":["bump","grind","hook","flush","filth","erect","decay","remainder","jack","bleach","wring","jam","cartridge","tar"]},{"id":"103","title":"运动会上的小插曲","en_title":"An Incident at Sports Day","kind":"听力·校园活动","en":"Our class was bound for the field when two pupils almost collided at a doorway. The teacher explained that people can collide even without moving quickly if everyone tries to pass at once. He asked us to form a row, keep an elbow away from others, and watch the slippery slide.\nA mischievous child tried to wink at his friend during the instructions. His playful wink was not itself a problem, but he was about to stray onto a wet area. The teacher chose to intervene calmly. Mischief did not require a dramatic punishment; safety did require attention.\nLater, we watched a horse trot in a supervised demonstration. A cold wind brought a chill, so the group moved indoors to quench its thirst. Nobody made a fuss about the change. The event was memorable because staff combined clear boundaries with kindness. They did not confuse an energetic child with a troublesome one.","zh":"去操场时两孩子险在门口相撞。老师解释，一拥而过即使不快也会碰撞，要求排队、肘别碰人、小心滑梯。淘气孩子向朋友眨眼，眨眼本身无妨，但他快误入湿地。老师平静介入：调皮不需大惩罚，安全却需注意。后来大家看受监督的马小跑演示。冷风带寒意，群体进屋解渴，没人为变化大惊小怪。活动难忘因工作人员把明确界限与善意结合，没把活泼等同麻烦。","key":"They did not confuse an energetic child with a troublesome one. || confuse A with B 表示把两者混淆。","task":"清楚的规则可以与友善的态度并存。 || Clear rules can coexist with a kind attitude.","q":"Why did the group move indoors? || A cold wind brought a chill. 天气变化引出地点调整。","note":"","wc":152,"new":["wink","elbow","bound","wind","quench","mischief","collide","stray","fuss","slide","intervene","chill","row","trot"]},{"id":"104","title":"信息传播与判断","en_title":"How a Claim Travels","kind":"阅读·研究与媒介","en":"The circulation of a striking story can outpace its verification. In our project, we examined the propagation of a claim across a cluster of accounts. Its incidence increased sharply after one popular post, but popularity did not establish truth. We had to examine the representation of events and the possibility of fabrication.\nThe analysis was subject to clear limits. A missing record could make a conclusion invalid, while an apparently uniform pattern might conceal distinct groups. We could not assume that people responded uniformly or invariably shared the same motive. Nor did a negative comment prove hostility.\nWe distinguished reach from penetration into a particular audience. A story could be seen by many people yet understood by few. The result was a useful lesson in public consciousness: exposure does not automatically produce understanding. Before deciding what a message achieves, researchers must ask who encountered it, how they interpreted it, and what evidence supports the conclusion.","zh":"醒目故事传播可能快于核实。项目考察主张跨账号群传播，热门帖后出现率升高，但流行不证明真相，需查事件呈现及编造可能。分析有限制：缺记录可能使结论无效，表面统一模式可能藏不同群体，不能假设人反应一致、动机总相同，负面评论也不证明敌意。我们区分触及人数与在特定受众中的深入程度：多人见却少人懂。公众认知提醒，接触不自动产生理解，评价信息效果要问谁接触、如何解读、证据是什么。","key":"Exposure does not automatically produce understanding. || 简洁因果否定，适合讨论信息、教育和传播。","task":"信息传播广泛，并不意味着它被准确理解。 || Wide circulation of information does not mean that it is accurately understood.","q":"Why was reach distinguished from understanding? || Many people might see a story while few understand it accurately. 接触与理解是不同指标。","note":"","wc":155,"new":["fabrication","consciousness","cluster","circulation","uniformly","subject","representation","negative","propagation","incidence","distinct","penetration","invariably","invalid"]},{"id":"105","title":"度假计划中的取舍","en_title":"Choosing a Short Break","kind":"听力·计划与偏好","en":"My friend wanted to immerse herself in a new place, whilst I preferred a quiet break. We nearly let that contrast become a clash. She proposed a strenuous tramp through hills; I feared the walk would devour our limited time and leave no room to rest.\nWe agreed not to gamble on an unrealistic timetable. A morning visit could precede an afternoon near the coast. I could indulge in reading, while she could explore nearby paths. We would not claim that one preference was more sensible in every case. Nor would we let stubborn insistence turn a holiday into strife.\nThe compromise pleased us both. I learnt that a plan can have direction without being rigid. My friend learnt that rest need not be laziness. Shared travel requires a willingness to embrace another person's priorities without abandoning one's own. A small adjustment can preserve both cooperation and enjoyment.","zh":"朋友想沉浸新地方，我想安静休息，差异险成冲突。她提议山间长途跋涉，我怕耗尽时间不能休息。双方不拿不现实日程冒险，上午参观、下午海边，我享阅读，她走附近小径。不说某偏好总更合理，也不执拗到度假变争斗。折中让两人满意：计划可有方向而不僵硬，休息不一定懒。结伴旅行需接纳他人优先事项而不放弃自身，小调整能保合作与乐趣。","key":"A plan can have direction without being rigid. || without + 动名词，表示目标与灵活性可以兼容。","task":"合作需要认真考虑不同的优先事项。 || Cooperation requires taking different priorities seriously.","q":"What compromise did the friends make? || A morning visit and an afternoon allowing different activities near the coast. 共同计划保留个人空间。","note":"","wc":148,"new":["stubborn","devour","whilst","clash","indulge","gamble","strife","immerse","embrace","tramp"]},{"id":"106","title":"讲清楚而不是说漂亮","en_title":"A Talk That Changed Direction","kind":"写作·表达与逻辑","en":"My first talk was a bore: it sounded elaborate but gave listeners little to use. I had mistaken simplicity for ignorance and filled the slides with vague claims. A peer asked what I actually meant. That commonsense question changed the presentation.\nI removed an improper comparison and explained why one inference was only tentative. Inasmuch as the evidence was incomplete, I could not claim certainty. Notwithstanding that limitation, the project still offered a useful insight. I would not say the result was incredible or doubtless correct merely to impress.\nI also replaced \"male versus female abilities\" with a more precise question about expectations. Describing a role as masculine or feminine did not prove that anyone was naturally suited to it. The improved talk avoided an empty opposition and offered a clear argument. Careful wording can help listeners think rather than simply persuade them to agree.","zh":"首次演讲枯燥：听着精巧却无实用内容。我把简单当无知，幻灯片满空话。同伴问到底什么意思，这个常识问题改变报告。我删不当比较，解释推断暂定。由于证据不全，不能称确定；尽管有限制，仍有启发。不为讨好就说结果不可思议或无疑正确。还把“男女能力对抗”改为更准确的社会期待问题：角色被称男性化或女性化，不证明谁天生适合。好措辞帮助听者思考，而非只劝同意。","key":"Inasmuch as the evidence was incomplete, I could not claim certainty. || inasmuch as 表示因为，较正式；日常作文用 because 也自然。","task":"准确表达比夸大结论更有说服力。 || Accurate expression is more persuasive than overstating a conclusion.","q":"What changed the presentation? || A peer's question about what the speaker actually meant. 清晰问题促成具体化。","note":"inasmuch as / notwithstanding 属较正式表达。清楚自然时，because / despite 往往已经足够。","wc":145,"new":["commonsense","inasmuch","ignorance","doubtless","bore","feminine","peer","incredible","masculine","notwithstanding","improper","versus"]},{"id":"107","title":"记录一个项目的变化","en_title":"Keeping a Useful Project Log","kind":"阅读·连接词与时间","en":"Our project log stated that work was currently behind schedule. Hitherto, the team had relied on informal updates. Henceforth, each member would record progress weekly. The first review identified a delay; subsequently, we revised the timetable. Thereafter, reports became more consistent.\nThe log was useful because it explained decisions, not just dates. A note might say that a change could pose a risk or that a resource was on the verge of running out. Another would explain why an apparently easy solution had proved of no avail. A summary referred to a problem and the lessons contained therein.\nFormal connectors should clarify relationships, not decorate a paragraph. Incidentally, an extra fact belongs only where it helps the reader. A record becomes confusing when every sentence sounds official but no one can tell what happened. The best account lets readers trace a decision, understand its reason, and see what followed.","zh":"项目日志写工作目前落后。此前靠非正式更新，此后每人每周记进展。首轮审查发现延误，随后改时间表，此后报告更一致。日志有用因解释决定不只记日期：变化可能带风险，资源濒临用尽，看似简单方案无效，摘要提到问题及其中教训。正式连接词应说明关系而非装饰。顺带事实只有帮助读者才值得放。每句官腔却不知发生什么只会困惑，最佳记录能追决定、明原因、见后果。","key":"Formal connectors should clarify relationships, not decorate a paragraph. || clarify relationships 可迁移到写作建议；避免堆砌连接词。","task":"好的记录应该清楚说明决定的原因。 || A good record should clearly explain the reasons behind decisions.","q":"Why was the log useful? || It explained decisions rather than merely listing dates. 信息之间有清晰关系。","note":"hitherto、henceforth、thereafter、therein 用于辨认正式文本，写作文不必成串使用。","wc":149,"new":["therein","avail","subsequently","currently","henceforth","incidentally","thereafter","verge","pose"]},{"id":"108","title":"讲述变化的科普作者","en_title":"Explaining Change to the Public","kind":"阅读·科学传播","en":"An author used an elemental example to explain a complex process. A growing plant could originate from a tiny seed, yet its development depended on many conditions. Readers should not confuse a simple starting point with a simple outcome.\nThe author compared the example with a different system, carefully noting where the analogy would deviate from reality. She refused to let a memorable image perplex readers about the underlying science. A spectacular claim might attract attention, but sheer novelty did not make it true.\nThe final chapter urged readers to remain curious. They could marvel at a discovery without attributing it to superstition. They could acknowledge a mystery without assuming that it would remain forever unexplained. Scientific communication succeeds when it preserves wonder while making the limits of knowledge visible. An explanation can be both accessible and intellectually honest.","zh":"作者用基本例子说明复杂过程：植物可来自小种子，但发展依赖多条件，不能把简单起点当简单结果。她谨慎类比另一系统，指出何处偏离现实，不让好记图像混淆科学。惊人主张吸睛，单凭新奇不真。最后鼓励好奇：可赞叹发现而不归迷信，可承认未知而不认永远无法解释。科普在保留惊奇又呈现知识边界时成功，解释能易懂又诚实。","key":"They could acknowledge a mystery without assuming that it would remain forever unexplained. || without + 动名词区分承认未知与断言不可知。","task":"通俗的解释也应该诚实呈现知识的局限。 || An accessible explanation should also present the limits of knowledge honestly.","q":"Why did the author identify limits to the analogy? || To prevent a memorable image from misleading readers. 类比有适用边界。","note":"","wc":139,"new":["marvel","superstition","perplex","elemental","originate","sheer","deviate"]},{"id":"109","title":"压力下的合作","en_title":"Cooperation under Pressure","kind":"写作·团队","en":"Our cooperative project began with vigour. Everyone wanted to move forward, but nobody could foresee every obstacle. When supplies ran short, the leader refused to make a rash promise. We had to wrestle with the schedule and choose tactics that protected quality.\nOne member wanted to head straight into production. Another preferred to wait indefinitely. We chose a middle course: preserve stability and test a small batch. A follower could contribute judgment rather than simply repeat instructions.\nThe experience was unique in its details but familiar in its lesson. Even an enthusiastic group can fall behind when responsibilities remain unclear. We should not leave a gap in planning and hope goodwill will fill the void. Nor should a slack schedule encourage careless work. We must reckon with uncertainty and turn common intentions into specific action.","zh":"合作项目起初充满活力，人人想前进，却无法预见所有困难。物资不足时负责人不轻率承诺，团队认真处理日程难题，选择保质量的策略。一人想直接生产，一人想无限等，我们取中间路：稳住局面、小批测试。跟随者也能贡献判断。细节独特，道理熟悉：职责不清，热情团队也会落后。不能留计划空白再盼善意填补，也不能因日程宽松而粗心。必须考虑不确定性并落实行动。","key":"Even an enthusiastic group can fall behind when responsibilities remain unclear. || even 引出让步，when 说明可能失败的条件。","task":"团队需要把共同目标转化为明确行动。 || A team needs to turn a shared objective into clearly defined actions.","q":"What course did the group choose? || Preserve stability and test a small batch. 在冒进与无限拖延之间取可检验路径。","note":"","wc":135,"new":["foresee","head","slack","forward","unique","reckon","wrestle","rash","follower","void","stability","vigour","cooperative","tactics","fall"]},{"id":"110","title":"从口语走向正式写作","en_title":"Choosing the Right Register","kind":"写作·语域","en":"My sales pitch was full of slang. I said a product would be a hit and invited customers to pop into the shop. Such phrases suited conversation, but a formal report needed greater precision.\nCalling a product positively perfect could conceal a gross exaggeration. A puff of promotional praise was not evidence. Nor should I call a competitor shady because its methods were unfamiliar. Frequent repetition could make a label seem credible without making it fair.\nWe also discussed literally, a word often used loosely in conversation. In formal work its meaning should be clear. An expression described as vulgar may be inappropriate for the audience. Good style means choosing language whose tone and meaning fit the purpose.","zh":"推销话术满俚语，说产品会大受欢迎，邀顾客顺便进店；聊天可用，正式报告需更精确。称产品绝对完美可能严重夸大，宣传吹捧不是证据，不能因陌生就说竞争者可疑。重复使标签似可信，却不使其公平。literally 闲谈常宽泛用，正式写作要清楚；粗俗表达可能不适合读者。好风格意味着语气和意义符合目的。","key":"Frequent repetition could make a label seem credible without making it fair. || make + 宾语 + 动词原形，区分外观可信与公平。","task":"语言风格应该符合目的和读者需要。 || Style should suit the purpose and the needs of its audience.","q":"Why revise casual expressions? || A formal report requires precision and a suitable tone. 表达需适合场景。","note":"puff 指宣传性吹捧。slang、gross、literally 的具体含义需结合语境。","wc":118,"new":["literally","pitch","positively","slang","shady","hit","vulgar","puff","frequent","gross","pop"]},{"id":"111","title":"海边村庄的一天","en_title":"A Day in a Coastal Village","kind":"阅读·场景","en":"A multitude of visitors gathered on the fringe of the village as milky light spread across the bay. Boats moved to and fro, and a path along the hill's flank led to the shore. The morning seemed pacific, yet a notice warned us to beware of changing weather.\nAt noon, a swell appeared offshore. Guides asked people to disperse, except for a group waiting under shelter. One visitor called the precaution senseless. Presumably, he expected calm weather to last; on the contrary, the guide had received an updated forecast.\nWe went indoors to hear local history. Our host used plague to mean a recurring problem, not a current illness. The story helped kindle curiosity. A frightful event showed how people could perish without community support. Responsible travel begins with listening to people who know a place.","zh":"乳白晨光铺海湾，村边聚满游客。船来回行，小径沿山侧通岸。晨间平静，告示却提醒天气变化。中午外海涌浪，导游让人散开，棚下等候组除外。游客称预防无意义，大概以为平静会持续；实际上导游已收新预报。大家进屋听历史，主人用 plague 指反复难题而非现有疾病。故事点燃好奇，其中可怕事件显示缺支持时人们可能丧生。负责旅行始于倾听当地人。","key":"Presumably, he expected calm weather to last. || presumably 标明推测，不能将推测当已证实事实。","task":"游客应该认真对待当地人的提醒。 || Visitors should take local people's advice seriously.","q":"Did plague mean a current illness? || No. It meant a recurring problem. 根据语境识别比喻义。","note":"pacific 在这里取较少见的平静义，普通作文优先用 calm / peaceful；perish 指死亡。","wc":136,"new":["senseless","pacific","plague","fro","presumably","fringe","perish","milky","flank","frightful","contrary","kindle","multitude","except","disperse","swell","beware"]}], I=[{"word":"abbreviation","forms":["abbreviation"],"records":[{"id":"P18R25C1","page":18,"row":25,"col":1,"word":"abbreviation","raw":"abbreviation n.节略，缩写，缩短","original_word":"abbreviation","forms":["abbreviation"],"correction":false}],"locations":[{"id":"02","sentence":"She would also consult a handbook when an abbreviation or an obscure expression caused confusion."}]},{"word":"abide","forms":["abide"],"records":[{"id":"P01R06C2","page":1,"row":6,"col":2,"word":"abide","raw":"abide vt.遵守vt.忍受","original_word":"abide","forms":["abide"],"correction":false}],"locations":[{"id":"41","sentence":"A charter is valuable when people abide by its principles and hold each other accountable."}]},{"word":"abolish","forms":["abolish"],"records":[{"id":"P2 function wordGrammar(entry){if(entry.usage)return entry.usage;const z=entry.zh||'',tips=[];if(/(?:^|\n)(?:vt\.|v\.)/.test(z))tips.push('作及物动词时可直接接宾语；搭配应结合下方例句学习。');if(/(?:^|\n)vi\./.test(z))tips.push('作不及物动词时不能直接接宾语，需留意与介词的搭配。');if(/(?:^|\n)(?:a\.|adj\.)/.test(z))tips.push('作形容词时可修饰名词，或在系动词后说明状态；具体位置见例句。');if(/(?:^|\n)(?:adv\.|ad\.)/.test(z))tips.push('作副词时可修饰动作、程度或整个句子；留意例句中的位置。');if(/(?:^|\n)n\./.test(z))tips.push('作名词时注意前面的限定词、单复数和介词搭配；不同词义的可数性可能不同。');return tips.slice(0,2).join(' ')||'结合下方例句，观察它修饰、连接或指代的成分。'}
function wordForms(e){const labels={p:'过去式',d:'过去分词',i:'-ing 形式','3':'第三人称单数',r:'比较级',t:'最高级',s:'复数','0':'词形原形'};return (e.exchange||'').split('/').map(s=>{const n=s.indexOf(':'),k=s.slice(0,n),v=s.slice(n+1);return n>0&&labels[k]&&v?labels[k]+'：'+v:''}).filter(Boolean).join('；')}
function showWord(word,context){stop();activeWord=word;const e=WORD_CARDS[word.toLowerCase()],dlg=$('#wordDialog');$('#wordTitle').textContent=word;$('#wordPhonetic').textContent=e?.phonetic?'参考音标 /'+e.phonetic+'/':'';$('#wordMeaning').textContent=e?.zh||'本地词典暂未收录此词，可打开下方词典继续查询。';$('#wordUsage').textContent=e?wordGrammar(e):'请结合当前例句理解。';$('#wordForms').textContent=e?[e.lemma&&e.lemma!==word.toLowerCase()?'原形：'+e.lemma:'',wordForms(e),e.note].filter(Boolean).join('\n'):'';$('#wordExample').textContent=context||'';$('#wordExample').parentElement.hidden=!context;$('#wordSource').textContent='释义与音标：'+(e?.source||'暂无')+'。多义词请结合上下文选择词义。';$('#wordExternal').href='https://dictionary.cambridge.org/dictionary/english-chinese-simplified/'+encodeURIComponent(e?.lemma||word.toLowerCase());$('#wordAuto').checked=autoWordSound;$('#wordSoundStatus').textContent='单词发音使用英语合成声音，可在正文上方切换声音。';if(!dlg.open)dlg.showModal();if(autoWordSound)pronounceWord()}
function pronounceWord(){stop();clearTimeout(wordTimer);const status=$('#wordSoundStatus');if(!('speechSynthesis'in window)){status.textContent='当前浏览器不支持发音，可打开下方在线词典听读音。';return}const available=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));const selected=voices[Number($('#voice')?.value)],voice=selected||available.find(v=>/en-US/i.test(v.lang))||available[0];const token=run;wordUtterance=new SpeechSynthesisUtterance(activeWord);wordUtterance.lang=voice?.lang||'en-US';wordUtterance.rate=.85;if(voice)wordUtterance.voice=voice;status.textContent='正在准备单词发音…';wordUtterance.onstart=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='正在发音：'+activeWord};wordUtterance.onend=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='发音完成，可点击“再听一次”。'};wordUtterance.onerror=()=>{if(token!==run)return;clearTimeout(wordTimer);status.textContent='此英语声音未能播放。请尝试切换声音，或打开在线词典听读音。'};wordTimer=setTimeout(()=>{if(token!==run)return;speechSynthesis.cancel();status.textContent='暂未启动英语语音。可切换系统英语声音，或打开在线词典听读音。'},8000);speechSynthesis.speak(wordUtterance)}
