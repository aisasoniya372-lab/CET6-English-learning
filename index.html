nient datum. They distinguished quantitative measures, such as study hours, from qualitative observations about motivation.\nThe initial statistics showed a positive correlation between regular attendance and examination performance. However, a correlation did not establish a cause. A learner's prior knowledge might influence both variables. Nor was the sample homogeneous: a junior student could have different priorities from someone approaching graduation. The team therefore refused to generalize too quickly. A numerical coefficient offered useful information, but its interpretation required caution. An analytic approach, or an analytical one, involves examining how separate factors interact. The final report described the study's scope, identified a possible flaw, and acknowledged that some conclusions remained uncertain. Only by reporting limitations openly could the researchers make their recommendation credible. The exercise taught them that an honest qualification strengthens an argument instead of making it worthless.","zh":"æ ¡å›­é‡Œæœ‰ä¸€ç§æµè¡Œè¯´æ³•ï¼šåœ¨çº¿è¯¾ç¨‹å¿…ç„¶æ”¹å–„å­¦ä¹ ã€‚ä¸ºæ£€éªŒå…¶æœ‰æ•ˆæ€§ï¼Œä¸€ä¸ªç ”ç©¶å›¢é˜Ÿè®¾è®¡é—®å·å¹¶éšæœºæŠ½æ ·ã€‚å­¦ç”Ÿå¦‚å®è®°å½•æ¯ä¸ªå›ç­”ï¼Œä¸ä¿®æ”¹ä¸ç¬¦åˆé¢„æœŸçš„æ•°æ®ã€‚ä»–ä»¬åŒºåˆ†å­¦ä¹ æ—¶é•¿ç­‰å®šé‡æŒ‡æ ‡ä¸å…³äºåŠ¨æœºçš„å®šæ€§è§‚å¯Ÿã€‚åˆæ­¥ç»Ÿè®¡æ˜¾ç¤ºï¼Œè§„å¾‹å‡ºå‹¤ä¸è€ƒè¯•æˆç»©æ­£ç›¸å…³ï¼Œä½†ç›¸å…³æ€§å¹¶ä¸èƒ½è¯æ˜å› æœå…³ç³»ï¼Œå·²æœ‰çŸ¥è¯†å¯èƒ½åŒæ—¶å½±å“è¿™ä¸¤ä¸ªå˜é‡ã€‚æ ·æœ¬ä¹Ÿä¸æ˜¯åŒè´¨çš„ï¼šä½å¹´çº§å­¦ç”Ÿä¸å³å°†æ¯•ä¸šè€…å¯èƒ½æœ‰ä¸åŒçš„ä¼˜å…ˆäº‹é¡¹ã€‚å› æ­¤ï¼Œå›¢é˜Ÿæ‹’ç»è¿‡æ—©æ¦‚æ‹¬ã€‚æ•°å€¼ç³»æ•°æä¾›ä¿¡æ¯ï¼Œä½†è§£è¯»æ—¶éœ€è¦è°¨æ…ã€‚åˆ†ææ€§æ–¹æ³•æ„å‘³ç€è€ƒå¯Ÿä¸åŒå› ç´ å¦‚ä½•ç›¸äº’ä½œç”¨ã€‚æœ€ç»ˆæŠ¥å‘Šäº¤ä»£ç ”ç©¶èŒƒå›´ã€æŒ‡å‡ºæ½œåœ¨ç¼ºé™·ï¼Œå¹¶æ‰¿è®¤æŸäº›ç»“è®ºä»ä¸ç¡®å®šã€‚åªæœ‰å…¬å¼€æŠ¥å‘Šå±€é™ï¼Œç ”ç©¶å»ºè®®æ‰å¯ä¿¡ã€‚è¿™è®©å­¦ç”Ÿæ˜ç™½ï¼Œè¯šå®åœ°ç»™ç»“è®ºåŠ ä¸Šé™åˆ¶æ¡ä»¶ï¼Œåè€Œèƒ½å¢å¼ºè®ºè¯ã€‚","key":"Only by reporting limitations openly could ,"interface","simple","innovation","membership","absent","incomplete","heading","program","edit","breakdown","software","insert"]},{"id":"08","title":"ç½‘ç»œä¿¡æ¯ä¸äº‹å®æ ¸æŸ¥","en_title":"Before You Share a Claim","kind":"å†™ä½œÂ·åª’ä»‹ç´ å…»","en":"A dramatic video can spread across a network before anybody examines its origin. A shadowy account may distort an incident, attach a false caption, and provoke indignation. When a striking image confirms our existing opinion, the impulse to share it can be overwhelming. Nevertheless, popularity is not evidence of accuracy.\nOur journalism workshop taught a practical sequence. First, identify the original author and the date of publication. Next, compare the report with independent accounts. Finally, ask whether a missing detail could alter the interpretation. We learnt to distinguish a documented occurrence from gossip, an imitation from an authentic recording, and criticism from slander. A responsible editor must not fabricate testimony or disguise a sham interview as factual reporting.\nHad the first readers paused to check the source, the rumour might not have spread so widely. Verification can seem slow, particularly during a crisis, but an inaccurate message can magnify fear. The aim is neither to suppress disagreement nor to censor every unusual opinion. It is to make public discussion more informed, rational, and accountable.","zh":"ä¸€æ®µæˆå‰§æ€§çš„è§†é¢‘å¯èƒ½åœ¨ä»»ä½•äººæ ¸æŸ¥æ¥æºä¹‹å‰å°±ä¼ éç½‘ç»œã€‚èº«ä»½ä¸æ˜çš„è´¦å·å¯èƒ½æ­ªæ›²äº‹ä»¶ã€æ·»åŠ è™šå‡è¯´æ˜ï¼Œæ¿€èµ·æ„¤æ€’ã€‚å½“é†’ç›®å›¾ç‰‡è¯å®æˆ‘ä»¬å·²æœ‰è§‚ç‚¹æ—¶ï¼Œåˆ†äº«å†²åŠ¨å¯èƒ½æ ¼å¤–å¼ºçƒˆã€‚ç„¶è€Œï¼Œæµè¡Œå¹¶ä¸æ˜¯å‡†ç¡®æ€§çš„è¯æ®ã€‚æ–°é—»ç ”è®¨è¯¾æ•™äº†ä¸€å¥—å®ç”¨æµç¨‹ï¼šå…ˆç¡®è®¤åŸä½œè€…å’Œå‘å¸ƒæ—¥æœŸï¼Œå†ä¸ç‹¬ç«‹æŠ¥é“æ¯”è¾ƒï¼Œæœ€åæ£€æŸ¥æ˜¯å¦æœ‰é—æ¼ç»†èŠ‚ä¼šæ”¹å˜è§£è¯»ã€‚æˆ‘ä»¬å­¦ä¹ åŒºåˆ†æœ‰è®°å½•çš„äº‹ä»¶ä¸æµè¨€ã€ä»¿åˆ¶å“ä¸çœŸå®å½•éŸ³ï¼Œä»¥åŠæ‰¹è¯„ä¸è¯½è°¤ã€‚è´Ÿè´£çš„ç¼–è¾‘ä¸èƒ½ç¼–é€ è¯è¨€ï¼Œä¹Ÿä¸èƒ½æŠŠå‡é‡‡ laboratory required a human review before any generated passage entered a formal report. Researchers had to ascertain whether each citation existed and whether it supported the associated claim.\nAs useful as automation can be, responsibility remains with the people who deploy it. A sophisticated mechanism can facilitate analysis; it cannot justify careless judgment. The team's guiding principle was to preserve human oversight while using technology to lessen repetitive work. They measured success by dependable results, not by the mere rapidity of a response.","zh":"ä¸€å®¶å®éªŒå®¤å¼•å…¥è™šæ‹ŸåŠ©æ‰‹æ¥æ¦‚æ‹¬ç ”ç©¶è®ºæ–‡ã€‚å®ƒèƒ½æ‰«æç¨¿ä»¶ã€æå–ä¸»é¢˜ï¼Œå¹¶åœ¨å‡ ç§’å†…ç”Ÿæˆç®€çŸ­è¯´æ˜ã€‚å¯¹å¿™ç¢Œçš„ç ”ç©¶è€…æ¥è¯´ï¼Œç”Ÿäº§ç‡æå‡çš„æ½œåŠ›å¾ˆå¤§ã€‚å·¥å…·è¿˜èƒ½ç»™ææ–™åˆ†ç±»ï¼Œæ‰¾å‡ºè¯»è€…å¯èƒ½å¿½ç•¥çš„è§„å¾‹ã€‚ä½†ä¼˜é›…çš„æ‘˜è¦ä»å¯èƒ½åŒ…å«ä¸¥é‡é”™è¯¯ï¼šåŠ©æ‰‹å¯èƒ½ç¼–é€ æ–‡çŒ®ï¼ŒæŠŠç†è®ºä¸å·²è¯æ˜çš„å®šç†æ··æ·†ï¼Œæˆ–è‡ªä¿¡åœ°æ–­è¨€æ²¡æœ‰ä¾æ®çš„å†…å®¹ã€‚æˆç†Ÿçš„è¯­æ°”å¹¶ä¸ä¿è¯æ¨ç†å¯é ã€‚å› æ­¤ï¼Œå®éªŒå®¤è¦æ±‚ç”Ÿæˆæ–‡æœ¬è¿›å…¥æ­£å¼æŠ¥å‘Šå‰å¿…é¡»ç»è¿‡äººå·¥å®¡æ ¸ï¼Œç ”ç©¶è€…å¿…é¡»æŸ¥æ˜æ¯æ¡å¼•æ–‡æ˜¯å¦å­˜åœ¨ã€æ˜¯å¦æ”¯æŒç›¸åº”è®ºç‚¹ã€‚æ— è®ºè‡ªåŠ¨åŒ–å¤šä¹ˆæœ‰ç”¨ï¼Œè´£ä»»ä»å±äºä½¿ç”¨å®ƒçš„äººã€‚å¤æ‚æœºåˆ¶èƒ½ååŠ©åˆ†æï¼Œå´ä¸èƒ½ä¸ºè‰ç‡åˆ¤æ–­æä¾›ç†ç”±ã€‚å›¢é˜ŸåšæŒä¿ç•™äººå·¥ç›‘ç£ï¼Œç”¨æŠ€æœ¯å‡å°‘é‡å¤åŠ³åŠ¨ï¼Œå¹¶ä»¥ç»“æœæ˜¯å¦å¯é ï¼Œè€Œä¸æ˜¯ä»…ä»¥å›å¤é€Ÿåº¦è¯„ä»·æˆåŠŸã€‚","key":"As useful as automation can be, responsibility remains with the people who deploy it. || As + å½¢å®¹è¯ + as + ä¸»è¯­ + è°“è¯­ï¼Œè¡¨è¾¾â€œå°½ç®¡â€¦â€¦â€ï¼Œåæ¥è®©æ­¥çš„ä¸»å¥ï¼›who å¼•å¯¼å®šè¯­ä»å¥ã€‚","task":"æ— è®ºå·¥å…·å¤šä¹ˆå…ˆè¿›ï¼Œä½¿ç”¨è€…ä»ç„¶æœ‰è´£ä»»æ ¸å®ç»“æœã€‚ || However advanced a tool may be, its users remain responsible for verifying the results.","q":"How did the laboratory evaluate success? || By dependable results, not merely by the speed of a response. é¢˜ç›®è€ƒæŸ¥è¯„ä»·æ ‡å‡†ã€‚","note":"","wc":174,"new": ated a new delivery schedule and kept an accurate log of each transaction. She learnt to distinguish cash in the bank from actual earnings. A temporary surplus could vanish if an overlooked liability became due.\nBy the end of the year, customers began to recommend the shop. Its margin remained slim, but its reputation for fair treatment grew. Lin's experience illustrates a practical lesson: commercial survival depends not only on ingenuity but also on reliable service, careful finance, and the willingness to acknowledge a mistake promptly.","zh":"æ—å†³å®šç§Ÿä¸€é—´å°åº—æ—¶ï¼Œä¸€ä½é“¶è¡Œä»ä¸šè€…é—®å¥¹çš„å•†ä¸šæ¨¡å¼æ˜¯å¦ç›ˆåˆ©ã€‚å¥¹æ²¡æœ‰æ‰¿è¯ºæ— é™å¢é•¿ï¼Œè€Œè®¡åˆ’ä¿®ç†å®¶ç”¨ç”µå™¨ã€å‡ºå”®äºŒæ‰‹è®¾å¤‡ï¼ŒæœåŠ¡é‚£äº›æ„¿æ„ç»´ä¿®è€Œéæ›´æ¢ç‰©å“çš„å±…æ°‘ã€‚é¢„ç®—åŒ…æ‹¬æˆ¿ç§Ÿã€é€‚å½“å·¥èµ„ï¼Œä»¥åŠåº”å¯¹æ„å¤–æ”¯å‡ºçš„å‚¨å¤‡ã€‚ç¬¬ä¸€å­£åº¦æ”¶å…¥ä¸å¤šï¼Œä¸€æ‰¹é›¶ä»¶åˆ°è´§å»¶è¿Ÿï¼Œè¿˜æœ‰å®¢æˆ·æ‹’ä»˜å‘ç¥¨ã€‚æ—æ²¡æœ‰éšç’ï¼Œè€Œæ˜¯åå•†æ–°çš„äº¤è´§å®‰æ’ï¼Œå¹¶å‡†ç¡®è®°å½•æ¯ç¬”äº¤æ˜“ã€‚å¥¹å­¦ä¼šåŒºåˆ†é“¶è¡Œç°é‡‘ä¸çœŸæ­£æ”¶ç›Šï¼šä¸€ç¬”è¢«å¿½ç•¥çš„å€ºåŠ¡åˆ°æœŸï¼Œå°±å¯èƒ½è®©ä¸´æ—¶ç›ˆä½™æ¶ˆå¤±ã€‚å¹´åº•ï¼Œå®¢æˆ·å¼€å§‹æ¨èè¿™å®¶åº—ã€‚åˆ©æ¶¦ä»è–„ï¼Œä½†å…¬å¹³å¾…å®¢çš„å£ç¢‘é€æ¸å¢é•¿ã€‚å¥¹çš„ç»å†è¯´æ˜ï¼Œå•†ä¸šç”Ÿå­˜ä¸ä»…å–å†³äºå·§æ€ï¼Œä¹Ÿå–å†³äºå¯é æœåŠ¡ã€è°¨æ…çš„è´¢åŠ¡ç®¡ç†ï¼Œä»¥åŠåŠæ—¶æ‰¿è®¤é”™è¯¯çš„æ„æ„¿ã€‚","key":"Commercial survival depends not only on ingenuity but also on reliable service, careful finance, and the willingness to acknowledge a mistake promptly. || not only ... but also ... ä½äºå¥ä¸­æ— éœ€å€’è£…ï¼›å¹¶åˆ—é¡¹åœ¨è¯­æ³•ä¸Šä¿æŒä¸€è‡´ã€‚","task":"ç¨³å®šçš„æ”¶å…¥ä¸èƒ½æ›¿ä»£å¯¹æˆæœ¬å’Œé£é™©çš„è°¨æ…ç®¡ç†ã€‚ || A steady income cannot replace careful management of costs and risks.","q":"Why could the temporary surplus disappear? || An overlooked liability might become due. æ³¨æ„åŒºåˆ†æ‰‹å¤´ç°é‡‘ä¸æ‰£é™¤ä¹‰åŠ¡åçš„è´¢åŠ¡çŠ¶å†µã€‚","note":"","wc":167,"new":["lease","shipment","liability","budget","margin","profitable","cater","banker","domestic","survival","slim","unlimited","finance","revenue","late","end","promptly","fair","second-hand","reserve","ingenuity","log","surplus","replacement","client","earnings","invoice","transaction","acknowledge","bank","expenditure"]},{"id":"12","title":"ç†æ€§æ¶ˆè´¹çš„æ—¥å¸¸ç»ƒä¹ ","en_title":"Buying with a Clear Purpose","kind":"å†™ä½œÂ·æ¶ˆè´¹ä¸å¯æŒç»­ç”Ÿæ´»","en":"An advertisement offered a gorgeous jacket at a huge discount. The material resembled velvet, and the lining felt wonderfully soft. I was tempted to buy it immediately, although my wardrobe already contained several similar garments. The promise of a bargain had briefly displaced a more basic question: did I need it?\nA consumer can resist this impulse by considering use, quality, and total cost. An attractive accessory is not necessarily essential, and a fashionable novelty may soon lose its charm. Buying an item in installments does not make it cheaper; it only changes the timing of payment. Nor should a complimentary token distract us from an unreasonable price.\nI left the store and reviewed my spending. The exercise was not about becoming a miser or rejecting every pleasure. It was about ensuring that consumption reflected my priorities. I eventually bought a sturdy coat that I could mend easily. Had I followed the initial excitement, I would have purchased something less suitable. A deliberate pause can transform shopping from a reflex into a considered choice.","zh":"ä¸€åˆ™å¹¿å‘Šå®£ä¼ ä¸€ä»¶æ¼‚äº®å¤¹å…‹å¤§å¹…æ‰“æŠ˜ã€‚é¢æ–™åƒå¤©é¹…ç»’ï¼Œè¡¬é‡Œååˆ†æŸ”è½¯ã€‚å°½ç®¡è¡£æŸœé‡Œå·²æœ‰å‡ ä»¶ç›¸ä¼¼è¡£æœï¼Œæˆ‘è¿˜æ˜¯å·®ç‚¹ç«‹åˆ»è´­ä¹°ã€‚ä¾¿å®œçš„è¯±æƒ‘æš‚æ—¶æŒ¤èµ°äº†æ›´åŸºæœ¬çš„é—®é¢˜ï¼šæˆ‘éœ€è¦å®ƒå—ï¼Ÿæ¶ˆè´¹è€…å¯ä»¥é€šè¿‡è€ƒè™‘ç”¨é€”ã€è´¨é‡å’Œæ€»æˆæœ¬æŠµåˆ¶å†²åŠ¨ã€‚å¥½çœ‹çš„é…é¥°æœªå¿…å¿…éœ€ï¼Œæ—¶å°šæ–°å“ä¹Ÿå¯èƒ½å¾ˆå¿«å¤±å»é­…åŠ›ã€‚åˆ†æœŸä»˜æ¬¾ä¸ä¼šé™ä½ä»·æ ¼ï¼Œåªæ”¹å˜ä»˜æ¬¾æ—¶é—´ã€‚æˆ‘ä»¬ä¹Ÿä¸åº”è¢«å…è´¹èµ å“å¸å¼•ï¼Œå¿½è§†ä¸åˆç†çš„ä»·æ ¼ã€‚æˆ‘ç¦»å¼€å•†åº— ","panel"]},{"id":"14","title":"ä¸€åº§èŠ±å›­çš„æ–‡åŒ–è¡¨è¾¾","en_title":"A Garden Built for Reflection","kind":"ç¿»è¯‘Â·å›­æ—ä¸åŸå¸‚æ–‡åŒ–","en":"Our guide asked us to pause beneath an arch before entering the garden. Through a circular opening, we could see a small pond, an ornamental rock, and the slender stem of a flowering shrub. The view appeared natural, yet its composition had been carefully planned. A winding footpath encouraged visitors to stroll slowly instead of heading directly towards the exit.\nOn a terrace stood a pavilion with a tiled roof. Its lattice windows framed changing views of the landscape. A vine climbed beside the doorway, while a fragrant herb grew near a patch of moss. At twilight, a faint gleam on the water made the surrounding buildings seem unusually distant. The pond could mirror the sky, but a single ripple would alter the reflection.\nRather than overwhelm visitors with grandeur, the garden invited quiet observation. Its appeal lay in the balance between enclosure and openness, detail and space. Even a miniature garden can reveal a thoughtful conception of how people might reside alongside nature. For a hurried urban resident, such a place offers a valuable opportunity to slow down and reflect.","zh":"è¿›å…¥èŠ±å›­å‰ï¼Œå¯¼æ¸¸è¯·æˆ‘ä»¬åœ¨æ‹±é—¨ä¸‹åœæ­¥ã€‚é€è¿‡åœ†å½¢å¼€å£ï¼Œå¯ä»¥çœ‹åˆ°æ± å¡˜ã€è§‚èµçŸ³å’Œå¼€èŠ±çŒæœ¨çš„ç»†èŒã€‚æ™¯è‰²çœ‹ä¼¼è‡ªç„¶ï¼Œæ„å›¾å´ç»è¿‡ç²¾å¿ƒè§„åˆ’ã€‚å¼¯æ›²å°å¾„é¼“åŠ±æ¸¸å®¢æ…¢æ…¢æ•£æ­¥ï¼Œè€Œä¸æ˜¯ç›´å¥”å‡ºå£ã€‚å°åœ°ä¸Šçš„äº­å­ç›–ç€ç“¦é¡¶ï¼Œæ ¼çª—æ¡†å‡ºä¸æ–­å˜åŒ–çš„æ™¯è§‚ã€‚è—¤è”“çˆ¬åœ¨é—¨è¾¹ï¼Œè‹”è—“æ—é•¿ç€èŠ³é¦™è‰æœ¬æ¤ç‰©ã€‚é»„æ˜æ—¶ï¼Œæ°´ä¸Šå¾®å…‰è®©å‘¨å›´å»ºç­‘æ˜¾å¾—æ ¼å¤–é¥è¿œã€‚æ± æ°´èƒ½æ˜ ç…§å¤©ç©ºï¼Œä½†ä¸€é“æ¶Ÿæ¼ªå°±ä¼šæ”¹å˜å€’å½±ã€‚èŠ±å›­æ²¡æœ‰ç”¨å®ä¼Ÿæ°”åŠ¿å‹å€’æ¸¸å®¢ï¼Œè€Œæ˜¯é‚€è¯·äººé™é™è§‚å¯Ÿã€‚å…¶å¸å¼•åŠ›åœ¨äºå°é—­ä¸å¼€é˜”ã€ç»†èŠ‚ä¸ç©ºé—´ä¹‹é—´çš„å¹³è¡¡ã€‚å³ä½¿å¾®å‹å›­æ—ï¼Œä¹Ÿèƒ½å±•ç°äººå¦‚ä½•ä¸è‡ªç„¶ç›¸å¤„çš„æ·±æ€ã€‚å¯¹åŒ†å¿™çš„åŸå¸‚å±…æ°‘è€Œè¨€ï¼Œè¿™æ · è¯»Â·å†å²ä¸è¯æ®","en":"A museum display showed an Egyptian sculpture beside a Roman coin. Nearby stood a model of a medieval fortress, complete with a tower, a gate, and a defensive trench. The labels described the reign of a monarch, the privileges of a duke and a baron, and the daily work of an ordinary tradesman. A historian explained that a grand monument might glorify a conqueror while revealing little about those who built it.\nThe next section examined colonial expansion. It distinguished the account of a colonist from the memory preserved by a descendant of a displaced community. A military victory, the guide observed, could be followed by exile, loss, and a profound change in social life. An exhibit should not erase that complexity.\nSeen in context, an object can illuminate more than its maker's skill. It can also reveal who possessed authority and whose labour remained largely invisible. The museum invited visitors to compare sources, question a triumphant narration, and consider the people missing from it. History becomes more informative when admiration is accompanied by careful inquiry.","zh":"åšç‰©é¦†æŠŠåŸƒåŠé›•å¡‘ä¸ç½—é©¬ç¡¬å¸å¹¶åˆ—å±•ç¤ºã€‚é™„è¿‘æ˜¯ä¸­ä¸–çºªå ¡å’æ¨¡å‹ï¼ŒåŒ…æ‹¬å¡”æ¥¼ã€å¤§é—¨å’Œé˜²å¾¡å£•æ²Ÿã€‚è¯´æ˜ç‰Œä»‹ç»å›ä¸»ç»Ÿæ²»ã€å…¬çˆµä¸ç”·çˆµçš„ç‰¹æƒï¼Œä»¥åŠæ™®é€šå·¥åŒ çš„æ—¥å¸¸å·¥ä½œã€‚å†å²å­¦è€…è§£é‡Šï¼Œå®ä¼Ÿçºªå¿µç¢‘å¯èƒ½æ­Œé¢‚å¾æœè€…ï¼Œå´å¾ˆå°‘å‘ˆç°å»ºé€ è€…çš„ç”Ÿæ´»ã€‚ä¸‹ä¸€åŒºåŸŸè®¨è®ºæ®–æ°‘æ‰©å¼ ï¼ŒåŒºåˆ†æ®–æ°‘è€…çš„å™è¿°ä¸è¢«è¿«è¿ç§»ç¤¾åŒºåè£”ä¿å­˜çš„è®°å¿†ã€‚å¯¼æ¸¸æŒ‡å‡ºï¼Œå†›äº‹èƒœåˆ©ä¹‹åå¯èƒ½å‡ºç°æµæ”¾ã€æŸå¤±å’Œç¤¾ä¼šç”Ÿæ´»çš„æ·±åˆ»å˜åŒ–ï¼Œå±•è§ˆä¸åº”æŠ¹å»è¿™äº›å¤æ‚æ€§ã€‚æŠŠç‰©å“ç½®äºè¯­å¢ƒä¸­ï¼Œçœ‹åˆ°çš„ä¸ä»…æ˜¯åˆ¶ä½œè€…çš„æŠ€è‰ºï¼Œä¹Ÿèƒ½çœ‹å‡ºè°æŒæ¡æƒåŠ›ã€è°çš„åŠ³åŠ¨é•¿æœŸè¢«å¿½ç•¥ã€‚åšç‰©é¦†é‚€è¯·æ¸¸å®¢æ¯”è¾ƒèµ„æ–™ã€è´¨ç–‘èƒœåˆ©è€…çš„å™è¿°ï¼Œå¹¶è€ƒè™‘å…¶ä¸­ç¼ºå¸­çš„äººã€‚å½“æ¬£èµä¼´éšè®¤çœŸæ¢ç©¶æ—¶ï¼Œå†å²æ‰æ›´èƒ½æä¾›å¯å‘ã€‚","key":"Seen in context, an object can il owship and give an overlooked public space a new purpose.","zh":"ç¤¾åŒºå‰§é™¢ç©ºç½®å¤šå¹´åï¼Œä¸€ä½é€€ä¼‘ä½œæ›²å®¶æå‡ºè®©å®ƒé‡æ–°æ´»è·ƒèµ·æ¥ï¼Œæ¯å‘¨ç»„ç»‡æ’ç»ƒï¼Œå‘ä¸šä½™çˆ±å¥½è€…ä¸ä¸“ä¸šä¹æ‰‹å¼€æ”¾ã€‚æœ‰äººæèµ äºŒæ‰‹é’¢ç´ï¼Œæœ‰äººå€Ÿå‡ºç«–ç´å’Œå‰ä»–ã€‚å¤§å…é‡Œçš„è€å¼ç•™å£°æœºè®©æ¸¸å®¢æƒ³èµ·æ•°å­—å½•éŸ³ä¹‹å‰çš„å¬ä¹æ–¹å¼ã€‚èµ·åˆï¼Œè¡¨æ¼”è€…éš¾ä»¥åè°ƒï¼šæ­Œæ‰‹é”™è¿‡è¿›å…¥æ—¶æœºï¼Œä¹æ‰‹å¼¹é”™å’Œå¼¦ï¼Œå¤§å®¶å¤±å»èŠ‚å¥ã€‚æŒ‡æŒ¥å…‹åˆ¶ä½ä¸¥å‰è´£å¤‡çš„å†²åŠ¨ï¼Œè€Œæ˜¯è¯·å¤§å®¶å½¼æ­¤å€¾å¬ï¼Œåå¤ç»ƒä¹ ä¸€å°æ®µã€‚è¿›æ­¥è™½ç„¶ç¼“æ…¢ï¼Œå´å¾ˆæ˜æ˜¾ã€‚é¦–æ¼”å¤œï¼Œç‹¬å¥ä¹‹åæ˜¯ä¸€é¦–çŸ­äº¤å“æ›²ï¼Œæœ€åä¸€ä¸ªéŸ³è¿˜æ²¡æ¶ˆå¤±ï¼Œè§‚ä¼—å°±å¼€å§‹é¼“æŒã€‚ä½¿å¤œæ™šéš¾å¿˜çš„ä¸æ˜¯æŠ€è‰ºé«˜äººä¸€ç­‰ï¼Œè€Œæ˜¯ä¸åŒå¹´é¾„è€…å…±äº«çš„æŠ•å…¥ã€‚è¿™ä¸ªé¡¹ç›®è¯´æ˜ï¼Œå‚ä¸è‰ºæœ¯èƒ½å¤Ÿä¿ƒè¿›æƒ…è°Šï¼Œèµ‹äºˆè¢«å¿½ç•¥çš„å…¬å…±ç©ºé—´æ–°çš„ç”¨é€”ã€‚","key":"It was not technical superiority that made the evening memorable, but the devotion shared by people of different ages. || It was ... that ... å¼ºè°ƒå¥çªå‡ºåŸå› ï¼›not ... but ... å½¢æˆå¹³è¡Œå¯¹æ¯”ã€‚å¯è¿ç§»ä¸ºå¼ºè°ƒåˆä½œè€Œéä¸ªäººå¤©èµ‹ã€‚","task":"è‰ºæœ¯æ´»åŠ¨èƒ½æŠŠä¸åŒå¹´é¾„çš„äººèšåœ¨ä¸€èµ·ï¼Œå¹¶å¢å¼ºç¤¾åŒºå½’å±æ„Ÿã€‚ || Artistic activities can bring together people of different ages and strengthen their sense of belonging to the community.","q":"How did the conductor respond to early mistakes? || She encouraged listening and repeated practice instead of harsh criticism. ç•™æ„å®é™…æŒ‡å¯¼æ–¹å¼ã€‚","note":"","wc":177,"new":["composer","rebuke","audience","superiority","amateur","foster","devotion","theatre","coordinate","harp","lobby","gramophone","appreciable","symphony","guitar","fellowship","applaud","solo","chord","urge","revive"]},{"id":"18","title":"åŸå¸‚æ›´æ–°åº”å½“ä¿ç•™ä»€ä¹ˆ","en_title":"Renewal without Erasure","kind":"å†™ä½œÂ·åŸå¸‚å‘å±•","en":"A metropolitan district planned to replace an old market with a skyscraper. The developer praised the scheme as a way to increase retail space and municipal revenue. Residents, however, feared that the new complex would displace small traders and weaken the neighbourhood's character. Their objection was not simply an attachment to the past.\nThe market provided inexpensive food, informal employment, and a place where elderly residents could meet. Its narrow lanes were shabby, but they supported a lively network of relationships. An architect suggested a more flexible option: reinforce the structure, improve drainage, and convert the upper floor into a spacious community centre. The plan would preserve the street's scale while improving its safety.\nAfter a public forum, the council agreed to assess both proposals. It asked for a transparent account of cost, environmental impact, and the likelihood of disruption. Urban renewal should not be judged solely by the height of a building. To be sustainable, it must reconcile economic development with the practical needs of the people who already dwell there.","zh":"ä¸€ä¸ªå¤§åŸå¸‚è¡—åŒºè®¡åˆ’ç”¨æ‘©å¤©æ¥¼æ›¿æ¢è€å¸‚åœºã€‚å¼€å‘å•†ç§°æ–¹æ¡ˆèƒ½å¢åŠ é›¶å”®ç©ºé—´å’Œå¸‚æ”¿æ”¶å…¥ï¼Œä½†å±…æ°‘æ‹…å¿ƒæ–°ç»¼åˆä½“æŒ¤èµ°å°å•†è´©ã€å‰Šå¼±è¡—åŒºç‰¹è‰²ã€‚ä»–ä»¬çš„åå¯¹å¹¶éåªæ˜¯æ€€æ—§ã€‚å¸‚åœºæä¾›ä¾¿å®œé£Ÿç‰©ã€éæ­£å¼å°±ä¸šï¼Œä»¥åŠè€å¹´å±…æ°‘è§é¢çš„åœºæ‰€ã€‚ç‹­çª„è¡—å··è™½ç„¶ç ´æ—§ï¼Œå´ç»´ç³»æ´»è·ƒçš„äººé™…ç½‘ç»œã€‚å»ºç­‘å¸ˆæå‡ºæ›´çµæ´»çš„é€‰é¡¹ï¼šåŠ å›ºç»“æ„ã€æ”¹å–„æ’æ°´ï¼ŒæŠŠä¸Šå±‚æ”¹ä¸ºå®½æ•çš„ç¤¾åŒºä¸­å¿ƒã€‚è¿™æ ·æ—¢èƒ½ä¿ç•™è¡—é“å°ºåº¦ï¼Œä¹Ÿèƒ½æ”¹å–„å®‰å…¨ã€‚å…¬å¼€è®ºå›åï¼Œå¸‚è®®ä¼šåŒæ„è¯„ä¼°ä¸¤ä¸ªæ–¹æ¡ˆï¼Œå¹¶è¦æ±‚é€æ˜è¯´æ˜æˆæœ¬ã€ç¯å¢ƒå½±å“å’Œå—æ‰°åŠ¨çš„å¯èƒ½æ€§ã€‚åŸå¸‚æ›´æ–°ä¸èƒ½åªç”¨æ¥¼é«˜è¯„ä»·ã€‚è¦å®ç°å¯æŒç»­å‘å±•ï¼Œå°±å¿…é¡»åè°ƒç»æµå‘å±•ä¸ç°æœ‰å±…æ°‘çš„å®é™…éœ€è¦ã€‚","key":"To be sustainable, it must reconcile economic development with the practical needs of the people who already dwell there. || ä¸å®šå¼ä½œç›®çš„ï¼æ¡ä»¶æ„å‘³çš„çŠ¶è¯­ï¼›reconcile A with B è¡¨ç¤ºåè°ƒä¸¤ç§éœ€æ±‚ã€‚","task":"åŸå¸‚æ›´æ–°åº”è¯¥æ”¹å–„å±…æ°‘çš„ç”Ÿæ´»ï¼Œè€Œä¸æ˜¯åªè¿½æ±‚æ›´é«˜çš„å»ºç­‘ã€‚ || Urban renewal should improve residents' lives rather than merely pursue taller buildings.","q":"What alternative did the architect suggest? || Repair and adapt the existing market while improving drainage and safety. åŸå»ºç­‘ä¿ç•™å¹¶æ”¹é€ ï¼Œè€Œéå®Œå…¨æ¨å€’ã€‚","note":"","wc":172,"new":["metropolitan","displace","replace","municipal","reconcile","drainage","skyscraper","forum","retail","attachment","shabby","likelihood","dwell","scheme","environmental","spacious","market"]},{"id":"19","title":"æ¹¿åœ°å¹¶ä¸æ˜¯é—²ç½®åœŸåœ°","en_title":"A Marsh Worth Protecting","kind":"ç¿»è¯‘Â·ç”Ÿæ€ä¿æŠ¤","en":"A marsh on the outskirts of town was once dismissed as useless land. A developer wanted to drain it and construct a warehouse. Local volunteers, however, argued that the apparent emptiness concealed a complex habitat. A reed bed sheltered small animals, while the shallow water offered a feeding ground for birds.\nDuring an excursion, we watched a woodpecker near a willow grove and a dove resting on a branch. A snail moved across a damp leaf, and a grasshopper clung to a stalk. Our guide asked us not to trample the vegetation or disturb a nest. Even an organism that seemed trivial could contribute to the area's ecology.\nThe group prepared a proposal to reclaim a damaged section and restrict construction near the water. It did not claim that preservation would solve every environmental problem. Rather, it showed how one practical intervention could protect a valuable locality. Once a habitat is destroyed, its restoration may demand far more time and money than its protection would have required. Treating nature as an integral part of a city can therefore be both responsible and economical.","zh":"é•‡éƒŠä¸€ç‰‡æ¹¿åœ°æ›¾è¢«è§†ä¸ºæ— ç”¨åœŸåœ°ï¼Œå¼€å‘å•†æƒ³æ’å¹²æ°´å»ºä»“åº“ã€‚å½“åœ°å¿—æ„¿è€…å´æŒ‡å‡ºï¼Œçœ‹ä¼¼ç©ºæ—·çš„åœ°æ–¹éšè—ç€å¤æ‚æ –æ¯åœ°ï¼šèŠ¦è‹‡åœ°åº‡æŠ¤å°åŠ¨ç‰©ï¼Œæµ…æ°´ä¸ºé¸Ÿç±»æä¾›è§…é£Ÿåœ  animals. A gorilla, a leopard, and a whale require very different habitats, yet each can suffer when human activity destroys its surroundings. A panther in a photograph was not a pet or a spectacle; it was a wild animal whose needs deserved respect. The guide also discussed how an extinct species differs from one merely absent from a particular locality.\nWhat impressed us most was the restraint required of a responsible observer. We must not use bait to attract wildlife, allow a puppy to chase birds, or toss food into an enclosure. Curiosity should lead to understanding rather than interference. The privilege of seeing an animal does not entitle us to control its behaviour.","zh":"ä¿æŠ¤åŒºé‡Œï¼ŒæŒ‡å¯¼å‘˜å…ˆè®²è§£å“ºä¹³åŠ¨ç‰©ä¸çˆ¬è¡ŒåŠ¨ç‰©çš„åŒºåˆ«ï¼Œå†å¸¦æˆ‘ä»¬ç»è¿‡è§‚å¯Ÿå›´æ ã€‚å­”é›€å±•ç¤ºç¾½æ¯›ï¼Œä¹Œé¾Ÿåœ¨æ± è¾¹ä¼‘æ¯ï¼Œç”²è™«çˆ¬åˆ°çŸ³ä¸‹ï¼Œè¿œå¤„å…½ç¾¤ç¼“ç¼“ç©¿è¿‡è‰åœ°ã€‚æˆ‘ä»¬è¢«è¦æ±‚å®‰é™è§‚å¯Ÿï¼Œè®©åŠ¨ç‰©æŒ‰æ­£å¸¸æ–¹å¼æ´»åŠ¨ã€‚ä¸‹åˆçš„è®²åº§è®¨è®ºæ¿’å±åŠ¨ç‰©ï¼šå¤§çŒ©çŒ©ã€è±¹å’Œé²¸éœ€è¦ä¸åŒæ –æ¯åœ°ï¼Œä½†éƒ½å¯èƒ½å› äººç±»ç ´åç¯å¢ƒè€Œå—è‹¦ã€‚ç…§ç‰‡é‡Œçš„é»‘è±¹ä¸æ˜¯å® ç‰©æˆ–è¡¨æ¼”å¯¹è±¡ï¼Œè€Œæ˜¯éœ€æ±‚åº”å—å°Šé‡çš„é‡ç”ŸåŠ¨ç‰©ã€‚å¯¼æ¸¸è¿˜è§£é‡Šç‰©ç§ç­ç»ä¸ä»…åœ¨æŸåœ°æ¶ˆå¤±çš„åŒºåˆ«ã€‚æœ€è®©æˆ‘ä»¬å°è±¡æ·±åˆ»çš„æ˜¯ï¼Œè´Ÿè´£çš„è§‚å¯Ÿè€…å¿…é¡»å…‹åˆ¶ï¼šä¸èƒ½ç”¨è¯±é¥µå¼•æ¥é‡ç”ŸåŠ¨ç‰©ï¼Œä¸èƒ½è®©å°ç‹—è¿½é¸Ÿï¼Œä¹Ÿä¸èƒ½æŠŠé£Ÿç‰©æ‰”è¿›å›´æ ã€‚å¥½å¥‡åº”å¸¦æ¥ç†è§£ï¼Œè€Œéå¹²æ‰°ã€‚èƒ½å¤Ÿçœ‹è§åŠ¨ç‰©ï¼Œå¹¶ä¸æ„å‘³ç€æœ‰æƒæ§åˆ¶å®ƒçš„è¡Œä¸ºã€‚","key":"The privilege of seeing an animal does not entitle us to control its behaviour. || entitle sb. to do è¡¨ç¤ºç»™äºˆæŸäººåšæŸäº‹çš„æƒåˆ©ï¼›é€‚åˆè®¨è®ºæƒåˆ©ä¸è´£ä»»ã€‚","task":"è§‚å¯Ÿé‡ç”ŸåŠ¨ç‰©æ—¶ï¼Œäººä»¬åº”è¯¥ä¿æŒè·ç¦»ï¼Œé¿å…å¹²æ‰°å®ƒä»¬çš„æ­£å¸¸è¡Œä¸ºã€‚ || When observing wildlife, people should keep their distance and avoid disturbing the animals' normal behaviour.","q":"Which actions does the guide discourage? || Using bait, allowing dogs to chase birds, and throwing food into enclosures. ä¸‰ä¸ªå¹¶åˆ—åŠ¨ä½œéƒ½æ˜¯äººä¸ºå¹²æ‰°ã€‚","note":"","wc":182,"new":["species","puppy","observe","reptile","pasture","peacock","particular","extinct","whale","beetle","turtle","stone","herd","toss","bait","gorilla","follow","spectacle","mammal","panther","leopard","entitle"]},{"id":"21","title":"æŠŠåºŸå¼ƒç‰©é‡æ–°å˜æˆèµ„æº","en_title":"Repair, Reuse, and Recover","kind":"å†™ä½œÂ·å¾ªç¯åˆ©ç”¨","en":"At a recycling workshop, each volunteer received a glove and a sorting guide. We separated metal scrap from plastic, detached a cable from a damaged appliance, and removed a worn tile from a reusable wooden frame. The supervisor asked us to handle a sharp edge with caution and leave electrical dismantling to trained personnel.\nThe display explained why materials need different treatment. A polymer may require a specialized process, while a composite product can be difficult to separate. A coating that protects an object from corrosion may complicate its recovery. Even a seemingly minor impurity can reduce the value of a recycled batch. These details made the promise of effortless recycling appear less convincing.\nWe then repaired a chair with a loose joint. A clamp held the parts together until the glue could solidify. Repair could prolong the object's useful life and reduce the need for replacement. The lesson was clear: a circular economy begins before something becomes waste. If manufacturers design products that people can maintain, reuse, and dismantle, fewer valuable resources will end up as litter.","zh":"å›æ”¶å·¥ä½œåŠç»™æ¯åå¿—æ„¿è€…å‘äº†æ‰‹å¥—å’Œåˆ†ç±»æŒ‡å—ã€‚æˆ‘ä»¬æŠŠé‡‘å±åºŸæ–™ä¸å¡‘æ–™åˆ†å¼€ï¼Œä»åç”µå™¨ä¸Šæ‹†ä¸‹ç”µç¼†ï¼Œå†ä»å¯é‡å¤ä½¿ç”¨çš„æœ¨æ¡†ä¸Šå–ä¸‹ä¸€å—æ—§ç“·ç –ã€‚ä¸»ç®¡æé†’å¤§å®¶å°å¿ƒé”‹åˆ©è¾¹ç¼˜ï¼ŒæŠŠç”µå™¨æ‹†è§£ç•™ç»™å—è®­äººå‘˜ã€‚å±•è§ˆè¯´æ˜ææ–™ä¸ºä½•éœ€è¦ä¸åŒå¤„ç†ï¼šèšåˆç‰©å¯èƒ½éœ€è¦ä¸“é—¨å·¥è‰ºï¼Œå¤åˆäº§å“åˆ™éš¾ä»¥åˆ†ç¦»ã€‚é˜²è…æ¶‚å±‚å¯èƒ½è®©å›æ”¶æ›´å¤æ‚ï¼Œçœ‹ä¼¼å¾®å°çš„æ‚è´¨ä¹Ÿå¯èƒ½é™ä½æ•´æ‰¹å›æ”¶ææ–™çš„ä»·å€¼ã€‚è¿™äº›ç»†èŠ‚è®©â€œè½»æ¾å›æ”¶â€çš„æ‰¿è¯ºæ˜¾å¾—ä¸å¤Ÿå¯ä¿¡ã€‚ä¹‹åï¼Œæˆ‘ä»¬ä¿®ç†äº†ä¸€æŠŠæ¥å¤´æ¾åŠ¨çš„æ¤…å­ï¼Œç”¨å¤¹å…·å›ºå®šéƒ¨ä»¶ï¼Œç­‰èƒ¶æ°´å‡å›ºã€‚ç»´ä¿®èƒ½å»¶é•¿ä½¿ç”¨å¯¿å‘½ã€å‡å°‘æ›¿æ¢éœ€æ±‚ã€‚å¾ªç¯ç»æµåœ¨ç‰©å“æˆä¸ºåƒåœ¾å‰å°±å·²å¼€å§‹ã€‚å¦‚æœå‚å®¶è®¾è®¡ä¾¿äºç»´æŠ¤ã€å†ç”¨å’Œæ‹†è§£çš„äº§å“ï¼Œæœ€ç»ˆå˜æˆåƒåœ¾çš„å®è´µèµ„æºå°±ä¼šå‡å°‘ã€‚","key":"If manufacturers design products that people can maintain, reuse, and dismantle, fewer valuable resources will end up as litter. || if æ¡ä»¶å¥æ­é…å«å®šè¯­ä»å¥çš„å®¾è¯­ï¼›ä¸‰ä¸ªåŠ¨è¯å¹¶åˆ—æè¿°å¯æŒç»­è®¾è®¡ã€‚","task":"å»¶é•¿äº§å“å¯¿å‘½ï¼Œæ˜¯å‡å°‘èµ„æºæµªè´¹çš„ä¸€ç§åˆ‡å®å¯è¡Œçš„æ–¹æ³•ã€‚ || Extending the useful life of products is a practicable way to reduce the waste of resources.","q":"Why can composite products be hard to recycle? || Their different materials can be difficult to separate. æ–‡ä¸­é€šè¿‡ææ–™æ„æˆè§£é‡Šå›æ”¶å›°éš¾ã€‚","note":"","wc":178,"new":["glue","prolong","tile","scrap","plastic","personnel","polymer","clamp","composite","cable","corrosion","litter","impurity","seemingly","solidify"]},{"id":"22","title":"èŠ‚èƒ½æ”¹é€ ä»ç»†èŠ‚å¼€å§‹","en_title":"An Energy Audit on Campus","kind":"å¬åŠ›Â·èƒ½æºä¸å·¥ç¨‹","en":"Our college invited an engineer to assess energy consumption in the oldest building. She examined the boiler, the radiator, and the pipe network before checking the insulation. A small leakage near a junction had gone unnoticed, and an inefficient heater was consuming more power than necessary. The proposed replacement would require an initial investment, but might reduce long-term costs.\nDuring her presentation, the engineer explained that a watt describes power, while energy use depends on both power and duration. A kilowatt is a thousand watts. She then showed how a sensor could regulate indoor lighting according to brightness and whether a room was occupied. A solar panel might supply part of the building's electricity, but its contribution would vary with conditions.\nThe students wanted a single spectacular solution. The engineer instead recommended a sequence of measurable improvements: insulate exposed pipes, repair faulty controls, ventilate rooms appropriately, and monitor the outcome. Not every impressive technology produces the optimum result in every setting. A careful assessment of actual needs is indispensable to an effective transition towards more efficient energy utilization.","zh":"å­¦æ ¡é‚€è¯·å·¥ç¨‹å¸ˆè¯„ä¼°æœ€è€å»ºç­‘çš„èƒ½è€—ã€‚å¥¹å…ˆæ£€æŸ¥é”…ç‚‰ã€æš–æ°”ç‰‡å’Œç®¡é“ç½‘ç»œï¼Œå†æŸ¥çœ‹ä¿æ¸©æƒ…å†µã€‚æ¥å¤´é™„è¿‘æœ‰ä¸€å¤„å°æ³„æ¼æœªè¢«å‘ç°ï¼Œä¸€å°ä½æ•ˆå–æš–å™¨è€—ç”µè¶…å‡ºéœ€è¦ã€‚æ›´æ¢è®¾å¤‡éœ€è¦åˆå§‹æŠ•èµ„ï¼Œå´å¯èƒ½å‡å°‘é•¿æœŸæˆæœ¬ã€‚æŠ¥å‘Šä¸­ï¼Œå¥¹è¯´æ˜ç“¦ç‰¹æè¿°åŠŸç‡ï¼Œè€Œèƒ½è€—å–å†³äºåŠŸç‡å’ŒæŒç»­æ—¶é—´ï¼›ä¸€åƒç“¦ç­‰äºä¸€åƒç“¦ç‰¹ã€‚å¥¹è¿˜å±•ç¤ºä¼ æ„Ÿå™¨å¦‚ä½•æ ¹æ®äº®åº¦åŠæˆ¿é—´æ˜¯å¦æœ‰äººæ¥è°ƒèŠ‚å®¤å†…ç¯å…‰ã€‚å¤ªé˜³èƒ½æ¿ä¹Ÿè®¸èƒ½ä¾›ç»™éƒ¨åˆ†ç”µåŠ›ï¼Œä½†è´¡çŒ®ä¼šéšæ¡ä»¶å˜åŒ–ã€‚å­¦ç”Ÿå¸Œæœ›æ‰¾åˆ°ä¸€ä¸ªæƒŠäººçš„å•ä¸€æ–¹æ¡ˆï¼Œå·¥ç¨‹å¸ˆå´å»ºè®®è¿›è¡Œä¸€ç³»åˆ—å¯æµ‹é‡æ”¹è¿›ï¼šç»™è£¸éœ²ç®¡é“ä¿æ¸©ã€ä¿®ç†å¤±çµæ§åˆ¶å™¨ã€é€‚å½“é€šé£å¹¶ç›‘æµ‹ç»“æœã€‚å¹¶éæ¯ç§å…ˆè¿›æŠ€æœ¯åœ¨æ‰€æœ‰åœºæ™¯ä¸‹éƒ½æœ€ä¼˜ã€‚è®¤çœŸè¯„ä¼°å®é™…éœ€æ±‚ï¼Œæ˜¯æœ‰æ•ˆè½¬å‘é«˜æ•ˆèƒ½æºåˆ©ç”¨ä¸å¯ç¼ºå°‘çš„æ­¥éª¤ã€‚","key":"Not every impressive technology produces the optimum result in every setting. || not every æ˜¯éƒ¨åˆ†å¦å®šï¼Œæ„ä¸ºâ€œå¹¶éæ¯ä¸€ä¸ªâ€ï¼Œä¸è¦è¯¯è¯‘ä¸ºâ€œæ‰€æœ‰éƒ½ä¸â€ã€‚","task":"èŠ‚èƒ½æ”¿ç­–åº”è¯¥å»ºç«‹åœ¨å®é™…éœ€æ±‚å’Œå¯è¡¡é‡çš„ç»“æœä¹‹ä¸Šã€‚ || Energy-saving policies should be based on actual needs and measurable results.","q":"What approach did the engineer recommend? || A sequence of measurable improvements rather than a single spectacular solution. å¬æ¸…è½¬æŠ˜è¯ instead åçš„å»ºè®®ã€‚","note":"","wc":178,"new":["optimum","transition","watt","regulate","indoor","ventilate","insulate","kilowatt","radiator","brightness","leakage","junction","solar","utilization","heater","boiler","pipe","sensor","indispensable"]},{"id":"23","title":"ä»æœå›­åˆ°é¤æ¡Œ","en_title":"A Farm's Changing Seasons","kind":"ç¿»è¯‘Â·ä¹¡æ‘ç”Ÿæ´»","en":"At dawn, the farmer led us through a fertile valley. An orchard occupied the gentle slope, while barley and another cereal grew on the level ground. Beyond a grassy track, cattle began to graze in a pasture. A rooster called near the poultry shed, where a hen guarded her offspring. The farm also kept a small flock of domestic fowl.\nOur task was to help in the vegetable garden. We used a hoe to loosen the soil, planted a young shoot, and checked the irrigation channels. A toad rested near a water basin, and a bee moved between flowers. The farmer explained that a pest could damage a crop, but careless treatment might also harm useful creatures. Watching a locust did not mean that every insect was an enemy.\nAfter work, we carried a bushel of apples to the storehouse. Some would be sold fresh; others would become juice. Fallen leaves would decompose and return material to the soil. The visit showed us that agricultural productivity rests on patient observation, suitable tools, and an understanding of the relationships that sustain growth.","zh":"é»æ˜ï¼Œå†œæ°‘å¸¦æˆ‘ä»¬ç©¿è¿‡è‚¥æ²ƒå±±è°·ã€‚æœå›­ä½äºç¼“å¡ï¼Œå¤§éº¦å’Œå¦ä¸€ç§è°·ç‰©é•¿åœ¨å¹³åœ°ä¸Šã€‚è‰å¾„å¤–ï¼Œç‰›å¼€å§‹åœ¨ç‰§åœºåƒè‰ã€‚å®¶ç¦½æ£šé™„è¿‘å…¬é¸¡å•¼å«ï¼Œæ¯é¸¡å®ˆç€å¹¼å´½ï¼Œå†œåœºè¿˜å…»ç€ä¸€ç¾¤å…¶ä»–å®¶ç¦½ã€‚æˆ‘ä»¬çš„ä»»åŠ¡æ˜¯åœ¨èœå›­å¸®å¿™ï¼šç”¨é”„å¤´æ¾åœŸã€ç§ä¸‹å¹¼è‹—ï¼Œå¹¶æ£€æŸ¥çŒæº‰æ²Ÿæ¸ ã€‚ä¸€åªèŸ¾èœåœåœ¨æ°´ç›†é™„è¿‘ï¼Œèœœèœ‚åœ¨èŠ±é—´ç§»åŠ¨ã€‚å†œæ°‘è§£é‡Šï¼Œå®³è™«ä¼šä¼¤å®³ä½œç‰©ï¼Œä½†ä¸æ…å¤„ç†ä¹Ÿå¯èƒ½ä¼¤å®³æœ‰ç›Šç”Ÿç‰©ã€‚çœ‹åˆ°ä¸€åªè—è™«ï¼Œä¸ç­‰äºæ‰€æœ‰æ˜†è™«éƒ½æ˜¯æ•Œäººã€‚åŠ³åŠ¨åï¼Œæˆ‘ä»¬æŠŠä¸€è’²å¼è€³è‹¹æœæ¬å…¥åº“æˆ¿ï¼Œæœ‰çš„é²œå–ï¼Œæœ‰çš„æ¦¨æ±ã€‚è½å¶ä¼šåˆ†è§£ï¼Œè®©ç‰©è´¨å›åˆ°åœŸå£¤ã€‚å‚è§‚è®©æˆ‘ä»¬çœ‹åˆ°ï¼Œå†œä¸šç”Ÿäº§åŠ›ä¾èµ–è€å¿ƒè§‚å¯Ÿã€åˆé€‚å·¥å…·ï¼Œä» ndividual effort and the infrastructure that makes responsible behaviour possible.","zh":"æµ·è¾¹æ¸…æ´å¼€å§‹å‰ï¼Œç»„ç»‡è€…åšå®‰å…¨è¯´æ˜ï¼šç•™åœ¨æ²™æ»©ï¼Œé¿å¼€æ¹¿æ»‘å²©çŸ³ï¼Œå‘ç°å°–é”ç‰©å°±æŠ¥å‘Šï¼›ä¸è¦æ¶‰å…¥é£æµªå¤§çš„å°æµ·æ¹¾ï¼Œä¹Ÿä¸è¦å°è¯•ä»ç¤çŸ³ä¸Šæ¡åƒåœ¾ã€‚å³ä½¿æ°´é¢å¹³é™ï¼Œæ½®æ±å˜åŒ–ä¹Ÿå¯èƒ½å¸¦æ¥å±é™©ã€‚æˆ‘ä»¬åœ¨ç å¤´é™„è¿‘æ‰¾åˆ°ä¸€æ®µé±¼çº¿ã€ç ´æ¸”ç½‘å’Œå¡‘æ–™ç®±ã€‚èƒèŸ¹è—åœ¨è´å£³ä¸‹ï¼Œæµ·é¸¥åœ¨ç å¤´ä¸Šç›˜æ—‹ã€‚è¿œå¤„æ¸¡èˆ¹ç©¿è¿‡æµ·å³¡é©¶å‘æµ·æ¸¯ï¼Œå°¾æµæŠŠå°ç‰‡æ°´èŠ±æ¨ä¸Šå²¸ã€‚æ—¥å¸¸æ´»åŠ¨ä¸éšæ„ä¸¢å¼ƒçš„åƒåœ¾å½¢æˆé²œæ˜å¯¹ç…§ã€‚ç»“æŸæ—¶ï¼Œæˆ‘ä»¬è®°å½•åƒåœ¾æ•°é‡å’Œç§ç±»ï¼Œç”¨æ•°æ®æ”¯æŒå½“åœ°æ”¹è¿›åºŸç‰©ç®¡ç†çš„è¡ŒåŠ¨ã€‚æˆ‘ä»¬æ²¡æœ‰å‡è£…ä¸€ä¸Šåˆèƒ½å‡€åŒ–æ•´ç‰‡æµ·å²¸ï¼Œä½†é‡å¤è¡ŒåŠ¨èƒ½å‡å°‘ä¼¤å®³ã€åŠ æ·±è®¤è¯†å¹¶é¼“åŠ±åˆä½œã€‚æµ·æ´‹ä¿æŠ¤æ—¢éœ€è¦ä¸ªäººåŠªåŠ›ï¼Œä¹Ÿéœ€è¦ä½¿è´Ÿè´£è¡Œä¸ºæˆä¸ºå¯èƒ½çš„åŸºç¡€è®¾æ–½ã€‚","key":"Protecting the sea requires both individual effort and the infrastructure that makes responsible behaviour possible. || åŠ¨åè¯çŸ­è¯­ä½œä¸»è¯­ï¼Œè°“è¯­ç”¨å•æ•° requiresï¼›both ... and ... è¿æ¥ä¸¤ä¸ªå¿…è¦æ¡ä»¶ã€‚","task":"ä¸ªäººè¡ŒåŠ¨èƒ½å¤Ÿå¸¦æ¥æ”¹å˜ï¼Œä½†ä¹Ÿéœ€è¦å…¬å…±è®¾æ–½å’Œé•¿æœŸæ”¿ç­–çš„æ”¯æŒã€‚ || Individual action can make a difference, but it also needs support from public facilities and long-term policies.","q":"What would the recorded data be used for? || To support a local campaign for better waste management. ç•™æ„æ´»åŠ¨ç»“æŸåæ•°æ®çš„ç”¨é€”ã€‚","note":"","wc":175,"new":["net","crab","peril","purify","wade","contrast","shell","wharf","inlet","reef","splash","line","strait","seaport","seaside","number","ferry","length","pier"]},{"id":"25","title":"è‡ªè¡Œè½¦ç»´ä¿®å®¤é‡Œçš„åŠ›å­¦","en_title":"Mechanics at the Repair Bench","kind":"é˜…è¯»Â·å·¥ç¨‹ç§‘æ™®","en":"At the repair bench, the instructor asked us to mount a bicycle securely before examining the rear wheel. We checked the axle, the bearing, and the alignment of the frame. A bent shaft could make a rotating part move unevenly, while excessive friction could waste energy. The instructor used a wrench to tighten a nut and a lever to lift a heavy component.\nNext came a demonstration of torque. A force applied farther from the axis could produce a greater turning effect, provided its direction was appropriate. We turned a crank slowly and watched the pedal rotate. A small model showed how a gear could change the relationship between speed and turning force. Another displayed a piston moving inside a cylinder.\nThe lesson connected theory with visible motion. We learnt to distinguish axial movement from sideways displacement and to notice a loose hinge before it caused damage. No one was permitted to operate unfamiliar equipment without supervision. Understanding mechanics meant more than memorizing a formula: it required noticing how parts interact and recognizing when an apparently minor defect could endanger the whole operation.","zh":"ç»´ä¿®å°å‰ï¼ŒæŒ‡å¯¼å‘˜è®©æˆ‘ä»¬å…ˆå›ºå®šè‡ªè¡Œè½¦ï¼Œå†æ£€æŸ¥åè½®ã€‚æˆ‘ä»¬æŸ¥çœ‹è½¦è½´ã€è½´æ‰¿å’Œè½¦æ¶å¯¹é½æƒ…å†µã€‚å¼¯æ›²è½¬è½´å¯èƒ½ä½¿æ—‹è½¬éƒ¨ä»¶è¿åŠ¨ä¸å‡ï¼Œè¿‡å¤§æ‘©æ“¦åˆ™ä¼šæµªè´¹èƒ½é‡ã€‚æŒ‡å¯¼å‘˜ç”¨æ‰³æ‰‹æ‹§ç´§èºæ¯ï¼Œç”¨æ æ†æŠ¬èµ·é‡éƒ¨ä»¶ã€‚éšåæ¼”ç¤ºæ‰­çŸ©ï¼šæ–¹å‘åˆé€‚æ—¶ï¼ŒåŠ›ä½œç”¨ç‚¹ç¦»è½´è¶Šè¿œï¼Œè½¬åŠ¨æ•ˆæœå¯èƒ½è¶Šå¼ºã€‚æˆ‘ä»¬æ…¢æ…¢è½¬æ›²æŸ„ï¼Œè§‚å¯Ÿè¸æ¿æ—‹è½¬ï¼›å°æ¨¡å‹å±•ç¤ºé½¿è½®å¦‚ä½•æ”¹å˜è½¬é€Ÿä¸è½¬åŠ¨åŠ›ä¹‹é—´çš„å…³ç³»ï¼Œå¦ä¸€æ¨¡å‹å±•ç¤ºæ´»å¡åœ¨æ°”ç¼¸å†…è¿åŠ¨ã€‚è¯¾ç¨‹æŠŠç†è®ºä¸å¯è§è¿åŠ¨è”ç³»èµ·æ¥ã€‚æˆ‘ä»¬å­¦ä¹ åŒºåˆ†è½´å‘è¿åŠ¨ä¸ä¾§å‘ä½ç§»ï¼Œå¹¶åœ¨é“°é“¾æ¾åŠ¨é€ æˆæŸåå‰å‘ç°é—®é¢˜ã€‚æ²¡äººèƒ½åœ¨æ— äººç›‘ç£æ—¶æ“ä½œé™Œç”Ÿè®¾å¤‡ã€‚ç†è§£åŠ›å­¦ä¸åªæ˜¯èƒŒå…¬å¼ï¼Œè¿˜è¦è§‚å¯Ÿéƒ¨ä»¶ç›¸äº’ä½œç”¨ï¼Œè®¤è¯†åˆ°å°ç¼ºé™·å¯èƒ½å±åŠæ•´ä¸ªè¿è¡Œã€‚","key":"Understanding mechanics meant more than memorizing a formula: it required noticing how parts interact. || åŠ¨åè¯ä½œä¸»è¯­ï¼›more than + åŠ¨åè¯è¡¨ç¤ºâ€œä¸åªæ˜¯â€ï¼›å†’å·åè§£é‡Šæ›´æ·±å±‚è¦æ±‚ã€‚","task":"å³ä½¿æ˜¯ä¸€ä¸ªå°ç¼ºé™·ï¼Œä¹Ÿå¯èƒ½å½±å“æ•´å°è®¾å¤‡çš„å¯é æ€§ã€‚ || Even a minor defect can affect the reliability of an entire machine.","q":"What did the lesson connect? || Mechanical theory with directly observable motion and practical inspection. å­¦ä¹ é‡ç‚¹æ˜¯æŠŠæ¦‚å¿µç”¨äºè§‚å¯Ÿã€‚","note":"ç§‘æŠ€æœ¯è¯­ç”¨äºé˜…è¯»è¯†åˆ«ï¼Œä¸å¿…æŠŠ torqueã€axial ç­‰ç”Ÿç¡¬æ”¾å…¥æ™®é€šè®®è®ºæ–‡ã€‚","wc":183,"new":["mount","torque","axial","axis","bearing","operation","cylinder","displacement","sideways","endanger","lever","pedal","rear","crank","wrench","nut","mechanics","piston","hinge","move","alignment","gear","friction","axle","shaft","tighten","rotate"]},{"id":"26","title":"ä¸€é—´ææ–™å®éªŒå®¤","en_title":"Inside a Materials Laboratory","kind":"é˜…è¯»Â·ææ–™ä¸å®éªŒ","en":"The laboratory compared a metal strip with a sample of polymer. Students measured tensile strength, watched a specimen bend, and recorded the point at which a fracture appeared. A wedge helped hold one sample in place, while a protective screen separated the observers from the apparatus. Safety took precedence over speed.\nA second experiment examined deformation under pressure. A soft material could flatten or stretch, whereas a brittle one might crack. The instructor warned that surface appearance alone could not predict capability. A shiny coating might hide an internal flaw, and a thick workpiece was not necessarily stronger in every direction. The sample's composition and manufacturing process also mattered.\nThe team used calibration records to check its instruments. A small deviation in measurement could become significant when results were compared. Rather than discard an unexpected reading, students repeated the procedure and described the discrepancy. Experimentation requires an honest account of uncertainty. The purpose was to assess a material's behaviour under specified conditions, not to declare one substance universally superior to every alternative.","zh":"å®éªŒå®¤æ¯”è¾ƒä¸€æ¡é‡‘å±ä¸ä¸€å—è She reminded us that a circuit diagram simplifies a physical arrangement.\nWe examined a silicon chip under a camera connected to a projector. Its tiny scale contrasted with the old radio receiver beside it. A microprocessor could perform operations far more quickly than the mechanical devices in the display, but it still required a suitable power supply. An insulator prevented an unintended electrical connection, while a loose contact could interrupt transmission.\nThe class then discussed a photoelectric detector and an optical sensor. Both examples helped us link an invisible process to a visible response. The demonstration used enclosed educational equipment; students did not handle live household wiring. The most useful insight was that a complex device becomes easier to understand when its function is divided into a sequence of manageable parts.","zh":"ç”µå·¥ç»™ç”µå­è¯¾å¸¦æ¥æ¼”ç¤ºæ¿ï¼Œä¸Šé¢æœ‰ç”µæ± ã€å¼€å…³ã€å°ç¯å’Œç”µå®¹å™¨ï¼Œå›¾ç¤ºè¯´æ˜å„éƒ¨ä»¶çš„è¿æ¥ã€‚æŒ‡å¯¼å‘˜è§£é‡Šï¼Œç”µé˜»çš„å•ä½æ˜¯æ¬§å§†ï¼Œohm æ˜¯å•æ•°å½¢å¼ï¼›ç”µå®¹çš„å•ä½æ˜¯æ³•æ‹‰ã€‚å¥¹æé†’ï¼Œç”µè·¯å›¾æ˜¯å¯¹å®é™…å¸ƒå±€çš„ç®€åŒ–ã€‚æˆ‘ä»¬é€šè¿‡è¿æ¥æŠ•å½±ä»ªçš„æ‘„åƒå¤´è§‚å¯Ÿç¡…èŠ¯ç‰‡ã€‚å…¶å¾®å°å°ºå¯¸ä¸æ—è¾¹æ—§æ”¶éŸ³æœºå½¢æˆå¯¹æ¯”ã€‚å¾®å¤„ç†å™¨è¿ç®—è¿œå¿«äºå±•å‡ºçš„æœºæ¢°è®¾å¤‡ï¼Œä½†ä»éœ€è¦åˆé€‚ç”µæºã€‚ç»ç¼˜ä½“é˜²æ­¢æ„å¤–ç”µè¿æ¥ï¼Œæ¥ç‚¹æ¾åŠ¨åˆ™ä¼šä¸­æ–­ä¼ è¾“ã€‚éšåï¼Œè¯¾å ‚è®¨è®ºå…‰ç”µæ¢æµ‹å™¨å’Œå…‰å­¦ä¼ æ„Ÿå™¨ï¼Œå¸®åŠ©æˆ‘ä»¬æŠŠä¸å¯è§è¿‡ç¨‹ä¸å¯è§ååº”è”ç³»èµ·æ¥ã€‚æ¼”ç¤ºé‡‡ç”¨å°é—­æ•™å­¦è®¾å¤‡ï¼Œå­¦ç”Ÿä¸æ¥è§¦å®¶ç”¨å¸¦ç”µçº¿è·¯ã€‚æœ€å®ç”¨çš„è®¤è¯†æ˜¯ï¼šæŠŠå¤æ‚è®¾å¤‡çš„åŠŸèƒ½åˆ†è§£ä¸ºå¯ç†è§£çš„å°æ­¥éª¤ï¼Œå°±æ›´å®¹æ˜“çœ‹æ‡‚å®ƒã€‚","key":"A complex device becomes easier to understand when its function is divided into a sequence of manageable parts. || when ä»å¥è¯´æ˜ç†è§£æ¡ä»¶ï¼›è¢«åŠ¨è¯­æ€çªå‡ºè¢«åˆ†æçš„åŠŸèƒ½è€Œéæ‰§è¡Œè€…ã€‚","task":"æŠŠå¤æ‚é—®é¢˜åˆ†æˆè¾ƒå°çš„éƒ¨åˆ†ï¼Œèƒ½å¤Ÿå¸®åŠ©å­¦ä¹ è€…é€æ­¥å»ºç«‹ç†è§£ã€‚ || Dividing a complex problem into smaller parts can help learners develop understanding step by step.","q":"Why was the old radio displayed beside the chip? || To contrast its physical scale with modern electronic technology. å¯¹æ¯”ç”¨äºå¸®åŠ©ç†è§£æŠ€æœ¯å˜åŒ–ã€‚","note":"ohm çš„å•æ•°è¢«æ˜ç¡®å†™å‡ºä»¥å¯¹åº”è¯è¡¨ã€‚å¤æ•° ohms å¸¸ç”¨äºå®é™…æ•°é‡è¡¨è¾¾ã€‚","wc":180,"new":["singular","transmission","microprocessor","projector","battery","ohm","receiver","silicon","photoelectric","optical","insulator","detector","insight","capacitance","electronics","capacitor","electrician","chip","switch","board"]},{"id":"28","title":"åŒ–å­¦è¯¾ä¸åªæ˜¯åœ¨è®°ç¬¦å·","en_title":"Chemistry beyond Symbols","kind":"é˜…è¯»Â·åŒ–å­¦ä¸ææ–™","en":"In the chemistry gallery, labels introduced zinc, nickel, sodium, and mercury. Another case displayed graphite, quartz, limestone, and a piece of granite. The guide stressed that naming a substance was only the start of understanding it. Its properties depended on its structure and the conditions under which it was examined.\nA model represented an atom with a central nucleus and surrounding electrons. A proton carried positive charge, while a neutron was electrically neutral. An ion differed from a neutral atom or group of atoms because it had gained or lost electrons. The class then compared an inorganic compound with a hydrocarbon and considered what a molecular diagram could show.\nIn a recorded demonstration, a metal could oxidize and form an oxide. Elsewhere, a display illustrated an electrode and an anode in a particular cell. The guide did not invite us to mix unfamiliar chemicals. Instead, she asked us to read each label carefully and distinguish an observation from an explanation. Scientific literacy begins when technical terminology helps us reason about evidence rather than merely impress an audience.","zh":"åŒ–å­¦å±•å…çš„æ ‡ç­¾ä»‹ç»é”Œã€é•ã€é’ å’Œæ±ï¼Œå¦ä¸€ä¸ªå±•æŸœå±•ç¤ºçŸ³å¢¨ã€çŸ³è‹±ã€çŸ³ç°å²©å’ŒèŠ±å²—å²©ã€‚å¯¼æ¸¸å¼ºè°ƒï¼Œå«å‡ºç‰©è´¨å ht, and a spring stored energy when compressed. Visitors could observe the kinetic energy of a moving trolley and the friction that slowed it. A rotating propeller produced thrust in an enclosed demonstration, helping explain one form of propulsion. The shape of the blade and the rate of rotation affected the result.\nThe instructor asked us to consider both useful output and unwanted losses. Vibration, heat, and sound could dissipate energy that might otherwise perform work. A smooth motion did not imply a perfect machine. By identifying where losses occurred, a designer could modify a component, streamline a process, or choose a more suitable mechanism. Engineering progress often comes from a series of careful improvements rather than a single dramatic invention.","zh":"å·¥ç¨‹å±•ä¸Šï¼Œå°é£è½¦ç«‹åœ¨æ¶¡è½®æ¨¡å‹æ—ã€‚æµåŠ¨ç©ºæ°”èƒ½å¸¦åŠ¨è½¬å­å¹¶é©±åŠ¨å‘ç”µæœºã€‚å¦ä¸€å±•é¡¹ç”¨é€æ˜è½¯ç®¡è¯´æ˜æ¶²å‹ç³»ç»Ÿï¼Œå°é—­æ¨¡å‹åˆ™æ¼”ç¤ºæ°”åŠ¨è¿åŠ¨ã€‚å¯¼æ¸¸æ¯”è¾ƒè¿™äº›æœºæ„ï¼Œå¹¶æœªè¯´å®ƒä»¬å¯ä»¥äº’æ¢ã€‚æ»‘è½®å¸®åŠ©æå‡é‡ç‰©ï¼Œå¼¹ç°§å—å‹æ—¶å‚¨å­˜èƒ½é‡ã€‚å‚è§‚è€…è§‚å¯Ÿç§»åŠ¨å°è½¦çš„åŠ¨èƒ½ï¼Œä»¥åŠè®©å®ƒå‡é€Ÿçš„æ‘©æ“¦ã€‚å°é—­æ¼”ç¤ºä¸­ï¼Œæ—‹è½¬èºæ—‹æ¡¨äº§ç”Ÿæ¨åŠ›ï¼Œå¸®åŠ©è§£é‡Šä¸€ç§æ¨è¿›æ–¹å¼ï¼›å¶ç‰‡å½¢çŠ¶å’Œè½¬é€Ÿä¼šå½±å“ç»“æœã€‚æŒ‡å¯¼å‘˜è®©æˆ‘ä»¬åŒæ—¶è€ƒè™‘æœ‰ç”¨è¾“å‡ºä¸éé¢„æœŸæŸè€—ã€‚æŒ¯åŠ¨ã€çƒ­å’Œå£°éŸ³å¯èƒ½ä½¿åŸæœ¬å¯ç”¨äºåšåŠŸçš„èƒ½é‡è€—æ•£ã€‚è¿åŠ¨å¹³ç¨³ä¸ç­‰äºæœºå™¨å®Œç¾ã€‚æŸ¥æ˜æŸè€—ä½ç½®åï¼Œè®¾è®¡è€…èƒ½ä¿®æ”¹éƒ¨ä»¶ã€ç®€åŒ–æµç¨‹æˆ–é€‰æ‹©æ›´åˆé€‚çš„æœºæ„ã€‚å·¥ç¨‹è¿›æ­¥å¸¸æ¥è‡ªä¸€è¿ä¸²è®¤çœŸæ”¹è¿›ï¼Œè€Œä¸æ˜¯å•ä¸€æƒŠäººå‘æ˜ã€‚","key":"By identifying where losses occurred, a designer could modify a component, streamline a process, or choose a more suitable mechanism. || by + åŠ¨åè¯è¯´æ˜æ–¹æ³•ï¼›where å¼•å¯¼å®¾è¯­ä»å¥ï¼›ä¸‰ä¸ªåŠ¨è¯å¹¶åˆ—åˆ—å‡ºå¯é‡‡å–çš„æªæ–½ã€‚","task":"å‘ç°èƒ½é‡æŸå¤±å‘ç”Ÿåœ¨å“ªé‡Œï¼Œæ˜¯æé«˜è®¾å¤‡æ•ˆç‡çš„é‡è¦ä¸€æ­¥ã€‚ || Identifying where energy losses occur is an important step tow d current ability.\nAt the first session, we would jog, practise balance, and learn a controlled movement involving the hip and thigh. Some participants could barely complete the sequence, while others wanted an extra challenge. The coach asked us not to mock a slower learner or mistake discomfort for achievement. A competitive atmosphere could energize a group, but excessive comparison could also frustrate it.\nAfter several weeks, the participants noticed steadier progress. The aim was to feel physically capable and remain engaged. Regular recreation offered a break from work and an opportunity to build supportive relationships. A modest routine we could sustain was more useful than an extreme programme abandoned after a few days.","zh":"æ•™ç»ƒé¼“åŠ±æˆ‘ä»¬æŠŠä½“èƒ½çœ‹ä½œé€æ­¥åŸ¹å…»çš„ç»“æœã€‚è‚Œè‚‰å¤–è§‚ä¸è¯æ˜è€åŠ›ï¼ŒçŒ›çƒˆå¼€å¤´ä¹Ÿä¸ä¿è¯èƒ½åšæŒï¼Œæ¯äººéœ€è¦ç¬¦åˆç»éªŒä¸å½“å‰èƒ½åŠ›çš„å¯è°ƒè®¡åˆ’ã€‚ç¬¬ä¸€æ¬¡è®­ç»ƒåŒ…å«æ…¢è·‘ã€å¹³è¡¡åŠæ¶‰åŠé«‹éƒ¨å’Œå¤§è…¿çš„å—æ§åŠ¨ä½œã€‚æœ‰äººå‹‰å¼ºå®Œæˆï¼Œæœ‰äººå¸Œæœ›å¢åŠ æŒ‘æˆ˜ã€‚æ•™ç»ƒè¦æ±‚ä¸å˜²ç¬‘æ…¢ä¸€äº›çš„å­¦ä¹ è€…ï¼Œä¹Ÿä¸æŠŠä¸é€‚è¯¯å½“æˆç»©ã€‚ç«äº‰æ°”æ°›å¯ä»¥æ¿€åŠ±å›¢é˜Ÿï¼Œè¿‡åº¦æ¯”è¾ƒå´å¯èƒ½ä½¿äººå—æŒ«ã€‚å‡ å‘¨åï¼Œå¤§å®¶çš„è¿›æ­¥æ›´ç¨³å®šï¼Œç›®æ ‡æ˜¯èº«ä½“èƒ½èƒœä»»æ´»åŠ¨å¹¶ä¿æŒå‚ä¸ã€‚è§„å¾‹ä¼‘é—²è®©äººæš‚ç¦»å·¥ä½œã€å»ºç«‹æ”¯æŒå…³ç³»ã€‚èƒ½åšæŒçš„é€‚é‡å®‰æ’ï¼Œæ¯”å‡ å¤©åæ”¾å¼ƒçš„æç«¯è®¡åˆ’æ›´æœ‰ç”¨ã€‚","key":"A muscular appearance did not prove endurance, and a vigorous start did not guarantee a sustainable routine. || ä¸¤ä¸ªå¹³è¡Œå¦å®šå¥åŒºåˆ†è¡¨è±¡ä¸é•¿æœŸèƒ½åŠ›ã€‚","task":"å¯æŒç»­çš„è¿›æ­¥éœ€è¦é€‚åˆä¸ªäººèƒ½åŠ›çš„è®¡åˆ’ã€‚ || Sustainable progress requires a plan suited to individual ability.","q":"What was the coach's attitude towards comparison? || Competition could help, but excessive comparison could frustrate learners. ç­”æ¡ˆä¿ç•™ä¸¤é¢æ€§ã€‚","note":"","wc":151,"new":["recreation","physically","hip","fitness","jog","endurance","feel","adjustable","competitive","vigorous","barely","challenge","extreme","muscular","thigh","energize","extra","coach","frustrate","mock"]},{"id":"40","title":"åˆç§Ÿç”Ÿæ´»é‡Œçš„åå•†","en_title":"Sharing a Home","kind":"å¬åŠ›Â·ä½å®¿æ²Ÿé€š","en":"When we moved into our lodging, the sitting-room contained a sofa, a couch cover, and a small table. A closet held spare bedding, while the pantry was almost empty. The landlord showed us the basement, the laundry area, and the balcony before handing over the key.\nSharing the space required more than dividing the rent. We agreed to rinse dishes, scrub the sink, and mop up a spill promptly. Nobody should leave underwear or pyjamas in the common lounge. One flatmate preferred an early breakfast; another came home late and needed a quiet place to unwind. These habits were not necessarily incompatible.\nWe held a short meeting whenever a complaint arose. An explicit agreement helped prevent a minor annoyance from becoming lasting resentment. The flat was neither luxurious nor spacious, but considerate behaviour made it homely. A comfortable home depends as much on cooperation as on furniture.","zh":"æ¬å…¥ä½å¤„æ—¶ï¼Œèµ·å±…å®¤æœ‰æ²™å‘ã€æ²™å‘ç½©å’Œå°æ¡Œã€‚å£æ©±å­˜æ”¾å¤‡ç”¨å¯å…·ï¼Œé£Ÿå“å‚¨è—é—´å‡ ä¹ç©ºç€ã€‚æˆ¿ä¸œå±•ç¤ºåœ°ä¸‹å®¤ã€æ´—è¡£åŒºå’Œé˜³å°åäº¤é’¥åŒ™ã€‚åˆç§Ÿä¸åªæ˜¯åˆ†æˆ¿ç§Ÿã€‚å¤§å®¶åŒæ„å†²å‡€ç¢—ç¢Ÿã€åˆ·æ´—æ°´æ§½å¹¶åŠæ—¶æ‹–å‡€æ³¼æ´’ç‰©ï¼Œä¸æŠŠå†…è¡£ç¡è¡£ç•™åœ¨å…¬å…±ä¼‘æ¯å®¤ã€‚ä¸€äººå–œæ¬¢æ—©åƒæ—©é¥­ï¼Œå¦ä¸€äººæ™šå½’éœ€è¦å®‰é™æ”¾æ¾ï¼Œè¿™äº›ä¹ æƒ¯æœªå¿…ä¸èƒ½å…¼å®¹ã€‚å‡ºç°æŠ±æ€¨å°±å¼€çŸ­ä¼šï¼Œæ˜ç¡®çº¦å®šèƒ½é˜²æ­¢å°çƒ¦æ¼å˜æˆé•¿æœŸæ€¨æ¨ã€‚æˆ¿å­æ—¢ä¸è±ªåä¹Ÿä¸å®½å¤§ï¼Œä½†ä½“è°…è®©å®ƒæ¸©é¦¨ã€‚èˆ’é€‚çš„å®¶æ—¢ä¾èµ–å®¶å…·ï¼Œä¹Ÿä¾èµ–åˆä½œã€‚","key":"A comfortable home depends as much on cooperation as on furniture. || as much on A as on B è¡¨ç¤ºä¸¤æ–¹é¢åŒæ ·é‡è¦ã€‚","task":"æ˜ç¡®çš„çº¦å®šæœ‰åŠ©äºé˜²æ­¢å°åˆ†æ­§æ¼”å˜æˆä¸¥é‡å†²çªã€‚ || Clear agreements help prevent minor disagreements from developing into serious conflicts.","q":"How did the flatmates deal with complaints? || They held a short meeting and clarified agreements. è§£å†³æ–¹å¼æ˜¯åŠæ—¶åå•†ã€‚","note":"","wc":147,"new":["sofa","balcony","closet","laundry","couch","rinse","pantry","underwear","sitting-room","homely","lodging","complaint","mop","basement","breakfast","incompatible","luxurious","spill","lounge","pyjamas","sink","scrub"]},{"id":"41","title":"å­¦ç”Ÿç¤¾å›¢çš„å…¬å¼€å†³ç­–","en_title":"Rules for a Student Association","kind":"å†™ä½œÂ·æ²»ç†ä¸è´£ä»»","en":"Our association asked a volunteer to preside over its annual meeting. The treasurer presented the accounts, and a delegate proposed an alteration to the constitution. The new provision would require public notice before a major expenditure. Members could second a motion, debate its merit, and vote in a poll.\nOne faction wanted to abolish every procedural constraint, arguing that bureaucracy wasted time. Others feared that a powerful chair might dominate decisions. We eventually reached an accord: retain a brief review, but shorten unnecessary paperwork. The committee would designate a deputy to supervise implementation and publish a quarterly summary.\nThe unanimous decision did not remove every disagreement about politics. It established a procedure whereby disagreement could be expressed fairly. A charter is valuable when people abide by its principles and hold each other accountable. Good administration should make participation possible while preventing authority from becoming a personal privilege.","zh":"ç¤¾å›¢è¯·å¿—æ„¿è€…ä¸»æŒå¹´ä¼šï¼Œè´¢åŠ¡è´Ÿè´£äººæ±‡æŠ¥è´¦ç›®ï¼Œä¸€ä½ä»£è¡¨æè®®ä¿®æ”¹ç« ç¨‹ï¼šå¤§ç¬”å¼€æ”¯å‰å¿…é¡»å…¬å¼€é€šçŸ¥ã€‚æˆå‘˜å¯é™„è®®ã€è®¨è®ºä»·å€¼å¹¶æŠ•ç¥¨ã€‚ä¸€ä¸ªæ´¾åˆ«ä¸»å¼ åºŸé™¤ä¸€åˆ‡ç¨‹åºé™åˆ¶ï¼Œè®¤ä¸ºå®˜åƒšæ‰‹ç»­æµªè´¹æ—¶é—´ï¼›å…¶ä»–äººæ‹…å¿ƒå¼ºåŠ¿ä¸»å¸­æ§åˆ¶å†³ç­–ã€‚æœ€ç»ˆå¤§å®¶è¾¾æˆä¸€è‡´ï¼šä¿ç•™ç®€çŸ­å®¡æŸ¥ï¼Œå‡å°‘å¤šä½™æ–‡ä¹¦ï¼ŒæŒ‡å®šå‰¯æ‰‹ç›‘ç£æ‰§è¡Œå¹¶å‘å¸ƒå­£åº¦æ‘˜è¦ã€‚ä¸€è‡´é€šè¿‡ä¸ä»£è¡¨æ”¿æ²»åˆ†æ­§æ mate concern.","zh":"ä¾›åº”å•†å‘å‘˜å·¥è¡Œè´¿ï¼Œå¸Œæœ›ä»–å¿½ç•¥ä¸€æ‰¹ç¼ºé™·äº§å“ã€‚æ¥å—è´¿èµ‚æ—¢è¿èƒŒå…¬å¸è§„å®šï¼Œä¹ŸèƒŒå›å®¢æˆ·ï¼Œä½†å‘˜å·¥æ‹…å¿ƒä¸¾æŠ¥å½±å“æ™‹å‡ã€‚åŒäº‹å»ºè®®è®°å½•äº‹å®å¹¶ä½¿ç”¨å…¬å¸æŠ¥å‘Šæµç¨‹ã€‚åç»­è°ƒæŸ¥å‘ç°å¤šç¬”äº¤æ˜“å¼‚å¸¸ã€‚ç®¡ç†äººå‘˜æ›¾ç”¨æ¨¡ç³Šå£°æ˜ç²‰é¥°é—®é¢˜ï¼Œä½†è¯æ®å¦å®šå…¶è¯´æ³•ã€‚è‘£äº‹ä¼šå†³å®šè§£é›‡è´Ÿè´£äººã€å§”æ‰˜ç‹¬ç«‹å®¡æŸ¥å¹¶è¡¥å¿å®¢æˆ·ã€‚ä¸‘é—»æŸå®³çš„ä¸åªæ˜¯çœ¼å‰æ”¶ç›Šï¼Œè¿˜ä¼šå‰Šå¼±é•¿æœŸåˆä½œçš„ä¿¡ä»»ã€‚ç»„ç»‡ä¸èƒ½ä»…å‡­è¡Œä¸ºå‡†åˆ™å°±å®£ç§°é“å¾·ä¼˜è¶Šï¼›æ„¿æ„æ‰¿è®¤é”™è¯¯ã€è½å®é€‚å½“åæœå¹¶ä¿æŠ¤æ­£å½“åæ˜ é—®é¢˜è€…æ—¶ï¼Œè¯šä¿¡æ‰çœŸæ­£æ˜¾ç°ã€‚","key":"Its integrity becomes manifest when it is willing to acknowledge wrongdoing. || when ä»å¥ç»™å‡ºæŠ½è±¡å“è´¨å¾—ä»¥ä½“ç°çš„å…·ä½“æ¡ä»¶ã€‚","task":"å…¬ä¼—ä¿¡ä»»å–å†³äºç»„ç»‡å¦‚ä½•å›åº”é”™è¯¯ã€‚ || Public trust depends on how an organization responds to its mistakes.","q":"Why was the employee initially hesitant? || He feared that reporting the incident might harm his promotion. ç•™æ„å¿ƒç†åŠ¨å› ã€‚","note":"","wc":150,"new":["commission","violate","dismiss","whitewash","ambiguous","impose","bribe","denial","subsequent","scandal","irregularity","manifest"]},{"id":"43","title":"ä¸€åœºæ¨¡æ‹Ÿæ³•åº­","en_title":"Evidence in a Mock Court","kind":"é˜…è¯»Â·å…¬å…±è§„åˆ™","en":"In a mock court, a student played a detective investigating a theft. Another acted as an attorney, while a third took the role of a magistrate. The alleged offence involved a stolen bicycle. The class had to distinguish suspicion from proof before discussing guilt.\nA witness would testify about what she had seen, not what gossip suggested. The defence could challenge a claim, question identification, and make a plea for careful consideration. A confession in the script was not automatically conclusive: its circumstances also mattered. The teacher asked us not to presume that a suspicious appearance established wrongdoing.\nThe exercise ended without a real conviction or penalty. Its purpose was to acquaint us with disciplined reasoning. It is easy to demand certainty when a story provokes anger; it is harder to examine competing explanations fairly. An impartial process protects both the person making a complaint and the person accused.","zh":"æ¨¡æ‹Ÿæ³•åº­ä¸Šï¼Œå­¦ç”Ÿåˆ†åˆ«æ‰®æ¼”ä¾¦æ¢ã€å¾‹å¸ˆå’Œæ³•å®˜ï¼Œæ¡ˆä»¶æ˜¯ä¸€è¾†è‡ªè¡Œè½¦å¤±çªƒã€‚è®¨è®ºæœ‰ç½ªä¸å¦å‰ï¼Œè¦åŒºåˆ†æ€€ç–‘ä¸è¯æ®ã€‚è¯äººåªèƒ½é™ˆè¿°æ‰€è§ï¼Œä¸ä¾èµ–æµè¨€ï¼›è¾©æ–¹å¯è´¨ç–‘ä¸»å¼ ä¸èº«ä»½è¾¨è®¤ï¼Œå¹¶è¯·æ±‚æ…é‡è€ƒè™‘ã€‚å‰§æœ¬ä¸­çš„ä¾›è®¤ä¹Ÿå¹¶éè‡ªåŠ¨æˆä¸ºå®šè®ºï¼Œè¿˜è¦çœ‹å‘ç”ŸèƒŒæ™¯ã€‚è€å¸ˆè¦æ±‚ä¸è¦å‡­å¤–è¡¨å¯ç–‘å°±è®¤å®šçŠ¯é”™ã€‚æ´»åŠ¨æ²¡æœ‰çœŸå®å®šç½ªæˆ–å¤„ç½šï¼Œè€Œæ˜¯è®©å¤§å®¶ç†Ÿæ‚‰ä¸¥è°¨æ¨ç†ã€‚æ•…äº‹æ¿€èµ·æ„¤æ€’æ—¶è¦æ±‚ç¡®å®šç­”æ¡ˆå¾ˆå®¹æ˜“ï¼Œå…¬æ­£å®¡è§†ä¸åŒè§£é‡Šæ›´éš¾ã€‚å…¬æ­£ç¨‹åºåŒæ—¶ä¿æŠ¤ç”³è¯‰è€…ä¸è¢«æŒ‡æ§è€…ã€‚","key":"It is easy to demand certainty; it is harder to examine competing explanations fairly. || it ä½œå½¢å¼ä¸»è¯­ï¼Œä¸å®šå¼ä¸ºçœŸæ­£ä¸»è¯­ï¼Œå¹³è¡Œæ¯”è¾ƒå¢å¼ºè®ºè¯ã€‚","task":"æˆ‘ä»¬ä¸åº”è¯¥æŠŠæ€€ç–‘å½“ä½œå·²ç»å¾—åˆ°è¯æ˜çš„äº‹å®ã€‚ || We should not treat suspicion as an established fact.","q":"What was the purpose of the exercise? || To practise disciplined reasoning rather than impose a real punishment. æ¨¡æ‹Ÿåœºæ™¯çš„å­¦ä¹ ç›®çš„ã€‚","note":"","wc":149,"new":["testify","detective","guilt","acquaint","identification","conviction","certainty","plea","suspicious","presume","offence","magistrate","theft","attorney","penalty"]},{"id":"44","title":"å†²çªä¹‹åçš„é‡å»º","en_title":"Rebuilding after Conflict","kind":"é˜…è¯»Â·å†å²ä¸äººé“å…³æ€€","en":"The documentary followed a civilian family returning to a desolate town. Warfare had damaged a bridge, emptied a nursery, and left the market in ruins. A former refugee described the grief of losing a neighbour and the difficulty of beginning again. No triumphant slogan could erase that experience.\nAn aid worker explained how humanitarian support could help restore ordinary life. Teams repaired water facilities, reunited relatives, and made a damaged school usable. A memorial recorded a massacre and warned against treating cruelty as an inevitable feature of history. The narrator rejected both the glorification of slaughter and a call for vengeance.\nReconstruction demanded solidarity, patience, and practical resources. A political settlement might end a battle, but it would not instantly remove fear or deprivation. Lasting peace requires institutions that safeguard dignity and opportunities for people to rebuild trust. Humanity is tested most clearly when the needs of vulnerable people remain visible after public attention has moved elsewhere.","zh":"çºªå½•ç‰‡è·Ÿéšä¸€ä¸ªå¹³æ°‘å®¶åº­è¿”å›è’å‡‰åŸé•‡ã€‚æˆ˜äº‰æ¯åæ¡¥æ¢ã€ä½¿æ‰˜å„¿æ‰€ç©ºç½®ã€è®©å¸‚åœºæˆä¸ºåºŸå¢Ÿã€‚æ›¾ä¸ºéš¾æ°‘çš„äººè®²è¿°å¤±å»é‚»å±…çš„æ‚²ç—›ä¸é‡æ–°å¼€å§‹çš„å›°éš¾ï¼Œèƒœåˆ©å£å·æ— æ³•æŠ¹å»ç»å†ã€‚æ´åŠ©äººå‘˜è§£é‡Šï¼Œäººé“æ”¯æŒé€šè¿‡ä¿®å¤ä¾›æ°´ã€å¸®åŠ©äº²äººå›¢èšã€æ¢å¤å­¦æ ¡æ¥é‡å»ºæ—¥å¸¸ç”Ÿæ´»ã€‚çºªå¿µç¢‘è®°å½•å± æ€ï¼Œæé†’äººä»¬ä¸è¦æŠŠæ®‹é…·å½“ä½œå†å²å¿…ç„¶ã€‚æ—ç™½æ‹’ç»æ­Œé¢‚æ€æˆ®æˆ–å‘¼åå¤ä»‡ã€‚é‡å»ºéœ€è¦å›¢ç»“ã€è€å¿ƒä¸èµ„æºï¼Œæ”¿æ²»å’Œè§£èƒ½ç»“æŸæˆ˜æ–—ï¼Œå´ä¸ä¼šç«‹åˆ»æ¶ˆé™¤ææƒ§ä¸åŒ®ä¹ã€‚é•¿ä¹…å’Œå¹³è¿˜éœ€ç»´æŠ¤å°Šä¸¥çš„åˆ¶åº¦å’Œé‡å»ºä¿¡ä»»çš„æœºä¼šã€‚å…¬ä¼—ç›®å…‰è½¬ç§»åä»çœ‹è§è„†å¼±è€…çš„éœ€è¦ï¼Œå°¤å…¶è€ƒéªŒäººæ€§ã€‚","key":"A political settlement might end a battle, but it would not instantly remove fear. || might / would ä¿æŒæ¡ä»¶æ€§ï¼ŒåŒºåˆ†çŸ­æœŸç»“æœä¸é•¿æœŸé—®é¢˜ã€‚","task":"é‡å»ºä¸ä»…åŒ…æ‹¬ä¿®å¤å»ºç­‘ï¼Œä¹ŸåŒ…æ‹¬æ¢å¤äººä»¬ä¹‹é—´çš„ä¿¡ä»»ã€‚ || Reconstruction involves restoring trust between people as well as repairing buildings.","q":"Why is rebuilding more than repairing structures? || People also need security, relationships, and trust restored. å…³æ³¨ç‰©è´¨ä¸ç¤¾ä¼šå±‚é¢ã€‚","note":"","wc":157,"new":["warfare","battle","solidarity","settlement","humanity","civilian","refugee","nursery","bridge","documentary","desolate","massacre","cruelty","humanitarian","grief","vengeance","safeguard","slaughter"]},{"id":"45","title":"åšç‰©é¦†ä¸­çš„æƒåŠ›æ•…äº‹","en_title":"When Power Goes Unchecked","kind":"é˜…è¯»Â·å†å²è¯æ±‡","en":"An exhibit described a fictional sovereign who became a tyrant. His regime used propaganda to glorify obedience, while a dictator in a neighbouring state claimed that dissent was a menace. The curator asked visitors to examine how tyranny could turn a disagreement into an excuse to persecute people.\nThe story included a siege, a captive soldier, and a regiment ordered to defend a fort. A bugle signalled the advance of a troop. Later, a mob tried to overthrow the ruler, and a bandit exploited the disorder to plunder abandoned houses. The display did not present every opponent as a hero.\nIts closing panel described efforts to govern through accountable institutions. A society cannot escape abuse simply by replacing one ruler with another. What matters is whether public authority is constrained and whether ordinary people can challenge injustice without being treated as enemies. Historical language becomes useful when it helps us ask precise questions about power.","zh":"å±•è§ˆè®²è¿°è™šæ„å›ä¸»å˜æˆæš´å›çš„æ•…äº‹ã€‚ä»–çš„æ”¿æƒç”¨å®£ä¼ æ­Œé¢‚æœä»ï¼Œé‚»å›½ç‹¬è£è€…åˆ™ç§°å¼‚è®®æ˜¯å¨èƒã€‚ç­–å±•äººè¯·æ¸¸å®¢æ€è€ƒï¼Œæš´æ”¿å¦‚ä½•æŠŠåˆ†æ­§å½“ä½œè¿«å®³å€Ÿå£ã€‚æ•…äº‹åŒ…å«å›´åŸã€è¢«ä¿˜å£«å…µå’Œå¥‰å‘½å®ˆå ¡çš„å›¢ï¼Œå†›å·å‘å‡ºéƒ¨é˜Ÿå‰è¿›ä¿¡å·ã€‚åæ¥æš´æ°‘è¯•å›¾æ¨ç¿»ç»Ÿæ²»è€…ï¼ŒåŒªå¾’è¶ä¹±åŠ«æ ç©ºå±‹ã€‚å±•è§ˆæ²¡æœ‰æŠŠæ‰€æœ‰åå¯¹è€…éƒ½æç»˜æˆè‹±é›„ã€‚æœ€åä»‹ç»é€šè¿‡å¯é—®è´£åˆ¶åº¦æ²»ç†çš„åŠªåŠ›ï¼šåªæ¢ç»Ÿæ²»è€…ä¸è¶³ä»¥æ‘†è„±æ»¥æƒï¼Œå…³é”®åœ¨äºå…¬å…±æƒåŠ›æ˜¯å¦å—çº¦æŸï¼Œæ™®é€šäººèƒ½å¦æŒ‘æˆ˜ä¸å…¬è€Œä¸è¢«è§†ä¸ºæ•Œäººã€‚å†å²è¯æ±‡èƒ½å¸®åŠ©æˆ‘ä»¬å‡†ç¡®è¿½é—®æƒåŠ›é—®é¢˜ã€‚","key":"What matters is whether public authority is constrained. || what ä¸»è¯­ä»å¥æ­é… whether è¡¨è¯­ä»å¥ï¼Œé€‚åˆæå‡ºåˆ¤æ–­æ ‡å‡†ã€‚","task":"çœŸæ­£é‡è¦çš„æ˜¯ï¼ŒæƒåŠ›æ˜¯å¦å—åˆ°æœ‰æ•ˆç›‘ç£ã€‚ || What truly matters is whether power is subject to effective oversight.","q":"Did the exhibition portray every opponent as heroic? || No. It also showed bandits exploiting disorder. é¿å…æŠŠå¤æ‚å™è¿°ç®€åŒ–ä¸ºå•ä¸€å¯¹ç«‹ã€‚","note":"","wc":155,"new":["regime","excuse","troop","fort","propaganda","overthrow","regiment","bandit","persecute","neighbouring","sovereign","mob","bugle","govern","disorder","obedience","dictator","captive","tyrant","tyranny","siege","menace","plunder"]},{"id":"46","title":"å®—æ•™è¯æ±‡ä¸å°Šé‡å·®å¼‚","en_title":"Reading about Belief","kind":"é˜…è¯»Â·æ–‡åŒ–ä¸å®—æ•™","en":"In a comparative religion class, we read about Islam, Buddhism, and Christian traditions. One text described a mosque and a pilgrim; another introduced a monk, a nun, and a Catholic bishop. References to Jesus Christ, the pope, and scripture required attention to each passage's context.\nThe teacher distinguished description from personal endorsement. To explain why someone might worship, pray, or burn incense was not to demand that classmates share a doctrine. A pious person might cherish a shrine, while another reader approached the same object historically. Older texts sometimes used Moslem where contemporary texts often use Muslim.\nWe discussed words such as divine, Heaven, and eternal without presenting supernatural claims as scientific findings. A respectful reader should neither ridicule belief nor assume that every member of a community thinks alike. Understanding cultural language requires sensitivity to difference, including differences within a tradition.","zh":"æ¯”è¾ƒå®—æ•™è¯¾é˜…è¯»ä¼Šæ–¯å…°æ•™ã€ä½›æ•™ä¸åŸºç£æ•™ä¼ ç»Ÿã€‚æ–‡ç« æåˆ°æ¸…çœŸå¯ºã€æœåœ£è€…ã€åƒ§ä¾£ã€ä¿®å¥³å’Œå¤©ä¸»æ•™ä¸»æ•™ï¼›è€¶ç¨£åŸºç£ã€æ•™çš‡ä¸ç»æ–‡ç­‰è¯éœ€è¦ç»“åˆè¯­å¢ƒã€‚è€å¸ˆåŒºåˆ†æè¿°ä¸ä¸ªäººèµåŒï¼šè§£é‡Šç¤¼æ‹œã€ç¥ˆç¥·æˆ–ç„šé¦™ï¼Œä¸æ˜¯è¦æ±‚åŒå­¦æ¥å—æŸç§æ•™ä¹‰ã€‚è™”è¯šä¿¡å¾’å¯èƒ½ççˆ  only because innumerable small tasks had been completed with care. Entertainment is often built on cooperation that the spectator never sees.","zh":"ä¸šä½™å‰§å›¢æ’æ¼”ä¸€å‡ºå–œå‰§ï¼šé­”æœ¯å¸ˆè¿ç®€å•æˆæ³•éƒ½åšä¸å¥½ï¼Œå°ä¸‘æ‰“æ–­ä»–ï¼Œèˆè€…å°è¯•èŠ­è•¾åŠ¨ä½œï¼Œæœºæ™ºä»†äººæ­éœ²å¹»è±¡ã€‚æœ€åä¸€å¹•ä»¥æ„å¤–åŠ¨ä½œè€Œéé•¿æ¼”è¯´æ”¶å°¾ã€‚åå°æœ‰äººä¿®è¡¥çŒ©çº¢æŠ«é£ã€ç¼è¿è¡£è£™æ¥ç¼ï¼ŒæŠŠè•¾ä¸é¢†å®‰åˆ°å¥³è¡¬è¡«ä¸Šï¼›åŒ–å¦†å¸ˆè°ƒæ•´é‡‘è‰²å‡å‘ã€ç”»ä¸Šçš±çº¹è®©å¹´è½»æ¼”å‘˜æ˜¾è€ã€‚é¥°å¥³ç¥çš„æ¼”å‘˜ç»ƒä¹ ä¼˜é›…åŠ¨ä½œï¼Œèˆå°ç›‘ç£é€ä¸€æ ¸å¯¹æç¤ºã€‚é¦–æ¼”ä»¤äººç´§å¼ å…´å¥‹ï¼Œé«˜æ½®æ—¶è§‚ä¼—é¼“æŒï¼Œç»“æŸåæ¼”å‘˜æ„Ÿæ¿€ç›¸æ‹¥ã€‚è¡¨æ¼”ä¹‹æ‰€ä»¥çœ‹ä¼¼è½»æ¾ï¼Œæ˜¯å› ä¸ºæ— æ•°å°ä»»åŠ¡å·²è¢«ç»†å¿ƒå®Œæˆã€‚å¨±ä¹å¾€å¾€å»ºç«‹åœ¨è§‚ä¼—çœ‹ä¸è§çš„åˆä½œä¸Šã€‚","key":"The performance seemed effortless only because innumerable small tasks had been completed with care. || è¿‡å»å®Œæˆæ—¶è¢«åŠ¨è¡¨ç¤ºæ¼”å‡ºä¹‹å‰å·²å®Œæˆçš„å‡†å¤‡ã€‚","task":"çœ‹ä¼¼è½»æ¾çš„è¡¨æ¼”å¾€å¾€éœ€è¦å¤§é‡çœ‹ä¸è§çš„å‡†å¤‡ã€‚ || A seemingly effortless performance often requires extensive preparation that the audience never sees.","q":"Why did the performance appear effortless? || Numerous backstage tasks had been completed carefully. å¤–åœ¨æ•ˆæœæ¥è‡ªå¹•ååŠ³åŠ¨ã€‚","note":"","wc":150,"new":["makeup","wrinkle","entertainment","episode","cloak","scarlet","lace","drama","comedy","innumerable","clap","blouse","goddess","magician","hug","grateful","witty","illusion","seam","spectator","blond","ballet","climax","frock","clown","gesture"]},{"id":"48","title":"ä¸€åœºé£æš´ä¸­çš„ç¤¾åŒº","en_title":"A Community Facing a Storm","kind":"å¬åŠ›Â·åº”æ€¥åä½œ","en":"A sudden gust shook the shutters as the weather bulletin announced a severe storm. Clouds gathered, hail struck the pavement, and water began to overflow a gutter. The council asked residents to remain alert and follow the local warning. A hurricane mentioned in the broadcast was affecting a distant coast; our town faced heavy rain.\nVolunteers helped move supplies from a damp basement. They used a portable lamp, carried a watertight box, and kept the exit clear. When a branch threatened to block the road, trained staff arranged a safe diversion. No one was encouraged to scramble onto a roof or cross a flooded street.\nAfterwards, neighbours checked on a frail resident and helped clear debris. The damage was serious, but timely cooperation reduced confusion. Preparedness means more than owning equipment: it means knowing who will do what and how information will reach those who need it.","zh":"çªèµ·é˜µé£æ‘‡åŠ¨ç™¾å¶çª—ï¼Œå¤©æ°”å…¬å‘Šå®£å¸ƒå¼ºé£æš´æ¥ä¸´ã€‚äº‘èšé›†ï¼Œå†°é›¹æ‰“å‘è·¯é¢ï¼Œé›¨æ°´æº¢å‡ºæ’æ°´æ²Ÿã€‚å¸‚æ”¿éƒ¨é—¨è¦æ±‚å±…æ°‘è­¦è§‰å¹¶éµå¾ªå½“åœ°é¢„è­¦ã€‚å¹¿æ’­æåˆ°çš„é£“é£åœ¨é¥è¿œæµ·å²¸ï¼Œæœ¬é•‡é¢å¯¹çš„æ˜¯å¤§é›¨ã€‚å¿—æ„¿è€…æŠŠç‰©èµ„ç§»å‡ºæ½®æ¹¿åœ°ä¸‹å®¤ï¼Œä½¿ç”¨ä¾¿æºç¯ã€æ¬é˜²æ°´ç®±å¹¶ä¿æŒå‡ºå£ç•…é€šã€‚æ ‘æå¯èƒ½å µè·¯æ—¶ï¼Œå—è®­äººå‘˜å®‰æ’å®‰å…¨ç»•è¡Œã€‚æ²¡äººè¢«é¼“åŠ±çˆ¬å±‹é¡¶æˆ–ç©¿è¿‡ç§¯æ°´è¡—é“ã€‚äº‹åï¼Œé‚»å±…æŸ¥çœ‹ä½“å¼±å±…æ°‘å¹¶æ¸…ç†æ‚ç‰©ã€‚æŸå®³ä¸¥é‡ï¼Œä½†åŠæ—¶åˆä½œå‡å°‘æ··ä¹±ã€‚å‡†å¤‡ä¸åªæ˜¯æ‹¥æœ‰è®¾å¤‡ï¼Œè¿˜åŒ…æ‹¬æ˜ç¡®åˆ†å·¥å’Œä¿¡æ¯å¦‚ä½•é€åˆ°éœ€è¦çš„äººæ‰‹ä¸­ã€‚","key":"Preparedness means more than owning equipment: it means knowing who will do what. || means + åŠ¨åè¯ï¼Œå†’å·åæŠŠæŠ½è±¡å‡†å¤‡è½å®ä¸ºå…·ä½“åˆ†å·¥ã€‚","task":"æ˜ç¡®çš„æ²Ÿé€šèƒ½å¤Ÿåœ¨ç´§æ€¥æƒ…å†µä¸‹å‡å°‘æ··ä¹±ã€‚ || Clear communication can reduce confusion in an emergency.","q":"Was a hurricane directly affecting the town? || No. The hurricane was distant; the town faced heavy rain. è¯†åˆ«ä¸åŒåœ°ç‚¹çš„ä¿¡æ¯ã€‚","note":"","wc":147,"new":["block","diversion","gust","cross","hail","portable","hurricane","alert","warning","timely","severe","gutter","frail","overflow","watertight","scramble"]},{"id":"49","title":"å±±è·¯ä¸Šçš„ä¸€æ¬¡æ”¹é“","en_title":"A Hike That Changed Course","kind":"å¬åŠ›Â·æˆ·å¤–æ´»åŠ¨","en":"Our hike began on a winding trail beside a barren slope. We passed a rocky overhang, a shallow cave with a hollow echo, and a clearing where a lily grew in the shade. The guide asked us to tread carefully on loose gravel and avoid the fragile edge of the path.\nAt noon, a fallen tree made the intended route inaccessible. We could not bypass it safely. Some walkers wanted to cling to the original plan, but the guide chose a longer descent. We would traverse the lower ridge, turn at a fence, and return through a neighbouring village.\nThe change caused disappointment, yet nobody had to prove courage by taking a needless risk. We ate a snack, tightened a bootlace, and resumed at a comfortable pace. A successful journey does not always reach the planned summit. Sometimes its achievement lies in recognizing when a sensible alteration is necessary.","zh":"å¾’æ­¥ä»è´«ç˜ å±±å¡æ—çš„æ›²å¾„å¼€å§‹ï¼Œç»è¿‡æ‚¬å²©ã€å¸¦ç©ºæ´å›å£°çš„æµ…æ´ï¼Œä»¥åŠé˜´å½±ä¸­é•¿ç€ç™¾åˆçš„ç©ºåœ°ã€‚å¯¼æ¸¸è¦æ±‚å°å¿ƒè¸©ç¢çŸ³ï¼Œé¿å¼€è„†å¼±è·¯è¾¹ã€‚ä¸­åˆå€’æ ‘ä½¿åŸè·¯æ— æ³•è¿›å…¥ï¼Œä¹Ÿæ— æ³•å®‰å…¨ç»•è¿‡ã€‚æœ‰äººæ‰§æ„åŸè®¡åˆ’ï¼Œå¯¼æ¸¸å´é€‰äº†æ›´é•¿çš„ä¸‹å±±è·¯ï¼šæ¨ªç©¿è¾ƒä½å±±è„Šï¼Œåœ¨å›´æ å¤„è½¬å¼¯ï¼Œç»é‚»æ‘è¿”å›ã€‚å˜åŒ–ä»¤äººå¤±æœ›ï¼Œä½†æ²¡äººéœ€è¦ä»¥æ— è°“å†’é™©è¯æ˜å‹‡æ°”ã€‚å¤§å®¶åƒé›¶é£Ÿã€ç´§é‹å¸¦ï¼ŒæŒ‰èˆ’é€‚é€Ÿåº¦ç»§ç»­ã€‚æˆåŠŸæ—…ç¨‹ä¸ä¸€å®šåˆ°è¾¾è®¡åˆ’ä¸­çš„å±±é¡¶ï¼Œæœ‰æ—¶æˆå°±åœ¨äºè®¤å‡ºä½•æ—¶å¿…é¡»åˆç†è°ƒæ•´ã€‚","key":"Sometimes its achievement lies in recognizing when a sensible alteration is necessary. || lie in + åŠ¨åè¯è¡¨ç¤ºå…³é”®æ‰€åœ¨ï¼›when å¼•å¯¼å®¾è¯­ä»å¥ã€‚","task":"åšæŒç›®æ ‡å¹¶ä¸æ„å‘³ç€æ‹’ç»è°ƒæ•´æ–¹æ³•ã€‚ || Commitment to a goal does not mean refusing to adjust one's approach.","q":"Why did the guide change the route? || A fallen tree blocked the path, and it could not be bypassed safely. å†³å®šåŸºäºç°åœºæ¡ä»¶ã€‚","note":"","wc":149,"new":["hike","cling","hollow","overhang","descent","gravel","barren","bypass","snack","fence","traverse","echo","summit","inaccessible","fragile","lily","clearing","shade","pace","tread"]},{"id":"50","title":"é€€ä¼‘åçš„æ–°è§’è‰²","en_title":"A Different Kind of Contribution","kind":"å†™ä½œÂ·è€é¾„ç¤¾ä¼š","en":"After retirement, a former engineer feared that his experience would become irrelevant. He did not yearn for a grand title, but he missed the satisfaction of solving a practical problem. A community centre invited him to mentor a small repair team.\nAt first, he expected unquestioning obedience. A younger volunteer found his manner stern and his instructions overly conservative. Rather than dismiss the disagreement, they discussed it openly. He learnt to explain the reason behind a procedure; she learnt to value knowledge acquired through years of practice. Their reciprocal respect became the project's greatest strength.\nThe engineer's contribution was not charity received but expertise shared. An ageing society benefits when it creates opportunities for meaningful involvement. Experience can complement youthful energy, provided neither group assumes automatic superiority. Respect grows through genuine collaboration, not a sentimental compliment offered once a year.","zh":"é€€ä¼‘åï¼Œä¸€ä½å·¥ç¨‹å¸ˆæ‹…å¿ƒç»éªŒå¤±å»æ„ä¹‰ã€‚ä»–ä¸æ¸´æœ›å¤´è¡”ï¼Œå´æ€€å¿µè§£å†³å®é™…é—®é¢˜çš„æ»¡è¶³æ„Ÿã€‚ç¤¾åŒºä¸­å¿ƒé‚€è¯·ä»–æŒ‡å¯¼ç»´ä¿®é˜Ÿã€‚èµ·åˆä»–å¸Œæœ›å¤§å®¶ç»å¯¹æœä»ï¼Œå¹´è½»å¿—æ„¿è€…è§‰å¾—ä»–ä¸¥å‰ã€æŒ‡ä»¤è¿‡åˆ†ä¿å®ˆã€‚åŒæ–¹å…¬å¼€è®¨è®ºï¼šä»–å­¦ç€è§£é‡Šç¨‹åºçš„åŸå› ï¼Œå¥¹å­¦ç€é‡è§†å¤šå¹´å®è·µç§¯ç´¯çš„çŸ¥è¯†ã€‚ç›¸äº’å°Šé‡æˆä¸ºé¡¹ç›®æœ€å¤§ä¼˜åŠ¿ã€‚å·¥ç¨‹å¸ˆçš„å‚ä¸ä¸æ˜¯æ¥å—æ–½èˆï¼Œè€Œæ˜¯åˆ†äº«ä¸“é•¿ã€‚è€é¾„ç¤¾ä¼šèƒ½ä»æœ‰æ„ä¹‰çš„å‚ä¸æœºä¼šä¸­å—ç›Šï¼›åªè¦å½¼æ­¤ä¸è‡ªè®¤å¤©ç„¶ä¼˜è¶Šï¼Œç»éªŒå°±èƒ½ä¸å¹´è½»æ´»åŠ›äº’è¡¥ã€‚å°Šé‡æ¥è‡ªå®é™…åˆä½œï¼Œè€Œéä¸€å¹´ä¸€æ¬¡çš„æ„Ÿä¼¤èµç¾ã€‚","key":"Experience can complement youthful energy, provided neither group assumes automatic superiority. || complement ä½œåŠ¨è¯æ„ä¸ºäº’è¡¥ï¼›provided å¼•å¯¼æ¡ä»¶ä»å¥ã€‚","task":"ç¤¾ä¼šåº”è¯¥ä¸ºè€å¹´äººæä¾›ç»§ç»­å‘æŒ¥ä¸“é•¿çš„æœºä¼šã€‚ || Society should provide older people with opportunities to continue using their expertise.","q":"What changed after the disagreement was discussed? || Both participants learnt to explain or appreciate the other's perspective. å˜åŒ–æ˜¯åŒå‘çš„ã€‚","note":"","wc":140,"new":["conservative","yearn","reciprocal","compliment","stern","retirement","satisfaction","complement"]},{"id":"51","title":"ç§»å±…ä¹‹å‰çš„ä¿¡æ¯å‡†å¤‡","en_title":"Preparing to Move Abroad","kind":"å¬åŠ›Â·å‡ºå›½ä¸æ‰‹ç»­","en":"Before deciding to emigrate, Lan attended an information session about life in a foreign country. She learnt that immigrate describes entering a country to settle, while emigrate emphasizes leaving one. Her personal motive was to join an overseas research team, not to escape an immediate problem.\nShe checked her passport, visa, and the availability of accommodation. A consul at an embassy information event explained where to find official guidance. An ambassador's speech about diplomatic cooperation was interesting, but it could not answer her individual paperwork questions. Lan made a reservation, packed a suitcase, and kept a copy of her correspondence.\nShe also checked when her documents would expire and whether a dependant needed separate arrangements. No tempting shortcut could replace proper preparation. Moving abroad might be advantageous, but it would involve adaptation, expense, and uncertainty. A realistic decision required both hope and a clear understanding of the commitment.","zh":"å…°å†³å®šç§»å±…å‰ï¼Œå‚åŠ å›½å¤–ç”Ÿæ´»è¯´æ˜ä¼šã€‚å¥¹äº†è§£åˆ° immigrate å¼ºè°ƒè¿å…¥å®šå±…ï¼Œemigrate å¼ºè°ƒè¿å‡ºï¼›è‡ªå·±çš„åŠ¨æœºæ˜¯åŠ å…¥æµ·å¤–ç ”ç©¶å›¢é˜Ÿã€‚å¥¹æ ¸æŸ¥æŠ¤ç…§ã€ç­¾è¯ä¸ä½å®¿ä¾›åº”ã€‚ä½¿é¦†æ´»åŠ¨ä¸­çš„é¢†äº‹ä»‹ç»å®˜æ–¹ä¿¡æ¯æ¸ é“ï¼Œå¤§ä½¿å…³äºå¤–äº¤åˆä½œçš„è®²è¯è™½æœ‰è¶£ï¼Œå´ä¸èƒ½å›ç­”ä¸ªäººæ‰‹ç»­é—®é¢˜ã€‚å¥¹é¢„è®¢ä½å®¿ã€è£…å¥½è¡Œæå¹¶ä¿å­˜é€šä¿¡å‰¯æœ¬ï¼Œä¹Ÿæ ¸æŸ¥è¯ä»¶åˆ°æœŸæ—¶é—´åŠå—æŠšå…»äººæ˜¯å¦éœ€å•ç‹¬å®‰æ’ã€‚æ·å¾„ä¸èƒ½å
